<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frosthaven Companion</title>
<link rel="icon" href="/web/icon.ico">
<style>
:root {
  --bg: #12151a; --panel: #1b2027; --panel2: #222832; --line: #2f3742; --text: #e8e2d4; --dim: #a59f92;
  --gold: #e3c98b; --gold2: #c9a75a; --ok: #7fc48a; --warn: #e6b35a; --bad: #e07a6a; --link: #8fc3e8;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 20px; padding: 0 16px; height: 52px; background: #0d1014; border-bottom: 1px solid var(--line); flex: none; }
header h1 { font: 600 17px Cambria, Georgia, serif; color: var(--gold); margin: 0; letter-spacing: .3px; white-space: nowrap; }
.camp { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; white-space: nowrap; padding: 0 4px 0 18px; border-left: 1px solid var(--line); height: 28px; }
.camp select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 14px; max-width: 220px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
.chip.on { background: #2a2617; border-color: #5a4c25; color: var(--gold); }
nav { display: flex; gap: 4px; height: 100%; overflow-x: auto; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim); font: inherit; padding: 0 14px; cursor: pointer; white-space: nowrap; }
nav button:hover { color: var(--text); }
nav button.on { color: var(--gold); border-bottom-color: var(--gold); }
nav button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: 6px; vertical-align: 2px; }
.spacer { flex: 1; }
.ver { color: var(--dim); font-size: 12px; white-space: nowrap; }
main { flex: 1; position: relative; min-height: 0; }
.view { position: absolute; inset: 0; display: none; }
.view.on { display: flex; flex-direction: column; }
iframe { border: 0; width: 100%; flex: 1; background: var(--bg); }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; font-size: 13px; color: var(--dim); }
.bar .btn.small { padding: 4px 12px; font-size: 13px; }
.bar select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }

/* Mods */
#mods { overflow-y: auto; }
.card.guide { padding-bottom: 8px; }
#guideframe { display: block; width: 100%; height: 600px; flex: none; background: transparent; }
.wrap { max-width: 980px; width: 100%; margin: 0 auto; padding: 28px 24px 48px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 16px; }
.headline { display: flex; align-items: flex-start; gap: 14px; }
.badge { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 20px; }
.badge.ok { background: #1f3a26; color: var(--ok); }
.badge.warn { background: #3d3119; color: var(--warn); }
.badge.bad { background: #3e211d; color: var(--bad); }
.headline h2 { margin: 0 0 2px; font: 600 21px Cambria, Georgia, serif; }
.headline p { margin: 0; color: var(--dim); }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 18px 0 0; font-size: 14px; }
.facts dt { color: var(--dim); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
button.btn { font: inherit; font-size: 14px; border-radius: 7px; padding: 8px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--text); }
button.btn:hover:not(:disabled) { border-color: var(--gold2); }
button.btn.primary { background: var(--gold); color: #1b1608; border-color: var(--gold); font-weight: 600; }
button.btn.primary:hover:not(:disabled) { background: #f0d79c; }
button.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
.note { font-size: 13px; color: var(--dim); margin-top: 14px; }
.banner { border-radius: 8px; padding: 10px 14px; margin-top: 16px; font-size: 14px; }
.banner.warn { background: #3d3119; color: #f3d9a2; }
.banner.bad { background: #3e211d; color: #f4c0b6; }
.banner.ok { background: #1f3a26; color: #bfe6c6; }
h3 { font: 600 16px Cambria, Georgia, serif; color: var(--gold); margin: 0 0 10px; }
.notes { white-space: pre-wrap; font-size: 14px; color: var(--text); }
details summary { cursor: pointer; color: var(--dim); font-size: 13px; margin-top: 10px; }
pre.log { background: #0d1014; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font: 12px/1.45 Consolas, monospace; white-space: pre-wrap; max-height: 320px; overflow: auto; color: #cfc8b8; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--gold2); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
a { color: var(--link); cursor: pointer; }
.empty { padding: 48px 24px; text-align: center; color: var(--dim); }
/* Stats */
#stats { overflow-y: auto; }
.swrap { max-width: 1180px; width: 100%; margin: 0 auto; padding: 20px 24px 48px; }
.sfilters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
.spills { display: flex; flex-wrap: wrap; gap: 6px; }
.spills button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--dim); cursor: pointer; }
.spills button:hover { color: var(--text); }
.spills button.on { background: var(--gold); color: #1b1608; border-color: var(--gold); font-weight: 600; }
.sfil { font-size: 13px; color: var(--dim); display: flex; gap: 8px; align-items: center; }
.sfil select, .sbar2 select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 13px; }
.sbar2 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.livedot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-left: 4px; vertical-align: 1px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile, .rec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0; }
.tl { font-size: 12px; color: var(--dim); }
.tv { font-size: 26px; font-weight: 600; margin-top: 2px; }
.ts { font-size: 12px; color: var(--dim); margin-top: 2px; }
.scard h3 { display: flex; align-items: center; gap: 8px; }
.schart { width: 100%; height: auto; display: block; margin-top: 6px; }
.schart .tick { fill: #8d877b; font-size: 11px; font-variant-numeric: tabular-nums; }
.schart .lbl { fill: var(--text); font-size: 12px; }
.schart .hit { fill: transparent; }
.schart .hit:hover { fill: rgba(255,255,255,0.04); }
.slegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--dim); margin-top: 8px; }
.slegend span { display: inline-flex; align-items: center; gap: 6px; }
i.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
i.ln { display: inline-block; width: 14px; height: 2px; border-radius: 1px; flex: none; }
.hbars { display: grid; gap: 6px; margin-top: 10px; }
.hrow { display: grid; grid-template-columns: minmax(120px, 230px) 1fr 52px; align-items: center; gap: 10px; font-size: 13px; padding: 2px 0; }
.hrow:hover { background: rgba(255,255,255,0.03); }
.hl { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb { display: flex; gap: 2px; height: 14px; }
.hb i { display: block; height: 100%; }
.hb i:last-child { border-radius: 0 4px 4px 0; }
.hv { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
.stable { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
.stable th { text-align: left; color: var(--dim); font-weight: 600; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.stable td { padding: 6px 8px; border-bottom: 1px solid #252b34; vertical-align: middle; }
.stable .n { text-align: right; font-variant-numeric: tabular-nums; }
.stable a { cursor: pointer; }
details.stbl { margin-top: 8px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
.pill.win { color: #bfe6c6; border-color: #2f5b3a; }
.pill.loss { color: #f4c0b6; border-color: #6b3128; }
.pill.live { color: #bfe6c6; border-color: #2f5b3a; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 0 16px; }
.recs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.rec .ts { display: flex; align-items: center; gap: 6px; }
.stip { position: fixed; z-index: 50; pointer-events: none; background: #0d1014; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.4); max-width: 320px; }
.stip-h { color: var(--dim); margin-bottom: 4px; }
.stip-r { display: flex; align-items: center; gap: 8px; }
.stip-r b { color: var(--text); font-variant-numeric: tabular-nums; }
.stip-r span { color: var(--dim); }
.stip-k { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }
@media (max-width: 640px) { header h1 { display: none; } .facts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Frosthaven Companion</h1>
  <label class="camp" id="campbox" hidden>Campaign <select id="campaign" title="Every tab shows this campaign"></select></label>
  <nav id="nav">
    <button data-v="mods">Mods<span class="dot" id="moddot" hidden></span></button>
    <button data-v="map">Scenario map</button>
    <button data-v="stats">Stats</button>
    <button data-v="play" id="playtab">Play guide</button>
  </nav>
  <div class="spacer"></div>
  <span class="ver" id="ver"></span>
</header>
<main>
  <section class="view" id="mods"><div class="wrap">
    <div id="modsbody"><div class="empty">Loading…</div></div>
    <div class="card guide"><h3 id="guidetitle">Mod guide</h3><p class="note" style="margin-top:0">What each mod does and how to use it. The host turns them on in the game: Options, Custom Rules.</p>
      <iframe id="guideframe" title="Mod guide" src="/guide/mods" scrolling="no"></iframe></div>
  </div></section>
  <section class="view" id="map">
    <div class="bar" id="mapbar">
      <button class="btn small" id="maprefresh" title="Rebuild the map from the campaign's latest progress file">Refresh</button>
      <span id="mapsaved"></span>
    </div>
    <iframe id="mapframe" title="Scenario map"></iframe>
  </section>
  <section class="view" id="stats"><div class="swrap" id="statsbody"></div></section>
  <section class="view" id="play"><iframe id="playframe" title="Play guide"></iframe></section>
</main>
<script src="/web/stats.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const FRAMES = {map: "#mapframe", play: "#playframe"};
const SRC = {map: () => "/map?campaign=" + encodeURIComponent(campaign || ""), play: () => "/guide/play"};
let S = null, view = "mods", busyAction = null, flash = null;

function show(v) {
  view = v;
  for (const b of document.querySelectorAll("#nav button")) b.classList.toggle("on", b.dataset.v === v);
  for (const s of document.querySelectorAll(".view")) s.classList.toggle("on", s.id === v);
  const f = FRAMES[v] && $(FRAMES[v]);
  if (f && !f.src) f.src = SRC[v]();            // each page loads once, and keeps its place when you switch back
  if (v === "stats") Stats.load(campaign);
  try { localStorage.setItem("companion-tab", v); } catch (e) {}
}
$("#nav").onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.v); };

async function api(path, post) {
  const r = await fetch(path, post ? {method: "POST", headers: {"X-Companion": "1"}} : {cache: "no-store"});
  return r.json();
}

function headline(s) {
  const inst = s.installed, lat = s.latest || {};
  switch (s.state) {
    case "no-game": return ["bad", "!", "Frosthaven wasn't found", "Install the game through Steam, then click Check again."];
    case "not-installed": return ["warn", "+", "The mod pack isn't installed", lat.version ? `Install v${lat.version} to play with your friends.` : "Install it to play with your friends."];
    case "update": return ["warn", "↑", `Update available: v${lat.version}`, `You have v${inst}. Everyone in a co-op game needs the same version.`];
    case "ahead": return ["ok", "✓", `You have v${inst}`, `That's newer than the latest release (v${lat.version}).`];
    case "unknown": return ["ok", "✓", `You have v${inst}`, "GitHub couldn't be reached, so newer versions can't be checked right now."];
    default: return ["ok", "✓", `Up to date: v${inst}`, "Everyone in a co-op game needs the same version."];
  }
}

function renderMods() {
  const s = S; if (!s) return;
  const job = s.job || {}, running = s.game.running, working = job.running;
  const [tone, mark, title, sub] = headline(s);
  const lat = s.latest || {};
  const installLabel = s.state === "not-installed" ? `Install v${lat.version || ""}`.trim() : s.state === "update" ? `Update to v${lat.version}` : "Reinstall";
  const canAct = !!s.game.dir && !running && !working;
  let jobHtml = "";
  if (working) jobHtml = `<div class="banner warn"><span class="spin"></span>${job.action === "uninstall" ? "Removing the mods…" : "Installing the mod pack…"} This takes a few seconds.</div>`;
  else if (job.action && job.finished) {
    const ok = job.code === 0;
    jobHtml = `<div class="banner ${ok ? "ok" : "bad"}">${ok ? (job.action === "uninstall" ? "The mods were removed. The game is back to normal." : "Done. Start Frosthaven to play with the mods.") : "That didn't work. The details are below."}</div>` +
      `<details${ok ? "" : " open"}><summary>Installer log</summary><pre class="log">${esc(job.log)}</pre></details>`;
  }
  $("#modsbody").innerHTML = `
  ${appBanner(s, lat)}
  <div class="card">
    <div class="headline"><div class="badge ${tone}">${mark}</div><div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div></div>
    ${running ? `<div class="banner warn">Frosthaven is running. Close it to install, update or remove the mods.</div>` : ""}
    ${flash ? `<div class="banner bad">${esc(flash)}</div>` : ""}
    ${jobHtml}
    <div class="actions">
      <button class="btn${s.state === "update" || s.state === "not-installed" ? " primary" : ""}" id="install" ${canAct ? "" : "disabled"}>${esc(installLabel)}</button>
      ${s.installed ? `<button class="btn danger" id="uninstall" ${canAct ? "" : "disabled"}>Remove the mods</button>` : ""}
      <button class="btn" id="check" ${working ? "disabled" : ""}>Check again</button>
    </div>
    <dl class="facts">
      <dt>Installed</dt><dd>${s.installed ? "v" + esc(s.installed) : "none"}</dd>
      <dt>Latest release</dt><dd>${lat.version ? "v" + esc(lat.version) + (lat.published ? " · " + esc(lat.published.slice(0, 10)) : "") : lat.error ? "couldn't check" : "…"}</dd>
      <dt>Game folder</dt><dd>${esc(s.game.dir || "not found")}</dd>
    </dl>
    <p class="note">Updating keeps your saves and campaign settings. The house rules are switched on in the game (Options, Custom Rules), by the host.</p>
  </div>
  ${campaignCard(s)}
  ${lat.notes ? `<div class="card"><h3>What's in v${esc(lat.version)}</h3><div class="notes">${esc(lat.notes)}</div>
    <p class="note"><a data-open="${esc(lat.url)}">Release page on GitHub</a></p></div>` : ""}`;
  $("#install").onclick = () => act("install");
  $("#uninstall") && ($("#uninstall").onclick = () => {
    if (confirm("Remove the mod pack? The game goes back to normal; your saves are kept.")) act("uninstall");
  });
  $("#check").onclick = async () => { flash = null; S = await api("/api/check", true); render(); };
}

// a newer companion: one click updates it (updater.py), or the GitHub link when this copy can't update itself
function appBanner(s, lat) {
  const a = s.app, u = a.update || {};
  if (u.state && u.state !== "error") {
    const done = u.state === "restarting";
    return `<div class="banner ${done ? "ok" : "warn"}" style="margin:0 0 16px">${done ? "" : '<span class="spin"></span>'}${esc(u.message || "Updating…")}${done ? " The window closes and the new version opens by itself." : ""}</div>`;
  }
  if (!a.newer) return u.state === "error" ? `<div class="banner bad" style="margin:0 0 16px">${esc(u.message)}</div>` : "";
  const err = u.state === "error" ? `<div class="note" style="margin-top:6px">${esc(u.message)}</div>` : "";
  if (a.canUpdate) return `<div class="banner warn" style="margin:0 0 16px">A newer companion (v${esc(a.latest)}) is out. ${esc(a.canUpdate)} <a data-open="${esc(lat.url)}">Release page</a>${err}</div>`;
  return `<div class="banner warn" style="margin:0 0 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap">` +
    `<span>A newer companion (v${esc(a.latest)}) is out.</span><button class="btn primary" id="appupdate">Update the app</button>` +
    `<a data-open="${esc(lat.url)}">What's new</a>${err}</div>`;
}
document.addEventListener("click", async e => {
  if (!e.target.closest("#appupdate")) return;
  e.target.disabled = true;
  const r = await fetch("/api/app/update", {method: "POST", headers: {"X-Companion": "1"}}).then(r => r.json()).catch(() => ({ok: false, message: "The companion didn't answer."}));
  if (!r.ok) flash = r.message;
  refresh();
});

async function act(action) {
  flash = null;
  const r = await fetch("/api/mods/" + action, {method: "POST", headers: {"X-Companion": "1"}}).then(r => r.json());
  if (!r.ok) flash = r.message;
  await refresh();
}

// ---- the campaign every tab shows (remembered between runs; the most recently played one at first)
let campaign = null;
try { campaign = localStorage.getItem("companion-campaign"); } catch (e) {}
const camp = () => ((S && S.campaigns) || []).find(c => c.name === campaign) || null;
const when = t => new Date(t * 1000).toLocaleString([], {weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});

function renderCampaigns() {
  const cs = (S && S.campaigns) || [], sel = $("#campaign");
  if (!cs.some(c => c.name === campaign)) campaign = cs.length ? cs[0].name : null;
  $("#campbox").hidden = !cs.length;
  const names = cs.map(c => c.name).join("|");
  if (sel.dataset.names !== names) {
    sel.dataset.names = names;
    sel.innerHTML = cs.map(c => `<option>${esc(c.name)}</option>`).join("");
  }
  if (campaign) sel.value = campaign;
}
$("#campaign").onchange = () => {
  campaign = $("#campaign").value;
  try { localStorage.setItem("companion-campaign", campaign); } catch (e) {}
  for (const v of Object.keys(FRAMES)) if (v !== "play" && $(FRAMES[v]).src) $(FRAMES[v]).src = SRC[v]();   // campaign pages reload
  Stats.reset();
  if (view === "stats") Stats.load(campaign);
  render();
};

function campaignCard(s) {
  const c = camp();
  if (!c) return "";
  const on = new Set(c.rules || []);
  const all = ["Battle stats", "Dwarf's balance changes", "Easier item reward window", "Game bug fixes", "Masteries carry over",
    "Milestone saves", "Modifier deck odds", "More story events", "Reveal event outcomes", "Scenario map file",
    "Share duplicate loot", "Show personal quest rewards", "Tradeable resources and equipment"];
  return `<div class="card"><h3>Campaign: ${esc(c.name)}</h3>
    <p class="note" style="margin-top:0">Last played ${esc(when(c.lastPlayed))}.${c.rules ? ` ${on.size} of ${all.length} mod rules on (the host changes them in the game: Options, Custom Rules).` : ""}</p>
    ${c.rules ? `<div class="chips">${all.map(r => `<span class="chip${on.has(r) ? " on" : ""}" title="${on.has(r) ? "On" : "Off"} in this campaign">${esc(r)}</span>`).join("")}</div>` : ""}
  </div>`;
}

function renderMap() {
  const c = camp(), saved = c && S.campaigns && c.hasMap;
  $("#mapsaved").textContent = saved
    ? `Progress saved ${when(c.mapSaved)}. Updates by itself when the game autosaves.`
    : "No progress for this campaign yet: the host turns on Scenario map file (Options, Custom Rules), then plays until the game autosaves.";
}
$("#maprefresh").onclick = () => {
  const f = $("#mapframe");
  try {
    // keep the selected scenario, as the page's own automatic reload does (`selected` is the map page's variable)
    const w = f.contentWindow, sel = w.eval("typeof selected === 'undefined' ? null : selected");
    if (sel !== null) w.location.hash = String(sel);
    w.location.reload();
  } catch (e) { f.src = SRC.map(); }
  refresh();
};

function render() {
  if (!S) return;
  $("#ver").textContent = `v${S.app.version}`;
  $("#moddot").hidden = !(S.state === "update" || S.state === "not-installed");
  $("#playtab").hidden = !S.playGuide;
  renderCampaigns();
  renderMods();
  renderMap();
}

async function refresh() {
  try { S = await api("/api/status"); } catch (e) { return; }
  render();
}

// the mod guide grows to its full height, so the Mods tab scrolls as one page
function fitGuide() {
  const f = $("#guideframe");
  try { const d = f.contentDocument; if (d && d.body) f.style.height = d.documentElement.scrollHeight + "px"; } catch (e) {}
}
$("#guideframe").addEventListener("load", () => {
  fitGuide();
  // links in the guide open in the system browser, not inside the app
  try {
    $("#guideframe").contentDocument.addEventListener("click", e => {
