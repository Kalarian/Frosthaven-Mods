# card: Slice Through
# top: the persistent "on a kill, discard this card to place a Tear in the enemy's hex" = Frosthaven's Deathwalker When
# Your Time Comes bottom (DuringActionAbilityOnDeath aura on enemies, a shadow on TriggerActor.Tile), one use
# (XPTracker [0]: the card is discarded after it), only for your own kills (Vars on the cause of death). Placed before
# Attack 4, so a kill by that attack counts.
# bottom: consume Dark Teleport 4 (Teleport2) before the swap, as printed; the swap = Gloomhaven's Swap (the 1st
# edition Summoner's Otherworldly Rage shape: first target you, second an ally), range 8 with IgnoreLOS ("within eight
# hexes" is a hex count, no line of sight)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TActive:
                AddActiveBonus:
                    CreateShadow:
                    Targeting: Custom
                    TargetingVars:
                        AddTileInRange: TargetTile
                    Target: 1
                    CanUndo: False
                    AnimOverload: Shadow Manipulation
                Range: 1
                Target: -1
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: DuringActionAbilityOnDeath
                    TriggerAbilitiesImmediately: True
                    TriggerOnCaster: True
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter:
                        TargetType: Enemy
                        UseTargetOriginalType: True
                    XPTracker: [0]
                    Vars:
                        TargetTile: TriggerActor.Tile
                        # "whenever YOU kill an enemy": the cause of death must be your ability (SetupTriggerContext
                        # checks these before the slot is used, so other figures' kills leave the card alone)
                        ValidateHasAbility: TriggerAbility != null
                        ValidateYourKill: TriggerAbility.TargetingActor == ActiveBonus.Caster
            TAttack:
                Attack:
                    Amount: 4
                    DiamondEnhancements: 1
        Infuse: Dark
    Bottom:
        Abilities:
            BNull:
                Null: True
            BSwap:
                Swap:
                    FirstTargetFilter: Self
                    SecondTargetFilter: Ally
                Range: 8
                IgnoreLOS: True      # "within eight hexes": a hex count, no line of sight (Deepwraith Pinning Spines)
                AnimOverload: RadialBeneficial
        Consumes:
            BCDark:
                Elements: Dark
                Abilities:
                    BCDarkTeleport:
                        ParentName: BNull
                        Teleport2: 4
                        Filter: Self
                        AnimOverload: Teleport Into
                        AnimOverload2: Teleport Outof
                XP: 1
Layout:
    Top:
        - Active:
            Ability: TActive
            Icon: Positive_Shadow_Enemy_Death
            ListLayout: "$GH2E_Nightshroud2_02_T$"
            Layout: "$GH2E_Nightshroud2_02_T$"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=50%> "
        - Infuse: Dark
    Bottom:
        - Consume:
            Name: BCDark
            Text: "$Teleport$ <sprite name=Teleport> 4, <sprite name=XP1>"
        - Row: "<size=50%> "
        - Row: "$GH2E_Nightshroud2_02_B$"
