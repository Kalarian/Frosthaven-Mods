# card: Concealed Dominance
# top: Curse on the 4-hex rhombus; consume Dark replaces the area with the larger one (the 1st edition Concealed
# Dominance's AreaEffect override), XP 1.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TCurse:
                Curse: True
                Filter: Enemy
                AreaEffect: "0,0,G|2,0,R|1,1,R|3,1,R"
                AnimOverload: AggressiveTargetedShout
        Consumes:
            TCDark:
                Elements: Dark
                AbilityOverrides:
                    TCDarkAreaBuff:
                        ParentName: TCurse
                        AreaEffect: "0,0,G|2,0,R|-1,1,R|1,1,R|3,1,R|0,2,R"
                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BLoot:
                Loot: 1
                Target: -1
                AnimOverload: Loot
Layout:
    Top:
        - Row:
            - ColumnWidths: "65,30"
            - Column:
                - Row: "<nobr><b><size=130%>$Curse$ <sprite name=Curse></nobr>"
            - Column: "£Area£"
        - Row: "<size=20%> "
        - Consume:
            Name: TCDark
            Text: "$GH2E_Nightshroud2_24_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Loot$ <sprite name=Loot> *BLoot*"
