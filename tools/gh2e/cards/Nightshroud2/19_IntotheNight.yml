# card: Into the Night
# top: Stun on the area; the stunned enemies gain Invisible (a sub-ability on the stun's own targets, UseParentTargets,
# the Lead to Slaughter fix's shape); the Tear hex 2,0 is a blue hex of the area, the only hex the Tear may go
# (GHTears.cs).
# bottom: "grant one adjacent ally: Teleport 8, must end in a hex containing a Tear" = a grant (ControlActor, the
# Sunkeeper2 grant shape) of Teleport2 8 limited to shadow hexes (IsValidTeleportTile), its printed square mark.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TStun:
                Stun: True
                Filter: Enemy
                AreaEffect: "0,0,G|1,1,R|1,-1,R|2,0,B"
                MiscVars:
                    GH2ETearHexArea: True
                AnimOverload: AggressiveTargetedShout
                SubAbilities:
                    TStunSubInvisible:
                        Invisible: True
                        Filter: Enemy
                        Target: -1
                        UseParentTargets: True
                        CanSkip: False
                        AnimOverload: None
            TTear:
                CreateShadow:
                HelpBoxTooltipLocKey: "GH2E_Nightshroud2_TEARHEX_HELP"
                Target: 1
                # (the tiles are replaced by the Tear hexes of the area by GHTears.cs; Custom targeting is what makes the
                # game ask for them)
                Targeting: Custom
                TargetingVars:
                    AddTilesInRange: CustomAbility.GetAdjacentTiles(TargetingActor.Tile)
                MiscVars:
                    GH2ETearHex: True
                AnimOverload: Shadow Manipulation
        Infuse: Dark
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    CircleEnhancements: 1
            BAlly:
                ControlActor:
                    Abilities:
                        BAllyTeleport:
                            Teleport2:
                                Amount: 8
                                SquareEnhancements: 1
                            StrengthIsBase: True
                            Filter: Self
                            MiscVars:
                                IsValidTeleportTile: CustomAbility.SteppedOnShadow(Tile)
                            AnimOverload: Teleport Into
                            AnimOverload2: Teleport Outof
                Range: 1
                Filter: Ally
                AnimOverload: ControlAlly
Layout:
    Top:
        - Row:
            - ColumnWidths: "65,30"
            - Column:
                - Row: "<nobr><b><size=130%>$Stun$ <sprite name=Stun></nobr>"
                - Row: "<size=20%> "
                - Row: "$GH2E_Nightshroud2_19_T$"
                - Row: "<size=20%> "
                - Row: "$GH2E_Nightshroud2_TEARHEXB$"
            - Column: "£Area£"
        - Row: "<size=50%> "
        - Infuse: Dark
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Nightshroud2_19_B$"
        - Row: "<b><size=130%>$Teleport$ <sprite name=Teleport> *BAllyTeleport* <size=100%><voffset=1>@BAllyTeleport@"
        - Row: "$GH2E_Nightshroud2_12_B$"
