# card: Shroud in Shade
# top: "negate the next source of damage you would suffer this round" = Frosthaven's Infuser Swift Pivot top (round
# PreventDamage 99, PreventFirstDamage, one use) without its melee-only reprisal.
# bottom: disadvantage on attacks targeting you this round (Shattersong Transparency bottom); consume Dark: the same for
# allies within range 2 of you (a round AttackersGainDisadvantage aura on allies), XP 1.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 5
                    DiamondEnhancements: 1
            TPreventDamage:
                PreventDamage: 99
                Range: 1
                Target: -1
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Round
                    XPTracker: [0]
                    Behaviour: PreventFirstDamage
        Infuse: Dark
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    SquareEnhancements: 1
            BDisadvantage:
                AttackersGainDisadvantage: 1
                Range: 0
                Target: -1
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Round
            BNull:
                Null: True
        Consumes:
            BCDark:
                Elements: Dark
                Abilities:
                    BCDarkAllies:
                        ParentName: BNull
                        AttackersGainDisadvantage: 1
                        Range: 2
                        Target: -1
                        Filter: Self
                        AnimOverload: PositiveBuffRadial
                        ActiveBonus:
                            Duration: Round
                            IsAura: True
                            AuraFilter: Ally
                            AuraTargeting: Range
                XP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=50%> "
        - Active:
            Ability: TPreventDamage
            Icon: Positive_DamagePrevent
            ListLayout: "$GH2E_Nightshroud2_14_T$"
            Layout: "$GH2E_Nightshroud2_14_T$"
        - Row: "<size=50%> "
        - Row:
            - ColumnWidths: "20,20,20,20"
            - Column:
            - Column:
                - MandatoryTrigger:
                    Layout:
                        - Infuse: Dark
            - Column:
                - XP: 1
            - Column:
                - Duration: Round
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Active:
            Ability: BDisadvantage
            Icon: Disadvantage
            ListLayout: "$GH2E_Nightshroud2_14_B$"
            Layout: "$GH2E_Nightshroud2_14_B$"
        - Row: "<size=20%> "
        - Consume:
            Name: BCDark
            Text: "$GH2E_Nightshroud2_14_B2$"
        - Row: "<size=50%> "
        - Duration: Round
