# card: Dark Cloud
# top: Muddle on all enemies within range 3; reveal (Eyes of the Night's shape, range 3); a Tear within range 3.
# bottom: Safeguard [diamond+], self: the pack's Safeguard condition (AUTHORING.md: a Ward carrier tagged GH2ESafeguard,
# GHSafeguard.cs), which holds the printed diamond+ mark.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TMuddle:
                Muddle: True
                Range: 3
                Target: -1
                Filter: Enemy
                AnimOverload: WeakRadial
            TReveal:
                NullTargeting: True
                Range: 3
                Target: -1
                Filter: Enemy
                AnimOverload: Cast_Concentrate
                PerformVars:
                    ApplyToActors:
                        Targets: ActorsToTarget
                        ShowMonsterCards: CustomAbility.ShowTopMonsterCards(Targets)
            TTear:
                CreateShadow:
                HelpBoxTooltipLocKey: "FH/GUI_PLACE_SHADOWS_HELPBOX"
                Range: 3
                Target: 1
                AnimOverload: Shadow Manipulation
        Infuse: Dark
    Bottom:
        Abilities:
            BSafeguard:
                Ward:
                    DiamondPlusEnhancements: 1
                Filter: Self
                AnimOverload: PowerUp
                MiscVars:
                    GH2ESafeguard: True
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BCurse:
                Curse: True
                Range:
                    Amount: 1
                    SquareEnhancements: 1
                Filter: Enemy
                AnimOverload: WeakRadial
        Infuse: Dark
Layout:
    Top:
        - Row: "<b><size=130%>$Muddle$ <sprite name=Muddle>"
        - Row: "$GH2E_Nightshroud2_22_T$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Nightshroud2_22_T2$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Nightshroud2_22_T3$"
        - Row: "<size=50%> "
        - Infuse: Dark
    Bottom:
        - Row: "<b><size=130%>$GH2E_SAFEGUARD_NAME$ <size=100%><voffset=1>@BSafeguard@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Curse$ <sprite name=Curse>"
        - Row: "$Range$ <sprite name=Range> *BCurse.Range* @BCurse.Range@"
        - Row: "<size=50%> "
        - Infuse: Dark
