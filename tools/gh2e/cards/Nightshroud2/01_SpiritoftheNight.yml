# card: Spirit of the Night
# top: Curse on an area (the 1st edition Soothsinger's Singing Arrow shape, a melee area from the grey hex); the Tear
# hex 3,1: the Tear hex is a blue hex of the area (it turns with it; tag GH2ETearHexArea) and the Tear placement may
# use only that hex (tag GH2ETearHex, GHTears.cs), once the area's ability was performed (2e FAQ).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TCurse:
                Curse: True
                Filter: Enemy
                AreaEffect: "0,0,G|2,0,R|4,0,R|6,0,E|3,1,B"
                MiscVars:
                    GH2ETearHexArea: True
                AnimOverload: AggressiveTargetedShout
            TTear:
                CreateShadow:
                HelpBoxTooltipLocKey: "GH2E_Nightshroud2_TEARHEX_HELP"
                Target: 1
                # (the tiles are replaced by the Tear hexes of the area by GHTears.cs; Custom targeting is what makes the
                # game ask for them)
                Targeting: Custom
                TargetingVars:
                    AddTilesInRange: CustomAbility.GetAdjacentTiles(TargetingActor.Tile)
                MiscVars:
                    GH2ETearHex: True
                AnimOverload: Shadow Manipulation
        Infuse: Dark
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    CircleEnhancements: 1
            BCurse:
                Curse: True
                Range:
                    Amount: 1
                    SquareEnhancements: 1
                Filter: Enemy
                AnimOverload: WeakRadial
Layout:
    Top:
        - Row:
            - ColumnWidths: "65,30"
            - Column:
                - Row: "<nobr><b><size=130%>$Curse$ <sprite name=Curse></nobr>"
                - Row: "<size=20%> "
                - Row: "$GH2E_Nightshroud2_TEARHEXB$"
            - Column: "£Area£"
        - Row: "<size=50%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Dark
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Curse$ <sprite name=Curse>"
        - Row: "$Range$ <sprite name=Range> *BCurse.Range* @BCurse.Range@"
