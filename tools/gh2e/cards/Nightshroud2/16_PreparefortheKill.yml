# card: Prepare for the Kill
# top: "whenever you remove a Tear, you may discard this card to gain Strengthen and have all adjacent enemies suffer
# damage 2": a persistent marker bonus (a NullTargeting bonus with no behaviour of its own, Shadowstrike bottom's marker
# form). The plugin (GHTears.cs) watches every Tear the Nightshroud removes (the two-Tear limit's removals included, the
# user's default) and, while this card is active, offers Strengthen (self, the step's confirm or skip = "you may");
# taken, the card is discarded (its bonus finished) and all adjacent enemies suffer Damage 2.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TActive:
                NullTargeting: True
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Persistent
        Infuse: Dark
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BAttack:
                Attack:
                    Amount: 2
                    DiamondEnhancements: 1
Layout:
    Top:
        - Active:
            Ability: TActive
            Icon: Positive_AttackPlus
            ListLayout: "$GH2E_Nightshroud2_16_T$"
            Layout: "$GH2E_Nightshroud2_16_T$"
        - Row: "<size=50%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - MandatoryTrigger:
                    Layout:
                        - Infuse: Dark
            - Column:
                - Duration: Persistent
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
