# card: Black Knives
# top: "+1 Attack on the second attack if the first attack kills an enemy": the plugin (GHTears.cs) adds +1 to the
# second target's attack (before the modifier's math) when the first target died (card 32908 only).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                Target: 2
        Consumes:
            TCDark:
                Elements: Dark
                AbilityOverrides:
                    TCDarkAttackBuff:
                        ParentName: TAttack
                        Strength: 1
                XP: 1
        XP: 1
    Bottom:
        Abilities:
            BAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                    Pierce: 1
                    PierceEnhancements: 1
            BLoot:
                Loot: 1
                Target: -1
                AnimOverload: Loot
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Target$ <sprite name=Target> 2"
        - Row: "<size=20%> "
        - Consume:
            Name: TCDark
            Text: "+1 $Attack$ <sprite name=Attack>, <sprite name=XP1>"
        - Row: "<size=20%> "
        - Row: "$GH2E_Nightshroud2_08_T$"
        - Row: "<size=50%> "
        - XP: 1
    Bottom:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "$Pierce$ <sprite name=Pierce> *BAttack.Pierce* @BAttack.Pierce@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Loot$ <sprite name=Loot> *BLoot*"
