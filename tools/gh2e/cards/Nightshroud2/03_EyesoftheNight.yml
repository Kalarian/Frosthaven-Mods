# card: Eyes of the Night
# top: the reveal = Frosthaven's Shattersong Transparency/Future Sense (CustomAbility.ShowTopMonsterCards on the
# targeted enemies), aimed at all enemies within range 2. The Tear = a Deathwalker shadow (CreateShadow, Call to the
# Abyss bottom shape).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TReveal:
                NullTargeting: True
                Range: 2
                Target: -1
                Filter: Enemy
                AnimOverload: Cast_Concentrate
                PerformVars:
                    ApplyToActors:
                        Targets: ActorsToTarget
                        ShowMonsterCards: CustomAbility.ShowTopMonsterCards(Targets)
            TTear:
                CreateShadow:
                HelpBoxTooltipLocKey: "GH2E_Nightshroud2_TEAR_PLACE_HELP"
                Range: 2
                Target: 1
                AnimOverload: Shadow Manipulation
        Infuse: Dark
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    SquareEnhancements: 1
Layout:
    Top:
        - Row: "$GH2E_Nightshroud2_03_T$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Nightshroud2_03_T2$"
        - Row: "<size=50%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Dark
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
