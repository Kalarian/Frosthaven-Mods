# card: Meteor
# from Xipe's 99140_Cragheart2_Meteor.yml; rewritten from tools/gh2e/sheets/Cragheart.json
# top consume: a round bonus built on Frosthaven's Drifter Shockwave (DuringActionAbilityOnAttackFinished): after each of
#   your ranged attacks this round, every other figure adjacent to the target suffers 1 damage (Xipe: a ControlActor
#   copied from Vicious Ballet). Frosthaven's ability-level Consume, first on the half as on Infuser Gemstone Resonance.
# top: "destroy any number of adjacent obstacles; Attack 2, range 3 for each": one destroy (up to 6), then six separate
#   Attack 2 abilities, the k-th only when k obstacles were destroyed this action (CPhaseAction.ObstaclesDestroyedThisAction),
#   so several may hit the same enemy. No marks, no XP, no infusion on the top (Xipe: XP 2, Infuse Earth). Bench first.
# bottom: the damage row is a "!" box (CanSkip False)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TConsume:
                Consume:
                    Elements: [Earth]
                    Abilities:
                        TCMeteor:
                            AddActiveBonus:
                                Damage: 1
                                Filter: [Enemy, Ally]
                                Target: -1
                                Vars:
                                    ActorsToTarget: AdjacentToTarget.Where(IsDead == false)
                                Targeting: Custom
                                TargetingVars:
                                    AddValidActorsInRange: ActorsToTarget
                                    AddTilesInRange: ActorsToTarget.Select(obj.Tile)
                                AutoTrigger: True
                                SkipAnim: True
                            Filter: Self
                            AutoTrigger: True
                            AnimOverload: PowerUp
                            ActiveBonus:
                                Duration: Round
                                Behaviour: DuringActionAbilityOnAttackFinished
                                AttackType: Ranged
                                ListLayoutOverride: [$GH2E_Cragheart2_25_T3$, Positive_Damage_Enemy_Attack]
                                Vars:
                                    AttackAbility: TriggerAbility
                                    ValidateIsRangedAttack: AttackAbility.IsMeleeAttack == false
                                    Attacker: TriggerActor
                                    AttackTarget: TriggerTarget
                                    AdjacentToTarget: AllAliveActors.Where(obj != AttackTarget && obj != Attacker && obj.IsAdjacentTo(AttackTarget))
                                    ValidateAnyAdjacentToTarget: AdjacentToTarget.Count > 0
                    XP: 1
            TDestroy:
                DestroyObstacle: True
                Range: 1
                Target: 6
                Targeting: Range
                AnimOverload: MeleeSmashExplosivePunch
            TAttack1:
                Attack: 2
                Range: 3
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateDestroyed: CPhaseAction.ObstaclesDestroyedThisAction >= 1
            TAttack2:
                Attack: 2
                Range: 3
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateDestroyed: CPhaseAction.ObstaclesDestroyedThisAction >= 2
            TAttack3:
                Attack: 2
                Range: 3
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateDestroyed: CPhaseAction.ObstaclesDestroyedThisAction >= 3
            TAttack4:
                Attack: 2
                Range: 3
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateDestroyed: CPhaseAction.ObstaclesDestroyedThisAction >= 4
            TAttack5:
                Attack: 2
                Range: 3
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateDestroyed: CPhaseAction.ObstaclesDestroyedThisAction >= 5
            TAttack6:
                Attack: 2
                Range: 3
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateDestroyed: CPhaseAction.ObstaclesDestroyedThisAction >= 6
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
                    Jump: True
            BDamage:
                Damage: 1
                Range: 1
                Target: -1
                Filter: [Enemy, Ally]
                IgnoreStun: True
                CanSkip: False
                AnimOverload: Footstomp
Layout:
    Top:
        - Row: "<sprite name=ConsumeEarth> $GH2E_Cragheart2_25_T$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Cragheart2_25_T2$"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack1*"
        - Row: "$Range$ <sprite name=Range> *TAttack1.Range*"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$Jump$ <sprite name=Jump>"
        - Row: "<size=50%> "
        - Row: "$GH2E_Cragheart2_25_B$"
