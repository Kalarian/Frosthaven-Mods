# card: Massive Boulder
# from Xipe's 99120_Cragheart2_Massive Boulder.yml; corrected against tools/gh2e/sheets/Cragheart.json
# top: the inline damage around the target is the 1st edition Massive Boulder's shape (play-tested)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
                Range:
                    Amount: 2
                    Enhancements: 1
                AnimOverload: ObstacleMassiveBoulder
                SubAbilities:
                    TAttackSubDamage:
                        Damage: 1
                        Range: 1
                        Target: -1
                        Filter: [Enemy, Ally]
                        IsInlineSubAbility: True
                        AllTargetsAdjacentToParentTargets: True
        Infuse: Earth
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "<size=20%> "
        - MandatoryTrigger:
            Layout:
                - Row: "$GH2E_Cragheart2_05_T$"
        - Row: "<size=20%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Earth
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
