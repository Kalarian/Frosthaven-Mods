# card: Solidify
# from Xipe's 99136_Cragheart2_Solidify.yml; corrected against tools/gh2e/sheets/Cragheart.json
# bottom: the 1st edition Unstable Upheaval bottom's shape (round Shield 2 on allies, each suffers 1 damage through
# UseParentTiles; play-tested), here on one ally within range 3. The damage row is a "!" box (CanSkip False).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
                Range: 4
                AnimOverload: MeleeSmashCrater
                MultiPassAttack: False
        Consumes:
            TCEarth:
                Elements: Earth
                AbilityOverrides:
                    TCEarthAttackBuff:
                        ParentName: TAttack
                        Strength: 2
                XP: 1
    Bottom:
        Abilities:
            BShield:
                Shield: 2
                Range: 3
                Target: 1
                Filter: Ally
                AnimOverload: TargetedUnstableUpheavalBottom
                ActiveBonusDuration: Round
                SubAbilities:
                    BShieldSubDamage:
                        Damage: 1
                        Target: -1
                        UseParentTiles: True
                        CanSkip: False
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "<size=20%> "
        - Consume:
            Name: TCEarth
            Text: "+2 $Attack$ <sprite name=Attack>, <sprite name=XP1>"
    Bottom:
        - Row: "$GH2E_Cragheart2_21_B$"
        - MandatoryTrigger:
            Layout:
                - Row: "$GH2E_Cragheart2_21_B2$"
        - Active:
            Ability: BShield
            Icon: "Shield"
            ListLayout: "<sprite name=Shield> *BShield*"
            Layout:
                - Row: "<b><size=130%>$Shield$ <sprite name=Shield> *BShield*"
