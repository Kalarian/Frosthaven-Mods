# card: Backup Ammunition
# from Xipe's 99121_Cragheart2_Backup Ammunition.yml; corrected against tools/gh2e/sheets/Cragheart.json
# top: +1 Target on the next four SINGLE-TARGET ranged attack abilities: the BuffTarget bonus (the 1st edition card's
# shape) marked GHSingleTargetOnly; the plugin (GHCragheart2e.cs) gives no +1 and spends no slot on an attack ability
# that, as written, has more than one target or an area
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TActive:
                AddTarget: 1
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffTarget
                    ValidAbilityType: Attack
                    AttackType: Ranged
                    XPTracker: [0,1,0,1]
                MiscVars:
                    GHSingleTargetOnly: True
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
Layout:
    Top:
        - Active:
            Ability: TActive
            ListLayout: "$GH2E_Cragheart2_06_T$"
            Layout: "$GH2E_Cragheart2_06_T$"
            Icon: "Attack"
        - Row: "<size=50%> "
        - XPTracker: TActive
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
