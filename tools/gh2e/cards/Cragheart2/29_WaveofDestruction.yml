# card: Wave of Destruction
# from Xipe's 99144_Cragheart2_Wave of Destruction.yml; corrected against tools/gh2e/sheets/Cragheart.json
# top: no enhancement mark on the attack. "+X Attack per target, X = range to it": Frosthaven's per-target
#   TargetDistanceRangeDiff is |ability range - distance|, and a melee area attack has range 1, so it gives distance - 1;
#   the stored base is 2 so the total is the printed 1 + distance (the card face shows the printed 1)
# bottom: APPROXIMATION: the move is a Jump (as Xipe; the card has none) that destroys every obstacle on its path (the
#   1st edition Clear the Way's destroy-on-path, play-tested), so you can't end in an obstacle's hex and you pass over
#   enemies and traps; then +2 per destroyed obstacle on your next attack this turn (a one-use turn bonus,
#   CPhaseAction obstacle count of the action). Bench first.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 2
                StatIsBasedOnX:
                    Strength:
                        BasedOn: TargetDistanceRangeDiff
                        AddTo: True
                AreaEffect: "0,0,G|1,1,R|2,0,R|3,1,R|4,2,R|5,1,R|6,2,R|7,3,R|8,2,R|9,3,R|10,4,E|11,3,E"
                MultiPassAttack: False
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    Enhancements: 1
                    Jump: True
            BDestroyObstacle:
                DestroyObstacle:
                Target: -1
                AllTargetsOnMovePath: True
                SpawnDelay: 0.2
                SkipAnim: True
            BAttackBuff:
                Attack: 0
                Filter: Self
                AutoTrigger: True
                AnimOverload: PowerUp
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateDestroyed: CPhaseAction.ObstaclesDestroyedThisAction > 0
                StatIsBasedOnX:
                    Strength:
                        BasedOn: ObstaclesDestroyedThisAction
                        Multiplier: 2
                ActiveBonus:
                    Duration: Turn
                    Behaviour: BuffAttack
                    XPTracker: [0]
Layout:
    Top:
        - Row:
            - ColumnWidths: "45,55"
            - Column:
                - Row: "<b><size=130%>$Attack$ <sprite name=Attack> 1"
                - Row: "<size=20%> "
                - Row: "$GH2E_Cragheart2_29_T$"
            - Column:
                - Row: "£Area£"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=20%> "
        - Row: "$GH2E_Cragheart2_29_B$"
        - Row: "<size=20%> "
        - Active:
            Ability: BAttackBuff
            ListLayout: "$GH2E_Cragheart2_29_B3$"
            Layout: "$GH2E_Cragheart2_29_B2$"
            Icon: "Positive_AttackPlus"
