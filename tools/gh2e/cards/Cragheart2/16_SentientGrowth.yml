# card: Sentient Growth
# from Xipe's 99131_Cragheart2_Sentient Growth.yml; corrected against tools/gh2e/sheets/Cragheart.json
# top: Attack 2 carries a square mark; the Heal 2 on allies in the red hexes has no mark (Xipe gave it one)
# bottom: Move 2 [circle] (Xipe: none); Heal 1 [square] "target all, range 1" includes yourself (a heal with a range
# may target its user; Xipe: allies only); Attack 1 [square] on all adjacent enemies
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    SquareEnhancements: 1
                Range: 3
                AreaEffect: "0,0,R|2,0,R|1,1,R|3,1,E"
                AnimOverload: TargetedSentientGrowth
                MultiPassAttack: False
                SubAbilities:
                    TAttackSubHeal:
                        Heal: 2
                        Filter: Ally
        Infuse: Earth
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    Enhancements: 1
            BHeal:
                Heal:
                    Amount: 1
                    SquareEnhancements: 1
                Range: 1
                Target: -1
                Filter: [Self, Ally]
                AnimOverload: Heal
            BAttack:
                Attack:
                    Amount: 1
                    SquareEnhancements: 1
                Target: -1
                MultiPassAttack: False
                AnimOverload: FootstompSentientGrowth
Layout:
    Top:
        - Row:
            - ColumnWidths: "60,40"
            - Column:
                - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
                - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
                - Row: "<size=50%> "
                - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *TAttackSubHeal*"
                - Row: "$GH2E_Cragheart2_16_T$"
            - Column:
                - Row: "£Area£"
        - Row: "<size=20%> "
        - Infuse: Earth
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *BHeal* <size=100%><voffset=1>@BHeal@"
        - Row: "$GH2E_Cragheart2_16_B$"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "$Target_AllAdjacentEnemies$"
