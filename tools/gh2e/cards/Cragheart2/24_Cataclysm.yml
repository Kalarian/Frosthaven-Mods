# card: Cataclysm
# from Xipe's 99139_Cragheart2_Cataclysm.yml; corrected against tools/gh2e/sheets/Cragheart.json
# top: the two hex marks of the card added (3,1 and 3,-1); the Immobilize sub-ability on [Enemy, Ally] covers the
# enemies and the allies in the red hexes (the 1st edition card's shape, play-tested)
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 4
                    Enhancements: 1
                AnimOverload: TargetedCataclysm
                AreaEffect: "0,0,R|2,0,R|1,1,R|-1,1,R|-2,0,G|-1,-1,R|1,-1,R|3,1,E|3,-1,E"
                MultiPassAttack: False
                SubAbilities:
                    TAttackSubImmo:
                        Immobilize: True
                        Filter: [Enemy, Ally]
        Consumes:
            TCEarth:
                Elements: Earth
                AbilityOverrides:
                    TCEarthAttackBuff:
                        ParentName: TAttack
                        Strength: 2
                XP: 1
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
        Consumes:
            BCEarth:
                Elements: Earth
                AbilityOverrides:
                    BCEarthMoveBuff:
                        ParentName: BMove
                        Strength: 3
                XP: 1
        Infuse: Earth
Layout:
    Top:
        - Row:
            - ColumnWidths: "60,40"
            - Column:
                - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
                - Row: "$Immobilize$ <sprite name=Immobilize>"
                - Row: "<size=20%> "
                - Consume:
                    Name: TCEarth
                    Text: "+2 $Attack$ <sprite name=Attack>, <sprite name=XP1>"
            - Column:
                - Row: "£Area£"
        - Row: "<size=50%> "
        - MandatoryTrigger:
            Layout:
                - Row: "$GH2E_Cragheart2_24_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=20%> "
        - Consume:
            Name: BCEarth
            Text: "+3 $Move$ <sprite name=Move>, <sprite name=XP1>"
        - Row: "<size=20%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Earth
