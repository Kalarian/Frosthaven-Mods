# card: Rumbling Advance
# from Xipe's 99119_Cragheart2_Rumbling Advance.yml; corrected against tools/gh2e/sheets/Cragheart.json
# bottom: the damage row sits in a "!" box (mandatory trigger, 2e rulebook p.35): CanSkip False
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            THeal:
                Heal:
                    Amount: 4
                    Enhancements: 1
                Range:
                    Amount: 2
                    Enhancements: 1
                Filter: [Self, Ally]
                AnimOverload: Heal
        Infuse: Earth
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    Enhancements: 1
            BDamage:
                Damage: 1
                Range: 1
                Target: -1
                Filter: [Enemy, Ally]
                IgnoreStun: True
                CanSkip: False
                AnimOverload: Footstomp
        Infuse: Earth
Layout:
    Top:
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
        - Row: "$Range$ <sprite name=Range> *THeal.Range* @THeal.Range@"
        - Row: "<size=20%> "
        - Infuse: Earth
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Cragheart2_04_B$"
        - Row: "<size=20%> "
        - Infuse: Earth
