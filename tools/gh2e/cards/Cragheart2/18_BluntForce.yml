# card: Blunt Force
# from Xipe's 99133_Cragheart2_Blunt Force.yml; corrected against tools/gh2e/sheets/Cragheart.json
# top: lost (Xipe: discard)
# bottom: Heal 2 carries a square mark; the consume gives Ward (Xipe: Retaliate 1 for the round, in a block that didn't
# parse), added after the heal as Gloomhaven's consume-adds-an-ability shape
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 5
                    Enhancements: 1
        Consumes:
            TCEarth:
                Elements: Earth
                AbilityOverrides:
                    TCEarthAttackBuff:
                        ParentName: TAttack
                        Strength: 5
                XP: 1
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 1
                    Enhancements: 1
            BHeal:
                Heal:
                    Amount: 2
                    SquareEnhancements: 1
                Filter: Self
                AnimOverload: Heal
        Consumes:
            BCEarth:
                Elements: Earth
                Abilities:
                    BCEarthWard:
                        ParentName: BHeal
                        Ward: True
                        Filter: Self
                        AnimOverload: PowerUp
                XP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=20%> "
        - Consume:
            Name: TCEarth
            Text: "+5 $Attack$ <sprite name=Attack>, <sprite name=XP1>"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *BHeal* <size=100%><voffset=1>@BHeal@"
        - Row: "<size=20%> "
        - Consume:
            Name: BCEarth
            Text: "$Ward$ <sprite name=Ward>, <sprite name=XP1>"
