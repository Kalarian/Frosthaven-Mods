# card: Rock Slide
# from Xipe's 99134_Cragheart2_Rock Slide.yml; corrected against tools/gh2e/sheets/Cragheart.json
# top: no XP (Xipe: XP 1); range 3 carries a square mark; damage and Muddle aim around the created tiles
# (AllTargetsAdjacentToParentTargets, the 1st edition Rock Slide fix)
# bottom (re-audit Cragheart2-02): "Designate one enemy within range 4" = a NullTargeting pick (BDesignate); "destroy
# all obstacles within range 2 of the designated enemy" = DestroyObstacle, all targets, its hexes measured from the
# designated enemy by plugin GHCragheart2e (MiscVars GH2E_DestroyAroundDesignated; the engine measures from you);
# "to perform: Attack X, target the designated enemy, Immobilize, X = twice the destroyed obstacles" = an attack aimed
# at the designated enemy (Custom targeting), X from CPhaseAction.ObstaclesDestroyedThisAction x 2 (Wave of Destruction
# shape), performed only when at least one obstacle was destroyed. UNVERIFIED in play.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TCreate:
                Create: RockSingle
                Range:
                    Amount: 3
                    Enhancements: 1
                Target: 3
                SpawnDelay: 2.9
                AnimOverload: ObstacleAvalanche
                MultiPassAttack: False
                SubAbilities:
                    # (the Muddle as the damage's own condition, as Frosthaven's Snowdancer Shifting Snow writes it: a second
                    # sub-ability around the same tiles started 19 times and never muddled anyone, harness 2026-11-02)
                    TCreateSubDamage:
                        AllTargetsAdjacentToParentTargets: True
                        Damage: 1
                        Conditions: [Muddle]
                        Range: 1
                        Target: -1
                        Filter: [Enemy, Ally]
        Infuse: Earth
    Bottom:
        Abilities:
            BDesignate:
                NullTargeting: True
                Range: 4
                Target: 1
                Filter: Enemy
                AnimOverload: None
            BDestroyObstacle:
                DestroyObstacle:
                Range: 2
                Target: -1
                AnimOverload: MeleeSmashRockyEnd
                SpawnDelay: 2.16
                MiscVars:
                    GH2E_DestroyAroundDesignated: True
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        Designate: CustomAbility.FindAbilityInPhaseByName("BDesignate")
                        ValidateDesignated: Designate != null && Designate.ActorsTargeted.Count > 0
            BAttack:
                Attack:
                    Amount: 0
                Range: 4
                Target: 1
                Conditions: Immobilize
                Targeting: Custom
                Vars:
                    Designate: CustomAbility.FindAbilityInPhaseByName("BDesignate")
                TargetingVars:
                    AddValidActorsInRange: Designate.ActorsTargeted
                    AddActorsToTarget: Designate.ActorsTargeted
                StatIsBasedOnX:
                    Strength:
                        BasedOn: ObstaclesDestroyedThisAction
                        Multiplier: 2
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateDestroyed: CPhaseAction.ObstaclesDestroyedThisAction > 0
                        Designate: CustomAbility.FindAbilityInPhaseByName("BDesignate")
                        ValidateAlive: Designate != null && Designate.ActorsTargeted.Count > 0 && Designate.ActorsTargeted[0].IsDead == False
                AnimOverload: MeleeSmashRockyEnd
        XP: 2
Layout:
    Top:
        - Row: "$GH2E_Cragheart2_19_T$"
        - Row: "$Range$ <sprite name=Range> *TCreate.Range* @TCreate.Range@"
        - Row: "<size=20%> "
        - Row: "$GH2E_Cragheart2_19_T2$"
        - Row: "<size=20%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Earth
    Bottom:
        - Row: "$GH2E_Cragheart2_19_B$"
        - Row: "$GH2E_Cragheart2_19_B2$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> X"
        - Row: "$GH2E_Cragheart2_19_B3$"
        - Row: "$Immobilize$ <sprite name=Immobilize>"
        - Row: "$GH2E_Cragheart2_19_B4$"
