# card: Earthen Bulwark
# from Xipe's 99122_Cragheart2_Earthen Bulwark.yml; corrected against tools/gh2e/sheets/Cragheart.json
# top: the damage and Ward are a consume Earth (Xipe: always, Strengthen); both aim at the allies around the created
# tiles (AllTargetsAdjacentToParentTargets under a Create, the 1st edition Rock Slide fix); range 3 carries a square mark
# bottom: Heal 1 carries a square mark (square slot)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TCreate:
                Create: RockSingle
                Range:
                    Amount: 3
                    Enhancements: 1
                Target: 2
                SpawnDelay: 2.9
                AnimOverload: ObstacleAvalanche
                MultiPassAttack: False
        Consumes:
            TCEarth:
                Elements: Earth
                AbilityOverrides:
                    TCEarthAllies:
                        ParentName: TCreate
                        SubAbilities:
                            TCEarthDamage:
                                AllTargetsAdjacentToParentTargets: True
                                Damage: 1
                                Range: 1
                                Target: -1
                                Filter: Ally
                            TCEarthWard:
                                AllTargetsAdjacentToParentTargets: True
                                Ward: True
                                Range: 1
                                Target: -1
                                Filter: Ally
                                AutoTrigger: True
                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    Enhancements: 1
            BHeal:
                Heal:
                    Amount: 1
                    SquareEnhancements: 1
                Range:
                    Amount: 2
                    Enhancements: 1
                Filter: [Self, Ally]
                AnimOverload: Heal
Layout:
    Top:
        - Row: "$GH2E_Cragheart2_07_T$"
        - Row: "$Range$ <sprite name=Range> *TCreate.Range* @TCreate.Range@"
        - Row: "<size=20%> "
        - Consume:
            Name: TCEarth
            Text: "$GH2E_Cragheart2_07_T2$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *BHeal* <size=100%><voffset=1>@BHeal@"
        - Row: "$Range$ <sprite name=Range> *BHeal.Range* @BHeal.Range@"
