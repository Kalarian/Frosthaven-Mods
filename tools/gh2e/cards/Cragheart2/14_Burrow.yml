# card: Burrow
# from Xipe's 99129_Cragheart2_Burrow.yml; corrected against tools/gh2e/sheets/Cragheart.json
# top: Heal 2 carries a square mark (square slot); infuse Earth (Xipe had none)
# bottom: Move 7 carries a square mark; the consume adds its own Immobilize on every enemy moved through, with
# Targeting All (the Trample lesson: the move-path branch is reached only when Targeting isn't Range)
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            THeal:
                Heal:
                    Amount: 2
                    SquareEnhancements: 1
                Range: 3
                Target: 2
                Filter: [Self, Ally]
                MultiPassAttack: False
                AnimOverload: Heal
        Infuse: Earth
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 7
                    Jump: True
                    SquareEnhancements: 1
        Consumes:
            BCEarth:
                Elements: Earth
                Abilities:
                    BCEarthImmobilize:
                        ParentName: BMove
                        Immobilize: True
                        Filter: Enemy
                        AllTargetsOnMovePath: True
                        Targeting: All
                        Target: -1
                        AnimOverload: None
                XP: 1
        XP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
        - Row: "$Target$ <sprite name=Target> *THeal.Target*"
        - Row: "$Range$ <sprite name=Range> *THeal.Range*"
        - Row: "<size=20%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Earth
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$Jump$ <sprite name=Jump>"
        - Row: "<size=20%> "
        - Consume:
            Name: BCEarth
            Text: "$GH2E_Cragheart2_14_B$"
