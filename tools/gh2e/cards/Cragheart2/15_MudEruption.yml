# card: Mud Eruption
# from Xipe's 99130_Cragheart2_Mud Eruption.yml; corrected against tools/gh2e/sheets/Cragheart.json
# top: "target 4 enemies within 4 hexes" = Range 4, Target 4 (as Xipe); the obstacles go in the hexes the targets stood
# in when targeted (an attack's TilesSelected are its targets' hexes, CAbilityAttack), placed after the pushes on the
# ones that are now featureless (Xipe: one obstacle anywhere within range 4). Pyroclast Cooling's create shape. Bench first.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
                Range: 4
                Target: 4
                AnimOverload: ObstacleEarthenClod
                SubAbilities:
                    TAttackSubPush:
                        Push: 1
                        AnimOverload: None
                        IsInlineSubAbility: True
                    TMudCreate:
                        Create: RockSingle
                        Target: -1
                        TreatAsNonSubAbility: True
                        AutoTrigger: True
                        TileFilter: FeaturelessHex
                        Targeting: Custom
                        TargetingVars:
                            AddTilesInRange: ParentAbility.TilesSelected
                        SpawnDelay: 2.9
                        AnimOverload: None
        Infuse: Earth
        XP: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$GH2E_Cragheart2_15_T$"
        - Row: "$Push$ <sprite name=Push> *TAttackSubPush*"
        - Row: "<size=20%> "
        - Row: "$GH2E_Cragheart2_15_T2$"
        - Row: "<size=20%> "
        - Infuse: Earth
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
