# card: Heaving Swing
# from Xipe's 99127_Cragheart2_Heaving Swing.yml; corrected against tools/gh2e/sheets/Cragheart.json
# top: push into obstacles, the 1st edition card's shape (play-tested)
# bottom: the cost is Frosthaven's own "suffer damage or destroy an adjacent obstacle" choice (Pyroclast Obsidian
# Shield bottom), then a round bonus of +3 on the next melee attack (one use: XPTracker [0], as Pyroclast Hardened Spike).
# The cost is optional (no "!" box; rulebook p22, decision B): BCost may be skipped, and the bonus comes only when one
# of its two options was performed this action (re-audit).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
                SubAbilities:
                    TAttackSubPush:
                        Push:
                            Amount: 1
                            Enhancements: 1
                        IsInlineSubAbility: True
                        AdditionalPushEffect: IntoObstacles
                        AdditionalPushEffectDamage: 2
                        AdditionalPushEffectXP: 1
    Bottom:
        Abilities:
            BCost:
                Filter: Self
                CanSkip: True
                HelpBoxTooltipLocKey: "$GH2E_Cragheart2_12_B2$"
                Choose:
                    Abilities:
                        BDamageSelf:
                            Damage: 1
                            Filter: Self
                            AutoTrigger: True
                            PreviewEffectText: "<sprite name=Damage>1"
                        BDestroyObstacle:
                            CanSkip: False
                            StartAbilityRequirements:
                                Type: ThisAbility
                                Vars:
                                    ValidateHasNearbyObstacle: GameState.GetTilesInRange(Actor, 1).Where(obj.FindObstacleProp(true, true) != null).Count > 0
                            PreviewEffectText: "$OBSTACLE_TOOLTIP$"
                            NullHex: True
                            Range: 1
                            TileFilter: Custom
                            MiscVars:
                                IsValidTile: obj.FindObstacleProp(true, true) != null
                                DontCancelIfNoTiles: True
                                DontPreviewDescription: True
                                SelectMultiHexProps: True
                            AnimOverload: ObstacleDestruction
                            PerformVars:
                                Perform:
                                    SelectedTile: TilesSelected[0]
                                    Prop: SelectedTile.FindObstacleProp(true, true)
                                    DestroyProp: Prop.DestroyPropFromAbility(obj)
            BActive:
                Attack: 3
                Filter: Self
                AutoTrigger: True
                AnimOverload: PowerUp
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        PaidDamage: CustomAbility.FindAbilityInPhaseByName("BDamageSelf")
                        PaidObstacle: CustomAbility.FindAbilityInPhaseByName("BDestroyObstacle")
                        ValidatePaid: (PaidDamage != null && PaidDamage.AbilityHasHappened) || (PaidObstacle != null && PaidObstacle.AbilityHasHappened)
                ActiveBonus:
                    Duration: Round
                    Behaviour: BuffAttack
                    AttackType: Melee
                    XPTracker: [0]
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Push$ <sprite name=Push> *TAttackSubPush* @TAttackSubPush@"
        - Row: "<size=20%> "
        - Row: "$GH2E_Cragheart2_12_T$"
    Bottom:
        - Active:
            Ability: BActive
            ListLayout: "$GH2E_Cragheart2_12_B3$"
            Layout: "$GH2E_Cragheart2_12_B$"
            Icon: "Positive_AttackPlus"
