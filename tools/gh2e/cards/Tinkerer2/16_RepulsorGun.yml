# card: Repulsor Gun
# from Xipe's 99045_Tinkerer2_Repulsor Gun.yml; corrected against tools/gh2e/sheets/Tinkerer.json
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 3
                Range: 3
                AnimOverload: RangedAttack
                SubAbilities:
                    TAttackSubPush:
                        Push:
                            Amount: 1
                            Enhancements: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    Enhancements: 1
            BPush:
                Push:
                    Amount: 2
                    Enhancements: 1
                Range: 2
                Filter: Enemy
                AnimOverload: RangedAttack
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack*"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$Push$ <sprite name=Push> *TAttackSubPush* @TAttackSubPush@"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Push$ <sprite name=Push> *BPush* <size=100%><voffset=1>@BPush@"
        - Row: "$Range$ <sprite name=Range> *BPush.Range*"
