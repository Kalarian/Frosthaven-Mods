# card: Teleportation Pad
# Xipe's 99047 is a placeholder (plain Attack 3 / Move 4); written from tools/gh2e/sheets/Tinkerer.json
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            # NEEDS PLUGIN: "you and all allies may treat the two token hexes as adjacent during move abilities" has
            # no engine shape. The two tokens are placed (summons that can't be targeted, hurt or block, the 1st
            # edition Ward's shape; each in an empty hex within range 5) so a plugin can read them; the rule is text.
            TSummon:
                Summon: TeleportationPadID
                Range: 5      # "in an empty hex within Range 5" (CAbilitySummon.SelectSummonPosition reads the range)
                AnimOverload: Summon
            TSummon2:
                Summon: TeleportationPadID
                Range: 5      # "in an empty hex within Range 5" (CAbilitySummon.SelectSummonPosition reads the range)
                AnimOverload: Summon
        XP: 3
    Bottom:
        Abilities:
            # Frosthaven's Teleport (the Blinkblade's Breakneck Speed bottom: Teleport2, a circle slot)
            BTeleport:
                Teleport2:
                    Amount: 4
                    CircleEnhancements: 1
                Filter: Self
                AnimOverload: Teleport Into
                AnimOverload2: Teleport Outof
Layout:
    Top:
        - Active:
            Ability: "TSummon"
            Icon: "Summon"
            Layout:
                - Summon:
                    Ability: TSummon
                    SummonName: $GH2E_SUMMON_TeleportationPad$
                    SpecialText: "$GH2E_Tinkerer2_18_T$"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - XP: 3
            - Column:
                - Duration: Persistent
    Bottom:
        - Row: "<b><size=130%>$Teleport$ <sprite name=Teleport> *BTeleport* <size=100%><voffset=1>@BTeleport@"
