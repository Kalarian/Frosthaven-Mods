# card: Cryonic Snare
# from Xipe's 99057_Tinkerer2_Cryonic Snare.yml; corrected against tools/gh2e/sheets/Tinkerer.json
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            # the Trapper's Boar Catcher shape: a trap within range 2 (Range with RangeIsBase)
            TTrap:
                Trap:
                    TrapName: PoisonMine
                    Damage: 4
                    Conditions: [Wound, Stun]
                Range:
                    Amount: 2
                    Enhancements: 1
                RangeIsBase: True
                SpawnDelay: 2.8
                AnimOverload: RangedTrap
        Infuse: Ice
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
            # "Grant one adjacent ally: Retaliate 2" for the round (Frosthaven's Hold the Line shape, one ally)
            BAllyRetaliate:
                Retaliate:
                    Amount: 2
                    DiamondPlusEnhancements: 1
                Range: 1
                Target: 1
                Filter: Ally
                ActiveBonus:
                    Duration: Round
Layout:
    Top:
        - Row: "$GH2E_Tinkerer2_28_T$"
        - Row: "<b><size=130%><sprite name=Damage> *TTrap* <sprite name=Wound> <sprite name=Stun>"
        - Row: "$Range$ <sprite name=Range> *TTrap.Range* @TTrap.Range@"
        - Row: "<size=50%> "
        - Infuse: Ice
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Tinkerer2_28_B$"
        - Row: "<b><size=130%>$Retaliate$ <sprite name=Retaliate> *BAllyRetaliate* <size=100%><voffset=1>@BAllyRetaliate@"
        - Row: "<size=20%> "
        - Duration: Round
