# card: Auto Turret
# from Xipe's 99054_Tinkerer2_Auto Turret.yml; corrected against tools/gh2e/sheets/Tinkerer.json
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            # "At the end of this and your next three turns, perform the following twice: Attack 2, Range 5, Pierce 1":
            # the 1st edition Auto Turret shape (EndTurnAbility), 4 slots with XP on the first three. "Twice" is
            # Target 2 (Xipe's choice): two different enemies, not the same one twice (NOTES.md)
            TActive:
                AddActiveBonus:
                    Attack:
                        Amount: 2
                        Pierce: 1
                    Range: 5
                    Target: 2
                    AnimOverload: RangedAttack
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,1,1,0]
                AnimOverload: PowerUpPotent
    Bottom:
        Abilities:
            BWard:
                Ward:
                    Enhancements: 1
                Range: 3
                Filter: [Self, Ally]
                AnimOverload: PowerUp
            BMove:
                Move:
                    Amount: 2
                    Enhancements: 1
            BPoison:
                Poison:
                    Enhancements: 1
                Range: 3
                Filter: Enemy
                AnimOverload: RangedAttack
Layout:
    Top:
        - Active:
            Ability: TActive
            ListLayout: "$GH2E_Tinkerer2_25_T$"
            Layout: "$GH2E_Tinkerer2_25_T$"
            Icon: "Attack"
        - Row: "<size=20%> "
        - XPTracker: TActive
    Bottom:
        - Row: "<b><size=130%>$Ward$ <sprite name=Ward> <size=100%><voffset=1>@BWard@"
        - Row: "$Range$ <sprite name=Range> *BWard.Range*"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Poison$ <sprite name=Poison> <size=100%><voffset=1>@BPoison@"
        - Row: "$Range$ <sprite name=Range> *BPoison.Range*"
