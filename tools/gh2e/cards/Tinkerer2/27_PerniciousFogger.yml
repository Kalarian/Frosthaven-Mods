# card: Pernicious Fogger
# from Xipe's 99056_Tinkerer2_Pernicious Fogger.yml; corrected against tools/gh2e/sheets/Tinkerer.json
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            # The "Pernicious Fogger" token: a summon that can't be targeted, hurt or block (the 1st edition Ward's
            # shape) carrying an end-of-turn damage aura (Frosthaven's Banner of Doom shape with EndTurnAbility).
            # Placed in an empty hex within range 3.
            TSummon:
                Summon: PerniciousFoggerID
                Range: 3      # "in an empty hex within Range 3" (CAbilitySummon.SelectSummonPosition reads the range)
                AnimOverload: Summon
        XP: 3
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
            BStrengthen:
                Strengthen:
                    Enhancements: 1
                Range: 3
                Filter: [Self, Ally]
                AnimOverload: PowerUp
Layout:
    Top:
        - Active:
            Ability: "TSummon"
            Icon: "Summon"
            Layout:
                - Summon:
                    Ability: TSummon
                    SummonName: $GH2E_SUMMON_PerniciousFogger$
                    SpecialText: "$GH2E_Tinkerer2_27_T$"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - XP: 3
            - Column:
                - Duration: Persistent
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Strengthen$ <sprite name=Strengthen> <size=100%><voffset=1>@BStrengthen@"
        - Row: "$Range$ <sprite name=Range> *BStrengthen.Range*"
