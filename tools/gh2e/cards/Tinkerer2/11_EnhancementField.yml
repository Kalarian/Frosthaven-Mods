# card: Enhancement Field
# from Xipe's 99040_Tinkerer2_Enhancement Field.yml; corrected against tools/gh2e/sheets/Tinkerer.json
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            # The "Enhancement Field" token: a summon that can't be targeted, hurt or block (the 1st edition Ward's
            # shape, seen working in a scenario) carrying the +1 Attack aura of range 1 (the 1st edition Spirit Banner's
            # and Frosthaven's Banner of Strength's shape), placed in an empty hex within range 3.
            TSummon:
                Summon: EnhancementFieldID
                Range: 3      # "in an empty hex within Range 3" (CAbilitySummon.SelectSummonPosition reads the range)
                AnimOverload: Summon
        XP: 3
    Bottom:
        Abilities:
            # "you and all adjacent allies add +1 Attack to all attacks this round": the allies adjacent when played
            # (user decision C): a round +1 Attack on yourself and one on each adjacent ally (Heatwave bottom's
            # ally BuffAttack; Hold the Line's self + adjacent-allies split)
            BAttack:
                Attack: 1
                Filter: Self
                ActiveBonus:
                    Behaviour: BuffAttack
                    Duration: Round
                AnimOverload: EnhancementField
            BAllyAttack:
                Attack: 1
                Range: 1
                Target: -1
                Filter: Ally
                ActiveBonus:
                    Behaviour: BuffAttack
                    Duration: Round
                AnimOverload: None
Layout:
    Top:
        - Active:
            Ability: "TSummon"
            Icon: "Summon"
            Layout:
                - Summon:
                    Ability: TSummon
                    SummonName: $GH2E_SUMMON_EnhancementField$
                    SpecialText: "$GH2E_Tinkerer2_11_T$"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - XP: 3
            - Column:
                - Duration: Persistent
    Bottom:
        - Active:
            Ability: BAttack
            ListLayout: "$GH2E_Tinkerer2_11_B$"
            Layout: "$GH2E_Tinkerer2_11_B$"
            Icon: "Attack"
        - Row: "<size=20%> "
        - Duration: Round
