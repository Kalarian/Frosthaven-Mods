# card: Gravity Bomb
# Xipe's 99059 is a placeholder (plain Attack 3 / Move 3); written from tools/gh2e/sheets/Tinkerer.json
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            # APPROXIMATION, NEEDS PLUGIN for the exact rule (NOTES.md): the token, the one-turn delay and the pull
            # toward the token have no engine shape. Done at once instead: damage 5 to one enemy within range 4 (the
            # bomb's hex), then damage 1 to every enemy adjacent to it (the Rock Slide / Rot Maggots shape:
            # AllTargetsAdjacentToParentTargets + TreatAsNonSubAbility). No pull.
            TDamage:
                Damage: 5
                Range: 4
                Target: 1
                Targeting: Range
                Filter: Enemy
                AnimOverload: RangedAttack
                SubAbilities:
                    TDamageAdjacent:
                        Damage: 1
                        Range: 1
                        Target: -1
                        Filter: Enemy
                        TreatAsNonSubAbility: True
                        AllTargetsAdjacentToParentTargets: True
                        AnimOverload: None
    Bottom:
        Abilities:
            BAttack:
                Attack: 2
                Range: 3
                Conditions: Immobilize
                AreaEffect: "0,0,R|2,0,R|1,1,R"
                MultiPassAttack: False
                AnimOverload: RangedAttack
Layout:
    Top:
        - Row: "$GH2E_Tinkerer2_30_T$"
    Bottom:
        - ColumnWidths: "65,35"
        - Column:
            - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack*"
            - Row: "$Range$ <sprite name=Range> *BAttack.Range*"
            - Row: "$Immobilize$ <sprite name=Immobilize>"
        - Column:
            - Row: "£Area£"
