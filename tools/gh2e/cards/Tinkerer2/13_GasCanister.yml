# card: Gas Canister
# from Xipe's 99042_Tinkerer2_Gas Canister.yml; corrected against tools/gh2e/sheets/Tinkerer.json
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            # the trap damage's square slot in Frosthaven's own shape (the Trapper's Boar Catcher: SquareEnhancements
            # inside the Trap block)
            TTrap:
                Trap:
                    TrapName: PoisonMine
                    Damage: 4
                    SquareEnhancements: 1
                    Conditions: Muddle
                SpawnDelay: 2.8
                Target: 1
                AnimOverload: GadgetAdjacentNetShooter
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
Layout:
    Top:
        - Row: "$GH2E_Tinkerer2_13_T$"
        - Row: "<b><size=130%><sprite name=Damage> *TTrap* <size=100%><voffset=1>@TTrap@ <size=130%><sprite name=Muddle>"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
