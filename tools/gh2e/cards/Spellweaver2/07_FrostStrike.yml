# card: Frost Strike
# bottom: the consume grants a whole round bonus (advantage on all attacks): Frosthaven's Death Spiral bottom shape
# (Attack 0 + AttackHasAdvantage, round BuffAttack), granted by the consume onto a Null ability (Implode's shape)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    SquareEnhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                AnimOverload: TargetedFrostArmor
        Consumes:
            TCIce:
                Elements: Ice
                AbilityOverrides:
                    TCIceStun:
                        ParentName: TAttack
                        Conditions: Stun
                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    SquareEnhancements: 1
            BNull:
                Null: True
        Consumes:
            BCFire:
                Elements: Fire
                Abilities:
                    BCFireAdvantage:
                        ParentName: BNull
                        Attack: 0
                        AttackHasAdvantage: True
                        Filter: Self
                        ActiveBonus:
                            Duration: Round
                            Behaviour: BuffAttack
                        AnimOverload: PowerUp
                XP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "<size=20%> "
        - Consume:
            Name: TCIce
            Text: "$Stun$ <sprite name=Stun>, <sprite name=XP1>"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Consume:
            Name: BCFire
            Text: "$GH2E_Spellweaver2_07_B$"
