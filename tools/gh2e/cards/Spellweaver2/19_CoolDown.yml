# card: Cool Down
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            THeal:
                Heal:
                    Amount: 2
                    Enhancements: 1
                Target:
                    Amount: 2
                    Enhancements: 1
                Range: 3
                Filter: [Self, Ally]
                AnimOverload: Heal
        Consumes:
            TCAny:
                Elements: Any
                AbilityOverrides:
                    TCAnyHealBuff:
                        ParentName: THeal
                        Strength: 1
                        Range: 1
                XP: 1
    Bottom:
        Abilities:
            BAttack:
                Attack:
                    Amount: 2
                    Enhancements: 1
                    Pierce: 1
                    PierceEnhancements: 1
                Range: 4
                AnimOverload: TargetedIcyBlast
        Infuse: Ice
Layout:
    Top:
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
        - Row: "$Target$ <sprite name=Target> *THeal.Target* @THeal.Target@"
        - Row: "$Range$ <sprite name=Range> *THeal.Range*"
        - Row: "<size=20%> "
        - Consume:
            Name: TCAny
            Text: "+1 $Heal$ <sprite name=Heal>, +1 $Range$ <sprite name=Range>, <sprite name=XP1>"
    Bottom:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "$Range$ <sprite name=Range> *BAttack.Range*"
        - Row: "$Pierce$ <sprite name=Pierce> *BAttack.Pierce* @BAttack.Pierce@"
        - Row: "<size=20%> "
        - Infuse: Ice
