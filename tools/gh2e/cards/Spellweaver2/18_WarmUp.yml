# card: Warm Up
# top: persistent, one use (the single dashed slot): approximated as a one-use toggle +1 Attack bonus (Frosthaven's
# Tidal Blast bottom shape: BuffAttack, IsToggleBonus) the player turns on for the next attack ability of a lost action;
# Frosthaven's BuffAttack never checks requirements, so the "from an action with [lost]" condition is the player's
# (NEEDS PLUGIN for the exact rule). Top is persistent only (no lost icon): discarded when the use ends.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                AnimOverload: TargetedGenericFlame
            TActive:
                Attack: 1
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffAttack
                    ValidAbilityType: Attack
                    IsToggleBonus: True
                    XPTracker: [0]
        Infuse: Fire
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    Enhancements: 1
            BLoot:
                Loot: 2
                Target: -1
                AnimOverload: Loot
        Infuse: Any
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "<size=50%> "
        - Active:
            Ability: TActive
            ListLayout: "$GH2E_Spellweaver2_18_T$"
            Layout: "$GH2E_Spellweaver2_18_T$"
            Icon: "Positive_AttackPlus"
        - XPTracker: TActive
        - Row: "<size=20%> "
        - Infuse: Fire
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Loot$ <sprite name=Loot> *BLoot*"
        - Row: "<size=20%> "
        - Infuse: Any
