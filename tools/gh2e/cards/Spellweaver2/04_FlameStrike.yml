# card: Flame Strike
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TStrengthen:
                Strengthen:
                    Enhancements: 1
                Filter: Self
                AnimOverload: PowerUp
            TLoot:
                Loot: 1
                Target: -1
                AnimOverload: Loot
    Bottom:
        Abilities:
            BAttack:
                Attack:
                    Amount: 1
                    SquareEnhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                AnimOverload: TargetedGenericFlame
        Consumes:
            BCFire:
                Elements: Fire
                AbilityOverrides:
                    BCFireAttackBuff:
                        ParentName: BAttack
                        Strength: 1
                        Conditions: Wound
                XP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Strengthen$ <sprite name=Strengthen> <size=100%><voffset=1>@TStrengthen@"
        - Row: "$Self$"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Loot$ <sprite name=Loot> *TLoot*"
    Bottom:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "$Range$ <sprite name=Range> *BAttack.Range* @BAttack.Range@"
        - Row: "<size=20%> "
        - Consume:
            Name: BCFire
            Text: "+1 $Attack$ <sprite name=Attack>, $Wound$ <sprite name=Wound>, <sprite name=XP1>"
