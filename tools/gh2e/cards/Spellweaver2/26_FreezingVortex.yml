# card: Freezing Vortex
# top: the kill is a sub-ability of the attack on its targets at 2 or fewer hit points (the 1st edition port's Impending
# End shape: Kill with Filter Health "<= 2"); each target the kill kills leaves a 1-hex obstacle (Frozen Fist's ice
# obstacle) in its hex when that hex is featureless, placed by the plugin (GHSpellweaver2e.cs, MiscVars
# GH2E_ObstacleOnKill; no Frosthaven shape creates an obstacle on every hex a multi-target kill emptied)
# bottom: the 1st edition Black Hole bottom's shape (Pull, Range 4, all targets, PullTowardsTile), Pull 3, no marks
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 5
                    SquareEnhancements: 1
                Range: 3
                AreaEffect: "0,0,R|2,0,R|1,1,R|-1,1,R|-2,0,R|-1,-1,R|1,-1,R"
                AnimOverload: TargetedIcyBlast
                MultiPassAttack: False
                SubAbilities:
                    TAttackSubKill:
                        Kill: True
                        Filter:
                            TargetType: Enemy
                            Health: "<= 2"
                        AnimOverload: None
                        MiscVars:
                            GH2E_ObstacleOnKill: True
        Infuse: Ice
        XP: 1
    Bottom:
        Abilities:
            BPull:
                Pull: 3
                Range: 4
                Target: -1
                PullType: PullTowardsTile
                AnimOverload: RadialBlackHolePull
        Infuse: Ice
Layout:
    Top:
        - ColumnWidths: "60,35"
        - Column:
            - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
            - Row: "<size=20%> "
            - Row: "$GH2E_Spellweaver2_26_T$"
        - Column:
            - Row: "£Area£"
            - Row: "<size=20%> "
            - Infuse: Ice
            - XP: 1
    Bottom:
        - Row: "$GH2E_Spellweaver2_26_B$"
        - Row: "<size=30%> "
        - Row: "<b><size=130%>$Pull$ <sprite name=Pull> *BPull*"
        - Row: "$GH2E_Spellweaver2_26_B2$"
        - Row: "$GH2E_Spellweaver2_26_B3$"
        - Row: "<size=20%> "
        - Infuse: Ice
