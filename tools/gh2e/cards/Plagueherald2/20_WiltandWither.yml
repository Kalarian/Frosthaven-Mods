# card: Wilt and Wither
# top: the second ability, "each enemy suffers 1 for each Plague that enemy has" (plugin GHPerPlague, MiscVars
# GH2E_PerPlague). bottom: "during this and your next turn, double all damage that enemies that have Plague suffer": a
# persistent bonus with two use slots (XP 1 each) spent by an end-of-turn trigger (this turn, then your next turn: it
# ends at the end of your next turn); while it is in play, plugin GHWiltAndWither (MiscVars GH2E_WiltAndWither) doubles
# all damage any enemy that has Plague suffers, from any source.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 1
                    SquareEnhancements: 1
                Target: 2
                Range: 5
                ResourcesToGiveToTargets:
                    - ["Plague", 1]
                AnimOverload: RangedAttack
            TDamage:
                Damage: 1
                Target: -1
                Targeting: All
                Filter:
                    TargetType: Enemy
                    TargetHasCharacterResource: ["Plague"]
                MiscVars:
                    GH2E_PerPlague: True
                AnimOverload: RadialNegativeMajor
    Bottom:
        Abilities:
            BWilt:
                AddActiveBonus:
                    NullTargeting: True
                    Filter: Self
                    AutoTrigger: True
                    CanSkip: False
                    SkipAnim: True
                    AnimOverload: None
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,1]
                MiscVars:
                    GH2E_WiltAndWither: True
                AnimOverload: RadialNegativeMajor
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Target$ <sprite name=Target> *TAttack.Target*"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$GH2E_Plagueherald2_PLAGUE$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Plagueherald2_20_T$"
    Bottom:
        - Active:
            Ability: BWilt
            Icon: "Positive_Damage_Enemy_Aura"
            ListLayout: "$GH2E_Plagueherald2_20_B$"
            Layout: "$GH2E_Plagueherald2_20_B$"
        - Row: "<size=50%> "
        - XPTracker: BWilt
