# card: Mass Extinction
# top: "whenever this ability kills an enemy, gain XP 1 and add +2 Attack, +1 Target" = a chain of kill-gated follow-up
# attacks on another enemy with Plague at any range: Attack 6 after the first kill, Attack 8 after the second, and so
# on; each kill's XP 1 is its own kill-gated GainXP step under the killing attack (TXP1..TXP8: the last kill, with no
# further attack, still pays; re-audit): eight attacks deep (Attack 4 to 18; GHNestedSubAbilities queues any depth), more enemies with
# Plague than a room holds in practice.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 4
                    Enhancements: 1
                Range: 99
                Target: 1
                Filter:
