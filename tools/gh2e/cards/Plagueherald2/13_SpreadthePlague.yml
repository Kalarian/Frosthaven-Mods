# card: Spread the Plague
# top: control one enemy with Plague (any range) for one Attack 4, as the 1st edition Mindthief's Hostile Takeover.
# The Plague its attack adds can't be given by the engine (a resource is passed from the giver's own supply, and the
# monster has none): NEEDS PLUGIN. bottom: Poison + Plague on one enemy adjacent to one of your poisoned allies (a custom
# target list), then the mandatory "remove Poison from that ally" on a poisoned ally adjacent to that enemy (a
# sub-ability around the target), so no ally loses Poison unless an enemy was there to take it.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TControl:
                ControlActor:
                    Abilities:
                        TControlAttack:
                            Attack:
                                Amount: 4
                                Enhancements: 1
                            StrengthIsBase: True
                    ControlDurationType: ControlForOneAction
                    ControlActorType: Ally
                Range: 99
                Target: 1
                Filter:
                    TargetType: Enemy
                    TargetHasCharacterResource: ["Plague"]
                AnimOverload: MindControl
        XP: 1
    Bottom:
        Abilities:
            # the enemy first (printed order): one enemy adjacent to one of your allies that has Poison; then that ally
            # loses Poison (mandatory, "! Remove Poison from that ally": a poisoned ally adjacent to the target)
            BPoison:
                Poison: True
                Target: 1
                Filter: Enemy
                Targeting: Custom
                Vars:
                    PoisonedAllies: AllAliveActors.Where(obj != TargetingActor && CActor.AreActorsAllied(obj.Type, TargetingActor.Type, obj, TargetingActor) && obj.Tokens.HasKey(CCondition.ENegativeCondition.Poison))
                TargetingVars:
                    AddTilesInRange: CustomAbility.GetAdjacentTiles(PoisonedAllies)
                    AddValidActorsInRange: CustomAbility.GetActorsOnTiles(CustomAbility.GetAdjacentTiles(PoisonedAllies))
                ResourcesToGiveToTargets:
                    - ["Plague", 1]
                ResourcesToAddOnAbilityEnd:
                    - ["Plague", 3]
                AnimOverload: TargetedDebuff
                SubAbilities:
                    BRemovePoison:
                        RemoveConditions: 1
                        Conditions: [Poison]
                        Range: 1
                        Target: 1
                        Filter:
                            TargetType: Ally
                            TargetHasNegativeCondition: Poison
                        AllTargetsAdjacentToParentTargets: True
                        TreatAsNonSubAbility: True
                        CanSkip: False
                        AnimOverload: TargetedHeal
Layout:
    Top:
        - Row: "$GH2E_Plagueherald2_13_T$"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TControl.TControlAttack* <size=100%><voffset=1>@TControl.TControlAttack@"
        - Row: "$GH2E_Plagueherald2_PLAGUE$"
    Bottom:
        - Row: "<b><size=130%>$Poison$ <sprite name=Poison>"
        - Row: "$GH2E_Plagueherald2_PLAGUE$"
        - Row: "$GH2E_Plagueherald2_13_B$"
        - Row: "$GH2E_Plagueherald2_13_B2$"
