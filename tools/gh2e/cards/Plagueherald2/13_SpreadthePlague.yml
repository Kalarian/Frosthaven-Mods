# card: Spread the Plague
# top: control one enemy with Plague (any range) for one Attack 4, the player choosing its target (ControlActorType Player, rulebook p33).
# The Plague its attack adds comes from the class supply (plugin GHPlague: any giver gives a Plague without holding
# one). bottom: written as "remove Poison from one of your allies, then Poison + Plague one
# enemy adjacent to that ally" (the card's mandatory removal comes first here so the target is picked around the
# chosen ally): APPROXIMATION of the order.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TControl:
                ControlActor:
                    Abilities:
                        TControlAttack:
                            Attack:
                                Amount: 4
                                Enhancements: 1
                            StrengthIsBase: True
                            ResourcesToGiveToTargets:
                                - ["Plague", 1]
                    ControlDurationType: ControlForOneAction
                    ControlActorType: Player
                Range: 99
                Target: 1
                Filter:
                    TargetType: Enemy
                    TargetHasCharacterResource: ["Plague"]
                AnimOverload: MindControl
        XP: 1
    Bottom:
        Abilities:
            BRemovePoison:
                RemoveConditions: 1
                Conditions: [Poison]
                Range: 99
                Target: 1
                Filter:
                    TargetType: Ally
                    TargetHasNegativeCondition: Poison
                AnimOverload: TargetedHeal
                SubAbilities:
                    BPoison:
                        Poison: True
                        Range: 1
                        Target: 1
                        Filter: Enemy
                        AllTargetsAdjacentToParentTargets: True
                        TreatAsNonSubAbility: True
                        ResourcesToGiveToTargets:
                            - ["Plague", 1]
                        AnimOverload: TargetedDebuff
Layout:
    Top:
        - Row: "$GH2E_Plagueherald2_13_T$"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TControl.TControlAttack* <size=100%><voffset=1>@TControl.TControlAttack@"
        - Row: "$GH2E_Plagueherald2_PLAGUE$"
    Bottom:
        - Row: "<b><size=130%>$Poison$ <sprite name=Poison>"
        - Row: "$GH2E_Plagueherald2_PLAGUE$"
        - Row: "$GH2E_Plagueherald2_13_B$"
        - Row: "$GH2E_Plagueherald2_13_B2$"
