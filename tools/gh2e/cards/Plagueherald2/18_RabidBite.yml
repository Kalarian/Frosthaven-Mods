# card: Rabid Bite
# top: Strengthen one normal or elite enemy with Plague (any range), then control it (UseParentTargets, as CARD_FIXES
# 20406 Lead to Slaughter): Move 1, Attack 5, driven by the player (ControlActorType Player, rulebook p33). "This
# movement must move toward a monster that does not have Plague": the move may only end on an adjacent hex closer (path
# around walls) to some other monster without Plague (MustEndOnSpecificTiles). The Plague its attack adds comes from
# the class supply (plugin GHPlague).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TStrengthen:
                Strengthen: True
                Range: 99
                Target: 1
                Filter:
                    TargetType: Enemy
                    EnemyType: [Normal, Elite]
                    TargetHasCharacterResource: ["Plague"]
                AnimOverload: TargetedDebuff
                SubAbilities:
                    TControl:
                        ControlActor:
                            Abilities:
                                TControlMove:
                                    Move:
                                        Amount: 1
                                        SquareEnhancements: 1
                                    StrengthIsBase: True
                                    Vars:
                                        RabidMover: TargetingActor
                                        RabidClean: AllAliveMonsters.Where(obj != RabidMover and obj.GetCharacterResourceAmount("Plague") == 0)
                                        MustEndOnSpecificTiles: CustomAbility.GetAdjacentTiles(RabidMover.Tile).Where(RabidClean.Any(obj.GetDistanceTo(parentContext.obj, true) < obj.GetDistanceTo(RabidMover, true)))
                                    MoveRestrictionType: MustEndOnSpecificTiles
                                TControlAttack:
                                    Attack: 5
                                    StrengthIsBase: True
                                    ResourcesToGiveToTargets:
                                        - ["Plague", 1]
                            ControlDurationType: ControlForOneAction
                            ControlActorType: Player
                        Filter: Enemy
                        UseParentTargets: True
                        Target: 1
                        AutoTrigger: True
                        AnimOverload: MindControl
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    Enhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Strengthen$ <sprite name=Strengthen>"
        - Row: "$GH2E_Plagueherald2_18_T$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Plagueherald2_18_T2$"
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *TStrengthen.TControl.TControlMove* <size=100%><voffset=1>@TStrengthen.TControl.TControlMove@"
        - Row: "$GH2E_Plagueherald2_18_T3$"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> 5"
        - Row: "$GH2E_Plagueherald2_PLAGUE$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
