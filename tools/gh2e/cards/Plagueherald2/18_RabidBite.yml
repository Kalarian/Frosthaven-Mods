# card: Rabid Bite
# top: Strengthen one normal or elite enemy with Plague (any range), then control it (UseParentTargets, as CARD_FIXES
# 20406 Lead to Slaughter): Move 1, Attack 5. "This movement must move toward a monster that does not have Plague":
# the controlled move follows the monster AI's own focus. The Plague its attack adds: the monster has no supply to give
# from. Both NEEDS PLUGIN.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TStrengthen:
                Strengthen: True
                Range: 99
                Target: 1
                Filter:
                    TargetType: Enemy
                    EnemyType: [Normal, Elite]
                    TargetHasCharacterResource: ["Plague"]
                AnimOverload: TargetedDebuff
                SubAbilities:
                    TControl:
                        ControlActor:
                            Abilities:
                                TControlMove:
                                    Move:
                                        Amount: 1
                                        SquareEnhancements: 1
                                    StrengthIsBase: True
                                TControlAttack:
                                    Attack: 5
                                    StrengthIsBase: True
                            ControlDurationType: ControlForOneAction
                            ControlActorType: Ally
                        Filter: Enemy
                        UseParentTargets: True
                        Target: 1
                        AutoTrigger: True
                        AnimOverload: MindControl
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    Enhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Strengthen$ <sprite name=Strengthen>"
        - Row: "$GH2E_Plagueherald2_18_T$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Plagueherald2_18_T2$"
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *TStrengthen.TControl.TControlMove* <size=100%><voffset=1>@TStrengthen.TControl.TControlMove@"
        - Row: "$GH2E_Plagueherald2_18_T3$"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> 5"
        - Row: "$GH2E_Plagueherald2_PLAGUE$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
