# card: Wretched Yield
# top: +1 Attack per Plague on the target = a per-target Vars bonus, Frosthaven's Crashing Tide shape (Submerge top:
# ConditionalOverrides + StatIsBasedOnX Vars on TargetActor). Heal X = the first target's Plague before the attack,
# noted by the plugin when its modifiers are drawn (a Carrier perk modifier could add one). UNVERIFIED in play.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    Enhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                ConditionalOverrides:
                    TAttackCO:
                        AbilityOverrides:
                            TPlagueBuff:
                                StatIsBasedOnX:
                                    Strength:
                                        BasedOn: Vars
                                        AddTo: True
                                        Vars:
                                            Value: TargetActor != null and TargetActor.GetCharacterResourceAmount("Plague") or 0
                AnimOverload: RangedAttack
            THeal:
                Heal: 0
                Filter: Self
                StatIsBasedOnX:
                    Strength:
                        BasedOn: Vars
                        Vars:
                            AttackAbility: CustomAbility.FindAbilityInPhaseByName("TAttack")
                            # the first target's Plague BEFORE the attack, noted by the plugin (GHPlagueherald2e, Wretched
                            # Yield) into the hidden count GH2ECount9 on the Plagueherald (re-audit: a Carrier modifier drawn
                            # on the attack could add one first)
                            Value: AttackAbility != null and AttackAbility.ActorsTargeted.Count > 0 and AttackAbility.TargetingActor.GetCharacterResourceAmount("GH2ECount9") or 0
                AnimOverload: PowerUp
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "$GH2E_Plagueherald2_09_T$"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> X"
        - Row: "$GH2E_Plagueherald2_09_T2$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
