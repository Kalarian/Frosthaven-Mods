# card: Contagious Corpse
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                AnimOverload: RangedAttack
                SubAbilities:
                    TCurseDeck:
                        AddModifiersToMonsterDeck:
                            Strength: 1
                            ModifiersToAdd: Curse
                        Filter: Enemy
                        AbilityXP: 1
                        StartAbilityRequirements:
                            Type: SubAbility
                            ActorsKilledByAbility: "> 0"
                        TreatAsNonSubAbility: True
                        AutoTrigger: True
                        AnimOverload: None
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
            BShield:
                Shield: 2
                Range: 3
                Filter:
                    TargetType: Ally
                    TargetHasNegativeCondition: Poison
                ActiveBonusDuration: Round
                AnimOverload: PositiveBuffTargeted
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Plagueherald2_04_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Plagueherald2_04_B$"
        - Row: "<b><size=130%>$Shield$ <sprite name=Shield> *BShield*"
