# card: Cloying Miasma
# bottom: advantage on attacks against enemies with Plague for you and all allies this round: an attack aura with
# AttackHasAdvantage whose bonus filter names the attack's target, as the 1st edition Doomstalker's Expose (IsDoomed).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 1
                    SquareEnhancements: 1
                Range: 4
                Conditions: Disarm
                ResourcesToGiveToTargets:
                    - ["Plague", 1]
                AnimOverload: RangedAttack
    Bottom:
        Abilities:
            BAdvantage:
                Attack: 0
                AttackHasAdvantage: True
                Target: -1
                Filter: Self
                ActiveBonus:
                    Duration: Round
                    Behaviour: BuffAttack
                    ValidAbilityType: Attack
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter: [Self, Ally]
                    Filter:
                        TargetType: Enemy
                        TargetHasCharacterResource: ["Plague"]
                AnimOverload: PositiveBuffRadial
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$Disarm$ <sprite name=Disarm>"
        - Row: "$GH2E_Plagueherald2_PLAGUE$"
    Bottom:
        - Active:
            Ability: BAdvantage
            Icon: "Positive_Advantage_Attack"
            ListLayout: "$GH2E_Plagueherald2_17_B$"
            Layout: "$GH2E_Plagueherald2_17_B$"
