# card: Compounding Infection
# top: Curse + Plague on one enemy within range 4. The persistent trigger ("whenever an enemy draws a Curse during its
# attack, you may discard this card to have that enemy gain Curse, Curse, Plague, Plague"): Frosthaven's curse-drawn
# bonus (DamageOnCurseModApplied, the 1st edition Baneful Hex), one use, marked MiscVars GH2E_CompoundingInfection:
# plugin GHCompoundingInfection asks the player instead of dealing the damage, gives the two Curses and two Plague on
# yes and ends the bonus (the card goes to the discard pile). bottom: persistent +1 Attack aura on
# character allies (ActorType Player) that have Poison.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TCurse:
                Curse: True
                Range:
                    Amount: 4
                    Enhancements: 1
                Filter: Enemy
                ResourcesToGiveToTargets:
                    - ["Plague", 1]
                AnimOverload: TargetedDebuff
            TInfection:
                Damage: 1
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: DamageOnCurseModApplied
                    Filter: Enemy
                    XPTracker: [0]
                MiscVars:
                    GH2E_CompoundingInfection: True
                AnimOverload: PowerUp
    Bottom:
        Abilities:
            BActive:
                Attack: 1
                Target: -1
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffAttack
                    ValidAbilityType: Attack
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter:
                        TargetType: Ally
                        ActorType: Player
                        TargetHasNegativeCondition: Poison
                AnimOverload: PositiveBuffRadial
        XP: 2
Layout:
    Top:
        - Row: "<b><size=130%>$Curse$ <sprite name=Curse>"
        - Row: "$GH2E_Plagueherald2_PLAGUE$"
        - Row: "$Range$ <sprite name=Range> *TCurse.Range* @TCurse.Range@"
        - Row: "<size=50%> "
        - Active:
            Ability: TInfection
            Icon: "Icon_Curse"
            ListLayout: "$GH2E_Plagueherald2_21_T$"
            Layout: "$GH2E_Plagueherald2_21_T$"
    Bottom:
        - Active:
            Ability: BActive
            Icon: "Positive_AttackPlus_Ally_Aura"
            ListLayout: "$GH2E_Plagueherald2_21_B$"
            Layout: "$GH2E_Plagueherald2_21_B$"
