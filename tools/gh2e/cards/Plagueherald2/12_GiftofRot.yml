# card: Gift of Rot
# top: Heal 1 + Ward on all allies within range 5 that have Poison. "You may heal as if they did not have Poison (their
# Poison is not removed)" = the heal ignores Poison every time (AdditionalHealData IgnoreTokens, as the 1st edition
# Voidwarden's heal data): keeping Poison is what the class wants, but IgnoreTokens also skips Wound/Bane/Brittle
# removal. APPROXIMATION ("you may" -> always). bottom: the ally-Poison cost buys a round advantage on your attacks
# (Drifter's Accurate Strikes bonus), added by the cost-consume.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TLoot:
                Loot: 1
                Target: -1
                AnimOverload: Loot
            THeal:
                Heal: 1
                Range: 5
                Target: -1
                Conditions: Ward
                Filter:
                    TargetType: Ally
                    TargetHasNegativeCondition: Poison
                AdditionalHealData:
                    IgnoreTokens: True
                AnimOverload: RadialPositive
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    Enhancements: 1
        Consumes:
            BCPoisonAlly:
                CostAbility:
                    ParentName: BMove
                    Poison: True
                    Range: 3
                    Target: 1
                    Filter:
                        TargetType: Ally
                        Vars:
                            ValidateNoPoison: not target.Tokens.HasKey(CCondition.ENegativeCondition.Poison)
                    AnimOverload: TargetedDebuff
                Abilities:
                    BCAdvantage:
                        ParentName: BMove
                        Advantage:
                            DecrementTrigger: Rounds
                        Filter: Self
                        ActiveBonus:
                            Duration: Round
                        AutoTrigger: True
                        AnimOverload: PowerUp
Layout:
    Top:
        - Row: "<b><size=130%>$Loot$ <sprite name=Loot> *TLoot*"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal*"
        - Row: "$GH2E_Plagueherald2_12_T$"
        - Row: "$Ward$ <sprite name=Ward>"
        - Row: "$GH2E_Plagueherald2_12_T2$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=20%> "
        - Consume:
            Name: BCPoisonAlly
            Text: "$GH2E_Plagueherald2_12_B$"
