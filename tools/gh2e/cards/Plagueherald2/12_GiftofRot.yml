# card: Gift of Rot
# top: Heal 1 + Ward on all allies within range 5 that have Poison. "For each target, you may heal that target as if they
# did not have Poison (if you do, their Poison is not removed)": MiscVars GH2E_HealThroughPoisonChoice, the plugin
# (GHPlagueherald2e) asks the Plagueherald per poisoned target; on yes the heal adds the hit points and removes Wound /
# Bane / Brittle as a normal heal does, and the Poison stays; on no it is a normal heal (it removes the Poison). bottom: the ally-Poison cost buys a round advantage on your attacks
# (Drifter's Accurate Strikes bonus), added by the cost-consume.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TLoot:
                Loot: 1
                Target: -1
                AnimOverload: Loot
            THeal:
                Heal: 1
                Range: 5
                Target: -1
                Conditions: Ward
                Filter:
                    TargetType: Ally
                    TargetHasNegativeCondition: Poison
                MiscVars:
                    GH2E_HealThroughPoisonChoice: True
                AnimOverload: RadialPositive
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    Enhancements: 1
        Consumes:
            BCPoisonAlly:
                CostAbility:
                    ParentName: BMove
                    Poison: True
                    Range: 3
                    Target: 1
                    Filter:
                        TargetType: Ally
                        Vars:
                            ValidateNoPoison: not target.Tokens.HasKey(CCondition.ENegativeCondition.Poison)
                    AnimOverload: TargetedDebuff
                Abilities:
                    BCAdvantage:
                        ParentName: BMove
                        Advantage:
                            DecrementTrigger: Rounds
                        Filter: Self
                        ActiveBonus:
                            Duration: Round
                        AutoTrigger: True
                        AnimOverload: PowerUp
Layout:
    Top:
        - Row: "<b><size=130%>$Loot$ <sprite name=Loot> *TLoot*"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal*"
        - Row: "$GH2E_Plagueherald2_12_T$"
        - Row: "$Ward$ <sprite name=Ward>"
        - Row: "$GH2E_Plagueherald2_12_T2$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=20%> "
        - Consume:
            Name: BCPoisonAlly
            Text: "$GH2E_Plagueherald2_12_B$"
