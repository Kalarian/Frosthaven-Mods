# card: Syringe
# top (Prescription): +1 Attack on the holder's next four attacks (BuffAttack with four slots, Sanctify's shape) placed
# on one adjacent ally.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TBuffAttack:
                Attack: 1
                Filter:
                    TargetType: Ally
                    ActorType: Player
                Range: 1
                Target: 1
                MiscVars:
                    GH2E_Prescription: True
                ActiveBonus:
                    Duration: Persistent
                    GiveAbilityCardToActor: True
                    Behaviour: BuffAttack
                    ValidAbilityType: Attack
                    IsSingleTargetBonus: True      # "your next four attacks": one slot per attack (target), HIVE Heavy Metal / Snowdancer Snowball
                    XPTracker: [0,0,0,0]
                AnimOverload: BuffAdjacent
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BWound:
                Wound: True
                Range: 1
                Filter: Enemy
                AnimOverload: TargetedDebuff
Layout:
    Top:
        - Row: "$GH2E_Sawbones2_RX$"
        - Row: "<size=20%> "
        - Active:
            Ability: TBuffAttack
            Icon: Positive_AttackPlus
            ListLayout: "$GH2E_Sawbones2_08_T$"
            Layout: "$GH2E_Sawbones2_08_T$"
        - Row: "<size=50%> "
        - XPTracker: TBuffAttack
        - Row: "<size=20%> "
        - XP: 1
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Wound$ <sprite name=Wound>"
        - Row: "$Range$ <sprite name=Range> *BWound.Range*"
