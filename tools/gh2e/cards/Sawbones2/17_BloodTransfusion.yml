# card: Blood Transfusion
# top: Heal X = the damage the attack dealt, Frosthaven's Drifter Consume Stamina shape (GetDamageDealt of TAttack).
# bottom: Safeguard on one figure within range 1, with the condition removal and the medical pack as sub-abilities on
# the same target (a self target gains the pack too).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
            THeal:
                Heal: 0
                Range: 1
                Target: 1
                Filter: Ally
                AnimOverload: Heal
                StatIsBasedOnX:
                    Strength:
                        BasedOn: Vars
                        Vars:
                            AttackAbility: CustomAbility.FindAbilityInPhaseByName("TAttack", TargetingActor)
                            Value: CustomAbility.GetDamageDealt(AttackAbility)
                StartAbilityRequirements:
                    Type: ThisAbility
                    ActorHasPerformedValidAbilityTypesThisAction: "> 0"
                    AbilityTypes: [Attack]
    Bottom:
        Abilities:
            BSafeguard:
                Ward: True
                Filter: [Self, Ally]
                Range: 1
                Target: 1
                AnimOverload: PowerUp
                MiscVars:
                    GH2ESafeguard: True
                SubAbilities:
                    BSafeguardSubRemove:
                        RemoveConditions: All
                        Conditions: [Wound, Brittle, Bane, Poison, Immobilize, Disarm, Impair, Stun, Muddle]
                        AnimOverload: None
                    BSafeguardSubGive:
                        GiveSupplyCard: 13230
                        Filter:
                            TargetType: [Self, Ally]
                            ActorType: Player
                        AnimOverload: None
        XP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> X"
        - Row: "$Target_OneAdjacentAlly$"
        - Row: "$GH2E_Sawbones2_17_T$"
    Bottom:
        - Row: "$GH2E_Sawbones2_SG_R1$"
        - Row: "<size=20%> "
        - Row: "$GH2E_Sawbones2_17_B$"
        - Row: "<size=50%> "
        - XP: 1
