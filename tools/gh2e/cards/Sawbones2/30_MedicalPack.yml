# card: Medical Pack
# Medical Pack 0441 (sheet position 30): a supply card (the 1st edition's SupplyCard), handed to allies by
# GiveSupplyCard 13230 (the plugin gives a free copy of the six); never held in the Sawbones' own hand.
SupplyCard: True
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            THeal:
                Heal: 4
                Filter: Self
                AnimOverload: Heal
    Bottom:
        Abilities:
            BHeal:
                Heal: 2
                Filter: Self
                Conditions: Ward
                AnimOverload: Heal
Layout:
    Top:
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal*"
    Bottom:
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *BHeal*"
        - Row: "$Ward$ <sprite name=Ward>"
