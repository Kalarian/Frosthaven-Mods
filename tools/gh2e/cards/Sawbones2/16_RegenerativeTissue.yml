# card: Regenerative Tissue
# bottom (Prescription): the 1st edition's verified StartTurnAbility on an adjacent ally (GiveAbilityCardToActor),
# three slots; the ActiveBonus Requirements gate each trigger on the holder being below maximum hit points
# (CStartTurnAbilityActiveBonus.CanTriggerAbility checks them before the slot moves).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            THeal:
                Heal:
                    Amount: 4
                    DiamondPlusEnhancements: 1
                Range: 1
                Filter: [Self, Ally]
                Conditions: Ward
                AnimOverload: Heal
    Bottom:
        Abilities:
            BActive:
                AddActiveBonus:
                    Heal: 2
                    Filter: Self
                Filter:
                    TargetType: Ally
                    ActorType: Player
                Range: 1
                Target: 1
                MiscVars:
                    GH2E_Prescription: True
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: StartTurnAbility
                    GiveAbilityCardToActor: True
                    XPTracker: [0,0,0]
                    Requirements:
                        Vars:
                            ValidateDamaged: Actor.Health < Actor.MaxHealth
                AnimOverload: BuffAdjacent
        XP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
        - Row: "$Range$ <sprite name=Range> *THeal.Range*"
        - Row: "$Ward$ <sprite name=Ward>"
    Bottom:
        - Row: "$GH2E_Sawbones2_RX$"
        - Row: "<size=20%> "
        - Active:
            Ability: BActive
            Icon: Positive_HealSelf
            ListLayout: "$GH2E_Sawbones2_16_B$"
            Layout: "$GH2E_Sawbones2_16_B$"
        - Row: "<size=50%> "
        - XPTracker: BActive
        - Row: "<size=20%> "
        - XP: 1
