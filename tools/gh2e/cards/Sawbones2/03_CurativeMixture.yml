# card: Curative Mixture
# "remove one negative condition": RemoveConditions 1 over the removable list (the game picks which one, as its Cure
# Potion comment says; Frosthaven's own "choose which" needs a Choose block on yourself only). Top: the removal is a
# sub-ability on the heal's target, so it lands after the heal, not before (approximation).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            THeal:
                Heal:
                    Amount: 3
                    DiamondPlusEnhancements: 1
                Range: 1
                Filter: [Self, Ally]
                AnimOverload: Heal
                SubAbilities:
                    THealSubRemove:
                        RemoveConditions: 1
                        Conditions: [Wound, Brittle, Bane, Poison, Immobilize, Disarm, Impair, Stun, Muddle]
                        AnimOverload: None
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BRemove:
                RemoveConditions: 1
                Conditions: [Wound, Brittle, Bane, Poison, Immobilize, Disarm, Impair, Stun, Muddle]
                Range: 1
                Filter: Ally
                AnimOverload: BuffAdjacent
Layout:
    Top:
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
        - Row: "$Range$ <sprite name=Range> *THeal.Range*"
        - Row: "<size=20%> "
        - Row: "$GH2E_Sawbones2_03_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Sawbones2_03_B$"
