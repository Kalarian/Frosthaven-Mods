# card: Curative Mixture
# "remove one negative condition": RemoveConditions 1 over the removable list; with two or more of them on the target,
# the plugin (GHSawbones2e, MiscVars GH2E_ChooseCondition) asks the performer which one goes. Top: the removal comes
# first (the parent ability picks the target), the heal is its sub-ability on the same figure.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            # "before the heal, remove one negative condition from the target": the removal is the parent (it picks
            # the target; CAbilityRemoveConditions takes a target without conditions too), the heal its sub-ability on
            # the same figure, so a poisoned target loses the Poison first and then gains the hit points
            TRemove:
                RemoveConditions: 1
                Conditions: [Wound, Brittle, Bane, Poison, Immobilize, Disarm, Impair, Stun, Muddle]
                Range: 1
                Filter: [Self, Ally]
                AnimOverload: Heal
                MiscVars:
                    GH2E_ChooseCondition: True
                SubAbilities:
                    THeal:
                        Heal:
                            Amount: 3
                            DiamondPlusEnhancements: 1
                        AnimOverload: None
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BRemove:
                RemoveConditions: 1
                Conditions: [Wound, Brittle, Bane, Poison, Immobilize, Disarm, Impair, Stun, Muddle]
                Range: 1
                Filter: Ally
                AnimOverload: BuffAdjacent
                MiscVars:
                    GH2E_ChooseCondition: True
Layout:
    Top:
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
        - Row: "$Range$ <sprite name=Range> *TRemove.Range*"
        - Row: "<size=20%> "
        - Row: "$GH2E_Sawbones2_03_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Sawbones2_03_B$"
