# card: Take Your Medicine
# top (Prescription): a pack given by an ally's start-of-turn bonus would come from that ally's class (the engine's
# CAbilityGiveSupplyCard takes TargetingActor.CharacterClass.SupplyCards), which holds none: front-loaded instead, the
# three medical packs go to the adjacent ally at once (the plugin hands out three different free copies). Approximation.
# bottom: playing a Medical Pack from an ally's hand for one action: text only, NEEDS PLUGIN.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TGiveSupplyCard:
                GiveSupplyCard: [13230, 13230, 13230]
                Range: 1
                Filter:
                    TargetType: Ally
                    ActorType: Player
                AnimOverload: GivePackAdjacent
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
Layout:
    Top:
        - Row: "$GH2E_Sawbones2_RX$"
        - Row: "<size=20%> "
        - Row: "$GH2E_Sawbones2_26_T$"
        - Row: "<size=50%> "
        - XP: 1
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Sawbones2_26_B$"
