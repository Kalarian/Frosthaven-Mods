# card: Prevention is Key
# top: Wound + Disarm on all enemies within range 1 (no attack; the diamond mark on Disarm, as Secretariat); Safeguard on
# you and all allies within range 1 (the pack's Safeguard condition with its diamond+ mark). bottom: the round "next Prescription action" trigger has no engine
# hook: Shield 1 this round for you and adjacent allies at once (the 1st edition card's round aura). Approximation.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TWoundDisarm:
                Disarm:
                    DiamondEnhancements: 1
                Conditions: [Wound]
                Range: 1
                Target: -1
                Filter: Enemy
                AnimOverload: RadialDebuff
            TSafeguard:
                Ward:
                    DiamondPlusEnhancements: 1
                Filter: [Self, Ally]
                Range: 1
                Target: -1
                AnimOverload: PowerUp
                MiscVars:
                    GH2ESafeguard: True
        XP: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BShield:
                Shield: 1
                Range: 1
                Filter: Self
                ActiveBonus:
                    Duration: Round
                    IsAura: True
                    AuraFilter: [Self, Ally]
                AnimOverload: RadialBuff
Layout:
    Top:
        - Row: "<b><size=130%>$Wound$ <sprite name=Wound> $Disarm$ <sprite name=Disarm> <size=100%><voffset=1>@TWoundDisarm@"
        - Row: "$GH2E_Sawbones2_ALL_R1$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Sawbones2_05_T$ <voffset=1>@TSafeguard@"
        - Row: "<size=50%> "
        - XP: 2
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Sawbones2_05_B$"
        - Active:
            Ability: BShield
            Icon: Positive_Shield_Ally_Aura
            ListLayout: "<sprite name=Shield> *BShield*"
            Layout: "<b><size=130%>$Shield$ <sprite name=Shield> *BShield*"
