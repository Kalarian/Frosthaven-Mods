# card: Teamwork
# "grant one adjacent ally": the ally performs the ability (ControlActor, Frosthaven's grant; Sunkeeper2 Empowering
# Command bottom).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    SquareEnhancements: 1
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyAttack:
                            Attack:
                                Amount: 3
                                DiamondEnhancements: 1
                            StrengthIsBase: True
                            RangeIsBase: True
                Range: 1
                Filter: Ally
                AnimOverload: ControlAlly
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    CircleEnhancements: 1
            BAlly:
                ControlActor:
                    Abilities:
                        BAllyMove:
                            Move:
                                Amount: 3
                                SquareEnhancements: 1
                            StrengthIsBase: True
                Range: 1
                Filter: Ally
                AnimOverload: ControlAlly
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Sawbones2_GRANT_ADJ$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAllyAttack* <size=100%><voffset=1>@TAllyAttack@"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Sawbones2_GRANT_ADJ$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BAllyMove* <size=100%><voffset=1>@BAllyMove@"
