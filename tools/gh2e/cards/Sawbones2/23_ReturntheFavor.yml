# card: Return the Favor
# top: the grant (ControlActor) may only pick an ally holding an active Prescription (filter Vars), no range printed:
# range 99. bottom: one condition removed from an adjacent ally (the game picks which) with the XP on the removal;
# "you may give one adjacent enemy the condition you removed" has no shape without a Choose on the ally: text only,
# NEEDS PLUGIN.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyMove:
                            Move:
                                Amount: 3
                                SquareEnhancements: 1
                            StrengthIsBase: True
                        TAllyAttack:
                            Attack:
                                Amount: 3
                                DiamondEnhancements: 1
                            StrengthIsBase: True
                            RangeIsBase: True
                Range: 99
                Filter:
                    TargetType: Ally
                    ActorType: Player
                    Vars:
                        ValidatePrescription: target.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_Prescription"))
                AnimOverload: ControlAlly
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BRemove:
                RemoveConditions: 1
                Conditions: [Wound, Brittle, Bane, Poison, Immobilize, Disarm, Impair, Stun, Muddle]
                Range: 1
                Filter: Ally
                XP: 1
                AnimOverload: BuffAdjacent
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Sawbones2_23_T$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *TAllyMove* <size=100%><voffset=1>@TAllyMove@"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAllyAttack* <size=100%><voffset=1>@TAllyAttack@"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Sawbones2_23_B$"
