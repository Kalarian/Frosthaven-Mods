# card: Grab and Go
# 2e sheet: top Loot 1, Heal 2 [square] self; bottom Move 4 [square].
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TLoot:
                Loot: 1
                Target: -1
                AnimOverload: Loot
            THeal:
                Heal:
                    Amount: 2
                    SquareEnhancements: 1
                Filter: Self
                AnimOverload: Heal
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    SquareEnhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Loot$ <sprite name=Loot> *TLoot*"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
