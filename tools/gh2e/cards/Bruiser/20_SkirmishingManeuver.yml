# card: Skirmishing Maneuver
# 2e sheet: top Attack 2 [square], Move 2 [circle], Attack 3 [diamond]; bottom Move 5 [square], Jump, infuse Air.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack1:
                Attack:
                    Amount: 2
                    SquareEnhancements: 1
            TMove:
                Move:
                    Amount: 2
                    CircleEnhancements: 1
            TAttack2:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    Jump: True
                    SquareEnhancements: 1
        Infuse: Air
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack1* <size=100%><voffset=1>@TAttack1@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *TMove* <size=100%><voffset=1>@TMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack2* <size=100%><voffset=1>@TAttack2@"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$Jump$ <sprite name=Jump>"
        - Row: "<size=20%> "
        - Infuse: Air
