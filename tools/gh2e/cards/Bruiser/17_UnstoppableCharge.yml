# card: Unstoppable Charge
# 2e sheet: top Attack 3 [diamond], "add +2 Attack and gain XP 1 if you have moved this turn"; bottom Move 4 [square],
# Stun [diamond] target all, range 1, XP 2, lost. The bonus is a conditional override on the attack (the 1st edition
# Hatchet's Fearsome Efficiency shape: Requirement, XP, Strength), required HexesMovedThisTurn >= 1, in place of
# Xipe's separate round bonus.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                AnimOverload: HeavyMeleeAttack
                ConditionalOverrides:
                    TAttackCO:
                        Requirement:
                            HexesMovedThisTurn: ">= 1"
                        XP: 1
                        AbilityOverrides:
                            TMovedBuff:
                                Strength: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    SquareEnhancements: 1
            BStun:
                Stun:
                    Amount: 1
                    DiamondEnhancements: 1
                Filter: Enemy
                Range: 1
                Target: -1
                AnimOverload: RadialShout
        XP: 2
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=20%> "
        - Row: "$GH2E_Bruiser_17_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Stun$ <sprite name=Stun> <size=100%><voffset=1>@BStun@"
        - Row: "$Target_AllAdjacentEnemies$"
