# card: Spare Dagger
# 2e sheet: top Attack 3, Range 3 (no marks); bottom Attack 2 [diamond], Pierce 1 [square].
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 3
                Range: 3
                AnimOverload: RangedAttack
    Bottom:
        Abilities:
            BAttack:
                Attack:
                    Amount: 2
                    DiamondEnhancements: 1
                    Pierce: 1
                    PierceEnhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack*"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
    Bottom:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "$Pierce$ <sprite name=Pierce> *BAttack.Pierce* @BAttack.Pierce@"
