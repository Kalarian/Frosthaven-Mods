# card: Sweeping Blow
# 2e sheet: top Attack 2 (no mark), Muddle, "+1 Attack on each undamaged target", 3 hexes in front with a hex mark
# up-left of the grey hex, XP 1; bottom Move 4 (no mark). Area as the 1st edition Sweeping Blow. "Undamaged" = at full
# hit points (decided, NOTES.md): a per-target conditional override (Frosthaven's ConditionalOverrides, as the 1st
# edition Demolitionist's Crushing Weight), filter TargetMissingHP == 0.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 2
                Conditions: Muddle
                AreaEffect: "0,0,G|1,1,R|2,0,R|1,-1,R|-1,1,E"
                AnimOverload: RadialAttack
                MultiPassAttack: False
                ConditionalOverrides:
                    TAttackCO:
                        Filter:
                            TargetType: Enemy
                            TargetMissingHP: "== 0"
                        AbilityOverrides:
                            TUndamagedBuff:
                                Strength: 1
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move: 4
Layout:
    Top:
        - ColumnWidths: "65,30"
        - Column:
            - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack*"
            - Row: "$Muddle$ <sprite name=Muddle>"
            - Row: "<size=20%> "
            - Row: "$GH2E_Bruiser_11_T$"
        - Column: "£Area£"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove*"
