# card: Whirlwind
# 2e sheet: top Attack 5 [diamond] on all adjacent enemies, XP 1 per enemy targeted, infuse Air, lost; bottom Move 4
# [circle], Push 3 [square] target all, range 1. The 1st edition Whirlwind's shape.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 5
                    DiamondEnhancements: 1
                Range: 1
                Target: -1
                AnimOverload: RadialAttack
                MultiPassAttack: False
                XPPerTarget: 1
        Infuse: Air
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BPush:
                Push:
                    Amount: 3
                    SquareEnhancements: 1
                Range: 1
                Target: -1
                AnimOverload: TargetedShout
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Target_AllAdjacentEnemies$"
        - Row: "$XP_PerEnemy$"
        - Row: "<size=20%> "
        - Infuse: Air
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Push$ <sprite name=Push> *BPush* <size=100%><voffset=1>@BPush@"
        - Row: "$Target_AllAdjacentEnemies$"
