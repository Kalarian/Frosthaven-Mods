# card: Balanced Measure
# 2e sheet: top Attack X = hexes moved this turn, XP 1; bottom Move X = damage dealt this turn. The 1st edition
# Balanced Measure's shape (StatIsBasedOnX).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 0
                AnimOverload: HeavyMeleeAttack
                StatIsBasedOnX:
                    Strength:
                        BasedOn: HexesMovedThisTurn
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move: 0
                StatIsBasedOnX:
                    Strength:
                        BasedOn: DamageInflictedThisTurn
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> X <size=100%>"
        - Row: "<size=20%> "
        - Row: "$GH2E_Bruiser_05_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> X <size=100%>"
        - Row: "<size=20%> "
        - Row: "$GH2E_Bruiser_05_B$"
