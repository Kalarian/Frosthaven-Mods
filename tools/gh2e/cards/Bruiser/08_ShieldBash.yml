# card: Shield Bash
# 2e sheet: top Attack 4 [diamond], Stun, XP 2, lost; bottom Move 2 [square], Shield 1 (no mark), round.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 4
                    DiamondEnhancements: 1
                Conditions: Stun
        XP: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    SquareEnhancements: 1
            BShield:
                Shield: 1
                ActiveBonusDuration: Round
                AnimOverload: PowerUpShield
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Stun$ <sprite name=Stun>"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Active:
            Ability: BShield
            Icon: Shield
            ListLayout: "<sprite name=Shield> *BShield*"
            Layout:
                - Row: "<b><size=130%>$Shield$ <sprite name=Shield> *BShield*"
        - Row: "<size=20%> "
        - Duration: Round
