# card: Scroll of Judgment
# top: the mandatory self damage 2 first, as printed (CanSkip False, standard confirm: no AutoTrigger on a half's first
#   ability), then all enemies within range 4 suffer damage 2 (Damage, Range 4, Target -1). XP 2, lost.
# bottom: Move 2 [circle]; Shield 1 [square], round; "after the next attack targeting you this round, Recover one of
#   your spent items and gain XP 1": a round DuringActionAbilityOnAttacked bonus (Frosthaven's Energy Conversion /
#   Stress Vents behaviour) with one use slot carrying the XP ([1]), whose ability recovers one spent item. TEST: the
#   item choice on a monster's turn.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TDamageSelf:
                Damage: 2
                Filter: Self
                CanSkip: False
                SkipAnim: True
            TDamage:
                Damage: 2
                Range: 4
                Target: -1
                Filter: Enemy
                AnimOverload: RadialScroll
        XP: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    CircleEnhancements: 1
            BShield:
                Shield:
                    Amount: 1
                    SquareEnhancements: 1
                ActiveBonusDuration: Round
                AnimOverload: PowerUp
            BReaction:
                AddActiveBonus:
                    RefreshItems: 1
                    SlotStateToRefresh: [Spent]
                    Filter: Self
                    AnimOverload: Refresh
                Filter: Self
                ActiveBonus:
                    Duration: Round
                    Behaviour: DuringActionAbilityOnAttacked
                    XPTracker: [1]
                AnimOverload: PowerUp
Layout:
    Top:
        - Row: "$GH2E_Quartermaster2_21_T$"
        - Row: "<size=20%> "
        - Row: "$GH2E_Quartermaster2_21_T2$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Active:
            Ability: BShield
            Icon: "Shield"
            ListLayout: "$Shield$ <sprite name=Shield> *BShield*"
            Layout: "<b><size=130%>$Shield$ <sprite name=Shield> *BShield* <size=100%><voffset=1>@BShield@"
        - Row: "<size=20%> "
        - Active:
            Ability: BReaction
            Icon: Refresh
            ListLayout: "$GH2E_Quartermaster2_21_B$"
            Layout: "$GH2E_Quartermaster2_21_B$"
        - Row: "<size=20%> "
        - XPTracker: BReaction
        - Duration: Round
