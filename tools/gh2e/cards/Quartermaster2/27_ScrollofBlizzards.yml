# card: Scroll of Blizzards
# top: Attack 1, Range 2 (no marks), ranged parallelogram of 6 (R 0,0 2,0 1,1 3,1 2,2 4,2) with hex marks on 3,3 and
#   5,3; infuse Ice (mandatory box).
# bottom: Move 3 [circle]; the optional spend box between the moves (Recover your and adjacent allies' items, XP 1);
#   Move 2 [circle].
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 1
                Range: 2
                AreaEffect: "0,0,R|2,0,R|1,1,R|3,1,R|2,2,R|4,2,R|3,3,E|5,3,E"
                MultiPassAttack: False
                AnimOverload: TargetedScrollBlizzard
        Infuse: [Ice]
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BSpend:
                NullTargeting: True
                Range: 1
                Target: -1
                Filter:
                    TargetType: [Self, Ally]
                    ActorType: Player
                AbilityXP: 1
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateSupplies: Actor.GetCharacterResourceAmount("Supplies") >= 10
                MiscVars:
                    GH2E_QMSpend: 1
                AnimOverload: Refresh
            BMove2:
                Move:
                    Amount: 2
                    CircleEnhancements: 1
Layout:
    Top:
        - ColumnWidths: "65,30"
        - Column:
            - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack*"
            - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
            - Row: "<size=50%> "
            - MandatoryTrigger:
                Layout:
                    - Infuse: Ice
        - Column: "£Area£"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_SPEND_GROUP$"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove2* <size=100%><voffset=1>@BMove2@"
