# card: Provisions
# top: gain 10 supplies; gain the Scroll of Relocation: the class item from the plugin (GH2E_QMGive, NOTES.md item supply).
# bottom: Move 4 (no mark).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSupplies:
                Null: True
                Filter: Self
                ResourcesToAddOnAbilityEnd:
                    - ["Supplies", 10]
                AnimOverload: PowerUp
            TGive:
                NullTargeting: True
                Filter: Self
                MiscVars:
                    GH2E_QMGive: 5
                AnimOverload: Refresh
    Bottom:
        Abilities:
            BMove:
                Move: 4
Layout:
    Top:
        - Row: "$GH2E_Quartermaster2_SUPPLIES10$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_11_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove*"
