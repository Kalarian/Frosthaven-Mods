# card: Provisions
# top: gain 10 supplies; gain the Scroll of Relocation: APPROXIMATION, recover one spent or lost item (NEEDS PLUGIN).
# bottom: Move 4 (no mark).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSupplies:
                Null: True
                Filter: Self
                ResourcesToAddOnAbilityEnd:
                    - ["Supplies", 10]
                AnimOverload: PowerUp
            TGive:
                RefreshItems: 1
                SlotStateToRefresh: [Spent, Consumed]
                Filter: Self
                AnimOverload: Refresh
    Bottom:
        Abilities:
            BMove:
                Move: 4
Layout:
    Top:
        - Row: "$GH2E_Quartermaster2_SUPPLIES10$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_11_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove*"
