# card: Bag of Holding
# top: Loot 3 (no mark). bottom: Move 3 [circle]; gain 20 supplies.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TLoot:
                Loot: 3
                Target: -1
                AnimOverload: Loot
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BSupplies:
                Null: True
                Filter: Self
                ResourcesToAddOnAbilityEnd:
                    - ["Supplies", 20]
                AnimOverload: PowerUp
Layout:
    Top:
        - Row: "<b><size=130%>$Loot$ <sprite name=Loot> *TLoot*"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_SUPPLIES20$"
