# card: Twin Lances
# top: Attack 3 (no value mark), V of two 2-hex lines (G 0,0; R 2,0 4,0 1,1 2,2) with the hex mark on 6,0; XP 1.
# bottom: Attack 2 [diamond], grey + 2 red in a line with the hex mark next in the line; give the Sturdy Spear to one
#   adjacent ally (no XP): APPROXIMATION, the ally recovers one spent or lost item (NEEDS PLUGIN); XP 1.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 3
                AreaEffect: "0,0,G|2,0,R|4,0,R|1,1,R|2,2,R|6,0,E"
                MultiPassAttack: False
                AnimOverload: SlamAttack
        XP: 1
    Bottom:
        Abilities:
            BAttack:
                Attack:
                    Amount: 2
                    DiamondEnhancements: 1
                AreaEffect: "0,0,G|2,0,R|4,0,R|6,0,E"
                MultiPassAttack: False
                AnimOverload: SlamAttack
            BGive:
                RefreshItems: 1
                SlotStateToRefresh: [Spent, Consumed]
                Range: 1
                Filter:
                    TargetType: Ally
                    ActorType: Player
                AnimOverload: Refresh
        XP: 1
Layout:
    Top:
        - ColumnWidths: "65,30"
        - Column:
            - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack*"
        - Column: "£Area£"
    Bottom:
        - ColumnWidths: "65,30"
        - Column:
            - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
            - Row: "<size=50%> "
            - Row: "$GH2E_Quartermaster2_25_B$"
        - Column: "£Area£"
