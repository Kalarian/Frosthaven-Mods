# card: Caustic Bolt
# top: Attack 2 [diamond], Range 3 [square], Pierce 2; give the Corrosive Coating to one adjacent ally (no XP):
#   the class item from the plugin (GH2E_QMGive, NOTES.md item supply).
# bottom: Move 3 [circle]; one adjacent ally may Recover one of their spent items (exact).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    DiamondEnhancements: 1
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                Pierce: 2
                AnimOverload: RangedAttack
            TGive:
                NullTargeting: True
                Range: 1
                IsTargetedAbility: False
                Filter:
                    TargetType: Ally
                    ActorType: Player
                MiscVars:
                    GH2E_QMGive: 6
                AnimOverload: Refresh
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BRecover:
                RefreshItems: 1
                SlotStateToRefresh: [Spent]
                Range: 1
                Filter:
                    TargetType: Ally
                    ActorType: Player
                AnimOverload: Refresh
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "$Pierce$ <sprite name=Pierce> *TAttack.Pierce*"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_12_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_12_B$"
