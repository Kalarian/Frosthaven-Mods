# card: Set Up Shop
# top: persistent, not lost, XP 1 (no use slots: stays until the scenario ends, a rules question in NOTES.md).
#   - "end of each of your turns, gain 10 supplies": an EndTurnAbility bonus whose Null ability adds 10 (AutoTrigger
#     inside the bonus, as the 1st edition end-of-turn cards).
#   - "whenever an ally ends a move or teleport adjacent to you, you may spend supplies to Recover that ally's items":
#     APPROXIMATION, at the end of each of your turns you may spend supplies to let one adjacent ally recover one spent
#     or lost item (a second EndTurnAbility bonus). The ally-move trigger is NEEDS PLUGIN (Frosthaven's ally-triggered
#     shapes run the caster's ability on another figure's turn; not risked for an item choice).
#   - mandatory "You cannot perform move abilities": text only, NEEDS PLUGIN.
# bottom: Move 4 [circle]; give the Scroll of Foresight to one adjacent ally (APPROXIMATION as elsewhere); "at the end
#   of the round, Heal 2 on all allies within range 1": a round EndRoundAbility bonus (heal unmarked). TEST: the round
#   bonus still triggers in the end-of-round phase.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TActive:
                AddActiveBonus:
                    Null: True
                    Filter: Self
                    AutoTrigger: True
                    ResourcesToAddOnAbilityEnd:
                        - ["Supplies", 10]
                    AnimOverload: PowerUp
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                AnimOverload: PowerUp
            TActive2:
                AddActiveBonus:
                    RefreshItems: 1
                    SlotStateToRefresh: [Spent, Consumed]
                    Range: 1
                    Filter:
                        TargetType: Ally
                        ActorType: Player
                    StartAbilityRequirements:
                        Type: ThisAbility
                        Vars:
                            ValidateSupplies: Actor.GetCharacterResourceAmount("Supplies") >= 10
                    PerformVars:
                        OnAbilityEnded:
                            SpendSupplies: AbilityHasHappened && TargetingActor.RemoveCharacterResource("Supplies", 50, true)
                    AnimOverload: Refresh
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                AnimOverload: PowerUp
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BGive:
                RefreshItems: 1
                SlotStateToRefresh: [Spent, Consumed]
                Range: 1
                Filter:
                    TargetType: Ally
                    ActorType: Player
                AnimOverload: Refresh
            BActive:
                AddActiveBonus:
                    Heal: 2
                    Range: 1
                    Target: -1
                    Filter: Ally
                    AnimOverload: Heal
                Filter: Self
                ActiveBonus:
                    Duration: Round
                    Behaviour: EndRoundAbility
                AnimOverload: PowerUp
Layout:
    Top:
        - Active:
            Ability: TActive
            Icon: Refresh
            ListLayout: "$GH2E_Quartermaster2_22_T$"
            Layout: "$GH2E_Quartermaster2_22_T$"
        - Row: "<size=20%> "
        - Active:
            Ability: TActive2
            Icon: Recover
            ListLayout: "$GH2E_Quartermaster2_22_T2$"
            Layout: "$GH2E_Quartermaster2_22_T2$"
        - Row: "<size=20%> "
        - Row: "$GH2E_Quartermaster2_22_T3$"
        - Row: "<size=20%> "
        - Duration: Persistent
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_22_B$"
        - Row: "<size=50%> "
        - Active:
            Ability: BActive
            Icon: Positive_HealSelf_Ally_Aura
            ListLayout: "$GH2E_Quartermaster2_22_B2$"
            Layout: "$GH2E_Quartermaster2_22_B2$"
        - Row: "<size=20%> "
        - Duration: Round
