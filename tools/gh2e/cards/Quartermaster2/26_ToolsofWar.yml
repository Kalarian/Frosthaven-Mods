# card: Tools of War
# top: one adjacent ally may Recover one of their spent items (exact); Move 1 [circle]; give the Scroll of Embers and
#   Weighted Bolas to one adjacent ally (XP 1): the class item from the plugin (GH2E_QMGive, NOTES.md item supply), XP 1 only when given (GH2E_QMGiveXP).
# bottom: Move 4 [circle]; Loot 1 (no mark); "if you loot at least one money token, gain 10 supplies": PerformVars on
#   the loot, gated by its own LootTokenCount (money tokens picked up; the Bruiser Scavenger perk's expression).
#   UNVERIFIED expression.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TRecover:
                RefreshItems: 1
                SlotStateToRefresh: [Spent]
                Range: 1
                Filter:
                    TargetType: Ally
                    ActorType: Player
                AnimOverload: Refresh
            TMove:
                Move:
                    Amount: 1
                    CircleEnhancements: 1
            TGive:
                NullTargeting: True
                Range: 1
                IsTargetedAbility: False
                Filter:
                    TargetType: Ally
                    ActorType: Player
                MiscVars:
                    GH2E_QMGive: 3
                    GH2E_QMGive2: 4
                    GH2E_QMGiveXP: 1
                AnimOverload: Refresh
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BLoot:
                Loot: 1
                Target: -1
                PerformVars:
                    OnAbilityEnded:
                        GainSupplies: AbilityHasHappened && LootTokenCount > 0 && TargetingActor.AddCharacterResource("Supplies", 10)
                AnimOverload: Loot
Layout:
    Top:
        - Row: "$GH2E_Quartermaster2_26_T$"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *TMove* <size=100%><voffset=1>@TMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_26_T2$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Loot$ <sprite name=Loot> *BLoot*"
        - Row: "$GH2E_Quartermaster2_26_B$"
