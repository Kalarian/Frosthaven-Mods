# card: Hammer and Anvil
# top: give the Sturdy Spear to one ally within range 2 (no XP); gain the Barbed Strip or Iron Plate (the
#   player picks): plugin gives (GH2E_QMGive / GH2E_QMGiveOr, NOTES.md item supply); Shield 1 [square], round.
# bottom: Move 5 [circle].
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TGive:
                NullTargeting: True
                Range: 2
                IsTargetedAbility: False
                Filter:
                    TargetType: Ally
                    ActorType: Player
                MiscVars:
                    GH2E_QMGive: 2
                AnimOverload: Refresh
            TGain:
                NullTargeting: True
                Filter: Self
                MiscVars:
                    GH2E_QMGive: 8
                    GH2E_QMGiveOr: 7
                AnimOverload: Refresh
            TShield:
                Shield:
                    Amount: 1
                    SquareEnhancements: 1
                ActiveBonusDuration: Round
                AnimOverload: PowerUp
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    CircleEnhancements: 1
Layout:
    Top:
        - Row: "$GH2E_Quartermaster2_19_T$"
        - Row: "$GH2E_Quartermaster2_19_T2$"
        - Row: "<size=50%> "
        - Active:
            Ability: TShield
            Icon: "Shield"
            ListLayout: "$Shield$ <sprite name=Shield> *TShield*"
            Layout: "<b><size=130%>$Shield$ <sprite name=Shield> *TShield* <size=100%><voffset=1>@TShield@"
        - Row: "<size=20%> "
        - Duration: Round
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
