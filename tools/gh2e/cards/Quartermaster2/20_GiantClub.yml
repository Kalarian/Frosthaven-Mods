# card: Giant Club
# top: Attack 5 [diamond], Muddle (no mark).
# bottom: Move 6 [circle]; "give up to four chosen class items to allies adjacent to any hex you entered; 10 supplies
#   per ally given": APPROXIMATION, every ally adjacent to you after the move recovers one spent or lost item (NEEDS
#   PLUGIN: allies along the path, the item choice), and you gain 10 supplies per ally targeted (PerformVars on the
#   give, 10 x ActorsTargeted.Count; UNVERIFIED expression). XP 2, lost.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 5
                    DiamondEnhancements: 1
                Conditions: Muddle
                AnimOverload: HeavyAttack
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 6
                    CircleEnhancements: 1
            BGive:
                RefreshItems: 1
                SlotStateToRefresh: [Spent, Consumed]
                Range: 1
                Target: -1
                Filter:
                    TargetType: Ally
                    ActorType: Player
                PerformVars:
                    OnAbilityEnded:
                        GainSupplies: AbilityHasHappened && TargetingActor.AddCharacterResource("Supplies", 10 * ActorsTargeted.Count)
                AnimOverload: Refresh
        XP: 2
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Muddle$ <sprite name=Muddle>"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_20_B$"
