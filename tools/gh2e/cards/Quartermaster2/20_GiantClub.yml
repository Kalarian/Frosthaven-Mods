# card: Giant Club
# top: Attack 5 [diamond], Muddle (no mark).
# bottom: Move 6 [circle]; "you may give up to four items of your choice from the Quartermaster item supply to any
#   allies adjacent to any hexes you entered during the move; gain 10 supplies for each ally you gave an item": a self
#   NullTargeting marked GH2E_QMGiantClub; the plugin (GHQuartermaster.cs) reads the move's path, asks per ally and per
#   item (not targeted: no line of sight, GH2e FAQ) and adds the supplies. XP 2, lost.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 5
                    DiamondEnhancements: 1
                Conditions: Muddle
                AnimOverload: HeavyAttack
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 6
                    CircleEnhancements: 1
            BGive:
                NullTargeting: True
                Filter: Self
                MiscVars:
                    GH2E_QMGiantClub: 1
                AnimOverload: Refresh
        XP: 2
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Muddle$ <sprite name=Muddle>"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_20_B$"
