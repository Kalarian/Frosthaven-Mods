# card: Hastened Step
# top: Attack 2 [diamond]; Move 1 [circle]; give the Sharpened Dirk to one adjacent ally (XP 1): APPROXIMATION, the
#   ally recovers one spent or lost item (NEEDS PLUGIN); XP 1 on the half.
# bottom: Move 4 (no mark).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    DiamondEnhancements: 1
            TMove:
                Move:
                    Amount: 1
                    CircleEnhancements: 1
            TGive:
                RefreshItems: 1
                SlotStateToRefresh: [Spent, Consumed]
                Range: 1
                Filter:
                    TargetType: Ally
                    ActorType: Player
                AnimOverload: Refresh
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move: 4
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *TMove* <size=100%><voffset=1>@TMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_04_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove*"
