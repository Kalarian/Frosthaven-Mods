# card: Scroll Case
# top: gain 10 supplies; give the Scroll of Embers (no XP) and the Scroll of Foresight (XP 1) to adjacent allies:
#   two separate plugin gives (GH2E_QMGive, NOTES.md item supply); the Foresight give's XP 1 only when given.
# bottom: Move 3 [circle]; give the Scroll of Relocation to one adjacent ally (plugin give).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSupplies:
                Null: True
                Filter: Self
                ResourcesToAddOnAbilityEnd:
                    - ["Supplies", 10]
                AnimOverload: PowerUp
            TGive1:
                NullTargeting: True
                Range: 1
                IsTargetedAbility: False
                Filter:
                    TargetType: Ally
                    ActorType: Player
                MiscVars:
                    GH2E_QMGive: 3
                AnimOverload: Refresh
            TGive2:
                NullTargeting: True
                Range: 1
                IsTargetedAbility: False
                Filter:
                    TargetType: Ally
                    ActorType: Player
                MiscVars:
                    GH2E_QMGive: 9
                    GH2E_QMGiveXP: 1
                AnimOverload: Refresh
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BGive:
                NullTargeting: True
                Range: 1
                IsTargetedAbility: False
                Filter:
                    TargetType: Ally
                    ActorType: Player
                MiscVars:
                    GH2E_QMGive: 5
                AnimOverload: Refresh
Layout:
    Top:
        - Row: "$GH2E_Quartermaster2_SUPPLIES10$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_15_T$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_15_T2$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Quartermaster2_15_B$"
