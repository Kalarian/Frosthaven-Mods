# card: Felling Swoop
# top: Summon War Raptor (stand-in model: the 1st edition War Hawk).
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TSummon:
                Summon: WarRaptorID
                AnimOverload: Summon
        XP: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    Enhancements: 1
                    Jump: True
Layout:
    Top:
        - Active:
            Ability: "TSummon"
            Icon: "Summon"
            Layout:
                - Summon:
                    Ability: TSummon
                    SummonName: $GH2E_SUMMON_WarRaptor$
                    SpecialText:
                        - Row: "<nobr>$Flying$ <sprite name=Flying></nobr>"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - XP: 2
            - Column:
                - Duration: Persistent
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$Jump$ <sprite name=Jump>"
