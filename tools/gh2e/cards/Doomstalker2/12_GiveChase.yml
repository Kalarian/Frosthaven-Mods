# card: Give Chase
# top: the only Doom on a top half. "Your summons add +2 Move and Jump to all their move abilities" has no doom shape
# (a doom's bonuses sit on the doomed monster; nothing in Frosthaven or the 1st edition buffs the caster's summons from
# there) and "your summons focus on this enemy" is the player's steering in Frosthaven: NEEDS PLUGIN. The doom places
# its token with a +0 summon attack bonus so the card has a doom ability (no effect on the numbers); the text is printed.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TDoom:
                AddDoom:
                    Doom:
                        DoomAbilities:
                            TDoomMarker:
                                Attack: 0
                                ActiveBonus:
                                    Duration: Persistent
                                    Behaviour: BuffIncomingAttacks
                                    Filter:
                                        ActorType: Summon
                                        Summoner: [Doomstalker2ID]   # "your summons": the Doomstalker's own (CAbilityFilter.CheckSummoner)
                Filter:
                    TargetType: Enemy
                    EnemyType: [Normal, Elite, Boss, Object]
                Target: 1
                Targeting: All
                MiscVars:
                    CheckLOS: True
                AnimOverload: DoomTargetAlt
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
Layout:
    Top:
        - Doom:
            DoomIcon: Doomstalker
            ParentAbility: TDoom
            ActiveBonusLayout: "$GH2E_Doomstalker2_12_T$"
            DoomAbilityLayout: "$GH2E_Doomstalker2_12_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
