# card: Charging Beast
# top: Summon Horned Hristek (stand-in model: the 1st edition Black Unicorn, the horned one). Its trait (+2 Attack on
# its attacks for the round after its first move) is plugin GHDoomstalker2e (HornedHristek); "whenever this summon kills
# an enemy, grant it Move +0" is an on-kill bonus in its summon file.
# bottom: Doom. On death, you and all allies Heal 3 (the 1st edition Nature's Hunger doom, Heal 2 -> 3). "Your summons
# focus on this enemy": plugin GHDoomstalker2e (DoomFocus).
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TSummon:
                Summon: HornedHristekID
                AnimOverload: Summon
        XP: 2
    Bottom:
        Abilities:
            BDoom:
                AddDoom:
                    Doom:
                        DoomAbilities:
                            BDoomOnDeath:
                                AddActiveBonus:
                                    Heal: 3
                                    Filter: Self
                                Target: -1
                                Targeting: All
                                ActiveBonus:
                                    Behaviour: DuringActionAbilityOnDeath
                                    Filter:
                                        ActorType: [Player, Summon, Ally]
                Filter:
                    TargetType: Enemy
                    EnemyType: [Normal, Elite, Boss, Object]
                Target: 1
                Targeting: All
                MiscVars:
                    CheckLOS: True
                AnimOverload: DoomTarget
Layout:
    Top:
        - Active:
            Ability: "TSummon"
            Icon: "Summon"
            Layout:
                - Summon:
                    Ability: TSummon
                    SummonName: $GH2E_SUMMON_HornedHristek$
                    SpecialText:
                        - Row: "$GH2E_Doomstalker2_25_T$"
        - Row: "<size=20%> "
        - Row: "$GH2E_Doomstalker2_25_T2$"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - XP: 2
            - Column:
                - Duration: Persistent
    Bottom:
        - Doom:
            DoomIcon: Doomstalker
            ParentAbility: BDoom
            ActiveBonusLayout: "$GH2E_Doomstalker2_25_B$"
            DoomAbilityLayout: "$GH2E_Doomstalker2_25_B$"
