# card: Murderous Stalker
# top: Frosthaven's Malicious Conversion (Boneshaper 131) shape: on a kill, play a card's action (SelectAndPlayCard)
# from the hand or the discard pile, here only actions with a Doom (IsActionValid: AddDoom). The kill XP is a GainXP
# sub-ability (Crashing Tide Submerge) under the same kill requirement. The corner XP 1 is the card's own.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 6
                    Enhancements: 1
                Range: 5
                AnimOverload: RangedAttack
                SubAbilities:
                    TKillXP:
                        GainXP: 1
                        StartAbilityRequirements:
                            Type: SubAbility
                            ActorsKilledByAbility: "> 0"
                            RequirementActorFilter:
                                TargetType: Enemy
                    TPlayDoom:
                        AutoTrigger: True
                        Filter: Self
                        TreatAsNonSubAbility: True
                        SelectAndPlayCard:
                            CardPile: [Hand, Discarded]
                        MiscVars:
                            IsActionValid: Action.Abilities.Any(obj.AbilityType == CAbility.EAbilityType.AddDoom)
                        StartAbilityRequirements:
                            Type: SubAbility
                            ActorsKilledByAbility: "> 0"
                            RequirementActorFilter:
                                TargetType: Enemy
                        SkipAnim: True
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
                    Jump: True
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "<size=20%> "
        - Row: "$GH2E_Doomstalker2_05_T$"
        - Row: "<size=50%> "
        - XP: 1
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$Jump$ <sprite name=Jump>"
