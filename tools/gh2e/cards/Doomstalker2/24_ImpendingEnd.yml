# card: Impending End
# top: "If this attack kills the target, you may perform its Doom actions on an enemy within Range 3 of the hex where it
# died" = Forward Momentum's transfer (TransferDooms on a doomed enemy's death), as a one-use bonus for this turn. A
# doom is gone the moment its enemy dies, so the bonus must exist before the attack: it is the half's first ability
# (standard confirm), the attack second. Its Vars accept only a death caused by this card's attack.
# bottom: Doom with three slots: "Immobilize on your first attack on it, +2 Attack on the second and third". Two doom
# bonuses: Immobilize (one use) and +2 Attack (two uses, XP on the last), so the first attack gets Immobilize and +2,
# the second +2 (same total, two attacks instead of three; approximation). The card is discarded when both are used.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TActive:
                AddActiveBonus:
                    TransferDooms: -1
                    Range: 3
                    Target: 1
                    Filter: Enemy
                    AnimOverload: DoomTarget
                    AllTargetsAdjacentToParentTarget: True
                Filter: Self
                ActiveBonus:
                    Duration: Turn
                    Behaviour: DuringActionAbilityOnDeath
                    TriggerOnCaster: True
                    Requirement:
                        ValidActorsInRangeOfAddedAbilityRange: "> 0"
                        RequirementActorFilter:
                            ActorType: [Enemy, Enemy2]
                    IsAura: True
                    AuraFilter:
                        IsDoomed: True
                        TargetType: Enemy
                    AuraTargeting: All
                    UseTriggerAbilityAsParent: True
                    XPTracker: [0]
                    # only a kill by this card's attack (the cause-of-death ability; SetupTriggerContext checks these
                    # before the slot is used). The turn's other action is a bottom half, so no other "TAttack".
                    Vars:
                        ValidateHasAbility: TriggerAbility != null
                        ValidateYourAttack: TriggerAbility.TargetingActor == ActiveBonus.Caster
                        ValidateThisAttack: TriggerAbility.Name == "TAttack"
                AnimOverload: PowerUp
            TAttack:
                Attack:
                    Amount: 4
                    Enhancements: 1
                Range: 5
                AnimOverload: RangedAttack
    Bottom:
        Abilities:
            BDoom:
                AddDoom:
                    Doom:
                        DoomAbilities:
                            BDoomImmobilize:
                                Attack: 0
                                Condition: Immobilize
                                ActiveBonus:
                                    Duration: Persistent
                                    Behaviour: BuffIncomingAttacks
                                    Filter:
                                        PlayerClasses: Doomstalker2ID
                                    XPTracker: [0]
                            BDoomAttackDebuff:
                                Attack: 2
                                ActiveBonus:
                                    Duration: Persistent
                                    Behaviour: BuffIncomingAttacks
                                    Filter:
                                        PlayerClasses: Doomstalker2ID
                                    XPTracker: [0,1]
                Filter:
                    TargetType: Enemy
                    EnemyType: [Normal, Elite, Boss, Object]
                Target: 1
                Targeting: All
                MiscVars:
                    CheckLOS: True
                AnimOverload: DoomTarget
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "<size=20%> "
        - Active:
            Ability: TActive
            ListLayout: "$GH2E_Doomstalker2_24_T$"
            Layout: "$GH2E_Doomstalker2_24_T$"
            Icon: "Doom"
    Bottom:
        - Doom:
            DoomIcon: Doomstalker
            ParentAbility: BDoom
            ActiveBonusLayout: "$GH2E_Doomstalker2_24_B$"
            DoomAbilityLayout:
                - Row: "$GH2E_Doomstalker2_24_B$"
                - Row: "<size=100%> "
                - XPTracker: BDoomAttackDebuff
                # (an empty row after the tracker too: it takes no height, and touched the "When this dies" line below,
                # the 2026-11-02 capture)
                - Row: "<size=70%> "
