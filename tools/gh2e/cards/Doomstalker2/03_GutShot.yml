# card: Gut Shot
# top: the 1st edition Swift Trickery conditional (IsDoomed) with Wound in place of +2 Attack (the condition override
# of the Demolitionist's One-Two Punch).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    Enhancements: 1
                Range:
                    Amount: 4
                    Enhancements: 1
                ConditionalOverrides:
                    TAttackCO:
                        Filter:
                            IsDoomed: True
                        AbilityOverrides:
                            TDoomedBuff:
                                Condition: Wound
                        XP: 1
                AnimOverload: RangedAttack
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "<size=20%> "
        - Row: "$GH2E_Doomstalker2_03_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
