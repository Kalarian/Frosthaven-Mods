# card: Solid Bow
# bottom: the 1st edition Sap Life doom (DuringActionAbilityOnDamaged, the caster heals): only damage from you or one of
# your summons counts (the bonus Vars test the damaging ability's actor, Boneshaper Unholy Prowess's form), and the
# skippable Heal 2 goes to you or one ally adjacent to the doomed enemy (a custom target list).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
                Range: 5
                AnimOverload: RangedAttack
    Bottom:
        Abilities:
            BDoom:
                AddDoom:
                    Doom:
                        DoomAbilities:
                            BDoomOnDamaged:
                                AddActiveBonus:
                                    Heal: 2
                                    Filter: [Self, Ally]
                                    CanSkip: True
                                    Targeting: Custom
                                    TargetingVars:
                                        AddValidActorsInRange: HealTargets
                                ActiveBonus:
                                    Behaviour: DuringActionAbilityOnDamaged
                                    TriggerOnCaster: True
                                    Vars:
                                        Doomstalker: ActiveBonus.Caster
                                        DoomedEnemy: ActiveBonus.Actor
                                        ValidateHasAbility: TriggerAbility != null
                                        ValidateFromYou: TriggerAbility.TargetingActor == Doomstalker || TriggerAbility.TargetingActor.Summoner == Doomstalker
                                        HealTargets: AllAliveActors.Where(obj == Doomstalker || (obj != DoomedEnemy && CActor.AreActorsAllied(obj.Type, Doomstalker.Type, obj, Doomstalker) && obj.IsAdjacentTo(DoomedEnemy)))
                Filter:
                    TargetType: Enemy
                    EnemyType: [Normal, Elite, Boss, Object]
                Target: 1
                Targeting: All
                MiscVars:
                    CheckLOS: True
                AnimOverload: DoomTarget
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
    Bottom:
        - Doom:
            DoomIcon: Doomstalker
            ParentAbility: BDoom
            ActiveBonusLayout: "$GH2E_Doomstalker2_08_B$"
            DoomAbilityLayout: "$GH2E_Doomstalker2_08_B$"
