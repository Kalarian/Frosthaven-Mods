# card: A Moment's Peace
# top: reveal the top ability card of one monster within range 5: Frosthaven's CustomAbility.ShowTopMonsterCards on the
# chosen target (the Nightshroud's Eyes of the Night shape; Frosthaven's Shattersong Transparency).
# bottom: Heal 2 on yourself or one of your summons within range 1.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TLoot:
                Loot: 1
                Target: -1
                AnimOverload: Loot
            TReveal:
                NullTargeting: True
                Range: 5
                Target: 1
                Filter: Enemy
                AnimOverload: Cast_Concentrate
                PerformVars:
                    ApplyToActors:
                        Targets: ActorsToTarget
                        ShowMonsterCards: CustomAbility.ShowTopMonsterCards(Targets)
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
            BHeal:
                Heal: 2
                Range: 1
                Filter:
                    TargetType: [Self, OwnSummon]
                AnimOverload: Heal
Layout:
    Top:
        - Row: "<b><size=130%>$Loot$ <sprite name=Loot> *TLoot*"
        - Row: "<size=20%> "
        - Row: "$GH2E_Doomstalker2_06_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *BHeal*"
        - Row: "$GH2E_Doomstalker2_06_B$"
