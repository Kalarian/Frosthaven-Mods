# card: Wild Command
# top: grant one of your summons Move +1, Attack +1 (the 1st edition Wild Command / Summoner shape with Frosthaven's
# OwnSummon at any range, as Command the Wretched).
# bottom: the 1st edition Wild Command bottom (an attack on the doomed enemy at any range: Targeting All + IsDoomed).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyMove:
                            Move: +1
                        TAllyAttack:
                            Attack: +1
                            Range: +0
                    ControlActorType: Player
                Target: 1
                Range: 99
                Filter:
                    TargetType: OwnSummon
                AnimOverload: ControlSummon
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
            BAttack:
                Attack: 2
                Targeting: All
                Filter:
                    IsDoomed: True
                AnimOverload: RangedAttack
Layout:
    Top:
        - Row: "$GH2E_Doomstalker2_GRANT$"
        - Row: "<b><size=130%>$Move$ <sprite name=Move> +1"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> +1"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack*"
        - Row: "$GH2E_Doomstalker2_23_B$"
