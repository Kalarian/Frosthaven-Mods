# card: Foot Snare
# top: IsDoomed conditional with Immobilize; bottom: the 1st edition Foot Snare bottom.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    Enhancements: 1
                Range:
                    Amount: 4
                    Enhancements: 1
                ConditionalOverrides:
                    TAttackCO:
                        Filter:
                            IsDoomed: True
                        AbilityOverrides:
                            TDoomedBuff:
                                Condition: Immobilize
                        XP: 1
                AnimOverload: RangedAttack
    Bottom:
        Abilities:
            BImmobilize:
                Immobilize: True
                Range: 1
                Filter: Enemy
                AnimOverload: ImmobilizeAdjacent
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "<size=20%> "
        - Row: "$GH2E_Doomstalker2_09_T$"
    Bottom:
        - Row: "<b><size=130%>$Immobilize$ <sprite name=Immobilize>"
        - Row: "$Target_OneAdjacentEnemy$"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
