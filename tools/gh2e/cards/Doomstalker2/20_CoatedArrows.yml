# card: Coated Arrows
# top: "on your next four ranged attacks, add Poison, then Wound, then Immobilize, then Disarm": a ranged-only persistent
# attack bonus (the 1st edition Crippling Noose's AttackType: Ranged) with four slots (XP on the fourth), marked
# GHSlotSequence: plugin GHDoomstalker2e puts only the current slot's condition on the bonus (Poison, Wound,
# Immobilize, Disarm in turn).
# bottom: the 1st edition Relentless Offensive bottom (round BuffAttack on doomed targets), +2.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TActive:
                Attack: 0
                Conditions: [Poison]
                Filter: Self
                MiscVars:
                    GHSlotSequence: True
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffAttack
                    ValidAbilityType: Attack
                    AttackType: Ranged
                    XPTracker: [0,0,0,1]
                AnimOverload: PowerUp
    Bottom:
        Abilities:
            BAttackBuff:
                Attack: 2
                Filter: Self
                ActiveBonus:
                    Duration: Round
                    Behaviour: BuffAttack
                    Filter:
                        IsDoomed: True
                AnimOverload: PowerUp
Layout:
    Top:
        - Active:
            Ability: TActive
            ListLayout: "$GH2E_Doomstalker2_20_T$"
            Layout: "$GH2E_Doomstalker2_20_T$"
            Icon: Positive_AttackPlus
        - Row: "<size=50%> "
        - XPTracker: TActive
    Bottom:
        - Active:
            Ability: BAttackBuff
            ListLayout: "$GH2E_Doomstalker2_20_B$"
            Layout: "$GH2E_Doomstalker2_20_B$"
            Icon: Positive_AttackPlus
        - Row: "<size=50%> "
        - Duration: Round
