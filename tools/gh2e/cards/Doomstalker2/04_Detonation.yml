# card: Detonation
# bottom: the 1st edition Detonation doom (on death, damage to all enemies adjacent to its hex), damage 2.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 4
                    Enhancements: 1
                Target:
                    Amount: 2
                    Enhancements: 1
                Range:
                    Amount: 4
                    Enhancements: 1
                AnimOverload: RangedAttack
        XP: 2
    Bottom:
        Abilities:
            BDoom:
                AddDoom:
                    Doom:
                        DoomAbilities:
                            BDoomOnDeath:
                                AddActiveBonus:
                                    Damage: 2
                                    Range: 1
                                    Target: -1
                                    Filter:
                                        ActorType: [Enemy, Enemy2]
                                    IsInlineSubAbility: True
                                    AllTargetsAdjacentToParentTarget: True
                                    IgnoreStun: True
                                ActiveBonus:
                                    Behaviour: DuringActionAbilityOnDeath
                Filter:
                    TargetType: Enemy
                    EnemyType: [Normal, Elite, Boss, Object]
                Target: 1
                Targeting: All
                MiscVars:
                    CheckLOS: True
                AnimOverload: DoomTarget
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Target$ <sprite name=Target> *TAttack.Target* @TAttack.Target@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "<size=50%> "
        - XP: 2
    Bottom:
        - Doom:
            DoomIcon: Doomstalker
            ParentAbility: BDoom
            ActiveBonusLayout: "$GH2E_Doomstalker2_04_B$"
            DoomAbilityLayout: "$GH2E_Doomstalker2_04_B$"
