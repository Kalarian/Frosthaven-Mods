# card: Rain of Arrows
# top: the 1st edition Rain of Arrows shape (an aura on the caster over doomed enemies, DuringActionAbilityOnDeath,
# four slots, XP on slots 1 and 3) with the 2e Attack 3, Range 4. "While there is another enemy within Range 4": the
# bonus's Requirement (Forward Momentum's ValidActorsInRangeOfAddedAbilityRange), so a death with nobody in range
# spends no slot.
# bottom: Doom, +Pierce 2 on your attacks (the 1st edition Expose doom's Pierce buff, filtered to this class).
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TActive:
                AddActiveBonus:
                    Attack: 3
                    Range: 4
                    AnimOverload: RangedAttack
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: DuringActionAbilityOnDeath
                    TriggerOnCaster: True
                    Requirement:
                        ValidActorsInRangeOfAddedAbilityRange: "> 0"
                        RequirementActorFilter:
                            ActorType: [Enemy, Enemy2]
                    IsAura: True
                    AuraFilter:
                        IsDoomed: True
                        TargetType: Enemy
                    AuraTargeting: All
                    XPTracker: [1,0,1,0]
                AnimOverload: PowerUp
    Bottom:
        Abilities:
            BDoom:
                AddDoom:
                    Doom:
                        DoomAbilities:
                            BDoomAttackDebuff:
                                Attack: 0
                                AttackEffect:
                                    Type: StandardBuff
                                    Pierce: 2
                                ActiveBonus:
                                    Duration: Persistent
                                    Behaviour: BuffIncomingAttacks
                                    Filter:
                                        PlayerClasses: Doomstalker2ID
                Filter:
                    TargetType: Enemy
                    EnemyType: [Normal, Elite, Boss, Object]
                Target: 1
                Targeting: All
                MiscVars:
                    CheckLOS: True
                AnimOverload: DoomTargetAlt
Layout:
    Top:
        - Active:
            Ability: TActive
            ListLayout: "$GH2E_Doomstalker2_01_T$"
            Layout: "$GH2E_Doomstalker2_01_T$"
            Icon: Positive_AttackPlus
        - Row: "<size=50%> "
        - XPTracker: TActive
    Bottom:
        - Doom:
            DoomIcon: Doomstalker
            ParentAbility: BDoom
            ActiveBonusLayout: "$GH2E_Doomstalker2_01_B$"
            DoomAbilityLayout: "$GH2E_Doomstalker2_01_B$"
