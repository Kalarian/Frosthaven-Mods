# card: Empathetic Assault
# written from tools/gh2e/sheets/Mindthief.json; the heal keeps its printed mark (Xipe dropped it)
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 4
                    Enhancements: 1
                Range: 5
                Conditions: Disarm
                AnimOverload: MindAttack
        Infuse: Ice
        XP: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    SquareEnhancements: 1
            BHeal:
                Heal:
                    Amount: 2
                    SquareEnhancements: 1
                Filter: Self
                AnimOverload: Heal
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$Disarm$ <sprite name=Disarm>"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - MandatoryTrigger:
                    Layout:
                        - Infuse: Ice
            - Column:
                - XP: 2
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *BHeal* <size=100%><voffset=1>@BHeal@"
