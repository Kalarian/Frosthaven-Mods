        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Push$ <sprite name=Push> *TAttackSubPush* @TAttackSubPush@"
        - Row: "$Curse$ <sprite name=Curse>"
        - Row: "<size=20%> "
        - Consume:
            Name: TCIce
            Text: "+2 <sprite name=Attack>, <sprite name=XP1>"
    Bottom:
        - Row: "<b><size=130%>$Wound$ <sprite name=Wound>"
        - Row: "$Range$ <sprite name=Range> 1"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove*"
