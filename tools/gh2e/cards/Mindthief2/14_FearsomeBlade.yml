        Consumes:
            TCIce:
                Elements: Ice
                AbilityOverrides:
                    TCIceAttackBuff:
                        ParentName: TAttack
                        Strength: 2
                XP: 1
    Bottom:
        Abilities:
            BWound:
                Wound: True
                Range: 1
                Target: 1
                Filter: Enemy
                AnimOverload: TargetedDebuff
            BMove:
                Move: 4
Layout:
