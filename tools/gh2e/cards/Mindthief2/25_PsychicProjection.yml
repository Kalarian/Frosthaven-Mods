# card: Psychic Projection
# written from tools/gh2e/sheets/Mindthief.json; augment = Submissive Affliction's per-condition buff on every melee
# attack. Bottom: the designated hex is Frosthaven's own "perform from a hex" shape (Pyroclast Cloud of Ash): a NullHex
# pick of an unoccupied hex within range 4, then the melee Attack 3 performed as though she occupied it (Vars
# TargetingOverrideArrayIndex: range 1, line of sight and adjacency from that hex, rulebook p21; her melee augments
# apply, it is her melee attack)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TPull:
                Pull: 2
                Range: 3
                Target: 1
                Filter: Enemy
                AnimOverload: MindAttack
            TAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
                Augment:
                    Type: Melee
                    AbilityOverrides:
                        TAugmentAttackBuff:
                            ParentName: TAttack
                            AttackEffect:
                                Type: BuffForEachNegativeConditionOnTarget
                                Strength: 1
        XP: 1
    Bottom:
        Abilities:
            BDesignate:
                NullHex: True
                Range: 4
                Target: 1
                TileFilter: Custom
                MiscVars:
                    IsValidTile: obj.LivingActor == null
                    DontPreviewDescription: True
                SkipAnim: True
                SubAbilities:
                    BAttack:
                        Attack:
                            Amount: 3
                            SquareEnhancements: 1
                        Filter: Enemy
                        TreatAsNonSubAbility: True
                        StartAbilityRequirements:
                            Type: ThisAbility
                            Vars:
                                ValidateDesignated: ParentAbility != null && ParentAbility.AbilityHasHappened
                        Vars:
                            DesignatedHex: ParentAbility.m_TilesSelected[0]
                            TargetingOverrideArrayIndex: DesignatedHex
        Infuse: Dark
Layout:
    Top:
        - Augment:
            AugmentIcon: Mindthief
            ParentAbility: TAttack
            ActiveBonusLayout: "$GH2E_Mindthief2_25_T$"
            AugmentAbilityLayout:
                - Row: "$GH2E_Mindthief2_25_A$"
            NormalContentLayout:
                - ColumnWidths: "20,60,20"
                - Column:
                - Column:
                    - Row: "<b><size=130%>$Pull$ <sprite name=Pull> *TPull* <size=100%>$Range$ <sprite name=Range> *TPull.Range*"
                    - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
                - Column:
                    - XP: 1
    Bottom:
        - Row: "$GH2E_Mindthief2_25_B$"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "$GH2E_Mindthief2_25_B2$"
        - Row: "<size=20%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Dark
