# card: Telepathic Command
# written from tools/gh2e/sheets/Mindthief.json; grants = Frosthaven's Command the Wretched shape (one of your
# summons, its own values +0); "Invisible, self" is the summon's own (Frosthaven's Flesh Shield: Filter Self inside a
# control is the commanded figure)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSummonGrant:
                ControlActor:
                    Abilities:
                        TSummonAttack:
                            Attack: +0
                            Range: +0
                        TSummonInvisible:
                            Invisible:
                                Enhancements: 1
                            Filter: Self
                            AnimOverload: TurnInvisible
                Target: 1
                Range: 99
                Filter:
                    TargetType: OwnSummon
                AnimOverload: ControlSummon
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
            BSummonMove:
                ControlActor:
                    Abilities:
                        BSummonMoveGrant:
                            Move:
                                Amount: 4
                                SquareEnhancements: 1
                            StrengthIsBase: True
                Target: 1
                Range: 99
                Filter:
                    TargetType: OwnSummon
                AnimOverload: ControlSummon
Layout:
    Top:
        - Row: "$GH2E_Mindthief2_GRANTSUMMON$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> +0"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Invisible$ <sprite name=Invisible> <size=100%><voffset=1>@TSummonInvisible@"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Mindthief2_GRANTSUMMON$"
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BSummonMoveGrant* <size=100%><voffset=1>@BSummonMoveGrant@"
