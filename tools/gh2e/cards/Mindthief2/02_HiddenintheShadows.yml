# card: Hidden in the Shadows
# written from tools/gh2e/sheets/Mindthief.json; top = Frosthaven's Morbid Camouflage top (Invisible on a kill);
# bottom = Frosthaven's Giant Sword shapes (TilesMovedThisRound, ImmunityTo Move for the round)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
                AttackHasAdvantage: True
                SubAbilities:
                    TInvisible:
                        Invisible:
                            Enhancements: 1
                        Filter: Self
                        Flags: [SubAbilityPreview]
                        StartAbilityRequirements:
                            Type: SubAbility
                            ActorsKilledByAbility: "> 0"
                        AnimOverload: TurnInvisible
    Bottom:
        Abilities:
            BInvisible:
                Invisible:
                    DecrementTrigger: Rounds
                Filter: Self
                AnimOverload: TurnInvisible
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateHasntMoved: TargetingActor.TilesMovedThisRound == 0
            BPreventMove:
                ImmunityTo: [Move]
                Filter: Self
                AutoTrigger: True
                CanSkip: False
                SkipAnim: True
                StartAbilityRequirements:
                    Type: PreviousAbility
                    AbilityHasHappened: True
                ActiveBonus:
                    Duration: Round
                    ListLayoutOverride: [$GH2E_Mindthief2_02_B2$, Negative_MovePrevent]
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Advantage$"
        - Row: "<size=20%> "
        - Row: "$GH2E_Mindthief2_02_T$"
        - Row: "<b><size=130%>$Invisible$ <sprite name=Invisible> <size=100%><voffset=1>@TInvisible@"
    Bottom:
        - Row: "$GH2E_Mindthief2_02_B$"
        - Row: "<b><size=130%>$Invisible$ <sprite name=Invisible>"
        - Row: "<size=20%> "
        - Row: "$GH2E_Mindthief2_02_B2$"
        - Row: "<size=20%> "
        - Duration: Round
