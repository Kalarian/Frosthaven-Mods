                Target: 2
                Filter: Enemy
                MiscVars:
                    GHTargetsAdjacent: True
                AnimOverload: MindControl
    Bottom:
        Abilities:
            BAugment:
                AddAugment: 1
                Filter: Self
                ActiveBonusDuration: Persistent
                AnimOverload: PowerUp
Layout:
