# card: Shared Nightmare
# written from tools/gh2e/sheets/Mindthief.json; bottom Move 4 keeps its printed mark (Xipe dropped it)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    SquareEnhancements: 1
                Target:
                    Amount: 2
                    Enhancements: 1
                Range: 4
                Conditions: Poison
                AnimOverload: MindAttack
        Consumes:
            TCDark:
                Elements: Dark
                AbilityOverrides:
                    TCDarkCurse:
                        ParentName: TAttack
                        Conditions: Curse
                XP: 1
        Infuse: Ice
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
            BAttack:
                Attack:
                    Amount: 1
                    Enhancements: 1
                Range:
                    Amount: 2
                    Enhancements: 1
        Consumes:
            BCIce:
                Elements: Ice
                AbilityOverrides:
                    BCIceStun:
                        ParentName: BAttack
                        Conditions: Stun
                XP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Target$ <sprite name=Target> *TAttack.Target* @TAttack.Target@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$Poison$ <sprite name=Poison>"
        - Row: "<size=20%> "
        - Consume:
            Name: TCDark
            Text: "$Curse$ <sprite name=Curse>, <sprite name=XP1>"
        - Row: "<size=20%> "
        - Infuse: Ice
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "$Range$ <sprite name=Range> *BAttack.Range* @BAttack.Range@"
        - Row: "<size=20%> "
        - Consume:
            Name: BCIce
            Text: "$Stun$ <sprite name=Stun>, <sprite name=XP1>"
