# card: Primal Infusion
# top: grant one of your summons Move +1, Attack +1.
# bottom: "your summons gain +1 Attack while Fire is strong or waning, +1 Move and Jump while Air is strong or waning,
# and Shield 1 while Dark is strong or waning": three persistent auras on your summons (BuffAttack, BuffMove with Jump
# as HIVE Coiled Limbs, BuffShield as Banner of Courage), each valid while its element can be consumed (Pyroclast perk
# 11's element test in the bonus Requirements). The first carries the card text; the other two are hidden. Unverified.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyMove:
                            Move: +1
                        TAllyAttack:
                            Attack: +1
                            Range: +0
                    ControlActorType: Player
                Target: 1
                Range: 99
                Filter: OwnSummon
                AnimOverload: ControlSummon
        XP: 1
    Bottom:
        Abilities:
            BFireAttack:
                Attack: 1
                Target: -1
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffAttack
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter: OwnSummon
                    Requirements:
                        Vars:
                            ValidateFire: ElementInfusionBoardManager.GetAvailableElements().Contains(ElementInfusionBoardManager.EElement.Fire)
                AnimOverload: PowerUp
            BAirMove:
                Move:
                    Amount: 1
                    Jump: True
                Target: -1
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffMove
                    ValidAbilityType: Move
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter: OwnSummon
                    Hidden: True
                    Requirements:
                        Vars:
                            ValidateAir: ElementInfusionBoardManager.GetAvailableElements().Contains(ElementInfusionBoardManager.EElement.Air)
                SkipAnim: True
                AutoTrigger: True
            BDarkShield:
                Shield: 1
                Target: -1
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffShield
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter: OwnSummon
                    Hidden: True
                    Requirements:
                        Vars:
                            ValidateDark: ElementInfusionBoardManager.GetAvailableElements().Contains(ElementInfusionBoardManager.EElement.Dark)
                SkipAnim: True
                AutoTrigger: True
        XP: 1
Layout:
    Top:
        - Row: "$GH2E_Soultether_GRANT1$"
        - Row: "<b><size=130%>$Move$ <sprite name=Move> +1"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> +1"
        - Row: "<size=50%> "
        - XP: 1
    Bottom:
        - Active:
            Ability: BFireAttack
            Icon: Positive_AttackPlus_Ally_Aura
            ListLayout: "$GH2E_Soultether_23_B$"
            Layout: "$GH2E_Soultether_23_B$"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - XP: 1
            - Column:
                - Duration: Persistent
