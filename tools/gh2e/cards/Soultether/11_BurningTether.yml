# card: Burning Tether
# bottom: Teleport 3 [square] (Frosthaven's Teleport2 takes a square slot, as Deepwraith Skewer the Flesh).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 1
                    Enhancements: 1
                Range: 4
                Conditions: Wound
                AnimOverload: RangedAttackFlame
        Consumes:
            TCFire:
                Elements: Fire
                AbilityOverrides:
                    TCFireTarget:
                        ParentName: TAttack
                        Target: 1
                XP: 1
    Bottom:
        Abilities:
            BTeleport:
                Teleport2:
                    Amount: 3
                    SquareEnhancements: 1
                Filter: Self
                AnimOverload: Teleport Into
                AnimOverload2: Teleport Outof
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$Wound$ <sprite name=Wound>"
        - Row: "<size=20%> "
        - Consume:
            Name: TCFire
            Text: "+1 $Target$ <sprite name=Target>, <sprite name=XP1>"
    Bottom:
        - Row: "<b><size=130%>$Teleport$ <sprite name=Teleport> *BTeleport* <size=100%><voffset=1>@BTeleport@"
