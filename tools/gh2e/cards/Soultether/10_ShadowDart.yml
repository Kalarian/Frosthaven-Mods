# card: Shadow Dart
# bottom: "all your summons' attacks are unaffected by Retaliate": Frosthaven's Decaying Will bottom word for word
# (a persistent BlockRetaliate aura on your summons).
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    Enhancements: 1
                Range: 4
                Conditions: Curse
                AnimOverload: RangedAttackDark
        Infuse: Dark
    Bottom:
        Abilities:
            BIgnoreRetaliate:
                PreventDamage: 1
                Target: -1
                Targeting: All
                Filter: Self
                ActiveBonus:
                    Behaviour: BlockRetaliate
                    Duration: Persistent
                    IsAura: True
                    AuraTargeting: All
                    IsToggleBonus: False
                    AuraFilter: OwnSummon
                AnimOverload: CastNegative
        XP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$Curse$ <sprite name=Curse>"
        - Row: "<size=50%> "
        - Infuse: Dark
    Bottom:
        - Active:
            Ability: BIgnoreRetaliate
            Icon: Positive_RetaliatePrevent_Summon
            ListLayout: "$GH2E_Soultether_10_B$"
            Layout: "$GH2E_Soultether_10_B$"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - XP: 1
            - Column:
                - Duration: Persistent
