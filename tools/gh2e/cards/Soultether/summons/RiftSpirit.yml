Parser: HeroSummon
ID: RiftSpiritID
LocKey: $GH2E_SUMMON_RiftSpirit$
# stand-in model: the 1st edition Mystic Ally (a new 2e creature; NOTES.md)
Model: MysticAlly
Health:
    Amount: 2
    SquareEnhancements: 1
Move: 2
# the attack slot prints only a Muddle icon (no value, no mark): an attack of 0 that muddles (NOTES.md)
Attack: 0
Range: 3
OnAttackCondition: Muddle
AttackAnimOverload: TargetedManaBolt
# "At end of turn, grant one ally within Range 3: Shield 1": a summon's end-of-turn ability (Frosthaven's Repair Drone
# heal, the 1st edition Healing Sprite), Shield 1 for the round on one ally. The summon's AI picks the ally ("you
# control the grant abilities of this summon" is not reproduced: NOTES.md).
SpecialAbilities:
    AShield:
        Shield: 1
        Range: 3
        Target: 1
        Filter: [Ally]
        ActiveBonus:
            Duration: Round
        AnimOverload: TargetedBuff
