# card: Tear the Fabric
# top: Attack 2, Range 4, Curse; Invisible on one of your summons within range 4.
# bottom: "grant all your summons: Shield 1, Retaliate 1" for the round: Shield and Retaliate on every one of your
# summons (the 1st edition Forged Ferocity bottom's all-summons round shield, OwnSummon), each with its printed square.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    Enhancements: 1
                Range: 4
                Conditions: Curse
                AnimOverload: RangedAttackDark
            TInvisible:
                Invisible:
                    Enhancements: 1
                Range: 4
                Target: 1
                Filter: OwnSummon
                AnimOverload: TargetedBuff
        Infuse: Dark
    Bottom:
        Abilities:
            BShield:
                Shield:
                    Amount: 1
                    SquareEnhancements: 1
                Target: -1
                Targeting: All
                Filter: OwnSummon
                ActiveBonusDuration: Round
                AnimOverload: RadialBuff
            BRetaliate:
                Retaliate:
                    Amount: 1
                    SquareEnhancements: 1
                Target: -1
                Targeting: All
                Filter: OwnSummon
                ActiveBonusDuration: Round
                AutoTrigger: True
                AnimOverload: None
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$Curse$ <sprite name=Curse>"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Invisible$ <sprite name=Invisible>"
        - Row: "$GH2E_Soultether_24_T$"
        - Row: "<size=50%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Dark
    Bottom:
        - Active:
            Ability: BShield
            Icon: Shield
            ListLayout: "$GH2E_Soultether_24_B$"
            Layout:
                - Row: "$GH2E_Soultether_GRANTALL$"
                - Row: "<b><size=130%>$Shield$ <sprite name=Shield> *BShield* <size=100%><voffset=1>@BShield@"
                - Row: "<b><size=130%>$Retaliate$ <sprite name=Retaliate> *BRetaliate* <size=100%><voffset=1>@BRetaliate@"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
            - Column:
                - Duration: Round
