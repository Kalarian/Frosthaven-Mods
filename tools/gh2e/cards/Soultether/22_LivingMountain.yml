# card: Living Mountain
# top: Rock Colossus (summons/RockColossus2.yml: incoming heals +1, Heal 1 self at the end of its turns).
# bottom: Teleport 3 [circle]; grant one of your summons a fixed Teleport 3 [square] (Frosthaven's HIVE Recall grant of
# Teleport2, StrengthIsBase).
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TSummon:
                Summon: RockColossus2ID
                AnimOverload: Summon
        XP: 1
    Bottom:
        Abilities:
            BTeleport:
                Teleport2:
                    Amount: 3
                    CircleEnhancements: 1
                Filter: Self
                AnimOverload: Teleport Into
                AnimOverload2: Teleport Outof
            BAlly:
                ControlActor:
                    Abilities:
                        BAllyTeleport:
                            Teleport2:
                                Amount: 3
                                SquareEnhancements: 1
                            StrengthIsBase: True
                            Filter: Self
                            AnimOverload: Teleport Into
                            AnimOverload2: Teleport Outof
                    ControlActorType: Player
                Target: 1
                Range: 99
                Filter: OwnSummon
                AnimOverload: ControlSummon
Layout:
    Top:
        - Active:
            Ability: TSummon
            Icon: Summon
            Layout:
                - Summon:
                    Ability: TSummon
                    SummonName: $GH2E_SUMMON_RockColossus$
                    SpecialText:
                        - Row: "<nobr>$Muddle$ <sprite name=Muddle></nobr>"
                        - Row: "<nobr>$Retaliate$ <sprite name=Retaliate> 2</nobr>"
                        - Row: "$GH2E_Soultether_22_T$"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - XP: 1
            - Column:
                - Duration: Persistent
    Bottom:
        - Row: "<b><size=130%>$Teleport$ <sprite name=Teleport> *BTeleport* <size=100%><voffset=1>@BTeleport@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Soultether_GRANT1$"
        - Row: "<b><size=130%>$Teleport$ <sprite name=Teleport> *BAllyTeleport* <size=100%><voffset=1>@BAllyTeleport@"
