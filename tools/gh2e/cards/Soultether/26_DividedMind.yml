# card: Divided Mind
# top: Heal 5, Range 4; consume Air: "grant the target of the heal ability: Push 1, Range 1, Immobilize" = a Null the
# consume fills with a grant (ControlActor) aimed at the heal's own target (Frosthaven's TargetTargetedByCaster-
# PreviousAbility + SpecificAbilityNames filter, the 1st edition Eye of the Void fix); the push carries Immobilize as a
# sub-ability on the pushed enemy (UseParentTargets). You or an ally ([Self, Ally]): healing yourself, you perform it.
# bottom: grant one of your summons Attack +0; consume Fire: two summons instead (+1 Target on the control).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            THeal:
                Heal:
                    Amount: 5
                    Enhancements: 1
                Range: 4
                Filter: [Self, Ally]
                AnimOverload: Heal
            TNull:
                Null: True
        Consumes:
            TCAir:
                Elements: Air
                Abilities:
                    TCAirGrant:
                        ParentName: TNull
                        ControlActor:
                            Abilities:
                                TCAirAllyPush:
                                    Push: 1
                                    StrengthIsBase: True
                                    Range: 1
                                    RangeIsBase: True
                                    Target: 1
                                    TargetIsBase: True
                                    Filter: [Enemy]
                                    SubAbilities:
                                        TCAirAllyPushSubImmobilize:
                                            Immobilize: True
                                            Target: 1
                                            UseParentTargets: True
                                            Filter: Enemy
                                            AutoTrigger: True
                                            CanSkip: False
                                            AnimOverload: None
                            ControlActorType: Player
                        Target: 1
                        Range: 4
                        Filter:
                            TargetType: [Self, Ally]      # healing yourself, you perform the push (Shattersong Lifting Voice grants to [Ally, Self])
                            TargetTargetedByCasterPreviousAbility: True
                            SpecificAbilityNames: [THeal]
                        AnimOverload: ControlAlly
        XP: 1
    Bottom:
        Abilities:
            BAlly:
                ControlActor:
                    Abilities:
                        BAllyAttack:
                            Attack: +0
                            Range: +0
                    ControlActorType: Player
                Target: 1
                Range: 99
                Filter: OwnSummon
                AnimOverload: ControlSummon
        Consumes:
            BCFire:
                Elements: Fire
                AbilityOverrides:
                    BCFireTwoSummons:
                        ParentName: BAlly
                        Target: 1
                XP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
        - Row: "$Range$ <sprite name=Range> *THeal.Range*"
        - Row: "<size=20%> "
        - Row: "$GH2E_Soultether_26_T$"
        - Consume:
            Name: TCAir
            Text: "<nobr>$Push$ <sprite name=Push> 1</nobr>, <nobr>$Range$ <sprite name=Range> 1</nobr>, $Immobilize$ <sprite name=Immobilize>"
        - Row: "<size=50%> "
        - XP: 1
    Bottom:
        - Row: "$GH2E_Soultether_GRANT1$"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> +0"
        - Row: "<size=20%> "
        - Consume:
            Name: BCFire
            Text: "$GH2E_Soultether_26_B$"
