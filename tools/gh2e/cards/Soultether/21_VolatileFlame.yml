# card: Volatile Flame
# top: Curse, range 4 (a condition ability); consume Dark adds Stun to the same target (a Conditions override on it).
# bottom: Ember Sprite (summons/EmberSprite.yml: its Fire-gated Retaliate aura); the card infuses the Fire it uses.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TCurse:
                Curse:
                    Enhancements: 1
                Range: 4
                Target: 1
                Filter: Enemy
                AnimOverload: CastNegative
        Consumes:
            TCDark:
                Elements: Dark
                AbilityOverrides:
                    TCDarkStun:
                        ParentName: TCurse
                        Conditions: Stun
                XP: 1
    Bottom:
        Abilities:
            BSummon:
                Summon: EmberSpriteID
                AnimOverload: Summon
        Infuse: Fire
        XP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Curse$ <sprite name=Curse>"
        - Row: "$Range$ <sprite name=Range> *TCurse.Range*"
        - Row: "<size=20%> "
        - Consume:
            Name: TCDark
            Text: "$Stun$ <sprite name=Stun>, <sprite name=XP1>"
    Bottom:
        - Active:
            Ability: BSummon
            Icon: Summon
            Layout:
                - Summon:
                    Ability: BSummon
                    SummonName: $GH2E_SUMMON_EmberSprite$
                    SpecialText:
                        - Row: "<nobr>$Flying$ <sprite name=Flying></nobr>"
                        - Row: "$GH2E_Soultether_21_B$"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
                - MandatoryTrigger:
                    Layout:
                        - Infuse: Fire
            - Column:
                - XP: 1
            - Column:
                - Duration: Persistent
