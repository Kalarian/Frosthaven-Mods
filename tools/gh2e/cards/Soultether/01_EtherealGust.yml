# card: Ethereal Gust
# top: grant two of your summons Move +0 (Frosthaven's Command the Wretched grant: Range 99, OwnSummon, Target 2).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyMove:
                            Move: +0
                    ControlActorType: Player
                Target: 2
                Range: 99
                Filter: OwnSummon
                AnimOverload: ControlSummon
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    SquareEnhancements: 1
        Infuse: Air
Layout:
    Top:
        - Row: "$GH2E_Soultether_GRANT2$"
        - Row: "<b><size=130%>$Move$ <sprite name=Move> +0"
        - Row: "<size=50%> "
        - XP: 1
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Air
