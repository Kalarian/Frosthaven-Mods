# card: Unwavering Hand
# top: grant one of your summons Attack +1. bottom: the 1st edition Unwavering Hand bottom (control one enemy within
# range 4: Move 1, you moving it), with the printed square mark.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyAttack:
                            Attack: +1
                            Range: +0
                    ControlActorType: Player
                Target: 1
                Range: 99
                Filter: OwnSummon
                AnimOverload: ControlSummon
        XP: 1
    Bottom:
        Abilities:
            BControl:
                ControlActor:
                    Abilities:
                        EnemyWillDoThis:
                            Move:
                                Amount: 1
                                SquareEnhancements: 1
                            StrengthIsBase: True
                    ControlDurationType: ControlForOneAction
                    ControlActorType: Player
                Range: 4
                Target: 1
                Filter: Enemy
                AnimOverload: MindControl
        Infuse: Air
Layout:
    Top:
        - Row: "$GH2E_Soultether_GRANT1$"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> +1"
        - Row: "<size=50%> "
        - XP: 1
    Bottom:
        - Row: "$GH2E_Soultether_15_B$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *EnemyWillDoThis* <size=100%><voffset=1>@EnemyWillDoThis@"
        - Row: "<size=50%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Air
