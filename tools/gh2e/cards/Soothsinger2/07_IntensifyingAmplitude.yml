# card: Intensifying Amplitude
# bottom: +X (0, 1, 2, 3, 4 over the five attacks) from the tracker position (Snowdancer Snowball's
# BasedOnActiveBonusVarsStrength, one slot per attack) on an ally aura (Sunkeeper2 Sanctify's, any range, allies only)
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 1
                    SquareEnhancements: 1
                Range: 3
                Conditions: Wound
                AnimOverload: RangedAttack
            TNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerLowNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
    Bottom:
        Abilities:
            # "on your allies' next five attacks, add +X Attack, X = the slots the token has passed (0, 1, 2, 3, 4)":
            # Frosthaven's Snowdancer Snowball bottom (strength from the tracker position, one slot per attack) as an
            # ally aura
            BActive:
                MiscVars:
                    ImmuneMoveActiveBonusTracker: True      # not a song (Captivating Performance moves song tokens only)
                Attack: 0
                AttackEffect:
                    Type: BasedOnActiveBonusVarsStrength
                Target: -1
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffAttack
                    ValidAbilityType: Attack
                    IsSingleTargetBonus: True
                    AlwaysBuff: True
                    Vars:
                        Strength: obj.TrackerIndex + TargetSelectionNumber - 1
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter:
                        TargetType: Ally
                    XPTracker: [0,1,0,1,0]
                AnimOverload: PositiveBuffRadial
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$Wound$ <sprite name=Wound>"
        - Row: "<size=50%> "
        - Row: "$GH2E_Soothsinger2_LOW$"
    Bottom:
        - Active:
            Ability: BActive
            Icon: "Positive_AttackPlus_Ally_Aura"
            ListLayout: "$GH2E_Soothsinger2_07_B$"
            Layout: "$GH2E_Soothsinger2_07_B$"
        - Row: "<size=20%> "
        - XPTracker: BActive
