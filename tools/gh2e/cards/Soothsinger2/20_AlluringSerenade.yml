# card: Alluring Serenade
# top: song (Low, Low Note); end-of-turn Pull 3 + Curse on one enemy within range 5
# bottom: the Pull rides on the heal: a sub-ability on the healed ally (UseParentTargets), skipped when you heal yourself
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                AddActiveBonus:
                    Pull: 3
                    Range: 5
                    Target: 1
                    Filter: Enemy
                    Conditions: Curse
                    AnimOverload: AggressiveTargetedShout
                Filter: Self
                AnimOverload: PlaySongConfuse2
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,0,0]
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
    Bottom:
        Abilities:
            BHeal:
                Heal:
                    Amount: 3
                    SquareEnhancements: 1
                Range: 4
                Filter: [Self, Ally]
                AnimOverload: PlayPositiveTune
                SubAbilities:
                    BHealSubPull:
                        Pull: 3
                        Filter: Ally
                        UseParentTargets: True
                        Target: 1
            BNote:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerHighNote", 1]
Layout:
    Top:
        - Row: "$GH2E_Soothsinger2_20_T$"
        - Active:
            Ability: TSong
            Icon: "Icon_Curse"
            ListLayout: "$GH2E_Soothsinger2_20_T2$"
            Layout: "$GH2E_Soothsinger2_20_T2$"
        - Row: "<size=20%> "
        - XPTracker: TSong
    Bottom:
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *BHeal* <size=100%><voffset=1>@BHeal@"
        - Row: "$Range$ <sprite name=Range> *BHeal.Range*"
        - Row: "$Pull$ <sprite name=Pull> *BHealSubPull*"
        - Row: "<size=50%> "
        - Row: "$GH2E_Soothsinger2_HIGH$"
