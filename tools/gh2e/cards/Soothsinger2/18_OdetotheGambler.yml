# card: Ode to the Gambler
# top: song (High + Low Note): you and every ally, each turn, may treat the first modifier card drawn as rolling, chosen
# after it is revealed (a marker aura; the plugin GHSoothsinger asks and makes the card rolling)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            # Frosthaven's Tome of Conflict aura (1229: a NullTargeting persistent aura), on you and every ally; its marker
            # GH2E_OdeRolling (not the engine's TreatFirstAttackModifierAsRolling) lets the plugin (GHSoothsinger) offer
            # each figure, once per turn on its first modifier card drawn, after the card is revealed, to treat it as rolling
            TSong:
                NullTargeting: True
                Filter: Self
                MiscVars:
                    GH2E_OdeRolling: True
                ActiveBonus:
                    Duration: Persistent
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter: [Self, Ally]
                AnimOverload: PlaySongAttack3
            TSongTimer:
                AddActiveBonus:
                    Null: True
                    Filter: Self
                    AutoTrigger: True
                    SkipAnim: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndRoundAbility
                    XPTracker: [1,0,0,0]
                    EndAllActiveBonusesOnBaseCardSimultaneously: True
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song2: True      # the song's Note cost (Symphonic Medley picks songs by it)
                    GH2E_SongHigh: 1   # the printed cost in High / Low Notes (plugin GHSoothsinger)
                    GH2E_SongLow: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    Enhancements: 1
Layout:
    Top:
        - Row: "$GH2E_Soothsinger2_18_T$"
        - Active:
            Ability: TSong
            Icon: "Positive_Rolling_Enemy_Death_Item"   # Tome of Conflict's rolling-first-modifier icon
            ListLayout: "$GH2E_Soothsinger2_18_T2$"
            Layout: "$GH2E_Soothsinger2_18_T2$"
        - Row: "<size=20%> "
        - XPTracker: TSongTimer
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
