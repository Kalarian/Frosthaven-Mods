# card: Pull the Strings
# top: the control on the attack's target = the 1st edition Lead to Slaughter fix (sub-ability, UseParentTargets)
# bottom: the 1st edition Pull the Strings bottom (the enemy's own attack +0)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    Enhancements: 1
                Range: 4
                AnimOverload: RangedAttack
                SubAbilities:
                    TSubControl:
                        ControlActor:
                            Abilities:
                                EnemyWillDoThis:
                                    Move:
                                        Amount: 2
                                        SquareEnhancements: 1
                                    StrengthIsBase: True
                            ControlDurationType: ControlForOneAction
                            ControlActorType: Player
                        Filter: Enemy
                        UseParentTargets: True
                        Target: 1
            TNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerHighNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
    Bottom:
        Abilities:
            BControl:
                ControlActor:
                    Abilities:
                        EnemyWillDoThis2:
                            Attack: 0
                            Range: 0
                            Target: 1
                            TargetIsBase: True
                    ControlDurationType: ControlForOneAction
                    ControlActorType: Player
                Range: 5
                Filter: Enemy
                AnimOverload: AggressiveTargetedShout
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "<size=50%> "
        - Row: "$GH2E_Soothsinger2_23_T$"
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *EnemyWillDoThis* <size=100%><voffset=1>@EnemyWillDoThis@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Soothsinger2_HIGH$"
    Bottom:
        - Row: "$GH2E_Soothsinger2_23_B$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> +0"
