# card: Tuning the Outcome
# bottom: the Curse itself carries no mark (only its range)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TBless:
                Bless:
                    Enhancements: 1
                Target:
                    Amount: 2
                    Enhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                Filter: [Self, Ally]
                AnimOverload: PlayPositiveTune
            TNote:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerLowNote", 1]
    Bottom:
        Abilities:
            BCurse:
                Curse: True
                Range:
                    Amount: 3
                    Enhancements: 1
                Filter: Enemy
                AnimOverload: AggressiveTargetedShout
            BNote:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerHighNote", 1]
Layout:
    Top:
        - Row: "<b><size=130%>$Bless$ <sprite name=Bless> <size=100%><voffset=1>@TBless@"
        - Row: "$Target$ <sprite name=Target> *TBless.Target* @TBless.Target@"
        - Row: "$Range$ <sprite name=Range> *TBless.Range* @TBless.Range@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Soothsinger2_LOW$"
    Bottom:
        - Row: "<b><size=130%>$Curse$ <sprite name=Curse>"
        - Row: "$Range$ <sprite name=Range> *BCurse.Range* @BCurse.Range@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Soothsinger2_HIGH$"
