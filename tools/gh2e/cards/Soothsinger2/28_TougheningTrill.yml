# card: Toughening Trill
# top: song (High + Low Note): Defensive Ditty's Shield aura and Echoing Aria's Retaliate aura, four slots per round
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                Shield: 1
                Target: -1
                Targeting: All
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter: [Self, Ally]
                AnimOverload: PlaySongShield1
            TSongRetaliate:
                Retaliate: 1
                RetaliateRange: 2
                Target: -1
                Targeting: All
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Persistent
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter: [Self, Ally]
            TSongTimer:
                AddActiveBonus:
                    Null: True
                    Filter: Self
                    AutoTrigger: True
                    SkipAnim: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndRoundAbility
                    XPTracker: [1,0,0,0]
                    EndAllActiveBonusesOnBaseCardSimultaneously: True
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song2: True      # the song's Note cost (Symphonic Medley picks songs by it)
                    GH2E_SongHigh: 1   # the printed cost in High / Low Notes (plugin GHSoothsinger)
                    GH2E_SongLow: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
            BAttack:
                Attack:
                    Amount: 2
                    SquareEnhancements: 1
                Range: 3
                AnimOverload: RangedAttack
Layout:
    Top:
        - Row: "$GH2E_Soothsinger2_28_T$"
        - Active:
            Ability: TSong
            Icon: "Positive_Shield_Ally_Aura"
            ListLayout: "$GH2E_Soothsinger2_28_T2$"
            Layout: "$GH2E_Soothsinger2_28_T2$"
        - Row: "<size=20%> "
        - XPTracker: TSongTimer
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "$Range$ <sprite name=Range> *BAttack.Range*"
