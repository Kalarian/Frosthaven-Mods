# card: Dissonant Rhythm
# top: song (High, Low, Low Note); end-of-turn Attack 2, Push 2, Pierce 2 on the enemy closest to you. No range printed:
# a melee attack (rulebook p21, approved rule B), so it can only reach an adjacent enemy, and every adjacent enemy is at
# the closest distance (1): Range 1, the player picks among them (ties are the player's choice)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                AddActiveBonus:
                    Attack: 2
                    Pierce: 2
                    Range: 1
                    Target: 1
                    Filter: Enemy
                    AnimOverload: AggressiveTargetedShout
                    SubAbilities:
                        TSongSubPush:
                            Push: 2
                            IsInlineSubAbility: True
                Filter: Self
                AnimOverload: PlaySongAttack2
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,0,1]
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song3: True      # the song's Note cost (Symphonic Medley picks songs by it)
                    GH2E_SongHigh: 1   # the printed cost in High / Low Notes (plugin GHSoothsinger)
                    GH2E_SongLow: 2
    Bottom:
        Abilities:
            BMuddle:
                Muddle: True
                Target:
                    Amount: 3
                    Enhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                Filter: Enemy
                AnimOverload: AggressiveNonTargetedShout
            BNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerHighNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
Layout:
    Top:
        - Row: "$GH2E_Soothsinger2_05_T$"
        - Active:
            Ability: TSong
            Icon: "Positive_ForceMove_Damage"
            ListLayout: "$GH2E_Soothsinger2_05_T2$"
            Layout: "$GH2E_Soothsinger2_05_T2$"
        - Row: "<size=20%> "
        - XPTracker: TSong
    Bottom:
        - Row: "<b><size=130%>$Muddle$ <sprite name=Muddle>"
        - Row: "$Target$ <sprite name=Target> *BMuddle.Target* @BMuddle.Target@"
        - Row: "$Range$ <sprite name=Range> *BMuddle.Range* @BMuddle.Range@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Soothsinger2_HIGH$"
