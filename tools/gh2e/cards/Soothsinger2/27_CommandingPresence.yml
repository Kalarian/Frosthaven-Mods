# card: Commanding Presence
# top: the 1st edition Commanding Presence grant (all enemies adjacent to the ally); the Attack 3 has no mark
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyAttack:
                            Attack: 3
                            Target: -1
                            Range: 1
                            StrengthIsBase: True
                            RangeIsBase: True
                            TargetIsBase: True
                            MultiPassAttack: False
                            AnimOverload: Attack
                Range:
                    Amount: 3
                    Enhancements: 1
                Filter: Ally
                AnimOverload: PlayPositiveTuneAttack
            TNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerHighNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 6
                    Enhancements: 1
Layout:
    Top:
        - Row: "$GH2E_Soothsinger2_GRANT_RANGE$ <nobr><sprite name=Range> *TAlly.Range*</nobr>: @TAlly.Range@"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAllyAttack*"
        - Row: "$Target_AllAdjacentEnemies$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Soothsinger2_HIGH$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
