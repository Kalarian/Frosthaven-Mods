        Abilities:
            TSong:
                AttackersGainDisadvantage: True
                Range: 0
                Target: -1
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter: [Self, Ally]
                AnimOverload: PlaySongShield3
            TSongTimer:
                AddActiveBonus:
                    Null: True
                    Filter: Self
                    AutoTrigger: True
                    SkipAnim: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndRoundAbility
                    XPTracker: [1,0,0]
                    EndAllActiveBonusesOnBaseCardSimultaneously: True
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    Enhancements: 1
            BPrevent:
                PreventDamage: 1
                Range: 2
                Target: -1
                Filter: [Self]
                ActiveBonus:
                    Duration: Round
                    XPTracker: [0]
                    IsAura: True
                    AuraFilter: [Ally]
                AnimOverload: PlayPositiveTuneShield
Layout:
    Top:
        - Row: "$GH2E_Soothsinger2_24_T$"
        - Active:
