# card: Mobilizing Measure
# top: song (Low Note); end-of-turn grant Move 2 to the closest ally (Custom targeting: only the closest; ties: the player picks)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                AddActiveBonus:
                    ControlActor:
                        Abilities:
                            TSongAllyMove:
                                Move: 2
                                StrengthIsBase: True
                    Range: 99
                    Target: 1
                    Filter: Ally
                    Vars:
                        SongMe: TargetingActor
                        SongAllies: AllAliveActors.Where(obj != SongMe and CActor.AreActorsAllied(obj.Type, SongMe.Type, obj, SongMe))
                        ValidateSongAllies: SongAllies.Count > 0
                        SongNearestDist: SongAllies.OrderBy(obj.GetDistanceTo(SongMe, true)).First.GetDistanceTo(SongMe, true)
                        SongClosest: SongAllies.Where(obj.GetDistanceTo(SongMe, true) == SongNearestDist)
                    Targeting: Custom
                    TargetingVars:
                        AddTilesInRange: SongClosest.Select(Tile)
                        AddValidActorsInRange: SongClosest
                    AnimOverload: PlayPositiveTuneMove
                Filter: Self
                AnimOverload: PlaySongSpeed1
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,0,0,0]
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
                    Jump: True
            BRetaliate:
                Retaliate:
                    Amount: 1
                    Enhancements: 1
                Range: 1
                Target: 1
                Filter: Ally
                ActiveBonus:
                    Duration: Round
                AnimOverload: PlayPositiveTuneShield
Layout:
    Top:
        - Row: "$GH2E_Soothsinger2_01_T$"
        - Active:
            Ability: TSong
            Icon: "Positive_Move_Ally_Grant"
            ListLayout: "$GH2E_Soothsinger2_01_T2$"
            Layout: "$GH2E_Soothsinger2_01_T2$"
        - Row: "<size=20%> "
        - XPTracker: TSong
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$Jump$ <sprite name=Jump>"
        - Row: "<size=50%> "
        - Row: "$GH2E_Soothsinger2_GRANT_ADJ$"
        - Row: "<b><size=130%>$Retaliate$ <sprite name=Retaliate> *BRetaliate* <size=100%><voffset=1>@BRetaliate@"
        - Row: "<size=50%> "
        - Duration: Round
