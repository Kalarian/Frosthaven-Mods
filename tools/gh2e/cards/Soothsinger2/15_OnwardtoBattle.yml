# card: Onward to Battle
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyAttack:
                            Attack:
                                Amount: 4
                                Enhancements: 1
                            Range: 1
                            StrengthIsBase: True
                            RangeIsBase: True
                Range:
                    Amount: 3
                    Enhancements: 1
                Filter: Ally
                AnimOverload: PlayPositiveTuneAttack
            TNote:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerHighNote", 1]
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    Enhancements: 1
Layout:
    Top:
        - Row: "$GH2E_Soothsinger2_GRANT_RANGE$ <nobr><sprite name=Range> *TAlly.Range*</nobr>: @TAlly.Range@"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAllyAttack* <size=100%><voffset=1>@TAllyAttack@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Soothsinger2_HIGH$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
