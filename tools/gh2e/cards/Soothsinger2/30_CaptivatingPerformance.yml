# card: Captivating Performance
# top: song (High, High, Low, Low Note); end-of-turn Disarm in Secretariat's triangle (0,1) (1,0) (1,1), no hex mark
# bottom: moving song tokens back is NEEDS PLUGIN (text only)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                AddActiveBonus:
                    Disarm: True
                    Range: 3
                    AreaEffect: "2,1,R|1,0,R|3,0,R"
                    Filter: Enemy
                    AnimOverload: AggressiveTargetedShout
                Filter: Self
                AnimOverload: PlaySongConfuse1
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,1]
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
Layout:
    Top:
        - Row: "$GH2E_Soothsinger2_30_T$"
        - Active:
            Ability: TSong
            Icon: "Icon_Disarm"
            ListLayout: "$GH2E_Soothsinger2_30_T2$"
            Layout: "$GH2E_Soothsinger2_30_T2$"
        - Row: "<size=20%> "
        - XPTracker: TSong
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Soothsinger2_30_B$"
