# card: Concentrated Rage
# top: Attack 1 [square], Range 3, Disarm. bottom: the damage-token counter: a persistent marker bonus (Attack +0 aura
# on the Bear, MiscVars GHRageTokens); the plugin (GHWildfury.cs RageTokens) keeps the tokens as the Wildfury's
# character resource WildfuryRage (saved with the scenario, shown on her status row): +1 per Bear attack (each target)
# and per Retaliate damage the Bear suffers; a Bear attack with 3+ tokens spends three for +3 Attack instead.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 1
                    SquareEnhancements: 1
                Range: 3
                Conditions: Disarm
                AnimOverload: RangedAttack
    Bottom:
        Abilities:
            BActive:
                Attack: 0
                Target: -1
                Filter: Self
                MiscVars:
                    GHRageTokens: True
                ActiveBonus:
                    Behaviour: BuffAttack
                    Duration: Persistent
                    ValidAbilityTypes: [Attack]
                    IsAura: True
                    AuraFilter:
                        HeroSummonClasses: [WildfuryBearID]
                    AuraTargeting: All
                AnimOverload: RadialBeneficial
        XP: 2
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$Disarm$ <sprite name=Disarm>"
    Bottom:
        - Active:
            Ability: BActive
            Icon: Positive_AttackPlus_Ally
            ListLayout: "$GH2E_Wildfury_01_B$"
            Layout: "$GH2E_Wildfury_01_B$"
        - Row: "<size=50%> "
        - XP: 2
        - Duration: Persistent
