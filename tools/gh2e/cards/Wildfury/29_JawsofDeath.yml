# card: Jaws of Death
# top: COMMAND Move 4 [circle], Attack 6 [diamond]; "if this attack kills an enemy, gain XP 1 and repeat this action":
# APPROXIMATION, the repeat written out twice (Move 4 + Attack 6 again when the action has one kill, once more with two),
# gated on CPhaseAction.ActorsKilledThisAction (the Drifter's Shockwave expression); XP 1 per repeat as GainXP after the
# command (Boneshaper Rotting Multitude's GainXP). Unlimited repeats NEED PLUGIN; two cover almost every case. Lost.
# bottom: COMMAND Attack 3 [diamond], Push 3; Move 3 [circle]; Attack 3 [diamond] (the 1st edition Jaws of Death
# bottom's chain, 2e numbers); XP 1.
Discard: [Lost,Discard]
