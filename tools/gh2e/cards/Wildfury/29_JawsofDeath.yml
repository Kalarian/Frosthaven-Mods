# card: Jaws of Death
# top: COMMAND Move 4 [circle], Attack 6 [diamond]; "if this attack kills an enemy, gain XP 1 and repeat this action":
# the attack is marked GHRepeatOnKill: each time it kills, the plugin (GHWildfury.cs JawsRepeat) gives the Wildfury XP 1
# and stacks copies of the commanded Move 4 and Attack 6 (enhancements kept) for the Bear, as often as each repeat
# kills. Lost.
# bottom: COMMAND Attack 3 [diamond], Push 3; Move 3 [circle]; Attack 3 [diamond] (the 1st edition Jaws of Death
# bottom's chain, 2e numbers); XP 1.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyMove:
                            Move:
                                Amount: 4
                                CircleEnhancements: 1
                            StrengthIsBase: True
                        TAllyAttack:
                            Attack:
                                Amount: 6
                                DiamondEnhancements: 1
                            StrengthIsBase: True
                            RangeIsBase: True
                            MiscVars:
                                GHRepeatOnKill: True
                    ControlActorType: Player
                Target: -1
                Targeting: All
                Filter: Companion
                AnimOverload: Command
    Bottom:
        Abilities:
            BAlly:
                ControlActor:
                    Abilities:
                        BAllyAttack1:
                            Attack:
                                Amount: 3
                                DiamondEnhancements: 1
                            StrengthIsBase: True
                            RangeIsBase: True
                            SubAbilities:
                                BAllyAttack1SubPush:
                                    Push: 3
                                    AnimOverload: None
                        BAllyMove1:
                            Move:
                                Amount: 3
                                CircleEnhancements: 1
                            StrengthIsBase: True
                        BAllyAttack2:
                            Attack:
                                Amount: 3
                                DiamondEnhancements: 1
                            StrengthIsBase: True
                            RangeIsBase: True
                    ControlActorType: Player
                Target: -1
                Targeting: All
                Filter: Companion
                AnimOverload: Command
        XP: 1
Layout:
    Top:
        - Command: True
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *TAllyMove* <size=100%><voffset=1>@TAllyMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAllyAttack* <size=100%><voffset=1>@TAllyAttack@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Wildfury_29_T$"
    Bottom:
        - Command: True
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAllyAttack1* <size=100%><voffset=1>@BAllyAttack1@"
        - Row: "$Push$ <sprite name=Push> 3"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BAllyMove1* <size=100%><voffset=1>@BAllyMove1@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAllyAttack2* <size=100%><voffset=1>@BAllyAttack2@"
        - Row: "<size=50%> "
        - XP: 1
