# card: Earthen Spikes
# top: Attack 2 [diamond], Range 4, Immobilize, infuse Earth. bottom: Move 5 [square]. As printed.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    DiamondEnhancements: 1
                Range: 4
                Conditions: Immobilize
                AnimOverload: RangedAttack
        Infuse: Earth
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    SquareEnhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$Immobilize$ <sprite name=Immobilize>"
        - Row: "<size=50%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Earth
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
