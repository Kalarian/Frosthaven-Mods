# card: Vitality Siphon
# top: Attack 1 [diamond], Range 3 [square], consume Air: +2 Attack, XP 1; Heal 1 [diamond+], Range 3 [square] (one
# target in range, no self pill: you or an ally), consume Earth: +2 Heal, XP 1 (the 1st edition Borrowed Essence top's
# shape). bottom: Move 5 [square].
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 1
                    DiamondEnhancements: 1
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                AnimOverload: RangedAttack
            THeal:
                Heal:
                    Amount: 1
                    DiamondPlusEnhancements: 1
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                Filter: [Self, Ally]
                AnimOverload: Heal
        Consumes:
            TCAir:
                Elements: Air
                AbilityOverrides:
                    TCAirAttackBuff:
                        ParentName: TAttack
                        Strength: 2
                XP: 1
            TCEarth:
                Elements: Earth
                AbilityOverrides:
                    TCEarthHealBuff:
                        ParentName: THeal
                        Strength: 2
                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    SquareEnhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Consume:
            Name: TCAir
            Text: "<nobr>+2 $Attack$ <sprite name=Attack>, <sprite name=XP1></nobr>"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
        - Row: "$Range$ <sprite name=Range> *THeal.Range* @THeal.Range@"
        - Consume:
            Name: TCEarth
            Text: "<nobr>+2 $Heal$ <sprite name=Heal>, <sprite name=XP1></nobr>"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
