# card: Stone Sigil
# top: "! consume Earth (required)", Summon Monolith (summons/Monolith2.yml: HP 2 [square], no move or attack; aura:
# allies within range 3 gain Shield 1), XP 1 with the consume. Persistent icon, not lost.
# bottom: Move 3 [circle]; "if you are adjacent to the Bear": Attack 1 [diamond], Range 3, Pierce 1, Muddle; consume
# Air: +1 Attack, +1 Pierce, XP 1. The condition is a start requirement on the attack: one of the Wildfury's summons of
# the Bear's class next to her (the Boneshaper's AllHeroSummons.Any(... IsAdjacentTo ...) expression). Untested.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TConsume:
                Consume:
                    Elements: [Earth]
                    Abilities:
                        TCNull:
                            Null: True
                            AutoTrigger: True
                    XP: 1
            TSummon:
                Summon: Monolith2ID
                StartAbilityRequirements:
                    Type: ThisAbility
                    ActorHasPerformedValidAbilityTypesThisAction: "> 0"
                    AbilityTypes: [Consume]
                AnimOverload: Summon
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BAttack:
                Attack:
                    Amount: 1
                    DiamondEnhancements: 1
                Range: 3
                Pierce: 1
                Conditions: Muddle
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateAdjacentToBear: AllHeroSummons.Any(obj.Class.ID == "WildfuryBearID" && obj.IsAdjacentTo(Actor))
                AnimOverload: RangedAttack
        Consumes:
            BCAir:
                Elements: Air
                AbilityOverrides:
                    BCAirAttackBuff:
                        ParentName: BAttack
                        Attack:
                            Amount: 1
                            Pierce: 1
                XP: 1
Layout:
    Top:
        - Row: "<sprite name=ConsumeEarth> $GH2E_Wildfury_REQUIRED$"
        - Active:
            Ability: "TSummon"
            Icon: "Summon"
            Layout:
                - Summon:
                    Ability: TSummon
                    SummonName: $GH2E_SUMMON_Monolith$
                    SpecialText: "$GH2E_Wildfury_17_T$"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - XP: 1
            - Column:
                - Duration: Persistent
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Wildfury_17_B$"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "$Range$ <sprite name=Range> *BAttack.Range*"
        - Row: "$Pierce$ <sprite name=Pierce> *BAttack.Pierce*"
        - Row: "$Muddle$ <sprite name=Muddle>"
        - Row: "<size=20%> "
        - Consume:
            Name: BCAir
            Text:
                - Row: "+1 $Attack$ <sprite name=Attack>, <sprite name=XP1>"
                - Row: "<size=10%> "
                - Row: "+1 $Pierce$ <sprite name=Pierce>"
