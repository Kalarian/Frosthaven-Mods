# card: Gust Sigil
# top: "! consume Air (required)" (the Infuser's required-consume shape), then Summon Wind Idol (summons/WindIdol.yml:
# HP 1 [square], no move or attack; its aura: allies within range 3 add Pierce 1 to all their attacks). XP 1 with the
# consume (no XP without the element). Persistent icon, not lost. bottom: Move 5 [square].
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TConsume:
                Consume:
                    Elements: [Air]
                    Abilities:
                        TCNull:
                            Null: True
                            AutoTrigger: True
                    XP: 1
            TSummon:
                Summon: WindIdolID
                StartAbilityRequirements:
                    Type: ThisAbility
                    ActorHasPerformedValidAbilityTypesThisAction: "> 0"
                    AbilityTypes: [Consume]
                AnimOverload: Summon
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    SquareEnhancements: 1
Layout:
    Top:
        - MandatoryTrigger:
            Layout:
                - Row: "<sprite name=ConsumeAir> $GH2E_Wildfury_REQUIRED$"
        - Active:
            Ability: "TSummon"
            Icon: "Summon"
            Layout:
                - Summon:
                    Ability: TSummon
                    SummonName: $GH2E_SUMMON_WindIdol$
                    SpecialText: "$GH2E_Wildfury_12_T$"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - XP: 1
            - Column:
                - Duration: Persistent
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
