# card: Lash Out
# top: COMMAND Attack 4 (no mark) on all adjacent enemies (the 1st edition Lash Out top's shape), XP 1.
# bottom: Move 3 [circle]; swap places with the Bear (the 1st edition Primal Blessing bottom's Swap: Self and the
# companion); Move 3 [circle].
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyAttack:
                            Attack: 4
                            Range: 1
                            Target: -1
                            StrengthIsBase: True
                            RangeIsBase: True
                            TargetIsBase: True
                            AnimOverload: RadialAttack
                            MultiPassAttack: False
                    ControlActorType: Player
                Target: -1
                Targeting: All
                Filter: Companion
                AnimOverload: Command
        XP: 1
    Bottom:
        Abilities:
            BMove1:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BSwap:
                Swap:
                    FirstTargetFilter: Self
                    SecondTargetFilter: Companion
                Targeting: All
                Target: -1
                AnimOverload: RadialBeneficial
            BMove2:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
Layout:
    Top:
        - Command: True
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAllyAttack*"
        - Row: "$Target_AllAdjacentEnemies$"
        - Row: "<size=50%> "
        - XP: 1
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove1* <size=100%><voffset=1>@BMove1@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Wildfury_26_B$"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove2* <size=100%><voffset=1>@BMove2@"
