# card: Divine Ascension
# top: "+4 Attack and advantage on all attacks of your next five melee attack abilities": Frosthaven's Crushing Weight
# shape (BuffAttack, AttackType Melee, BuffIfAttackIsMelee) with advantage and the whole ability counted once
# (EntireAction, the 1st edition's Angelic Ascension). "Gain Flying": the 1st edition's Winged Congregation (a
# persistent Move 0 with Fly) as a second bonus of the card; it ends when the card leaves the active area.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TActive:
                Attack: 0
                AttackEffect:
                    Type: BuffIfAttackIsMelee
                    Strength: 4
                AttackHasAdvantage: True
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffAttack
                    AttackType: Melee
                    EntireAction: True
                    XPTracker: [1,0,1,0,1]
                AnimOverload: PowerUp
            TFly:
                Move:
                    Amount: 0
                    Fly: True
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffMove
                AnimOverload: None
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 6
                    Enhancements: 1
                    Jump: True
Layout:
    Top:
        - Active:
            Ability: TActive
            Icon: "Positive_AttackPlus"
            ListLayout: "$GH2E_Sunkeeper2_29_T$"
            Layout: "$GH2E_Sunkeeper2_29_T$"
        - Row: "<size=50%> "
        - XPTracker: TActive
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$Jump$ <sprite name=Jump>"
