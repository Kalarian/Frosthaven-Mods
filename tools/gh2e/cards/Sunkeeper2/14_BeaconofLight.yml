# card: Beacon of Light
# top: "your next three single-target heals from your ability cards also target all allies within range 2 of the
# primary target": a persistent marker bonus with the three slots (Secret of the Oak's NullTargeting shape, MiscVars
# GH2E_HealSplash: 2); the plugin (GHSunkeeper2e) applies the heal to the allies around the primary target and moves
# the slot after each such heal.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TActive:
                NullTargeting: True
                Filter: Self
                MiscVars:
                    GH2E_HealSplash: 2
                ActiveBonus:
                    Duration: Persistent
                    XPTracker: [1,0,1]
                AnimOverload: PowerUp
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    SquareEnhancements: 1
            BNull:
                Null: True
        Consumes:
            BCLight:
                Elements: Light
                Abilities:
                    BCLightWard:
                        ParentName: BNull
                        Ward: True
                        Range: 2
                        Filter: Ally
                        AnimOverload: PositiveBuffTargeted
                XP: 1
Layout:
    Top:
        - Active:
            Ability: TActive
            Icon: "Positive_Heal"
            ListLayout: "$GH2E_Sunkeeper2_14_T$"
            Layout: "$GH2E_Sunkeeper2_14_T$"
        - Row: "<size=50%> "
        - XPTracker: TActive
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=20%> "
        - Consume:
            Name: BCLight
            Text: "$GH2E_Sunkeeper2_14_B$"
