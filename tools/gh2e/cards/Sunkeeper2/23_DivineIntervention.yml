# card: Divine Intervention
# top: the 1st edition card's damage redirect (PreventAndApplyToActiveBonusCaster, optional per hit).
# bottom consume: "enemies' positive and 2x modifier cards count as +0 this round": Frosthaven's Iron Helmet rewrite
# (ChangeAttackModifier, Behaviour AdjustWhenAttacked: a drawn modifier is replaced when the holder is the attack's
# target) with +1, +2 and 2x -> +0, for the round, on you and every ally (Targeting All): every enemy attack on your side.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TPrevent:
                PreventDamage: 1
                Filter: [Self]
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: PreventAndApplyToActiveBonusCaster
                    IsAura: True
                    AuraFilter: [Ally]
                    AuraTargeting: All
                    ToggleIsOptional: True
                AnimOverload: PowerUp
        XP: 2
    Bottom:
        Abilities:
            BShield:
                Shield: 1
                Range: 3
                Target: -1
                Filter: [Self, Ally]
                ActiveBonusDuration: Round
                AnimOverload: PowerUpShield
            BNull:
                Null: True
        Consumes:
            BCLight:
                Elements: Light
                Abilities:
                    BCLightAdjust:
                        ParentName: BNull
                        ChangeAttackModifier:
                        ReplaceModifiers: ["+1", "+2", "*2"]
                        ReplaceWithModifier: "+0"
                        Target: -1
                        Targeting: All
                        Filter: [Self, Ally]
                        ActiveBonus:
                            Duration: Round
                            Behaviour: AdjustWhenAttacked
                        AnimOverload: PositiveBuffRadial
                XP: 1
Layout:
    Top:
        - Active:
            Ability: TPrevent
            Icon: "Immune"
            ListLayout: "$GH2E_Sunkeeper2_23_T$"
            Layout: "$GH2E_Sunkeeper2_23_T$"
        - Row: "<size=50%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - XP: 2
            - Column:
                - Duration: Persistent
    Bottom:
        - Row: "$GH2E_Sunkeeper2_23_B$"
        - Row: "<size=20%> "
        - Active:
            Ability: BShield
            Icon: "Shield"
            ListLayout: "$Shield$ <sprite name=Shield> *BShield*"
            Layout:
                - Row: "<b><size=130%>$Shield$ <sprite name=Shield> *BShield*"
        - Row: "<size=20%> "
        - Consume:
            Name: BCLight
            Text: "$GH2E_Sunkeeper2_23_B2$"
        - Row: "<size=50%> "
        - Duration: Round
