# card: Bright Aegis
# bottom consume: "that ally may immediately play up to two cards, at most one top and one bottom action": the 1st
# edition's verified extra turn (Unwavering Mandate, ExtraTurn: BothActions) on the adjacent ally who recovered the card
# (TargetTargetedByCasterPreviousAbility + SpecificAbilityNames [BRecover]).
Discard: [Discard,Permanently Lost]
Data:
    Top:
        Abilities:
            TShield:
                Shield:
                    Amount: 2
                    Enhancements: 1
                ActiveBonusDuration: Round
                AnimOverload: PowerUp
            TRetaliate:
                Retaliate:
                    Amount: 1
                    Enhancements: 1
                ActiveBonusDuration: Round
                AnimOverload: PowerUp
        Infuse: Light
    Bottom:
        Abilities:
            BRecover:
                RecoverLostCards: 1
                Range: 1
                Filter:
                    TargetType: Ally
                    ActorType: Player
                AnimOverload: PositiveBuffTargeted
            BNull:
                Null: True
        Consumes:
            BCLight:
                Elements: Light
                Abilities:
                    BCLightExtraTurn:
                        ParentName: BNull
                        ExtraTurn: BothActions
                        Range: 1
                        PreviewEffectId: Sunkeeper
                        PreviewEffectText: FHS_GH2E_Sunkeeper2_25_B
                        Filter:
                            TargetType: Ally
                            ActorType: Player
                            # "that ally": the one who recovered the lost card
                            TargetTargetedByCasterPreviousAbility: True
                            SpecificAbilityNames: [BRecover]
                XP: 1
        XP: 2
Layout:
    Top:
        - Active:
            Ability: TShield
            Icon: Shield
            ListLayout: "$Shield$ <sprite name=Shield> *TShield*"
            Layout:
                - Row: "<b><size=130%>$Shield$ <sprite name=Shield> *TShield* <size=100%><voffset=1>@TShield@"
        - Row: "<size=50%> "
        - Active:
            Ability: TRetaliate
            Icon: Retaliate
            ListLayout: "$Retaliate$ <sprite name=Retaliate> *TRetaliate*"
            Layout:
                - Row: "<b><size=130%>$Retaliate$ <sprite name=Retaliate> *TRetaliate* <size=100%><voffset=1>@TRetaliate@"
        - Row: "<size=50%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - MandatoryTrigger:
                    Layout:
                        - Infuse: Light
            - Column:
                - Duration: Round
    Bottom:
        - Row: "$GH2E_Sunkeeper2_07_T$"
        - Row: "<size=20%> "
        - Consume:
            Name: BCLight
            Text: "$GH2E_Sunkeeper2_25_B$"
        - Row: "<size=50%> "
        - XP: 2
