# card: Arresting March
# top consume: "Heal 3, target the target of the grant ability": a heal of its own within the grant's range 3 on one
# ally (the player picks the granted ally).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            # the consume's heal comes first: hung after the grant (ControlActor), switching Light on stopped the game
            # (CardsActionControlller.RefreshConsumeBar NullReference, "StackedAugmentToNullAbility", 2e rerun 2026-11-01 12:34)
            TNull:
                Null: True
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyAttack:
                            Attack:
                                Amount: 3
                                SquareEnhancements: 1
                            Conditions: Stun
                            StrengthIsBase: True
                            RangeIsBase: True
                Range: 3
                Filter: Ally
                AnimOverload: ControlAlly
        Consumes:
            TCLight:
                Elements: Light
                Abilities:
                    TCLightHeal:
                        ParentName: TNull
                        Heal: 3
                        Range: 3
                        Filter: Ally
                        AnimOverload: Heal
                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
            BAlly:
                ControlActor:
                    Abilities:
                        BAllyMove:
                            Move:
                                Amount: 3
                                Enhancements: 1
                            StrengthIsBase: True
                Range: 3
                Filter: Ally
                AnimOverload: ControlAlly
Layout:
    Top:
        - Row: "$GH2E_Sunkeeper2_21_T$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAllyAttack* <size=100%><voffset=1>@TAllyAttack@"
        - Row: "$Stun$ <sprite name=Stun>"
        - Row: "<size=20%> "
        - Consume:
            Name: TCLight
            Text: "$GH2E_Sunkeeper2_21_T2$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Sunkeeper2_21_T$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BAllyMove* <size=100%><voffset=1>@BAllyMove@"
