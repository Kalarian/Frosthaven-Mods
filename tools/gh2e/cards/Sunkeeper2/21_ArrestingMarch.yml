# card: Arresting March
# top consume: "Heal 3, target the target of the grant ability": after the grant, aimed at the granted ally
# (TargetTargetedByCasterPreviousAbility + SpecificAbilityNames [TAlly], Soultether Divided Mind's filter).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyAttack:
                            Attack:
                                Amount: 3
                                SquareEnhancements: 1
                            Conditions: Stun
                            StrengthIsBase: True
                            RangeIsBase: True
                Range: 3
                Filter: Ally
                AnimOverload: ControlAlly
            # the consume's heal after the grant, as printed ("target the target of the grant ability"); the crash this
            # order caused on 2026-11-01 (RefreshConsumeBar NullReference) is what the plugin's GHConsumeOnNull guards
            TNull:
                Null: True
        Consumes:
            TCLight:
                Elements: Light
                Abilities:
                    TCLightHeal:
                        ParentName: TNull
                        Heal: 3
                        Range: 3
                        Filter:
                            TargetType: Ally
                            TargetTargetedByCasterPreviousAbility: True
                            SpecificAbilityNames: [TAlly]
                        AnimOverload: Heal
                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
            BAlly:
                ControlActor:
                    Abilities:
                        BAllyMove:
                            Move:
                                Amount: 3
                                Enhancements: 1
                            StrengthIsBase: True
                Range: 3
                Filter: Ally
                AnimOverload: ControlAlly
Layout:
    Top:
        - Row: "$GH2E_Sunkeeper2_21_T$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAllyAttack* <size=100%><voffset=1>@TAllyAttack@"
        - Row: "$Stun$ <sprite name=Stun>"
        - Row: "<size=20%> "
        - Consume:
            Name: TCLight
            Text: "$GH2E_Sunkeeper2_21_T2$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Sunkeeper2_21_T$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BAllyMove* <size=100%><voffset=1>@BAllyMove@"
