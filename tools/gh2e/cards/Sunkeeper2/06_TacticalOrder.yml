# card: Tactical Order
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyMove:
                            Move:
                                Amount: 4
                                Enhancements: 1
                            StrengthIsBase: True
                Range: 3
                Filter: Ally
                AnimOverload: ControlAlly
    Bottom:
        Abilities:
            BMove:
                Move: 3
        Consumes:
            BCLight:
                Elements: Light
                AbilityOverrides:
                    BCLightMoveBuff:
                        ParentName: BMove
                        Strength: 2
                XP: 1
Layout:
    Top:
        - Row: "$GH2E_Sunkeeper2_06_T$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *TAllyMove* <size=100%><voffset=1>@TAllyMove@"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove*"
        - Row: "<size=20%> "
        - Consume:
            Name: BCLight
            Text: "+2 $Move$ <sprite name=Move>, <sprite name=XP1>"
