# card: Burning Flash
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 4
                    Enhancements: 1
                Range: 1
                Target: -1
                XPPerTarget: 1
                MultiPassAttack: False
                AnimOverload: RadialSmite
        Consumes:
            TCLight:
                Elements: Light
                AbilityOverrides:
                    TCLightAttackBuff:
                        ParentName: TAttack
                        Strength: 1
                        AttackHasAdvantage: True
                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    Enhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Target_AllAdjacentEnemies$"
        - Row: "<size=20%> "
        - Consume:
            Name: TCLight
            Text: "+1 $Attack$ <sprite name=Attack>, $Advantage$, <sprite name=XP1>"
        - Row: "<size=20%> "
        - Row: "$XP_PerEnemy$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
