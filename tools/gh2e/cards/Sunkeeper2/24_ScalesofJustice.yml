# card: Scales of Justice
# bottom: "whenever you consume Light during one of your attack abilities, +1 Attack, Pierce 1 on all its attacks, and
# null modifier cards count as 2x". The 1st edition's Weapon of Purity shape: a persistent attack bonus the player
# toggles on an attack, which consumes Light for it (Consuming: Light). A Light consumed by the attack card's own
# consume can't also pay for the toggle, and the null-as-2x rule has no Frosthaven ability: NEEDS PLUGIN.
Discard: [Lost,Lost]
Data:
    Top:
        Abilities:
            TRetaliate:
                Retaliate: 2
                Filter: Self
                ActiveBonusDuration: Persistent
                AnimOverload: PowerUp
        XP: 2
