# card: From the Brink
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TCleanse:
                RemoveConditions: "All"
                Conditions: [Wound,Brittle,Bane,Poison,Immobilize,Disarm,Impair,Stun,Muddle,StopFlying]
                IgnoreStun: True
                Filter: Self
                AnimOverload: PowerUp
            TRecover:
                RecoverLostCards: 1
                Filter: Self
                CanSkip: True
                AnimOverload: PowerUp
                StartAbilityRequirements:
                    Type: ThisAbility
                    HP: "== 1"
            # set the hit points to half the maximum (rounded up): not damage, not a heal (plugin GHBerserker2e, GH2E_SetHPHalf,
            # at the end of this ability), then Strengthen
            TStrengthen:
                Strengthen: True
                Filter: Self
                AnimOverload: PowerUp
                MiscVars:
                    GH2E_SetHPHalf: True
        Infuse: Fire
        XP: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    SquareEnhancements: 1
            BPull:
                Pull:
                    Amount: 1
                    Enhancements: 1
                Range:
                    Amount: 2
                    Enhancements: 1
                Target: 1
                Filter: Enemy
Layout:
    Top:
        - Row: "$GH2E_Berserker2_10_T$"
        - Row: "<size=20%> "
        - Row: "$GH2E_Berserker2_10_T2$"
        - Row: "<size=50%> "
        - Infuse: Fire
        - XP: 2
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Pull$ <sprite name=Pull> *BPull* <size=100%><voffset=1>@BPull@"
        - Row: "$Range$ <sprite name=Range> *BPull.Range* @BPull.Range@"
