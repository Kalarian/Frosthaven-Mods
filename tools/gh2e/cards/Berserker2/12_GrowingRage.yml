# card: Growing Rage
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            # a persistent marker: after each of your retaliates the plugin (GHRetaliate2e, GH2E_GrowingRage) performs Heal 1,
            # self, and repeats it once if you are then at half your maximum or less
            TActive:
                NullTargeting: True
                Filter: Self
                AnimOverload: PowerUp
                MiscVars:
                    GH2E_GrowingRage: True
                ActiveBonus:
                    Duration: Persistent
        XP: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    SquareEnhancements: 1
            BAttack:
                Attack:
                    Amount: 2
                    SquareEnhancements: 1
                StartAbilityRequirements:
                    Type: ThisAbility
                    HPPercentOfMax: "<= 50%"
                    XP: 1
Layout:
    Top:
        - Active:
            Ability: TActive
            ListLayout: "$GH2E_Berserker2_12_T$"
            Layout: "$GH2E_Berserker2_12_T$"
            Icon: Positive_HealSelf_Damage
        - Row: "<size=50%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - XP: 2
            - Column:
                - Duration: Persistent
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Berserker2_12_B$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
