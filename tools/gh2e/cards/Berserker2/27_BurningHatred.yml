# card: Burning Hatred
Discard: [Discard,Permanently Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 2
                Range: 1
                Target: -1
                MultiPassAttack: False
                TreatAsMelee: True
                AnimOverload: RangedRadial
        Consumes:
            TCFire:
                Elements: Fire
                AbilityOverrides:
                    TCFireRangeBuff:
                        ParentName: TAttack
                        Range: 1
            TCDamage:
                CostAbility:
                    ParentName: TAttack
                    Damage: 2
                    Filter: Self
                AbilityOverrides:
                    TCAttackBuff:
                        ParentName: TAttack
                        Strength: 1
                XP: 1
    Bottom:
        # "You may perform this action any number of times in succession, increasing the damage suffered by 1 each time":
        # after the attack the plugin (GHBerserker2e) asks; yes repeats suffer damage N+1 (cannot be negated), Move 1,
        # Attack 2, with no cap. GH2E_CannotPrevent: no prevent bonus or lost card negates the damage.
        Abilities:
            BDamage:
                Damage: 1
                Filter: Self
                CanSkip: False
                MiscVars:
                    GH2E_CannotPrevent: True
            BMove:
                Move: 1
            BAttack:
                Attack: 2
        XP: 2
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack*"
        - Row: "$Target_AllAdjacentEnemies$"
        - Row: "<size=20%> "
        - Consume:
            Name: TCFire
            Text: "$Target_TwoHexInstead$"
        - Row: "<size=20%> "
        - Consume:
            Name: TCDamage
            Text: "$GH2E_Berserker2_27_T$"
    Bottom:
        - Row: "$GH2E_Berserker2_27_B$"
        - Row: "$GH2E_Berserker2_27_B2$"
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove*"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack*"
        - Row: "<size=20%> "
        - XP: 2
