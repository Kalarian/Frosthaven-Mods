# card: Into the Fight
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 2
                Range: 3
                Target: 2
                AnimOverload: RangedAttack
                SubAbilities:
                    TAttackSubPull:
                        Pull: 2
                        IsInlineSubAbility: True
                ConditionalOverrides:
                    TAttackCO:
                        XP: 1
                        Requirements:
                            HPPercentOfMax: "<= 50%"
                        AbilityOverrides:
                            TAttackLowHP:
                                Conditions: Muddle
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
            BNull:
                Null: True
        Consumes:
            BCDamage:
                CostAbility:
                    ParentName: BNull
                    Damage: 2
                    Filter: Self
                Infuse: Fire
                Abilities:
                    BCDamageStun:
                        ParentName: BNull
                        Stun: True
                        Range: 1
                        Target: 1
                        Filter: Enemy
                        AnimOverload: AdjacentShove
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack*"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$Target$ <sprite name=Target> *TAttack.Target*"
        - Row: "$Pull$ <sprite name=Pull> 2"
        - Row: "<size=20%> "
        - Row: "$GH2E_Berserker2_14_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Consume:
            Name: BCDamage
            Text: "$GH2E_Berserker2_14_B$"
