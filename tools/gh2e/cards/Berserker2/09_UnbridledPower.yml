# card: Unbridled Power
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
                TreatAsMelee: True
                SubAbilities:
                    TAttackSubPush:
                        Push:
                            Amount: 2
                            Enhancements: 1
                        AnimOverload: None
                        IsInlineSubAbility: True
        Consumes:
            TCFire:
                Elements: Fire
                AbilityOverrides:
                    TCFireBuff:
                        ParentName: TAttack
                        Range: 1
                        Strength: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
            BRetaliate:
                Retaliate: 1
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Round
                    ProcXP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Push$ <sprite name=Push> *TAttackSubPush* @TAttackSubPush@"
        - Row: "<size=20%> "
        - Consume:
            Name: TCFire
            Text: "$GH2E_Berserker2_09_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Active:
            Ability: BRetaliate
            Icon: Positive_XP_Retaliate
            ListLayout: "$Retaliate$ <sprite name=Retaliate> *BRetaliate*, $GH2E_Berserker2_05_T$"
            Layout:
                - Row: "<b><size=130%>$Retaliate$ <sprite name=Retaliate> *BRetaliate*"
                - Row: "<size=20%> "
                - Row: "$GH2E_Berserker2_05_T$"
        - Row: "<size=50%> "
        - Duration: Round
