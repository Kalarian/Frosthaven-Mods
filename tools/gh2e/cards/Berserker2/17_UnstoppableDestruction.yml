# card: Unstoppable Destruction
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 5
                    Enhancements: 1
                AnimOverload: HeavyAttack
        Consumes:
            TCFire:
                Elements: Fire
                AbilityOverrides:
                    TCFireSplash:
                        ParentName: TAttack
                        SubAbilities:
                            TAttackSubDamage:
                                Damage: 2
                                AllTargetsAdjacentToParentTargets: True
                                TreatAsNonSubAbility: True
                                Range: 1
                                Target: -1
                                CanSkip: False
                                Filter:
                                    TargetType: Enemy
                                    Vars:
                                        ValidateNotAdjacentToYou: target.GetDistanceTo(self) > 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
                Jump: True
            BHeal:
                Heal:
                    Amount: 2
                    Enhancements: 1
                Filter: Self
                AnimOverload: Heal
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=20%> "
        - Consume:
            Name: TCFire
            Text: "$GH2E_Berserker2_17_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$Jump$ <sprite name=Jump>"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *BHeal* <size=100%><voffset=1>@BHeal@"
