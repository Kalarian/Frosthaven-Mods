# card: Fueled by Pain
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 4
                    Enhancements: 1
        Consumes:
            TCFire:
                Elements: Fire
                AbilityOverrides:
                    TCFireHealOverride:
                        ParentName: TAttack
                        SubAbilities:
                            TAttackSubHeal:
                                Heal: 0
                                Filter: Self
                                AnimOverload: Heal
                                StatIsBasedOnX:
                                    Strength:
                                        BasedOn: DamageInflictedByParent
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
                Jump: True
            BAttack:
                Attack: 3
                AllTargetsOnMovePath: True
                Targeting: All
                Target: -1
                Filter:
                    TargetType: Enemy
                    TargetHasNegativeCondition: Wound
        Consumes:
            BCDamage:
                CostAbility:
                    ParentName: BMove
                    Damage: 2
                    Filter: Self
                AbilityOverrides:
                    BCMoveBuff:
                        ParentName: BMove
                        Strength: 2
                XP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=20%> "
        - Consume:
            Name: TCFire
            Text: "$GH2E_Berserker2_24_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$Jump$ <sprite name=Jump>"
        - Row: "<size=20%> "
        - Consume:
            Name: BCDamage
            Text: "$GH2E_Berserker2_24_B$"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack*"
        - Row: "$GH2E_Berserker2_24_B2$"
