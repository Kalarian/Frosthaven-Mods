# card: Bone Breaker
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 5
                    Enhancements: 1
                Conditions: [Wound, Immobilize]
                AnimOverload: HeavyAttack
                ConditionalOverrides:
                    TAttackCO:
                        Self: True
                        XP: 1
                        Requirements:
                            HPPercentOfMax: "<= 50%"
                        AbilityOverrides:
                            TAttackLowHP:
                                SubAbilities:
                                    TAttackSubPush:
                                        Push: 2
                                        IsInlineSubAbility: True
                                        AnimOverload: None
        Infuse: Fire
    Bottom:
        Abilities:
            BAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
                Range: 4
                AnimOverload: RangedAttack
            # persistent: the Berserker's token on the target (plugin GHBerserker2e: the Berserker2Token resource and
            # StopFlying on it while this marker is active; both removed when the card leaves the active area)
            BToken:
                NullTargeting: True
                Filter: Self
                AnimOverload: None
                MiscVars:
                    GH2E_BoneBreaker: True
                ActiveBonus:
                    Duration: Persistent
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Wound$ <sprite name=Wound>"
        - Row: "$Immobilize$ <sprite name=Immobilize>"
        - Row: "<size=20%> "
        - Row: "$GH2E_Berserker2_25_T$"
        - Row: "<size=50%> "
        - Infuse: Fire
    Bottom:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "$Range$ <sprite name=Range> *BAttack.Range*"
        - Active:
            Ability: BToken
            Icon: Doom
            ListLayout: "$GH2E_Berserker2_25_B$"
            Layout: "$GH2E_Berserker2_25_B$"
        - Row: "<size=50%> "
        - Duration: Persistent
