# card: Cauterize
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 1
                Range: 3
                Conditions: Wound
                AnimOverload: RangedAttack
                ConditionalOverrides:
                    TAttackCO:
                        Self: True
                        XP: 1
                        Requirements:
                            HPPercentOfMax: "<= 50%"
                        AbilityOverrides:
                            TAttackLowHP:
                                Target: 1
        Infuse: Fire
    Bottom:
        Abilities:
            BNull:
                Null: True
            BMove:
                Move:
                    Amount: 3
                    SquareEnhancements: 1
        Consumes:
            BCDamage:
                CostAbility:
                    ParentName: BNull
                    Damage: 2
                    Filter: Self
                Abilities:
                    BCDamageWound:
                        ParentName: BNull
                        Wound: True
                        Conditions: [Immobilize]
                        Range: 1
                        Target: 1
                        Filter: Enemy
                        AnimOverload: AdjacentShove
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack*"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$Wound$ <sprite name=Wound>"
        - Row: "<size=20%> "
        - Row: "$GH2E_Berserker2_07_T$"
        - Row: "<size=50%> "
        - Infuse: Fire
    Bottom:
        - Consume:
            Name: BCDamage
            Text: "$GH2E_Berserker2_07_B$"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
