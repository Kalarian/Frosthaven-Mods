# card: Seeing Red
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
            TAttack2:
                Attack:
                    Amount: 2
                    Enhancements: 1
                AnimOverload: MeleeAttackAlt
                StartAbilityRequirements:
                    Type: ThisAbility
                    HPPercentOfMax: "<= 50%"
                    XP: 1
        Consumes:
            TCDamage:
                CostAbility:
                    ParentName: TAttack
                    Damage: 2
                    Filter: Self
                AbilityOverrides:
                    TCAttackBuff:
                        ParentName: TAttack
                        Strength: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    Enhancements: 1
            BAttack:
                Attack:
                    Amount: 2
                    Enhancements: 1
                Target: 2
                TreatAsMelee: True
        Consumes:
            BCFire:
                Elements: Fire
                AbilityOverrides:
                    BCFireRangeBuff:
                        ParentName: BAttack
                        Range: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=20%> "
        - Consume:
            Name: TCDamage
            Text: "$GH2E_Berserker2_19_T$"
        - Row: "<size=50%> "
        - Row: "$GH2E_Berserker2_19_T2$"
        - Row: "<size=20%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack2* <size=100%><voffset=1>@TAttack2@"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "$Target$ <sprite name=Target> *BAttack.Target*"
        - Row: "<size=20%> "
        - Consume:
            Name: BCFire
            Text: "$GH2E_Berserker2_19_B$"
