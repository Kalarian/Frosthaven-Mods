# card: Shaping the Ether
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    CircleEnhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                AnimOverload: TargetFloorMulti
        Consumes:
            TCFire:
                Elements: Fire
                AbilityOverrides:
                    TCFireWound:
                        ParentName: TAttack
                        Conditions: Wound
            TCIce:
                Elements: Ice
                AbilityOverrides:
                    TCIceImmobilize:
                        ParentName: TAttack
                        Conditions: Immobilize
            TCAir:
                Elements: Air
                AbilityOverrides:
                    TCAirPush:
                        ParentName: TAttack
                        SubAbilities:
                            TCAttackSubPush:
                                Push: 3
                                AnimOverload: None
                                IsInlineSubAbility: True
            TCEarth:
                Elements: Earth
                AbilityOverrides:
                    TCEarthPoison:
                        ParentName: TAttack
                        Conditions: Poison
            TCTwo:
                AbilityOverrides:
                    TCTwoTarget:
                        ParentName: TAttack
                        Target: 1
                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "<size=20%> "
        - Consume:
            Name: TCFire
            Text: "$Wound$ <sprite name=Wound>"
        - Consume:
            Name: TCIce
            Text: "$Immobilize$ <sprite name=Immobilize>"
        - Consume:
            Name: TCAir
            Text: "$Push$ <sprite name=Push> 3"
        - Consume:
            Name: TCEarth
            Text: "$Poison$ <sprite name=Poison>"
        - Consume:
            Name: TCTwo
            Text: "$GH2E_Elementalist2_TWO_TARGET$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
