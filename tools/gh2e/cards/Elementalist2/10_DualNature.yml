# card: Dual Nature
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    Enhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                AnimOverload: TargetFloorObsidian
            TCEarth:
                Consume:
                    Elements: Earth
                    Abilities:
                        TCEarthHeal:
                            Heal: 2
                            Range: 3
                            Filter: [Self, Ally]
                            AnimOverload: Heal
                        TCEarthInfuse:
                            Infuse: [Earth]
                            CanUndo: False
                            CanSkip: False
                            SkipAnim: True
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    SquareEnhancements: 1
                ConditionalOverrides:
                    BMoveCO:
                        Requirements:
                            Vars:
                                ValidateElementStrongOrWaning: ElementInfusionBoardManager.GetAvailableElements().Count > 0
                        AbilityOverrides:
                            BMoveBuff:
                                Strength: 1
        Infuse: Ice
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "<size=50%> "
        - Row: "$GH2E_Elementalist2_10_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$GH2E_Elementalist2_MOVE_IF_ELEMENT$"
        - Row: "<size=20%> "
        - Infuse: Ice
