# card: Duskstorm
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    Enhancements: 1
                Range: 4
                AreaEffect: "1,1,R|3,1,E|0,0,R|2,0,R"
                MultiPassAttack: False
                AnimOverload: AreaHexFireIce
        Consumes:
            TCDark:
                Elements: Dark
                AbilityOverrides:
                    TCDarkInvisible:
                        ParentName: TAttack
                        SubAbilities:
                            TAllyInvisible:
                                Invisible: True
                                AutoTrigger: True
                                TreatAsNonSubAbility: True
                                Filter: [Ally]
                                Target: -1
                                Targeting: Custom
                                TargetingVars:
                                    AddTilesInRange: CustomAbility.ActorsOnRedHexes(ParentAbility, false).Select(Tile)
                                    AddValidActorsInRange: CustomAbility.ActorsOnRedHexes(ParentAbility, false)
                            TDarkInfuse:
                                Infuse: [Fire, Ice]
                                ShowElementPicker: True
                                TreatAsNonSubAbility: True
                                CanUndo: False
                                SkipAnim: True
            TCFire:
                Elements: Fire
                ConsumeOnlyOneElement: True
                AbilityOverrides:
                    TCFireBuff:
                        ParentName: TAttack
                        Strength: 1
                        Conditions: Wound
            TCIce:
                Elements: Ice
                ConsumeOnlyOneElement: True
                AbilityOverrides:
                    TCIceBuff:
                        ParentName: TAttack
                        Strength: 1
                        Conditions: Wound
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
            BInfuse:
                Infuse: [Fire, Air]
                ShowElementPicker: True
                CanUndo: False
                CanSkip: False
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateActionHasHappened: CustomAbility.HasPerformedAction(Ability)
Layout:
    Top:
        - ColumnWidths: "65,35"
        - Column:
            - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
            - Row: "<size=20%> "
            - Consume:
                Name: TCDark
                Text: "$GH2E_Elementalist2_23_T$"
            - Consume:
                Name: TCFire
                Text: "+1 $Attack$ <sprite name=Attack>, $Wound$ <sprite name=Wound>"
            - Consume:
                Name: TCIce
                Text: "+1 $Attack$ <sprite name=Attack>, $Wound$ <sprite name=Wound>"
        - Column:
            - Row: "£Area£"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=20%> "
        - Row: "<sprite name=CreateMixed-FA>"
