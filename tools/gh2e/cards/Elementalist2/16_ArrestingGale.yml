# card: Arresting Gale
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 1
                    SquareEnhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                Conditions: Stun
                AnimOverload: AreaHexWind
        Infuse: Air
    Bottom:
        Abilities:
            BWard:
                Ward:
                    CircleEnhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                Filter: [Self, Ally]
                AnimOverload: TargetedBuff
        Consumes:
            BCEarth:
                Elements: Earth
                Infuse: [Earth]
                AbilityOverrides:
                    BCEarthTarget:
                        ParentName: BWard
                        Target: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "$Stun$ <sprite name=Stun>"
        - Row: "<size=20%> "
        - Infuse: Air
    Bottom:
        - Row: "<b><size=130%>$Ward$ <sprite name=Ward> <size=100%><voffset=1>@BWard@"
        - Row: "$Range$ <sprite name=Range> *BWard.Range* @BWard.Range@"
        - Row: "<size=20%> "
        - Consume:
            Name: BCEarth
            Text: "+1 $Target$ <sprite name=Target>, <sprite name=CreateEarth>"
