# card: Stoking Hail
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    Enhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                AnimOverload: TargetFloorIce
        Consumes:
            TCIce:
                Elements: Ice
                Infuse: [Ice]
                AbilityOverrides:
                    TCIceBuff:
                        ParentName: TAttack
                        Strength: 1
                        Pierce: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    SquareEnhancements: 1
                ConditionalOverrides:
                    BMoveCO:
                        Requirements:
                            Vars:
                                ValidateElementStrongOrWaning: ElementInfusionBoardManager.GetAvailableElements().Count > 0
                        AbilityOverrides:
                            BMoveBuff:
                                Strength: 1
        Infuse: Air
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "<size=20%> "
        - Consume:
            Name: TCIce
            Text: "+1 $Attack$ <sprite name=Attack>, $Pierce$ <sprite name=Pierce> 2, <sprite name=CreateIce>"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$GH2E_Elementalist2_MOVE_IF_ELEMENT$"
        - Row: "<size=20%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Air
