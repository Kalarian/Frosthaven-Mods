# card: Burial
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 4
                    Enhancements: 1
                Range: 4
                AreaEffect: "0,2,R|1,1,R|3,1,R|0,0,R"
                MultiPassAttack: False
                AnimOverload: AreaHexEarth
        Consumes:
            TCEarth:
                Elements: Earth
                AbilityOverrides:
                    TCEarthAttackBuff:
                        ParentName: TAttack
                        Strength: 1
                        Conditions: Immobilize
                XP: 1
            TCDark:
                Elements: Dark
                AbilityOverrides:
                    TCDarkAttackBuff:
                        ParentName: TAttack
                        Strength: 1
                        Conditions: Curse
                XP: 1
    Bottom:
        Abilities:
            BAttack:
                Attack:
                    Amount: 2
                    SquareEnhancements: 1
                Range: 4
                AnimOverload: TargetFloorObsidian
        Infuse: Dark
Layout:
    Top:
        - ColumnWidths: "65,35"
        - Column:
            - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
            - Row: "<size=20%> "
            - Consume:
                Name: TCEarth
                Text: "+1 $Attack$ <sprite name=Attack>, $Immobilize$ <sprite name=Immobilize>, <sprite name=XP1>"
            - Consume:
                Name: TCDark
                Text: "+1 $Attack$ <sprite name=Attack>, $Curse$ <sprite name=Curse>, <sprite name=XP1>"
        - Column:
            - Row: "£Area£"
    Bottom:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "$Range$ <sprite name=Range> *BAttack.Range*"
        - Row: "<size=20%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Dark
