                    Ability: TSummon
                    SummonName: $GH2E_SUMMON_ChromaticConstruct$
        - Row: "$GH2E_Elementalist2_24_T$"
        - Row: "<size=20%> "
        - Duration: Persistent
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=20%> "
        - Row: "<sprite name=CreateMixed-IA>"
