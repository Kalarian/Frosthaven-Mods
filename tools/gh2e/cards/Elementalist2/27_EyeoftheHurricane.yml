# card: Eye of the Hurricane
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            THeal:
                Heal: 2
                Range: 4
                Filter: [Self, Ally]
                AnimOverload: Heal
        Consumes:
            TCFire:
                Elements: Fire
                AbilityOverrides:
                    TCFireStrengthen:
                        ParentName: THeal
                        Conditions: Strengthen
                XP: 1
            TCIce:
                Elements: Ice
                AbilityOverrides:
                    TCIceAttack:
                        ParentName: THeal
                        SubAbilities:
                            THealAdjacentAttack:
                                Attack: 2
                                Range: 1
                                Target: -1
                                Filter: Enemy
                                Conditions: Muddle
                                AllTargetsAdjacentToParentTargets: True
                                TreatAsNonSubAbility: True
                                AnimOverload: RadialHexWind
                XP: 1
            TCAir:
                Elements: Air
                AbilityOverrides:
                    TCAirAttack:
                        ParentName: THeal
                        SubAbilities:
                            THealRingAttack:
                                Attack: 1
                                Pierce: 3
                                Target: -1
                                Filter: Enemy
                                TreatAsNonSubAbility: True
                                Targeting: Custom
                                TargetingVars:
                                    HealTarget: ParentAbility.ActorsToTarget[0]
                                    NearEnemies: GameState.GetAllEnemiesInRange(HealTarget, HealTarget.ArrayIndex, 1)
                                    AddValidActorsInRange: GameState.GetAllEnemiesInRange(HealTarget, HealTarget.ArrayIndex, 2).Where(NearEnemies.Contains(obj) == False)
                                    AddTilesInRange: AddValidActorsInRange.Select(Tile)
                                AnimOverload: RadialHexWind
                XP: 1
    Bottom:
        Abilities:
            BAttack:
                Attack: 2
                Range: 3
                AnimOverload: TargetFloorMulti
        Consumes:
            BCFire:
                Elements: Fire
                Infuse: [Fire]
                AbilityOverrides:
                    BCFireWound:
                        ParentName: BAttack
                        Conditions: Wound
            BCAir:
                Elements: Air
                Infuse: [Air]
                AbilityOverrides:
                    BCAirRange:
                        ParentName: BAttack
                        Range: 3
            BCEarth:
                Elements: Earth
                Infuse: [Earth]
                AbilityOverrides:
                    BCEarthPoison:
                        ParentName: BAttack
                        Conditions: Poison
            BCTwo:
                Infuse: [Dark]
                AbilityOverrides:
                    BCTwoAttack:
                        ParentName: BAttack
                        Strength: 1
                XP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal*"
        - Row: "$Range$ <sprite name=Range> *THeal.Range*"
        - Row: "<size=20%> "
        - Consume:
            Name: TCFire
            Text: "$Strengthen$ <sprite name=Strengthen>, <sprite name=XP1>"
        - Consume:
            Name: TCIce
            Text: "$GH2E_Elementalist2_27_T$"
        - Consume:
            Name: TCAir
            Text: "$GH2E_Elementalist2_27_T2$"
    Bottom:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack*"
        - Row: "$Range$ <sprite name=Range> *BAttack.Range*"
        - Row: "<size=20%> "
        - Consume:
            Name: BCFire
            Text: "$Wound$ <sprite name=Wound>, <sprite name=CreateFire>"
        - Consume:
            Name: BCAir
            Text: "+3 $Range$ <sprite name=Range>, <sprite name=CreateAir>"
        - Consume:
            Name: BCEarth
            Text: "$Poison$ <sprite name=Poison>, <sprite name=CreateEarth>"
        - Consume:
            Name: BCTwo
            Text: "$GH2E_Elementalist2_27_B$"
