# card: Stiletto Storm
# corrected against tools/gh2e/sheets/SilentKnife.json
# top: the second attack only if every target of the first was isolated: a requirement on the previous ability that
# counts its targets that were NOT isolated (RequirementActorFilter) and wants none (CAbilityRequirements
# ActorsTargetedByAbility), only after the first attack happened. Neither Attack 2 value has a mark.
# bottom: the Attack 3 mark is a square (SquareEnhancements written directly).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 2
                Target:
                    Amount: 2
                    Enhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                AnimOverload: RangedAttackThrowingKnives
            TAttack2:
                Attack: 2
                Target:
                    Amount: 2
                    Enhancements: 1
                Range:
                    Amount: 3
                    Enhancements: 1
                AnimOverload: RangedAttackThrowingKnives
                StartAbilityRequirements:
                    Type: PreviousAbility
                    AbilityHasHappened: True
                    ActorsTargetedByAbility: "== 0"
                    RequirementActorFilter:
                        TargetType: Enemy
                        TargetAdjacentAlliesOfTarget: "> 0"
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
            BAttack:
                Attack:
                    Amount: 3
                    SquareEnhancements: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack*"
        - Row: "$Target$ <sprite name=Target> *TAttack.Target* @TAttack.Target@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range* @TAttack.Range@"
        - Row: "<size=50%> "
        - Row: "$GH2E_SilentKnife_23_T$"
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack2*"
        - Row: "$Target$ <sprite name=Target> *TAttack2.Target* @TAttack2.Target@"
        - Row: "$Range$ <sprite name=Range> *TAttack2.Range* @TAttack2.Range@"
        - Row: "<size=50%> "
        - XP: 1
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
