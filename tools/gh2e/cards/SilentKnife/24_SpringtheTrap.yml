# card: Spring the Trap
# corrected against tools/gh2e/sheets/SilentKnife.json
# top: Frosthaven's Blinkblade Systems Reboot bottom ("may be performed while stunned; remove all negative conditions":
# IgnoreStun + RemoveConditions All over Frosthaven's negative-condition list); the heal also ignores Stun, as the
# whole action may be performed while stunned
# bottom: the trap is relocated with Frosthaven's MoveTrap (Trapper Spike Pit): after the move, any trap within 6 (the
# designated adjacent trap is at most 6 away after Move 5) to an empty hex adjacent to you (MoveTrapRange is counted from
# the mover, CAbilityMoveTrap). Springing it on an enemy is impossible (Frosthaven only moves traps to empty hexes) -
# NEEDS PLUGIN for "spring it on the enemy there, XP 1".
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TCleanse:
                IgnoreStun: True
                RemoveConditions: "All"
                Conditions: [Wound, Brittle, Bane, Poison, Immobilize, Disarm, Impair, Stun, Muddle]
                Filter: Self
                AnimOverload: PowerUp
            THeal:
                Heal:
                    Amount: 5
                    Enhancements: 1
                IgnoreStun: True
                Filter: Self
                AnimOverload: Heal
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    Enhancements: 1
                Jump: True
            BMoveTrap:
                MoveTrap:
                Range: 6
                RangeIsBase: True
                Target: 1
                TargetIsBase: True
                MoveTrapRange: 1
Layout:
    Top:
        - Row: "$GH2E_SilentKnife_24_T$"
        - Row: "<size=50%> "
        - Row: "$GH2E_SilentKnife_24_T2$"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
    Bottom:
        - Row: "$GH2E_SilentKnife_24_B$"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$Jump$ <sprite name=Jump>"
        - Row: "<size=50%> "
        - Row: "$GH2E_SilentKnife_24_B2$"
