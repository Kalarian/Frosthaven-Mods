# card: Gruesome Advantage
# corrected against tools/gh2e/sheets/SilentKnife.json
# top: "+2 Attack and XP 1 if flanking OR isolated" (one +2, not +4): two mutually exclusive overrides - flanking, or
# isolated and not flanking (Xipe's +2/+2/-2 gave no XP)
# bottom: Frosthaven's Pyroclast Feed the Beast bottom (a one-slot round bonus fired by DuringActionAbilityOnAttackFinished)
# with the Drifter's Shockwave checks (melee attack; the target, here, has Poison), performing Attack 2, Range 3, Poison
# as a Blinkblade Stab Them All-style added attack
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 4
                    Enhancements: 1
                ConditionalOverrides:
                    TAttackCO1:
                        Filter:
                            TargetType: Enemy
                            TargetAdjacentAllies: "> 0"
                        XP: 1
                        AbilityOverrides:
                            TFlankBuff:
                                Strength: 2
                    TAttackCO2:
                        Filter:
                            TargetType: Enemy
                            TargetAdjacentAllies: "== 0"
                            TargetAdjacentAlliesOfTarget: "== 0"
                        XP: 1
                        AbilityOverrides:
                            TIsolatedBuff:
                                Strength: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
            BActive:
                Filter: Self
                AnimOverload: PowerUp
                AddActiveBonus:
                    Attack: 2
                    Range: 3
                    Conditions: Poison
                    Filter: Enemy
                    CanUndo: False
                ActiveBonus:
                    Behaviour: DuringActionAbilityOnAttackFinished
                    Duration: Round
                    AttackType: Melee
                    XPTracker: [0]
                    Vars:
                        AttackAbility: TriggerAbility
                        ValidateIsMeleeAttack: AttackAbility.IsMeleeAttack
                        EnemyTarget: TriggerTarget
                        ValidateTargetHasPoison: EnemyTarget.Tokens.HasKey(CCondition.ENegativeCondition.Poison)
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=50%> "
        - Row: "$GH2E_SilentKnife_18_T$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Active:
            Ability: BActive
            Icon: Positive_Poison_Attack
            ListLayout: "$GH2E_SilentKnife_18_B$"
            Layout: "$GH2E_SilentKnife_18_B$"
        - Row: "<size=50%> "
        - Duration: Round
