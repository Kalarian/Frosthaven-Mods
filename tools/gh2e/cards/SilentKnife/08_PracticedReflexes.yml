# card: Practiced Reflexes
# from Xipe's 99095_Scoundrel2_Practiced Reflexes.yml; corrected against tools/gh2e/sheets/SilentKnife.json
# bottom: Frosthaven has no "you may choose not to spring traps" move (only a perk flag, ChooseToNotTriggerTrap), so the
# move jumps (hexes passed over don't spring their traps; the last hex still does) - approximation, see NOTES.md.
# "Destroy one trap in a hex you entered": DisarmTrap on the move's path (CAbilityDisarmTrap reads AllTargetsOnMovePath,
# the same path the 1e Swift Bow loots), XP 1 only when a trap is destroyed (AbilityXP: no target, no XP).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TMove:
                Move:
                    Amount: 3
                    Enhancements: 1
            TAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
                Jump: True
            BDisarm:
                DisarmTrap: True
                AllTargetsOnMovePath: True
                Target: 1
                AbilityXP: 1
Layout:
    Top:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *TMove* <size=100%><voffset=1>@TMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$GH2E_SilentKnife_08_B$"
        - Row: "<size=50%> "
        - Row: "$GH2E_SilentKnife_08_B2$"
