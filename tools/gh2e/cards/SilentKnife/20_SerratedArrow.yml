# card: Serrated Arrow
# from Xipe's 99107_Scoundrel2_Serrated Arrow.yml; corrected against tools/gh2e/sheets/SilentKnife.json (agrees)
# bottom: the 1st edition Spring the Trap bottom's shape (passed in the 1e bench): one-slot x2 on a target that is both
# flanked and isolated
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 4
                    Enhancements: 1
                Range: 3
                Conditions: Wound
                AnimOverload: RangedAttackPistolBurningOil
    Bottom:
        Abilities:
            BActive:
                Attack: 2
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffAttack
                    StrengthIsScalar: True
                    Filter:
                        TargetType: Enemy
                        TargetAdjacentAlliesOfTarget: "== 0"
                        TargetAdjacentAllies: "> 0"
                    XPTracker: [2]
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
        - Row: "$Wound$ <sprite name=Wound>"
    Bottom:
        - Active:
            Ability: BActive
            Icon: Positive_AttackPlus
            ListLayout: "$GH2E_SilentKnife_20_B$"
            Layout: "$GH2E_SilentKnife_20_B$"
        - Row: "<size=50%> "
        - XPTracker: BActive
