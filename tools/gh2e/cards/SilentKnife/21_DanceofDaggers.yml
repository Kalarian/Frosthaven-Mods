# card: Dance of Daggers
# rewritten from tools/gh2e/sheets/SilentKnife.json (Xipe's file 99109 held Cull the Weak's top)
# top: negate the damage of every attack this round = a round PreventDamage with no use track, attack sources only
# (CPreventDamageActiveBonus prevents every time while it lasts; the 1e Trickster's Reversal bottom adds a one-slot
# track for "the next"). The attacks' added effects are not negated (no Frosthaven shape) - NEEDS PLUGIN.
# "after each attack ability targeting you: XP 1 and Attack 2 on the attacker" = a round Retaliate 2 with XP 1 per
# trigger (ProcXP, Gloomhaven's Eye for an Eye) and no range limit - an approximation (damage, no modifier draw).
# bottom: Move 4, then Frosthaven's "advantage on all attacks this round" (Drifter Accurate Strikes bottom).
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TPrevent:
                PreventDamage: 1
                AttackSourcesOnly: True
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Round
            TRetaliate:
                Retaliate: 2
                RetaliateRange: 99
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Round
                    ProcXP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    Enhancements: 1
            BAdvantage:
                Advantage:
                    DecrementTrigger: Rounds
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Round
Layout:
    Top:
        - Active:
            Ability: TPrevent
            Icon: Positive_DamagePrevent
            ListLayout: "$GH2E_SilentKnife_21_T$"
            Layout: "$GH2E_SilentKnife_21_T$"
        - Row: "<size=50%> "
        - Active:
            Ability: TRetaliate
            Icon: Positive_Retaliate_Range
            ListLayout: "$GH2E_SilentKnife_21_T2$"
            Layout: "$GH2E_SilentKnife_21_T2$"
        - Row: "<size=50%> "
        - Duration: Round
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Active:
            Ability: BAdvantage
            Icon: Positive_Advantage
            ListLayout: "$GH2E_SilentKnife_21_B$"
            Layout: "$GH2E_SilentKnife_21_B$"
        - Row: "<size=50%> "
        - Duration: Round
