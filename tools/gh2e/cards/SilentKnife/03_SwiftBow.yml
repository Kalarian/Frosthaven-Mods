# card: Swift Bow
# from Xipe's 99090_Scoundrel2_Swift Bow.yml; corrected against tools/gh2e/sheets/SilentKnife.json
# bottom: the 1st edition Swift Bow's loot-the-path shape (Loot 0 on every hex of the move path; passed in the 1e bench)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    Enhancements: 1
                Range: 4
                AnimOverload: RangedAttackThrowingKnives
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
            BLoot:
                Loot: 0
                Target: -1
                AllTargetsOnMovePath: True
                AnimOverload: Loot
Layout:
    Top:
        - Row: "<b><size=130%>$Attack$ <sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$Range$ <sprite name=Range> *TAttack.Range*"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$GH2E_SilentKnife_03_B$"
