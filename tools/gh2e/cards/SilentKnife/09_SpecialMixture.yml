# card: Special Mixture
# from Xipe's 99096_Scoundrel2_Special Mixture.yml; corrected against tools/gh2e/sheets/SilentKnife.json
# bottom: the Poison has its diamond mark (Xipe had none); a condition ability of its own, as the 1e Special Mixture
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            THeal:
                Heal:
                    Amount: 3
                    Enhancements: 1
                Filter: Self
                AnimOverload: Heal
        Infuse: Dark
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    Enhancements: 1
            BPoison:
                Poison:
                    Enhancements: 1
                Range: 1
                Filter: Enemy
                AnimOverload: AimedPowderPoison
Layout:
    Top:
        - Row: "<b><size=130%>$Heal$ <sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
        - Row: "<size=50%> "
        - Infuse: Dark
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "<b><size=130%>$Poison$ <sprite name=Poison> <size=100%><voffset=1>@BPoison@"
        - Row: "$Range$ <sprite name=Range> *BPoison.Range*"
