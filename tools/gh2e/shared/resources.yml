GH2ESafeguard:
    # pack-wide: the Safeguard condition token (2e rulebook: the next negative condition the figure would gain is
    # prevented, then Safeguard is removed; no stacking: MaxAmount 1). Given and spent by the plugin (GHSafeguard.cs);
    # shown on the figure's status row with this Frosthaven icon and text.
    ID: "GH2ESafeguard"
    Sprite: "Positive_DamagePrevent"
    LocKey: "GH2E_SAFEGUARD_TOOLTIP"
    MaxAmount: 1

GH2ECount1:
    # pack-wide: hidden, an in-scenario count a 2nd edition plugin keeps on its own character (mastery counts, "this
    # round" states; GHSavedCounts.cs: each class numbers its own slots); saved with the scenario, never shown
    ID: "GH2ECount1"
    Sprite: "Positive_DamagePrevent"
    LocKey: "GH2E_HIDDEN_COUNT_TOOLTIP"
    MaxAmount: 999
    Hidden: True

