        - Row:
            - ColumnWidths: "20,30,30,20"
            - Column:
            - Column: "<b><size=130%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - AddedEffect: "<size=130%><sprite name=Muddle></size>"
            - Column:
        - Row: "<size=20%> "
        - Consume:
            Name: TCDark
            Text: "+1 <sprite name=Attack>, <size=150%><voffset=-1.5><sprite name=Light></voffset></size>, <sprite name=XP1>"
    Bottom:
        - Row: "<b><size=130%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row: "<b><size=130%><sprite name=Bless> <size=100%><voffset=1>@BBless@"
        - Row: "$Affect_OneAdjacentAlly$"
