Parser: AbilityCard
Name: $ABILITY_CARD_SpiritHunger$
Character: VoidwardenID
ID: 31176
Level: 7
Initiative: 68
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyAttack:
                            Attack: 
                                Amount: 5 
                                DiamondEnhancements: 1
                            StrengthIsBase: True
                            RangeIsBase: True
                            TargetIsBase: True
                            SubAbilities:
                                TAllyAttackSubHeal:
                                    Heal: 0
                                    Filter: [Self]
                                    StatIsBasedOnX:
                                        Strength:
                                            BasedOn: DamageInflictedByParentOnLastTarget
                Range: 2
                Filter: Ally
                AnimOverload: ControlAlly
            # TODO: Controlled actor Heal X, where X is damage 
            # suffered by target of prior attack
        XP: 2
    Bottom:
        Abilities:
            BMove:
                Move: 4 
            BHeal:
                Heal: 2 
                Range: 2
                Filter: [Self, Ally]
                AnimOverload: TargetedHeal
        Consumes:
            BCIce:
                Elements: Ice 
                AbilityOverrides:
                    BCIceBuff:
                        ParentName: BHeal
                        Strength: 1
                        Range: 1
Layout:
    Top:
        - Row: "$FHS_JOTL_176_T_1$"
        - Row: "<size=20%> "
        - Row: "<size=150%><sprite name=Attack> *TAllyAttack* @TAllyAttack@"
        - Row: "<size=20%> "
        - Row: "$FHS_JOTL_176_T_2$"
        - Row: "<size=20%> "
        - Row: "<size=150%><sprite name=Heal> X"
        - Row: "<size=20%> "
        - Row: "$FHS_JOTL_176_T_3$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove*"
        - Divider:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Heal> *BHeal*"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *BHeal.Range*</link>"
            - Column:
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: BCIce
                    Text: "<nobr>+1 <sprite name=Heal></nobr>, <nobr>+1 <sprite name=Range></nobr>"
