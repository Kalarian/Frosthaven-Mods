Parser: AbilityCard
Name: $ABILITY_CARD_FreezeTheSoul$
Character: VoidwardenID
ID: 31155
Level: 1
Initiative: 58
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                Conditions: Poison
                AnimOverload: Attack Powered
        Consumes:
            TCFire:
                Elements: Ice
                AbilityOverrides:
                    TCIceBuff:
                        ParentName: TAttack
                        Strength: 1
                        Conditions: Muddle
                XP: 1
    Bottom:
        Abilities:
            BStun:
                Stun: True
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                Filter: Enemy
                AnimOverload: TargetedDebuff
            BCurse:
                Curse: True
                Filter: Self
        Consumes:
            BCDark:
                Elements: Dark
                AbilityOverrides:
                    BCCurseNullInstead:
                        ParentName: BCurse
                        Null: True
                        AllowContinueForNullAbility: True
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Poison></link>"
            - Column:
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCFire
                    Text: "<nobr>+1 <sprite name=Attack></nobr>, <nobr><sprite name=Muddle></nobr>, <sprite name=XP1>"
    Bottom:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Stun>"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *BStun.Range* @BStun.Range@</link>"
            - Column:
        - Divider:
        - Row: "<link=fhself><size=125%><sprite name=Curse></link>"
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: BCDark
                    Text: "$FHS_JOTL_155_B$"
