Parser: AbilityCard
Name: $ABILITY_CARD_HonorableFury$
Character: RedGuardID
ID: 31252
Level: 9
Initiative: 89
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 5
                    DiamondEnhancements: 1
                Range: 2
                AnimOverload: AltRangedAttack
        Consumes:
            TCFire:
                Elements: Fire
                AbilityOverrides:
                    TCFireBuff:
                        ParentName: TAttack
                        Strength: 1
                        Range: 2
                        SubAbilities:
                            TAttackSubDamage:
                                IsInlineSubAbility: True
                                Damage: 1
                                Range: 1
                                Target: -1
                                Filter: Enemy
                                AllTargetsAdjacentToParentTargets: True
            TCLight:
                Elements: Light
                AbilityOverrides:
                    TCLightBuff:
                        ParentName: TAttack
                        Strength: 1
                        AttackHasAdvantage: True
                        Condition: Muddle
    Bottom:
        Abilities:
            BCLight:
                Consume:
                    Elements: Light
                    Abilities:
                        BCLightMove:
                            Move: 3
                    XP: 1
            BDamage:
                Damage: 3
                Target: -1
                Filter: Enemy
                AnimOverload: Attack_AOE_Radial
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAttack.Range*</link>"
            - Column:
        - Row: "<size=50%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCFire
                    Text: "$FHS_JOTL_252_T$"
        - Row: "<size=50%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCLight
                    Text: "<nobr>+1 <sprite name=Attack></nobr>, $FHS_Advantage$, <nobr><sprite name=Muddle></nobr>"
    Bottom:
        - Conditional:
            Layout:
                - Consume:
                    Name: BCLight
                    Text: "<sprite name=Move> 3, <sprite name=XP1>"
        - Row: "<size=50%> "
        - Row: "$FHS_JOTL_252_B$"
