Parser: AbilityCard
Name: $ABILITY_CARD_ViciousBallet$
Character: RedGuardID
ID: 31247
Level: 7
Initiative: 28
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                AnimOverload: AltAttack
            TCFire:
                Consume:
                    Elements: Fire
                    Abilities:
                        TCFireAlly:
                            ControlActor:
                                Abilities:
                                    TCFireAllyAttack:
                                        Attack: 3
                                        StrengthIsBase: True
                                        RangeIsBase: True
                                        TargetIsBase: True
                            Range: 1
                            Filter: Ally
                            AnimOverload: CommandAlly
                            HelpBoxTooltipLocKey: GUI_ViciousBallet_Tooltip
                    XP: 1
            TCLight:
                Consume:
                    Elements: Light
                    Abilities:
                        TCLightAlly:
                            ControlActor:
                                Abilities:
                                    TCLightAllyAttack:
                                        Attack: 3
                                        StrengthIsBase: True
                                        RangeIsBase: True
                                        TargetIsBase: True
                            Range: 1
                            Filter: Ally
                            IgnorePreviousAbilityTargets: TCFireAlly
                            AnimOverload: CommandAlly
                            HelpBoxTooltipLocKey: GUI_ViciousBallet_Tooltip
                    XP: 1
    Bottom:
        Abilities:
            BDamage1:
                Damage: 1
                Filter: Enemy
                AnimOverload: TargetedDebuffQuick
            BMove1:
                Move: 2
            BDamage2:
                Damage: 1
                Filter: Enemy
                AnimOverload: TargetedDebuffQuick
            BMove2:
                Move:
                    Amount: 2
                    CircleEnhancements: 1
            BDamage3:
                Damage: 1
                Filter: Enemy
                AnimOverload: TargetedDebuffQuick
Layout:
    Top:
        - Row: "<size=150%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=50%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCFire
                    Text: "$FHS_JOTL_247_T_1$"
        - Row: "<size=50%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCLight
                    Text: "$FHS_JOTL_247_T_2$"
    Bottom:
        - Row: "$FHS_JOTL_247_B$"
        - Row: "<size=50%> "
        - Row: "<size=150%><sprite name=Move> *BMove1*"
        - Row: "<size=50%> "
        - Row: "$FHS_JOTL_247_B$"
        - Row: "<size=50%> "
        - Row: "<size=150%><sprite name=Move> *BMove2* <size=100%><voffset=1>@BMove2@"
        - Row: "<size=50%> "
        - Row: "$FHS_JOTL_247_B$"
