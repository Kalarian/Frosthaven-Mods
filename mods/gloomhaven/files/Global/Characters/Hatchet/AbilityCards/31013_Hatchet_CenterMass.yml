Parser: AbilityCard
Name: $ABILITY_CARD_CenterMass$
Character: HatchetID
ID: 31013
Level: 1
Initiative: 24
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                AnimOverload: RangedAttack
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BPush:
                Push:
                    Amount: 2
                    SquareEnhancements: 1
                Filter: Enemy
                AnimOverload: TargetedPush
Layout:
    Top:
        - Row:
            - ColumnWidths: "20,30,30,20"
            - Column:
            - Column: "<b><size=130%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<sprite name=Range>*TAttack.Range* @TAttack.Range@"
            - Column:
    Bottom:
        - Row: "<b><size=130%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row: "<b><size=130%><sprite name=Push> *BPush* <size=100%><voffset=1>@BPush@"
        - Row: "$Target_OneAdjacentEnemy$"
