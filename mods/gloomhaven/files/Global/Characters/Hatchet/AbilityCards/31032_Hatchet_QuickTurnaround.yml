Parser: AbilityCard
Name: $ABILITY_CARD_QuickTurnaround$
Character: HatchetID
ID: 31032
Level: 6
Initiative: 11
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 4
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                SubAbilities:
                    TAttackSubPush:
                        Push: 2
                        IsInlineSubAbility: True
                AnimOverload: RangedAttack
        Consumes:
            TCAir:
                Elements: Air
                AbilityOverrides:
                    TCAirBuff1:
                        ParentName: TAttack
                        Range: 1
                    TCAirBuff2:
                        ParentName: TAttackSubPush
                        Strength: 2
                        IsInlineSubAbility: True #need to include this otherwise the override reverts this to false
                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move: 3
            BLoot:
                Loot: 1 
                Target: -1
                StartAbilityRequirements:
                    Type: ThisAbility
                    LootInRange: "> 0"
                    ObjectImportTypes: Resource
                AnimOverload: Loot
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Attack> *TAttack*"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAttack.Range* @TAttack.Range@</link>"
                - Row: "<link=fhpill><sprite name=Push> *TAttackSubPush*</link>"
            - Column:
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCAir
                    Text: "<nobr>+1 <sprite name=Range></nobr>, <nobr>+2 <sprite name=Push></nobr>, <sprite name=XP1>"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove*"
        - Row: "<size=50%> "
        - Row: "$FHS_JOTL_032_B$"
        - Row: "<size=20%> "
        - Row: "<size=150%><sprite name=Loot> *BLoot*"
