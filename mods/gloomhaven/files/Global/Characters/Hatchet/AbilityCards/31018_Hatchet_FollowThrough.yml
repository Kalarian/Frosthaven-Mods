Parser: AbilityCard
Name: $ABILITY_CARD_FollowThrough$
Character: HatchetID
ID: 31018
Level: 1
Initiative: 39
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack: 
                Attack: 2
                Range: 
                    Amount: 4
                    SquareEnhancements: 1
                ConditionalOverrides:
                        TAttackFavoriteCO:
                            Filter:
                                TargetType: Enemy
                                TargetHasCharacterResource: ["TheFavorite"]
                            XP: 1
                            AbilityOverrides:
                                TAdjAllyBuff:
                                    Strength: 2
                        TAttackNewFavoriteCO:
                            Filter:
                                TargetType: Enemy
                                TargetHasCharacterResource: ["TheNewFavorite"]
                            XP: 1
                            AbilityOverrides:
                                TAdjAllyBuff:
                                    Strength: 2
                AnimOverload: RangedAttack
    Bottom:
        Abilities:
            BMove: 
                Move:
                    Amount: 2
                    CircleEnhancements: 1
            BPush:
                Push: 2
                Filter: Enemy
                AnimOverload: TargetedPush
            BCAir:
                Consume:
                    Elements: Air 
                    Abilities:
                        BCAirMove:
                            Move: 2
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAttack*"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAttack.Range* @TAttack.Range@</link>"
            - Column:
        - Row: "<size=20%> "
        - Row: "$FHS_JOTL_018_T$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row: "<size=150%><sprite name=Push> *BPush*"
        - Row: "<size=50%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: BCAir
                    Text: "<nobr><sprite name=Move> 2</nobr>"
