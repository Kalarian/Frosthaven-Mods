Parser: AbilityCard
Name: $ABILITY_CARD_StoppingPower$
Character: HatchetID
ID: 31014
Level: 1
Initiative: 35
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                Range:
                    Amount: 2
                    SquareEnhancements: 1
                AnimOverload: RangedAttack
        Consumes:
            TCAir:
                Elements: Air
                AbilityOverrides:
                    TCAirBuff:
                        ParentName: TAttack
                        Range: 1
                        SubAbilities:
                            TAttackSubPush:
                                Push: 2
                                IsInlineSubAbility: True
                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
                    Jump: True
                SubAbilities:
                    BMoveSubImmobilize:
                        Immobilize: True
                        Range: 1
                        Target: -1
                        Filter: [Enemy]
                        AllTargetsAdjacentToParentMovePath: true
        Infuse: Air
        XP: 1
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAttack.Range* @TAttack.Range@</link>"
            - Column:
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCAir
                    Text: "<nobr>+1 <sprite name=Range></nobr>, <nobr><sprite name=Push> 2</nobr>, <sprite name=XP1>"
    Bottom:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
            - Column:
                - Row: "<link=fhpill><sprite name=Jump></link>"
            - Column:
        - Divider:
        - Row: "<size=150%><sprite name=Immobilize>"
        - Row: "$FHS_Target_AllEnemiesAdjacentToHexesMovedThrough$"
        - Row: "<size=50%> "
        - Row:
            - ColumnWidths: "30,20,20"
            - Column:
            - Column:
                - Infuse: Air
            - Column:
