        Abilities:
            BMove: 
                Move: 3
            BHeal:
                Heal: 1
                Range:
                    Amount: 1
                    SquareEnhancements: 1
                Filter: [Self, Ally]
                AnimOverload: Heal
        Infuse: Earth 
