        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    DiamondEnhancements: 1
                Range: 3
                SubAbilities:
                    THeal:
                        Heal:
                            Amount: 2
                            DiamondPlusEnhancements: 1
                        Filter: Ally
                        Range: 1
                        TreatAsNonSubAbility: True
                        AllTargetsAdjacentToParentTargets: True
                AnimOverload: QuickRangedAttack
