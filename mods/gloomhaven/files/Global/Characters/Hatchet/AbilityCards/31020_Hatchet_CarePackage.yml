        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAttack.Range*</link>"
            - Column:
        - Divider:
        - Row: "<size=150%><sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
        - Row: "$FHS_JOTL_020_T$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove*"
        - Divider:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Heal> *BHeal*"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *BHeal.Range* @BHeal.Range@</link>"
            - Column:
        - Row: "<size=50%> "
        - Infuse: Earth
