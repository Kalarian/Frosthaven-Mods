    - Targets:
        Filter: CountXRounds
        SubFilter: Scenario
        EnemyFamilies: [FrosthavenMods_SingleAbilityDamage]
        CharacterIDs:
            ActorID: SawbonesID
        Amount: 20
        Value: 1
