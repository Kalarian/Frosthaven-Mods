Parser: HeroSummon
ID: FeySubjugatorID
LocKey: $GH2E_SUMMON_FeySubjugator$
# stand-in model: the 1st edition Healing Sprite (a new 2e creature; NOTES.md)
Model: HealingSprite
Health:
    Amount: 4
    SquareEnhancements: 1
Move:
    Amount: 2
    SquareEnhancements: 1
Attack:
    Amount: 1
    SquareEnhancements: 1
Range:
    Amount: 4
    SquareEnhancements: 1
Flying: True
# "Whenever this summon attacks a normal or elite enemy, after the attack ability control that enemy: Attack -1": the
# summon's attack with a control sub-ability on its own target (the 1st edition Lead to Slaughter fix: UseParentTargets),
# normal and elite only; the enemy attacks at its own value -1 at its OWN range (decision C, QUESTIONS.md: Range 0
# without RangeIsBase = the monster's own range, Soothsinger2 Pull the Strings bottom's shape), its target chosen by
# the summon's owner (ControlActorType Player: rulebook p33, the commanding figure decides how a controlled ability is
# performed; the engine hands a summon's controlled figure to the summoner's player, FFSNetwork.GetControllingPlayer).
# Unverified on a summon's attack.
AttackOverride:
    ParentName: DefaultAttack
    SubAbilities:
        AControl:
            ControlActor:
                Abilities:
                    EnemyWillDoThis:
                        Attack: -1
                        Range: 0
                        Target: 1
                        TargetIsBase: True
                ControlDurationType: ControlForOneAction
                ControlActorType: Player
            Filter:
                TargetType: Enemy
                EnemyType: [Normal, Elite]
            UseParentTargets: True
            Target: 1
            AutoTrigger: True
            AnimOverload: MindControl
