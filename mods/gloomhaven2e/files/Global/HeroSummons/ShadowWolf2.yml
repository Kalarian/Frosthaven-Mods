Parser: HeroSummon
ID: ShadowWolf2ID
LocKey: $GH2E_SUMMON_ShadowWolf$
Model: ShadowWolf
Health:
    Amount: 2
    SquareEnhancements: 1
Move:
    Amount: 3
    SquareEnhancements: 1
Attack:
    Amount: 2
    SquareEnhancements: 1
Range: 1
Pierce: 1
# "Whenever a Shadow Wolf dies, infuse Dark and all Shadow Wolves gain Invisible": Frosthaven's Flesh Bomb death
# trigger (DuringActionAbilityOnDeath with its summon-removal guard); the Invisible goes to the other living Shadow
# Wolves (HeroSummonClasses, the filter of Frosthaven's Unholy Prowess aura). Unverified.
OnSummonAbilities:
    AOnDeath:
        AutoTrigger: True
        Filter: Self
        SkipAnim: True
        AddActiveBonus:
            Infuse: Dark
            CanUndo: False
            PerformVars:
                OnAbilityEnded:
                    StackSubAbilities: CustomAbility.StackNonInlineSubabilities(obj)
            SubAbilities:
                AWolvesInvisible:
                    Invisible: True
                    Range: 99
                    Target: -1
                    Targeting: All
                    Filter:
                        TargetType: Ally
                        HeroSummonClasses: [ShadowWolf2ID]
                    TreatAsNonSubAbility: True
                    IsInlineSubAbility: False
                    AutoTrigger: True
                    CanSkip: False
        ActiveBonus:
            Duration: Persistent
            Behaviour: DuringActionAbilityOnDeath
            TriggerAbilitiesImmediately: True
            ListLayoutOverride: ["$GH2E_Soultether_03_T$", Icon_Invisible]
            Requirement:
                Vars:
                    ValidateRealDeath: CheckingBonus.Actor.CauseOfDeath != "SummonerDied" && CheckingBonus.Actor.CauseOfDeath != "SummonActiveBonusCancelled" && CheckingBonus.Actor.CauseOfDeath != "ActorRemovedFromMap"
