Parser: HeroSummon
ID: EnhancementFieldID
LocKey: $GH2E_SUMMON_EnhancementField$
Model: SpiritBanner
# a map token, not a figure (class mat: "hexes containing one or more of these tokens are still empty"; GH2e FAQ:
# tokens "won't make a hex non-empty"): can't be targeted, hurt or block (the 1st edition Ward's flags), any figure may
# end a move in its hex or be summoned / placed there (IgnoreActorCollision: Frosthaven's own flag for a figure that
# shares a hex, the 1st edition Sand Devil's; GHMapTokens.cs hides the token from the engine's "who stands here"
# lookups so the hex counts as empty)
Health: 1
Move: 0
Attack: 0
Range: 0
Untargetable: True
Invulnerable: True
DoesNotBlock: True
IgnoreActorCollision: True
# "Add +1 Attack to all attacks you and all allies perform while within Range 1 of the token": the 1st edition Spirit
# Banner's aura (+2 there) with Frosthaven's Banner of Strength range aura keys
OnSummonAbilities:
    ABuffAttackAura:
        Attack: 1
        Range: 1
        Target: -1
        Filter: Self
        ActiveBonus:
            Behaviour: BuffAttack
            Duration: Persistent
            ValidAbilityTypes: [Attack]
            IsAura: True
            AuraTargeting: Range
            AuraFilter: [Ally]
            ListLayoutOverride: [$GH2E_Tinkerer2_11_T$, Positive_AttackPlus_Ally_Aura]
        Text: "$GH2E_Tinkerer2_11_T$"
        AnimOverload: None
