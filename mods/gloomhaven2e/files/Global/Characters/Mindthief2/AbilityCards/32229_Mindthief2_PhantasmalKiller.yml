# card: Phantasmal Killer
# written from tools/gh2e/sheets/Mindthief.json; first augment = Xipe's (a control on one target of each melee attack,
# UseParentTargets); the second augment "after each of your control abilities, you may perform: consume Dark: one
# controlled enemy suffers damage 3" is the augment ability TAugmentAfterControl (MiscVars GHAfterControl): the plugin
# (GHAfterControl) takes it out of the augment's per-attack list when the card is read and, after each control ability
# of the Mindthief that controlled an enemy while this augment is hers, stacks it with the enemies that ability
# controlled (temp var GHControlledEnemies) as the only targets. The card's own Attack 3 has no mark (Xipe had one).
Discard: [Discard,Discard]
