Parser: AbilityCard
Name: $ABILITY_CARD_InvocationofSpirit$
Character: WildfuryID
ID: 33611
Level: X
Initiative: 62
# card: Invocation of Spirit
# top: "! consume Air/Earth (either, required)": the split consume as Spirit Swap top (two GHElementEither steps the
# plugin merges into one element picker: either element), then the invocation is placed when either was consumed. Invocation: after each of the Bear's next
# three attacks, once each round, "Attack 2 on one enemy within 3 hexes, as if you occupied the Bear's hex".
# The trigger's Attack 2 is marked GHBySummonerFromHex: the plugin (GHWildfury.cs) stacks it for the Wildfury instead of
# the Bear, performed from the Bear's hex (TargetingOverrideArrayIndex, Frosthaven's own "perform from a hex"): her
# attack, her modifier deck and bonuses, range and line of sight from the Bear (rulebook p21). Three slots, XP on the
# first. Persistent.
# bottom: Move 3 [square]; Heal 1 [square], Range 2 [square], consume Earth: +1 Heal, XP 1; "+1 Heal if the target is
# the Bear": a target conditional override filtered to the Bear; Frosthaven evaluates per-target overrides only for
# attacks, so the plugin (GHWildfury.cs TargetHealBonus) adds it when a pack heal heals a target its filter matches.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            # the split Air/Earth consume: one element picker (GHElementEither, the plugin merges the marked steps into
            # the first, as on Spirit Swap top): either element, the player's pick
            TCEarth:
                MiscVars:
                    GHElementEither: True
                Consume:
                    Elements: [Earth]
                    Abilities:
                        TCEarthNull:
                            Null: True
                            AutoTrigger: True
            TCAir:
                MiscVars:
                    GHElementEither: True
                Consume:
                    Elements: [Air]
                    Abilities:
                        TCAirNull:
                            Null: True
                            AutoTrigger: True
            TInvoke:
                AddActiveBonus:
                    Attack: 2
                    Range: 3
                    Target: 1
                    Filter: Enemy
                    AnimOverload: RangedAttack
                    MiscVars:
                        GHBySummonerFromHex: True
                Filter: Self
                StartAbilityRequirements:
                    Type: ThisAbility
                    ActorHasPerformedValidAbilityTypesThisAction: "> 0"
                    AbilityTypes: [Consume]
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: DuringActionAbilityOnAttackAbilityFinished
                    ValidAbilityTypes: [Attack]
                    Restriction: OncePerRound
                    XPTracker: [1,0,0]
                    IsAura: True
                    AuraFilter:
                        HeroSummonClasses: [WildfuryBearID]
                    AuraTargeting: All
                AnimOverload: RadialBeneficial
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    SquareEnhancements: 1
            BHeal:
                Heal:
                    Amount: 1
                    SquareEnhancements: 1
                Range:
                    Amount: 2
                    SquareEnhancements: 1
                Filter: [Self, Ally]
                AnimOverload: Heal
                ConditionalOverrides:
                    BHealBearCO:
                        Filter:
                            HeroSummonClasses: [WildfuryBearID]
                        AbilityOverrides:
                            BHealBearBuff:
                                Strength: 1
        Consumes:
            BCEarth:
                Elements: Earth
                AbilityOverrides:
                    BCEarthHealBuff:
                        ParentName: BHeal
                        Strength: 1
                XP: 1
Layout:
    Top:
        - Row: "<sprite name=ConsumeAir>/<sprite name=ConsumeEarth> $FHS_GH2E_Wildfury_REQUIRED$"
        - Row: "<size=50%> "
        - Active:
            Ability: TInvoke
            Icon: Positive_AttackPlus_Ally
            ListLayout: "$FHS_GH2E_Wildfury_11_T$"
            Layout: "$FHS_GH2E_Wildfury_11_T$"
        - Row: "<size=100%> "
        - XPTracker: TInvoke
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Heal> *BHeal* <size=100%><voffset=1>@BHeal@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *BHeal.Range* @BHeal.Range@</link>"
            - Column:
        - Conditional:
            Layout:
                - Consume:
                    Name: BCEarth
                    Text: "<nobr>+1 <sprite name=Heal> </nobr>, <sprite name=XP1>"
        - Row: "$FHS_GH2E_Wildfury_11_B$"
