            - Column:
        - Row: "$FHS_GH2E_Wildfury_SAFEGUARD_ROW$"
        - Row: "<size=50%> "
        - Infuse: Earth
    Bottom:
        - Row: "<size=150%><sprite name=Poison> <sprite name=Muddle>"
        - Row: "<size=40%> "
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=1%> "
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *BPoison.Range*</link>"
            - Column:
        - Row: "<size=50%> "
        - Infuse: Earth
