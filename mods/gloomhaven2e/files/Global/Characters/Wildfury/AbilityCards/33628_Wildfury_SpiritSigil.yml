Parser: AbilityCard
Name: $ABILITY_CARD_SpiritSigil$
Character: WildfuryID
ID: 33628
Level: 9
Initiative: 85
# card: Spirit Sigil
# top: "! consume Air and Earth (required, both)", Summon Vital Force (summons/VitalForce.yml: HP 3 [square], no move or
# attack; aura: allies within range 3 add +2 Attack to their first attack each round), XP 1 with the consume.
# Persistent icon, not lost.
# bottom: Move 5 [circle]; Bless and Safeguard on one ally within range 1 [square] (Safeguard: the class's stand-in, a
# sub-ability on the Bless target); "! infuse Air/Earth (either)": an Infuse ability with the element picker.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TConsume:
                Consume:
                    Elements: [Air, Earth]
                    Abilities:
                        TCNull:
                            Null: True
                            AutoTrigger: True
                    XP: 1
            TSummon:
                Summon: VitalForceID
                StartAbilityRequirements:
                    Type: ThisAbility
                    ActorHasPerformedValidAbilityTypesThisAction: "> 0"
                    AbilityTypes: [Consume]
                AnimOverload: Summon
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    CircleEnhancements: 1
            BBless:
                Bless: True
                Range:
                    Amount: 1
                    SquareEnhancements: 1
                Target: 1
                Filter: Ally
                AnimOverload: RangedCast
                SubAbilities:
                    BBlessSafeguard:
                        AddActiveBonus:
                            Null: True
                            Filter: Self
                            AutoTrigger: True
                            SkipAnim: True
                        Filter: [Self, Ally]
                        UseParentTargets: True
                        SkipAnim: True
                        ActiveBonus:
                            Duration: Persistent
                            Behaviour: GenericOnNegativeCondition
                            IsToggleBonus: True
                            XPTracker: [0]
                            ListLayoutOverride: [$GH2E_SAFEGUARD$, Positive_DamagePrevent]
                            Vars:
                                ValidateIsHolder: TriggerTarget == ActiveBonus.Actor
                                ValidateNotScenarioEffect: TriggerAbility.TreatedAsScenarioEffect() == False
                                PreventCondition: True
            BInfuse:
                Infuse: [Air, Earth]
                ShowElementPicker: True
                CanUndo: False
                CanSkip: False
                SkipAnim: True
Layout:
    Top:
        - Row: "<sprite name=ConsumeAir><sprite name=ConsumeEarth> $FHS_GH2E_Wildfury_REQUIRED$"
        - Active:
            Ability: "TSummon"
            Icon: Positive_Summon
            Layout:
                - Summon:
                    Ability: TSummon
                    SummonName: $FHS_GH2E_SUMMON_VitalForce$
                    SpecialText: "$FHS_GH2E_Wildfury_28_T$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row: "<size=150%>$FHS_GH2E_Wildfury_SAFEGUARD_ROW$, <sprite name=Bless>"
        - Row: "$FHS_GH2E_Wildfury_28_B$ <sprite name=Range> *BBless.Range* @BBless.Range@"
        - Row: "<size=50%> "
        - Row: "<sprite name=CreateAir>/<sprite name=CreateEarth>"
