Parser: AbilityCard
Name: $ABILITY_CARD_SpiritSwap$
Character: WildfuryID
ID: 33609
Level: 1
Initiative: 27
# card: Spirit Swap
# top: COMMAND Move 1 [circle], Attack 2 [diamond], Wound. "consume Air/Earth (either): teleport the Wildfury to an
# empty hex adjacent to the Bear": the Wildfury's own teleport between the Bear's commanded move and its commanded attack
# (the command is two ControlActor steps around it, as printed), limited to hexes next to the Bear (Frosthaven's IsValidTeleportTile, as
# HIVE Recall's "a hex adjacent to you" and Infuser Formless Bladestorm's tile list). The split element (Air or Earth,
# one teleport) is Frosthaven's element selector: two Consume steps marked GHElementEither, which the plugin merges into
# the first (both consumes, the picker on) and drops the second, so the player picks either element and teleports once
# (before 2026-11-02: Earth only while Air was not infused, so with both up Air was forced).
# bottom: swap two normal or elite enemies (the 1st edition Spirit Swap bottom's Swap), infuse Air.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            # the command split in two around the consume row, as printed (Move, then the optional teleport, then
            # the Attack); the ability names TAllyMove / TAllyAttack keep their enhancement slots
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyMove:
                            Move:
                                Amount: 1
                                CircleEnhancements: 1
                            StrengthIsBase: True
                    ControlActorType: Player
                Target: -1
                Targeting: All
                Filter: Companion
                AnimOverload: Command
            TCEarth:
                MiscVars:
                    GHElementEither: True
                # no Bear on the map (dead, or not summoned yet): the consume isn't offered (Unbreakable Bond top's
                # ValidateBear), and the tile test below is null-safe (the Lick Wounds crash shape, re-audit 2026-11-02)
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateBear: AllHeroSummons.Find(obj.Class.ID == "WildfuryBearID") != null
                Consume:
                    Elements: [Earth]
                    Abilities:
                        TTeleportEarth:
                            Teleport2: 99
                            Filter: Self
                            Vars:
                                Bear: AllHeroSummons.Find(obj.Class.ID == "WildfuryBearID")
                            StartAbilityRequirements:
                                Type: ThisAbility
                                Vars:
                                    ValidateBear: AllHeroSummons.Find(obj.Class.ID == "WildfuryBearID") != null
                            MiscVars:
                                IsValidTeleportTile: Bear != null && Bear.GetDistanceTo(tile) == 1
                            AnimOverload: Teleport Into
                            AnimOverload2: Teleport Outof
            TCAir:
                MiscVars:
                    GHElementEither: True
                # no Bear on the map (dead, or not summoned yet): the consume isn't offered (Unbreakable Bond top's
                # ValidateBear), and the tile test below is null-safe (the Lick Wounds crash shape, re-audit 2026-11-02)
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateBear: AllHeroSummons.Find(obj.Class.ID == "WildfuryBearID") != null
                Consume:
                    Elements: [Air]
                    Abilities:
                        TTeleportAir:
                            Teleport2: 99
                            Filter: Self
                            Vars:
                                Bear: AllHeroSummons.Find(obj.Class.ID == "WildfuryBearID")
                            StartAbilityRequirements:
                                Type: ThisAbility
                                Vars:
                                    ValidateBear: AllHeroSummons.Find(obj.Class.ID == "WildfuryBearID") != null
                            MiscVars:
                                IsValidTeleportTile: Bear != null && Bear.GetDistanceTo(tile) == 1
                            AnimOverload: Teleport Into
                            AnimOverload2: Teleport Outof
            TAlly2:
                ControlActor:
                    Abilities:
                        TAllyAttack:
                            Attack:
                                Amount: 2
                                DiamondEnhancements: 1
                            Conditions: Wound
                            StrengthIsBase: True
                            RangeIsBase: True
                    ControlActorType: Player
                Target: -1
                Targeting: All
                Filter: Companion
                AnimOverload: Command
    Bottom:
        Abilities:
            BSwap:
                Swap: True
                Targeting: All
                Filter:
                    TargetType: Enemy
                    EnemyType: [Normal, Elite]
                AnimOverload: RadialBeneficial
        Infuse: Air
Layout:
    Top:
        - Row: "<size=1%><link=fhcommand> </link>"
        - Row: "<size=150%><sprite name=Move> *TAllyMove* <size=100%><voffset=1>@TAllyMove@"
        - Divider:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Attack> *TAllyAttack* <size=100%><voffset=1>@TAllyAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Wound></link>"
            - Column:
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Wildfury_09_T$"
    Bottom:
        - Row: "$FHS_GH2E_Wildfury_09_B$"
        - Row: "<size=50%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Air
