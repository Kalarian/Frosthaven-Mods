# card: Disorienting Roar
# top: COMMAND Muddle all enemies within range 2 of the Bear (the 1st edition Disorienting Roar top's shape, without its
# Immobilize), then a round aura on the Bear: -1 Attack on enemies' attacks within range 2 (BuffAttack -1 with an Enemy
# aura filter, the 1st edition Ward's enemy-aura shape). APPROXIMATION: the aura doesn't check Muddle (every enemy in
# range was just muddled; only immune ones differ) and follows the Bear through the round. XP 1, round.
# bottom: "! consume Air (required)": Frosthaven's required-consume shape (Infuser Propulsive Tailwind: a Consume
# ability, then the bonus with ActorHasPerformedValidAbilityTypesThisAction Consume). Invocation: after each of the
# Bear's next three attacks (Infuser's DuringActionAbilityOnAttackAbilityFinished aura on the summon, as the 1st
# edition Blood Hunger top), once each round (Restriction OncePerRound), the Bear: Move 3, Jump. Three slots, XP on
# the first. Persistent, not lost.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyMuddle:
                            Muddle: True
                            Range: 2
                            Target: -1
                            Filter: Enemy
                            RangeIsBase: True
                            TargetIsBase: True
                            AnimOverload: RadialRoar
                        TAllyWeaken:
                            Attack: -1
                            Range: 2
                            Target: -1
                            Filter: Self
                            ActiveBonus:
                                Behaviour: BuffAttack
                                Duration: Round
                                IsAura: True
                                AuraTargeting: Range
                                AuraFilter: [Enemy]
                                ListLayoutOverride: [$GH2E_Wildfury_07_T$, Positive_AttackMinus_Enemy_Aura]
                            AnimOverload: None
                    ControlActorType: Player
                Target: -1
                Targeting: All
                Filter: Companion
                AnimOverload: Command
        XP: 1
    Bottom:
        Abilities:
            BConsume:
                Consume:
                    Elements: [Air]
                    Abilities:
                        BCNull:
                            Null: True
                            AutoTrigger: True
            BInvoke:
                AddActiveBonus:
                    Move: 3
                    Jump: True
                    Filter: Self
                Filter: Self
                StartAbilityRequirements:
                    Type: ThisAbility
                    ActorHasPerformedValidAbilityTypesThisAction: "> 0"
                    AbilityTypes: [Consume]
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: DuringActionAbilityOnAttackAbilityFinished
                    ValidAbilityTypes: [Attack]
                    Restriction: OncePerRound
                    XPTracker: [1,0,0]
                    IsAura: True
                    AuraFilter:
                        HeroSummonClasses: [WildfuryBearID]
                    AuraTargeting: All
                AnimOverload: RadialBeneficial
