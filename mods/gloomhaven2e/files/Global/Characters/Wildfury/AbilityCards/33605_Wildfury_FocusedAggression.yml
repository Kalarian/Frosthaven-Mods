Parser: AbilityCard
Name: $ABILITY_CARD_FocusedAggression$
Character: WildfuryID
ID: 33605
Level: 1
Initiative: 14
# card: Focused Aggression
# top: Attack 3 [diamond], Range 3 [square], infuse Air. bottom: Move 3 [square]; grant one adjacent ally Shield 1 for
# the round (the 1st edition Maul bottom's shape); "if the target of the grant is the Bear, also Retaliate 1": a
# sub-ability on the shield's own target (UseParentTargets) filtered to the Bear, so it lands only when the shield went
# to the Bear. Untested filter-on-parent-target shape (NOTES.md).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                AnimOverload: RangedAttack
        Infuse: Air
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    SquareEnhancements: 1
            BShield:
                Shield: 1
                Range: 1
                Filter: Ally
                ActiveBonusDuration: Round
                AnimOverload: RadialBeneficial
                SubAbilities:
                    BBearRetaliate:
                        Retaliate: 1
                        UseParentTargets: True
                        Filter:
                            HeroSummonClasses: [WildfuryBearID]
                        ActiveBonusDuration: Round
                        SkipAnim: True
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAttack.Range* @TAttack.Range@</link>"
            - Column:
        - Row: "<size=50%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Air
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Wildfury_05_B$"
        - Active:
            Ability: BShield
            Icon: Positive_Shield
            ListLayout: "<sprite name=Shield> *BShield*"
            Layout: "<size=150%><sprite name=Shield> *BShield*"
        - Row: "$FHS_GH2E_Wildfury_05_B2$"
        - Row: "<size=150%><sprite name=Retaliate> 1"
