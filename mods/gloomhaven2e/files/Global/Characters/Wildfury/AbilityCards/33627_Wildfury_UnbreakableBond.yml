Parser: AbilityCard
Name: $ABILITY_CARD_UnbreakableBond$
Character: WildfuryID
ID: 33627
Level: 8
Initiative: 55
# card: Unbreakable Bond
# top: Attack 3 [diamond], Range 3 [square]; Attack 3 [diamond], Range 3 [square] "as if you occupied the same hex as
# the Bear": the second attack is the Wildfury's own, performed from the Bear's hex with Frosthaven's own "perform from
# a hex" var (Vars TargetingOverrideArrayIndex, Pyroclast Cloud of Ash): range, line of sight and adjacency count from
# the Bear's hex (rulebook p21); it needs the Bear on the map. The name TAllyAttack keeps the enhancement slot. "! infuse Air/Earth (either)": an Infuse ability with the element picker
# (Infuse [Air, Earth], ShowElementPicker, can't be skipped).
# bottom: "for the next three rounds, skip your card selection and turn; your other persistents don't advance; the Bear
# takes two turns at initiative 14 each round under your control" (GH2e FAQ: you play no cards and do nothing on your
# turn; your wound doesn't hurt you and your end-of-turn conditions don't expire; for focus you are last in initiative;
# the Bear takes two full turns; your other persistents work but their slots don't move). A persistent marker bonus
# (MiscVars GHUnbreakableBond) with the card's three slots (XP on slots 1 and 3, lost after the last); its
# StartTurnAbility never fires (she has no turn while it is out; the play turn has already started). The plugin
# (GHUnbreakableBond.cs) does the rest on the rounds after the play round, from the marker and its start round (both in
# the save): no card selection, her turn skipped (initiative 99), the Bear at initiative 14 twice under her control, her
# other cards' slots held, this card's slot advanced at each of those rounds' end.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                AnimOverload: RangedAttack
            TAllyAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                AnimOverload: RangedAttack
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateBear: AllHeroSummons.Find(obj.Class.ID == "WildfuryBearID") != null
                Vars:
                    Bear: AllHeroSummons.Find(obj.Class.ID == "WildfuryBearID")
                    TargetingOverrideArrayIndex: Bear.Tile
            TInfuse:
                Infuse: [Air, Earth]
                ShowElementPicker: True
                CanUndo: False
                CanSkip: False
                SkipAnim: True
    Bottom:
        Abilities:
            BActive:
                AddActiveBonus:
                    Null: True
                    AutoTrigger: True
                    CanUndo: False
                    SkipAnim: True
                Filter: Self
                MiscVars:
                    GHUnbreakableBond: True
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: StartTurnAbility
                    XPTracker: [1,0,1]
                AnimOverload: RadialBeneficial
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAttack.Range* @TAttack.Range@</link>"
            - Column:
        - Divider:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAllyAttack* <size=100%><voffset=1>@TAllyAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAllyAttack.Range* @TAllyAttack.Range@</link>"
            - Column:
        - Row: "$FHS_GH2E_Wildfury_27_T$"
        - Row: "<size=50%> "
        - MandatoryTrigger:
            Layout:
                - Row: "<sprite name=CreateAir>/<sprite name=CreateEarth>"
    Bottom:
        - Active:
            Ability: BActive
            Icon: Positive_Move_Ally_Grant
            ListLayout: "$FHS_GH2E_Wildfury_27_B$"
            Layout: "$FHS_GH2E_Wildfury_27_B$"
        - Row: "<size=100%> "
        - XPTracker: BActive
