Parser: AbilityCard
Name: $ABILITY_CARD_GruesomeAdvantage$
Character: SilentKnifeID
ID: 32318
Level: 4
Initiative: 90
# card: Gruesome Advantage
# corrected against tools/gh2e/sheets/SilentKnife.json
# top: "+2 Attack and XP 1 if flanking OR isolated" (one +2, not +4): two mutually exclusive overrides - flanking, or
# isolated and not flanking (Xipe's +2/+2/-2 gave no XP)
# bottom: a one-slot round bonus fired after the whole attack ability (Frosthaven's DuringActionAbilityOnAttackAbility-
# Finished, Infuser Propulsive Tailwind) of a melee attack (the Drifter's Shockwave check), performing Attack 2, Range 3,
# Poison as a Blinkblade Stab Them All-style added attack. "Targeting an enemy that has Poison": the plugin
# (GHSilentKnife.cs) notes each target's Poison before its hit and lets the bonus fire only if one had it.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 4
                    DiamondEnhancements: 1
                ConditionalOverrides:
                    TAttackCO1:
                        Filter:
                            TargetType: Enemy
                            TargetAdjacentAllies: "> 0"
                        XP: 1
                        AbilityOverrides:
                            TFlankBuff:
                                Strength: 2
                    TAttackCO2:
                        Filter:
                            TargetType: Enemy
                            TargetAdjacentAllies: "== 0"
                            TargetAdjacentAlliesOfTarget: "== 0"
                        XP: 1
                        AbilityOverrides:
                            TIsolatedBuff:
                                Strength: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BActive:
                Filter: Self
                AnimOverload: PowerUp
                AddActiveBonus:
                    Attack: 2
                    Range: 3
                    Conditions: Poison
                    Filter: Enemy
                    CanUndo: False
                ActiveBonus:
                    Behaviour: DuringActionAbilityOnAttackAbilityFinished
                    ValidAbilityTypes: [Attack]
                    Duration: Round
                    AttackType: Melee
                    XPTracker: [0]
                    Vars:
                        AttackAbility: TriggerAbility
                        ValidateIsMeleeAttack: AttackAbility.IsMeleeAttack
Layout:
    Top:
        - Row: "<size=150%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_SilentKnife_18_T$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Active:
            Ability: BActive
            Icon: Positive_Poison_Attack
            ListLayout: "$FHS_GH2E_SilentKnife_18_B$"
            Layout: "$FHS_GH2E_SilentKnife_18_B$"
