Parser: AbilityCard
Name: $ABILITY_CARD_Flintlock$
Character: SilentKnifeID
ID: 32316
Level: 3
Initiative: 51
# card: Flintlock
# corrected against tools/gh2e/sheets/SilentKnife.json (Xipe: always Attack 4 Pierce 2, trap on any hex)
# top: money tokens = loot tokens (Frosthaven FAQ section 10). "You may place one of your money tokens in the hex
# occupied by the target to add +2 Attack, Pierce 2": an optional step before the attack (TMoney, offered only while
# she holds a money token, the SilentKnifeMoney resource) picks the enemy within the attack's range; the plugin
# (GHMoneyTokens, MiscVars GHMoneyPlace) takes one token, puts one of her loot cards back on top of the loot deck and
# a loot token into that enemy's hex. The attack's +2 Attack, Pierce 2 override applies only to that enemy
# (TargetTargetedByCasterPreviousAbility + SpecificAbilityNames, the Eye of the Void port's filter).
# bottom: Frosthaven's Trapper Honeypot top shape (the loot names itself in a temp var; the trap reads the loot's
# looted tiles), here only the hexes where this loot picked up a loot token (the plugin keeps them in the temp var
# GHMoneyLootedTiles) that are now empty; the player picks one.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TMoney:
                NullTargeting: True
                Range: 2
                Target: 1
                Filter: Enemy
                SkipAnim: True
                CanUndo: False
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateMoney: Actor.GetCharacterResourceAmount("SilentKnifeMoney") >= 1
                MiscVars:
                    GHMoneyPlace: True
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                Range: 2
                Conditions: Muddle
                AnimOverload: RangedAttackPistol
                ConditionalOverrides:
                    TAttackCO:
                        Filter:
                            TargetType: Enemy
                            TargetTargetedByCasterPreviousAbility: True
                            SpecificAbilityNames: [TMoney]
                        AbilityOverrides:
                            TTokenBuff:
                                Strength: 2
                                Pierce: 2
        Infuse: Fire
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    CircleEnhancements: 1
            BLoot:
                Loot: 1
                Target: -1
                AnimOverload: Loot
                Vars:
                    LootAbility: TargetingActor.SetTempVar("SilentKnifeFlintlockLoot", Ability)
                    MoneyTilesReset: TargetingActor.SetTempVar("GHMoneyLootedTiles", list())
            BTrap:
                Trap:
                    TrapName: BearTrap
                    Conditions: [Poison, Immobilize]
                Target: 1
                SpawnDelay: 2.8
                Vars:
                    LootAbility: TargetingActor.SilentKnifeFlintlockLoot
                    ValidateHasHappened: LootAbility.AbilityHasHappened
                    LootedTiles: TargetingActor.LastAbilityPerformed and LootAbility.TilesSelected
                    MoneyTiles: TargetingActor.GHMoneyLootedTiles
                    EmptyLootedTiles: LootedTiles.Where(IsEmpty and MoneyTiles.Contains(obj))
                    ValidateHasEmptyLootedTiles: EmptyLootedTiles.Count > 0
                Targeting: Custom
                TargetingVars:
                    AddTilesInRange: EmptyLootedTiles
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAttack.Range*, <sprite name=Muddle></link>"
            - Column:
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_SilentKnife_16_T$"
        - MandatoryTrigger:
            Layout:
                - Infuse: Fire
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row: "<size=150%><sprite name=Loot> *BLoot*"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_SilentKnife_16_B$"
