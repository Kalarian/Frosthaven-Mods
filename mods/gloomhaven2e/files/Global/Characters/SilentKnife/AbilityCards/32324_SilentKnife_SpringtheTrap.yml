Parser: AbilityCard
Name: $ABILITY_CARD_SpringtheTrap$
Character: SilentKnifeID
ID: 32324
Level: 7
Initiative: 13
# card: Spring the Trap
# corrected against tools/gh2e/sheets/SilentKnife.json
# top: Frosthaven's Blinkblade Systems Reboot bottom ("may be performed while stunned; remove all negative conditions":
# IgnoreStun + RemoveConditions All over Frosthaven's negative-condition list); the heal also ignores Stun, as the
# whole action may be performed while stunned
# bottom: the trap is relocated with Frosthaven's MoveTrap (Trapper Spike Pit) after the move. The plugin
# (GHSilentKnife.cs): the traps adjacent to her when the move starts are designated (GHDesignateAdjacentTrap) and the
# only ones MoveTrap offers (range 6: at most 6 away after Move 5); the destinations, empty hexes adjacent to her, also
# offer featureless hexes adjacent to her holding an enemy (GHMoveTrapOntoEnemy): the trap springs on that enemy at once
# and she gains XP 1.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TCleanse:
                IgnoreStun: True
                RemoveConditions: "All"
                Conditions: [Wound, Brittle, Bane, Poison, Immobilize, Disarm, Impair, Stun, Muddle]
                Filter: Self
                AnimOverload: PowerUp
            THeal:
                Heal:
                    Amount: 5
                    DiamondPlusEnhancements: 1
                IgnoreStun: True
                Filter: Self
                AnimOverload: Heal
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    CircleEnhancements: 1
                Jump: True
                MiscVars:
                    GHDesignateAdjacentTrap: True
            BMoveTrap:
                MoveTrap:
                Range: 6
                RangeIsBase: True
                Target: 1
                TargetIsBase: True
                MoveTrapRange: 1
                MiscVars:
                    GHMoveTrapOntoEnemy: True
Layout:
    Top:
        - Row: "$FHS_GH2E_SilentKnife_24_T$"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_SilentKnife_24_T2$"
        - Row: "<size=50%> "
        - Row: "<size=150%><sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
    Bottom:
        - Row: "$FHS_GH2E_SilentKnife_24_B$"
        - Row: "<size=50%> "
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
            - Column:
                - Row: "<link=fhpill><sprite name=Jump></link>"
            - Column:
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_SilentKnife_24_B2$"
