# card: Unwilling Sacrifice
# top: one enemy with Plague (any range) suffers Damage 2 for each Plague it has (plugin GHPerPlague, MiscVars
# GH2E_PerPlague). Then plugin GHUnwillingSacrifice (MiscVars GH2E_UnwillingSacrifice): the player removes any number of
# its Plague (up to the tokens it had before the damage, so also when it was killed, and the enemies adjacent to its
# hex); TSpread (the template, MiscVars GH2E_PlagueSpreadTemplate, taken off the card when it is read) is then performed
# with that many targets among the enemies adjacent to that hex: Damage 1 and Plague each.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TDamage:
                Damage: 2
                Range: 99
                Target: 1
                Filter:
                    TargetType: Enemy
                    TargetHasCharacterResource: ["Plague"]
                MiscVars:
                    GH2E_PerPlague: True
                    GH2E_UnwillingSacrifice: True
                AnimOverload: TargetedDebuff
                SubAbilities:
                    TSpread:
                        Damage: 1
                        Range: 1
                        Target: 1
                        Filter: Enemy
                        TreatAsNonSubAbility: True
                        MiscVars:
                            GH2E_PlagueSpreadTemplate: True
                        ResourcesToGiveToTargets:
                            - ["Plague", 1]
                        AnimOverload: TargetedDebuff
        XP: 1
    Bottom:
        Abilities:
            BPoison:
                Poison: True
                Target: 3
                Range:
                    Amount: 4
                    SquareEnhancements: 1
                Filter: Enemy
                AnimOverload: RadialNegativeTarget
