Parser: AbilityCard
Name: $ABILITY_CARD_SuccumbtotheGift$
Character: Plagueherald2ID
ID: 33023
Level: 6
Initiative: 81
# card: Succumb to the Gift
# top: on a kill, XP 1 and a Damage 3 + Poison trap in the killed enemy's hex: a sub-ability gated on the kill
# (ActorsKilledByAbility, the 1st edition Hatchet's Fearsome Efficiency) placing the trap on the attack's hex (Custom
# targeting on the parent's selected tile, as CARD_FIXES 20136 Petrify), only in a featureless hex (the trap's own
# PlacementTileFilter: FeaturelessHex; the engine's default is an empty hex). The trap
# uses the 1st edition Tinkerer's poison trap model. Untested shape.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 5
                    DiamondEnhancements: 1
                Range: 99
                Target: 1
                AttackHasAdvantage: True
                Filter:
                    TargetType: Enemy
                    TargetHasCharacterResource: ["Plague"]
                AnimOverload: RangedAttack
                SubAbilities:
                    # "If the attack ability killed an enemy, gain XP 1": its own kill-gated step (the Convert the Flock
                    # BXP shape), so the XP doesn't depend on the trap finding a featureless hex (re-audit)
                    TXP:
                        GainXP: 1
                        Filter: Self
                        StartAbilityRequirements:
                            Type: SubAbility
                            ActorsKilledByAbility: "> 0"
                        TreatAsNonSubAbility: True
                        AutoTrigger: True
                        AnimOverload: None
                    TTrap:
                        Trap:
                            TrapName: Trap
                            Damage: 3
                            Conditions: Poison
                            PlacementTileFilter: FeaturelessHex
                        Target: 1
                        Targeting: Custom
                        TargetingVars:
                            ParentTile: ParentAbility.m_TilesSelected[0]
                            AddTileInRange: ParentTile
                        StartAbilityRequirements:
                            Type: SubAbility
                            ActorsKilledByAbility: "> 0"
                        TreatAsNonSubAbility: True
                        AutoTrigger: True
                        SpawnDelay: 2.8
                        AnimOverload: None
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BBless:
                Bless: True
                Range: 5
                Target: -1
                Filter:
                    TargetType: Ally
                    TargetHasNegativeCondition: Poison
                AnimOverload: RadialPositive
Layout:
    Top:
        - Row: "<size=150%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$FHS_GH2E_Plagueherald2_23_T$"
        - Row: "$FHS_Advantage$"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Plagueherald2_23_T2$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row: "<size=150%><sprite name=Bless>"
        - Row: "$FHS_GH2E_Plagueherald2_23_B$"
