Parser: AbilityCard
Name: $ABILITY_CARD_WiltandWither$
Character: Plagueherald2ID
ID: 33020
Level: 5
Initiative: 91
# card: Wilt and Wither
# top: the second ability, "each enemy suffers 1 for each Plague that enemy has" (plugin GHPerPlague, MiscVars
# GH2E_PerPlague). bottom: "during this and your next turn, double all damage that enemies that have Plague suffer": a
# persistent bonus with two use slots (XP 1 each) spent by an end-of-turn trigger (this turn, then your next turn: it
# ends at the end of your next turn); while it is in play, plugin GHWiltAndWither (MiscVars GH2E_WiltAndWither) doubles
# all damage any enemy that has Plague suffers, from any source.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 1
                    SquareEnhancements: 1
                Target: 2
                Range: 5
                ResourcesToGiveToTargets:
                    - ["Plague", 1]
                AnimOverload: RangedAttack
            TDamage:
                Damage: 1
                Target: -1
                Targeting: All
                Filter:
                    TargetType: Enemy
                    TargetHasCharacterResource: ["Plague"]
                MiscVars:
                    GH2E_PerPlague: True
                AnimOverload: RadialNegativeMajor
    Bottom:
        Abilities:
            BWilt:
                AddActiveBonus:
                    NullTargeting: True
                    Filter: Self
                    AutoTrigger: True
                    CanSkip: False
                    SkipAnim: True
                    AnimOverload: None
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,1]
                MiscVars:
                    GH2E_WiltAndWither: True
                AnimOverload: RadialNegativeMajor
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Target> *TAttack.Target* <sprite name=Range> *TAttack.Range*</link>"
            - Column:
        - Row: "$FHS_GH2E_Plagueherald2_PLAGUE$"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Plagueherald2_20_T$"
    Bottom:
        - Active:
            Ability: BWilt
            Icon: Positive_Damage_Enemy_Aura
            ListLayout: "$FHS_GH2E_Plagueherald2_20_B$"
            Layout: "$FHS_GH2E_Plagueherald2_20_B$"
        - Row: "<size=100%> "
        - XPTracker: BWilt
