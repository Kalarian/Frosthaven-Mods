Parser: AbilityCard
Name: $ABILITY_CARD_ConverttheFlock$
Character: Plagueherald2ID
ID: 33027
Level: 8
Initiative: 57
# card: Convert the Flock
# top: control every normal and elite enemy with Plague (any range): Move 2, Attack 5 + Poison, each driven by the player (ControlActorType Player, rulebook p33). The Plague their
# attacks add comes from the class supply (plugin GHPlague). bottom: "one enemy that has Poison or
# Plague": the target pick checks either (filter Vars); it gains Plague and suffers Damage 3; on a kill, XP 1. "You may
# Teleport to the hex it occupied": a kill-gated, skippable Teleport whose only valid hex is the killed enemy's (the
# Infuser's Formless Bladestorm shape: IsValidTeleportTile).
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TControl:
                ControlActor:
                    Abilities:
                        TControlMove:
                            Move:
                                Amount: 2
                                SquareEnhancements: 1
                            StrengthIsBase: True
                        TControlAttack:
                            Attack:
                                Amount: 5
                                DiamondEnhancements: 1
                            Conditions: Poison
                            StrengthIsBase: True
                            ResourcesToGiveToTargets:
                                - ["Plague", 1]
                    ControlDurationType: ControlForOneAction
                    ControlActorType: Player
                Target: -1
                Targeting: All
                Filter:
                    TargetType: Enemy
                    EnemyType: [Normal, Elite]
                    TargetHasCharacterResource: ["Plague"]
                AnimOverload: MindControl
        XP: 2
    Bottom:
        Abilities:
            BDamage:
                Damage: 3
                Range: 99
                Target: 1
                Filter:
                    TargetType: Enemy
                    Vars:
                        ValidatePoisonOrPlague: target.Tokens.HasKey(CCondition.ENegativeCondition.Poison) or target.GetCharacterResourceAmount("Plague") > 0
                ResourcesToGiveToTargets:
                    - ["Plague", 1]
                AnimOverload: TargetedDebuff
                SubAbilities:
                    BXP:
                        GainXP: 1
                        Filter: Self
                        StartAbilityRequirements:
                            Type: SubAbility
                            ActorsKilledByAbility: "> 0"
                        TreatAsNonSubAbility: True
                        AutoTrigger: True
                        AnimOverload: None
                    BTeleport:
                        Teleport2: 99
                        Range: 99
                        Target: -1
                        Filter: Self
                        TreatAsNonSubAbility: True
                        CanSkip: True
                        StartAbilityRequirements:
                            Type: SubAbility
                            ActorsKilledByAbility: "> 0"
                        Vars:
                            # ActorsTargeted (the engine empties ActorsToTarget before a kill-gated sub-ability starts; re-audit)
                            KillTile: ParentAbility.ActorsTargeted[0].Tile
                        MiscVars:
                            IsValidTeleportTile: tile.Equals(KillTile)
                        AnimOverload: Teleport Into
                        AnimOverload2: Teleport Outof
Layout:
    Top:
        - Row: "$FHS_GH2E_Plagueherald2_27_T$"
        - Row: "<size=150%><sprite name=Move> *TControl.TControlMove* <size=100%><voffset=1>@TControl.TControlMove@"
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Attack> *TControl.TControlAttack* <size=100%><voffset=1>@TControl.TControlAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Poison></link>"
            - Column:
        - Row: "$FHS_GH2E_Plagueherald2_PLAGUE$"
    Bottom:
        - Row: "$FHS_GH2E_Plagueherald2_27_B$"
