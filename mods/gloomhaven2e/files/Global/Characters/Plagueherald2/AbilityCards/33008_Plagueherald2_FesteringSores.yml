Parser: AbilityCard
Name: $ABILITY_CARD_FesteringSores$
Character: Plagueherald2ID
ID: 33008
Level: 1
Initiative: 11
# card: Festering Sores
# top: Wound + Plague on one enemy within range 4, then the persistent trigger as Frosthaven's Deathwalker writes
# "when an enemy dies" (When Your Time Comes bottom: a self aura over all enemies, DuringActionAbilityOnDeath): here
# only enemies with Plague, one use (the card is discarded after it). Plugin GHFesteringSores (MiscVars
# GH2E_FesteringSores): "you may" is asked (declined: the card stays), and the targets are the enemies within range 3 of
# the hex where it died (Custom targeting; the data's TriggerActor expression is the same set). bottom: -1 Move per
# Plague that enemy has (plugin GHPerPlague, MiscVars GH2E_PerPlague).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TWound:
                Wound: True
                Range:
                    Amount: 4
                    SquareEnhancements: 1
                Filter: Enemy
                ResourcesToGiveToTargets:
                    - ["Plague", 1]
                AnimOverload: TargetedDebuff
            TOnDeath:
                AddActiveBonus:
                    NullTargeting: True
                    Target: 2
                    Filter: Enemy
                    Targeting: Custom
                    TargetingVars:
                        AddValidActorsInRange: GameState.GetAllEnemiesInRange(TargetingActor, TriggerActor.ArrayIndex, 3)
                    ResourcesToGiveToTargets:
                        - ["Plague", 1]
                    AnimOverload: TargetedDebuff
                Range: 1
                Target: -1
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: DuringActionAbilityOnDeath
                    TriggerAbilitiesImmediately: True
                    TriggerOnCaster: True
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter:
                        TargetType: Enemy
                        UseTargetOriginalType: True
                        TargetHasCharacterResource: ["Plague"]
                    XPTracker: [0]
                MiscVars:
                    GH2E_FesteringSores: True
                AnimOverload: PowerUp
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BMoveDebuff:
                Move: -1
                Target: -1
                Filter: Self
                ActiveBonus:
                    Duration: Round
                    Behaviour: BuffMove
                    ValidAbilityType: Move
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter:
                        TargetType: Enemy
                        TargetHasCharacterResource: ["Plague"]
                MiscVars:
                    GH2E_PerPlague: True
                AnimOverload: RadialNegative
Layout:
    Top:
        - Row: "<size=150%><sprite name=Wound>"
        - Row: "$FHS_GH2E_Plagueherald2_PLAGUE$"
        - Row: "<sprite name=Range> *TWound.Range* @TWound.Range@"
        - Row: "<size=50%> "
        - Active:
            Ability: TOnDeath
            Icon: Positive_Damage_Enemy_Death
            ListLayout: "$FHS_GH2E_Plagueherald2_08_T$"
            Layout: "$FHS_GH2E_Plagueherald2_08_T$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Active:
            Ability: BMoveDebuff
            Icon: Negative_MoveMinus
            ListLayout: "$FHS_GH2E_Plagueherald2_08_B$"
            Layout: "$FHS_GH2E_Plagueherald2_08_B$"
