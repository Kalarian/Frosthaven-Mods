Parser: AbilityCard
Name: $ABILITY_CARD_AcceleratedEnd$
Character: Plagueherald2ID
ID: 33010
Level: 1
Initiative: 76
# card: Accelerated End
# top: "add Plague and gain XP 1 if the target has Plague" = a conditional override on the target having the resource,
# as the Hatchet's Follow Through checks The Favorite. bottom: designate one enemy with Plague (any range), then Poison
# all figures adjacent to it, allies and you included (TreatAsNonSubAbility, see CARD_FIXES 20304 / 20301).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                Range:
                    Amount: 4
                    SquareEnhancements: 1
                ConditionalOverrides:
                    TAttackPlagueCO:
                        Filter:
                            TargetType: Enemy
                            TargetHasCharacterResource: ["Plague"]
                        XP: 1
                        AbilityOverrides:
                            TPlagueAdd:
                                ResourcesToGiveToTargets:
                                    - ["Plague", 1]
                AnimOverload: RangedAttack
    Bottom:
        Abilities:
            BDesignate:
                NullTargeting: True
                Range: 99
                Target: 1
                Filter:
                    TargetType: Enemy
                    TargetHasCharacterResource: ["Plague"]
                AnimOverload: TargetedDebuff
                SubAbilities:
                    BPoisonAll:
                        Poison: True
                        Range: 1
                        Target: -1
                        Filter: [Enemy, Ally, Self]
                        AllTargetsAdjacentToParentTargets: True
                        TreatAsNonSubAbility: True
                        AutoTrigger: True
                        AnimOverload: RadialNegative
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAttack.Range* @TAttack.Range@</link>"
            - Column:
        - Row: "$FHS_GH2E_Plagueherald2_10_T$"
    Bottom:
        - Row: "$FHS_GH2E_Plagueherald2_10_B$"
        - Row: "<size=150%><sprite name=Poison>"
        - Row: "$FHS_GH2E_Plagueherald2_10_B2$"
