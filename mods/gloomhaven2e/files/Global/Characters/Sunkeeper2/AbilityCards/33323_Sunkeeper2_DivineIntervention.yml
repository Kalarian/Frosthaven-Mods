Parser: AbilityCard
Name: $ABILITY_CARD_DivineIntervention$
Character: Sunkeeper2ID
ID: 33323
Level: 6
Initiative: 9
# card: Divine Intervention
# top: the 1st edition card's damage redirect (PreventAndApplyToActiveBonusCaster, optional per hit).
# bottom consume: "enemies' positive and 2x modifier cards count as +0 this round": Frosthaven's Iron Helmet rewrite
# (ChangeAttackModifier, Behaviour AdjustWhenAttacked: a drawn modifier is replaced when the holder is the attack's
# target) with +1, +2 and 2x -> +0, for the round, on you and every ally (Targeting All): every enemy attack on your side.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TPrevent:
                PreventDamage: 1
                Filter: [Self]
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: PreventAndApplyToActiveBonusCaster
                    IsAura: True
                    AuraFilter: [Ally]
                    AuraTargeting: All
                    ToggleIsOptional: True
                AnimOverload: PowerUp
        XP: 2
    Bottom:
        Abilities:
            BShield:
                Shield: 1
                Range: 3
                Target: -1
                Filter: [Self, Ally]
                ActiveBonusDuration: Round
                AnimOverload: Persistent Buff
            BCLight:
                Consume:
                    Elements: Light
                    Abilities:
                        BCLightAdjust:
                            ChangeAttackModifier:
                            ReplaceModifiers: ["+1", "+2", "*2"]
                            ReplaceWithModifier: "+0"
                            Target: -1
                            Targeting: All
                            Filter: [Self, Ally]
                            ActiveBonus:
                                Duration: Round
                                Behaviour: AdjustWhenAttacked
                            AnimOverload: PositiveBuffRadial
                    XP: 1
Layout:
    Top:
        - Active:
            Ability: TPrevent
            Icon: Positive_DamagePrevent
            ListLayout: "$FHS_GH2E_Sunkeeper2_23_T$"
            Layout: "$FHS_GH2E_Sunkeeper2_23_T$"
    Bottom:
        - Row: "$FHS_GH2E_Sunkeeper2_23_B$"
        - Row: "<size=20%> "
        - Active:
            Ability: BShield
            Icon: Positive_Shield
            ListLayout: "<sprite name=Shield> *BShield*"
            Layout:
                - Row: "<size=150%><sprite name=Shield> *BShield*"
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: BCLight
                    Text: "$FHS_GH2E_Sunkeeper2_23_B2$"
