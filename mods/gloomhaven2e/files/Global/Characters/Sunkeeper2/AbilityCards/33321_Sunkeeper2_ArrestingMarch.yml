Parser: AbilityCard
Name: $ABILITY_CARD_ArrestingMarch$
Character: Sunkeeper2ID
ID: 33321
Level: 5
Initiative: 22
# card: Arresting March
# top consume: "Heal 3, target the target of the grant ability": a heal of its own within the grant's range 3 on one
# ally (the player picks the granted ally).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            # the consume's heal comes first: hung after the grant (ControlActor), switching Light on stopped the game
            # (CardsActionControlller.RefreshConsumeBar NullReference, "StackedAugmentToNullAbility", 2e rerun 2026-11-01 12:34)
            TCLight:
                Consume:
                    Elements: Light
                    Abilities:
                        TCLightHeal:
                            Heal: 3
                            Range: 3
                            Filter: Ally
                            AnimOverload: Heal
                    XP: 1
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyAttack:
                            Attack:
                                Amount: 3
                                SquareEnhancements: 1
                            Conditions: Stun
                            StrengthIsBase: True
                            RangeIsBase: True
                Range: 3
                Filter: Ally
                AnimOverload: ControlAlly
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BAlly:
                ControlActor:
                    Abilities:
                        BAllyMove:
                            Move:
                                Amount: 3
                                SquareEnhancements: 1
                            StrengthIsBase: True
                Range: 3
                Filter: Ally
                AnimOverload: ControlAlly
Layout:
    Top:
        - Row: "$FHS_GH2E_Sunkeeper2_21_T$"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Attack> *TAllyAttack* <size=100%><voffset=1>@TAllyAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Stun></link>"
            - Column:
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCLight
                    Text: "$FHS_GH2E_Sunkeeper2_21_T2$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Sunkeeper2_21_T$"
        - Row: "<size=20%> "
        - Row: "<size=150%><sprite name=Move> *BAllyMove* <size=100%><voffset=1>@BAllyMove@"
