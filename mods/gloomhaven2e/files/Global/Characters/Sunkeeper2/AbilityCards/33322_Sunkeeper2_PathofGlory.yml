Parser: AbilityCard
Name: $ABILITY_CARD_PathofGlory$
Character: Sunkeeper2ID
ID: 33322
Level: 5
Initiative: 48
# card: Path of Glory
# bottom: "Strengthen, Bless all allies moved through": a plain Move, then its own condition ability over the walked
# path with Targeting All (the Trample fix in CARD_FIXES: the move-path branch of Frosthaven's targeting needs
# Targeting other than Range).
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 4
                    DiamondEnhancements: 1
                Pierce: 1
                Conditions: Muddle
                AnimOverload: MeleeSmite
        Consumes:
            TCLight:
                Elements: Light
                AbilityOverrides:
                    TCLightAttackBuff:
                        ParentName: TAttack
                        Strength: 1
                        AttackHasAdvantage: True
                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 6
                    CircleEnhancements: 1
            BStrengthen:
                Strengthen: True
                Conditions: Bless
                AllTargetsOnMovePath: True
                Targeting: All
                Target: -1
                Filter: Ally
                AnimOverload: PositiveBuffRadial
        Infuse: Light
        XP: 2
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Pierce> *TAttack.Pierce*, <sprite name=Muddle></link>"
            - Column:
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCLight
                    Text: "+1 <sprite name=Attack>, $FHS_Advantage$, <sprite name=XP1>"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row: "<size=150%><sprite name=Strengthen>, <sprite name=Bless>"
        - Row: "<size=40%> "
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=1%> "
            - Column:
                - Row: "<link=fhpill><sprite name=Target> all <sprite name=Allies> moved through</link>"
            - Column:
        - Row: "<size=50%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Light
