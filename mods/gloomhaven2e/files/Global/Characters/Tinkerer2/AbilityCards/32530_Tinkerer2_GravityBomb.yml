Parser: AbilityCard
Name: $ABILITY_CARD_GravityBomb$
Character: Tinkerer2ID
ID: 32530
Level: 9
Initiative: 85
# card: Gravity Bomb
# Xipe's 99059 is a placeholder (plain Attack 3 / Move 3); written from tools/gh2e/sheets/Tinkerer.json
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            # The "Gravity Bomb" token (summons/GravityBomb.yml: a map token that keeps its hex empty), placed in an empty
            # hex within range 4. The card stays in the active area while the token stands (persistent, as printed).
            # At the end of your next turn (not the turn it is placed) GHMapTokens.cs has the token perform its three
            # abilities: Pull 2 on all enemies within range 2 toward the token, damage 5 to an enemy in the token's hex,
            # damage 1 to the enemies adjacent to it; then the token leaves the map and this card goes to the discard.
            TSummon:
                Summon: GravityBombID
                Range: 4      # "in an empty hex within Range 4" (CAbilitySummon.SelectSummonPosition reads the range)
                AnimOverload: Summon
    Bottom:
        Abilities:
            BAttack:
                Attack: 2
                Range: 3
                Conditions: Immobilize
                AreaEffect: "0,0,R|2,0,R|1,1,R"
                MultiPassAttack: False
                AnimOverload: RangedAttack
Layout:
    Top:
        - Row: "$FHS_GH2E_Tinkerer2_30_T$"
    Bottom:
        - ColumnWidths: "65,35"
        - Column:
            - Row:
                - ColumnWidths: "10,35,45,10"
                - Column:
                - Column: "<size=150%><sprite name=RangedAttack> *BAttack*"
                - Column:
                    - Row: "<link=fhpill><sprite name=Range> *BAttack.Range*, <sprite name=Immobilize></link>"
                - Column:
        - Column:
            - Row: "£Area£"
