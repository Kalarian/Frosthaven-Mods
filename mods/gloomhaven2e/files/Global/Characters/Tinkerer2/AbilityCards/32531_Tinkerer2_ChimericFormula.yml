Parser: AbilityCard
Name: $ABILITY_CARD_ChimericFormula$
Character: Tinkerer2ID
ID: 32531
Level: 9
Initiative: 33
# card: Chimeric Formula
# Xipe's 99060 is a placeholder (plain Attack 3 / Move 3); written from tools/gh2e/sheets/Tinkerer.json
Discard: [Discard,Permanently Lost]
Data:
    Top:
        Abilities:
            # Heal 3, Strengthen, Bless on one ally within range 3
            THeal:
                Heal:
                    Amount: 3
                    DiamondPlusEnhancements: 1
                Range: 3
                Target: 1
                Filter: Ally
                Conditions: [Strengthen, Bless]
                AnimOverload: Heal
            # "The target of the heal ability may immediately play up to two cards from their hand, performing at most
            # one top and one bottom action of the cards": the same printed rule as Bright Aegis's consume, built the
            # same way: Frosthaven's extra turn (ExtraTurn: BothActions, the 1st edition Unwavering Mandate, verified)
            # given to the character the heal just targeted (TargetTargetedByCasterPreviousAbility + SpecificAbilityNames)
            THealExtraTurn:
                ExtraTurn: BothActions
                Range: 3
                PreviewEffectId: Sunkeeper
                PreviewEffectText: FHS_GH2E_Tinkerer2_31_T2
                Filter:
                    TargetType: Ally
                    ActorType: Player
                    TargetTargetedByCasterPreviousAbility: True
                    SpecificAbilityNames: [THeal]
    Bottom:
        Abilities:
            # "One ally within Range 3 may Recover one card from the lost pile of one ally adjacent to them": the card
            # comes back to the hand of its owner, a character adjacent to an ally (character or summon, not you) within
            # range 3; that owner may be you (QUESTIONS.md C: own card allowed, the chosen ally must be within range 3).
            # GHTinkerer.cs builds the targets (misc var GHAdjacentToAllyInRange); the owner picks the card.
            BRecover:
                RecoverLostCards: 1
                Range: 3
                Filter:
                    TargetType: [Self, Ally]
                    ActorType: Player
                AnimOverload: TargetRecover
                MiscVars:
                    GHAdjacentToAllyInRange: True
        XP: 3
Layout:
    Top:
        - Row: "<size=150%><sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
        - Row: "$FHS_GH2E_Tinkerer2_31_T$"
        - Row: "<sprite name=Strengthen> <sprite name=Bless>"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Tinkerer2_31_T2$"
    Bottom:
        - Row: "$FHS_GH2E_Tinkerer2_31_B$"
