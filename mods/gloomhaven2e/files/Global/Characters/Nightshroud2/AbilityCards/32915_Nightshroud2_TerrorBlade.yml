Parser: AbilityCard
Name: $ABILITY_CARD_TerrorBlade$
Character: Nightshroud2ID
ID: 32915
Level: 3
Initiative: 32
# card: Terror Blade
# top: Attack 5, Push 3 (inline sub-ability), Muddle; "if the target is adjacent to none of its allies after the push,
# it suffers damage 2" = a Damage 2 aimed at the attack's target (custom targeting), only when no figure allied to it
# stands adjacent (the adjacency test of Frosthaven's Crashing Tide Powerful Pincer: GameState.GetActorsInRange +
# CActor.AreActorsAllied).
# bottom: two Tears within range 3, the second not adjacent to (or on) the first (a custom tile list built from the first
# Tear's hex), then Teleport 3 onto a Tear (Teleport2 with IsValidTeleportTile on shadow hexes; with the two-Tear limit
# the older Tears are gone, so only these two remain); "on your next two attacks, double the value of the attack" = the 1st edition Empowering
# Void's scalar attack buff (Attack 2, AbilityStrengthIsScalar), two use slots with XP on both.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 5
                    DiamondEnhancements: 1
                Conditions: Muddle
                SubAbilities:
                    TAttackSubPush:
                        Push:
                            Amount: 3
                            SquareEnhancements: 1
                        IsInlineSubAbility: True
            TDamage:
                Damage: 2
                Filter: Enemy
                Target: -1
                AutoTrigger: True
                CanSkip: False
                Targeting: Custom
                Vars:
                    Struck: CustomAbility.FindAbilityInPhaseByName("TAttack")
                TargetingVars:
                    AddValidActorsInRange: Struck.ActorsToTarget
                    AddActorsToTarget: Struck.ActorsToTarget
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateStruck: Struck != null && Struck.ActorsToTarget.Count > 0
                        Victim: Struck.ActorsToTarget[0]
                        ValidateAlive: Victim.IsDead == False
                        ValidateAlone: GameState.GetActorsInRange(Victim.ArrayIndex, 1).Where(obj != Victim && obj.IsAdjacentTo(Victim) && CActor.AreActorsAllied(obj.Type, Victim.Type, obj, null)).Count == 0
                AnimOverload: Debuff
        XP: 1
    Bottom:
        Abilities:
            BTear1:
                CreateShadow:
                HelpBoxTooltipLocKey: "GH2E_Nightshroud2_TEAR_PLACE_HELP"
                Range: 3
                Target: 1
                AnimOverload: Shadow Manipulation
            # the second Tear: within range 3, not adjacent to the first (Dig Pit's custom tile list from an earlier
            # ability of the action)
            BTear2:
                CreateShadow:
                HelpBoxTooltipLocKey: "GH2E_Nightshroud2_TEAR_PLACE_HELP"
                Target: 1
                Targeting: Custom
                Vars:
                    FirstTear: CustomAbility.FindAbilityInPhaseByName("BTear1")
                TargetingVars:
                    AddTilesInRange: GameState.GetTilesInRange(TargetingActor, 3).Where(CustomAbility.GetAdjacentTiles(FirstTear.TilesSelected, true).Contains(obj) == false)
                AnimOverload: Shadow Manipulation
            BTeleport:
                Teleport2: 3
                Filter: Self
                MiscVars:
                    IsValidTeleportTile: CustomAbility.SteppedOnShadow(Tile)
                    GH2ETearOnly: True
                    GH2ETearPlacedOnly: True
                AnimOverload: Teleport Into
                AnimOverload2: Teleport Outof
            BDouble:
                Attack: 2
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffAttack
                    AbilityStrengthIsScalar: True
                    XPTracker: [1,1]
        Infuse: Dark
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Push> *TAttackSubPush* <voffset=1>@TAttackSubPush@</link>"
                - Row: "<link=fhpill>, <sprite name=Muddle></link>"
            - Column:
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Nightshroud2_15_T$"
    Bottom:
        - Row: "$FHS_GH2E_Nightshroud2_15_B$"
        - Row: "<size=50%> "
        - Active:
            Ability: BDouble
            Icon: Positive_AttackPlus
            ListLayout: "$FHS_GH2E_Nightshroud2_15_B2$"
            Layout: "$FHS_GH2E_Nightshroud2_15_B2$"
        - Row: "<size=50%> "
        - MandatoryTrigger:
            Layout:
                - Infuse: Dark
        - XPTracker: BDouble
