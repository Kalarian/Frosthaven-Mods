Parser: AbilityCard
Name: $ABILITY_CARD_SwallowedbyNight$
Character: Nightshroud2ID
ID: 32927
Level: 9
Initiative: 73
# card: Swallowed by Night
# top: Stun + Curse, range 1. If you have Invisible: a Tear adjacent to the target (Seeping Tendrils' shape). If you
# don't and the target is a normal enemy standing on a Tear: you may kill it (a custom-targeted Kill on the stun's
# target, optional), which removes that Tear (RemoveShadow on its hex, Deathwalker Fluid Night's form) and gives you
# Invisible; XP 1 on the kill (AbilityXP).
# bottom: "during this and the next four rounds, you may perform attack abilities while you have Invisible": a
# persistent marker bonus whose five slots advance at each round's end (EndRoundAbility, XP on slots 1, 3, 5); while
# it is active the class mat's no-attack rule lets her attacks through (GHNightshroud.cs). "When this card is moved
# from your active area to your lost pile, you become exhausted": GHTears.cs exhausts her when the card goes from the
# active area to the lost pile (after her action if it is her turn, else at the next exhaustion check).
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TStun:
                Stun: True
                Conditions: Curse
                Range:
                    Amount: 1
                    SquareEnhancements: 1
                Filter: Enemy
                AnimOverload: WeakRadial
            TTear:
                CreateShadow:
                HelpBoxTooltipLocKey: "GH2E_Nightshroud2_TEAR_PLACE_HELP"
                Target: 1
                Targeting: Custom
                Vars:
                    Stunned: CustomAbility.FindAbilityInPhaseByName("TStun")
                TargetingVars:
                    AddTilesInRange: CustomAbility.GetAdjacentTiles(Stunned.ActorsToTarget)
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateHasInvisibility: TargetingActor.Tokens.HasKey(CCondition.EPositiveCondition.Invisible)
                AnimOverload: Shadow Manipulation
            TKill:
                Kill: True
                Filter:
                    TargetType: Enemy
                    EnemyType: Normal
                Target: -1
                AbilityXP: 1
                Targeting: Custom
                MiscVars:
                    # only a Nightshroud's Tear passes SteppedOnShadow in this requirement (GHTears), not a Deathwalker's shadow
                    GH2ETearOnly: True
                Vars:
                    Stunned: CustomAbility.FindAbilityInPhaseByName("TStun")
                TargetingVars:
                    AddValidActorsInRange: Stunned.ActorsToTarget
                    AddActorsToTarget: Stunned.ActorsToTarget
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateNotInvisible: TargetingActor.Tokens.HasKey(CCondition.EPositiveCondition.Invisible) == False
                        ValidateOnTear: Stunned != null && Stunned.ActorsToTarget.Any(obj.IsDead == False && CustomAbility.SteppedOnShadow(obj.Tile))
                AnimOverload: Kill
                SubAbilities:
                    TKillSubRemoveTear:
                        RemoveShadow:
                        Target: 1
                        AutoTrigger: True
                        SkipAnim: True
                        CanUndo: False
                        TreatAsNonSubAbility: True
                        Targeting: Custom
                        TargetingVars:
                            AddTilesInRange: ParentAbility.TilesSelected
                            AddSelectedTiles: ParentAbility.TilesSelected
                    # (Targeting Range set: as a sub-ability of the custom-targeted kill it took Custom targeting with no vars, and
                    # the game threw "Invalid targeting type" at the error screen, harness 2026-11-02 08:55)
                    TKillSubInvisible:
                        Invisible: True
                        Filter: Self
                        Targeting: Range
                        AutoTrigger: True
                        TreatAsNonSubAbility: True
                        AnimOverload: TurnInvisible
    Bottom:
        Abilities:
            # An AddActiveBonus with a Null add-ability (Elementalist2 Lingering Essence / Soothsinger2 TSongTimer shape):
            # the engine only runs an EndRoundAbility bonus, and advances its tracker, when the bonus's ability is an
            # AddActiveBonus (PhaseManager.NextActiveBonusOrScenarioModifier -> CEndRoundAbilityActiveBonus.TriggerAbility).
            # The earlier NullTargeting ability with ActiveBonus.AbilityData never ticked (AbilityData is not read for
            # this behaviour), so the card stayed active forever (harness 20261103-110730).
            BActive:
                AddActiveBonus:
                    Null: True
                    Filter: Self
                    AutoTrigger: True
                    SkipAnim: True
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndRoundAbility
                    XPTracker: [1,0,1,0,1]
Layout:
    Top:
        - Row: "<size=150%><sprite name=Stun>, <sprite name=Curse>"
        - Row: "<size=40%> "
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=1%> "
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TStun.Range* @TStun.Range@</link>"
            - Column:
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Nightshroud2_27_T$"
    Bottom:
        - Active:
            Ability: BActive
            Icon: Icon_Invisible
            ListLayout: "$FHS_GH2E_Nightshroud2_27_B$"
            Layout: "$FHS_GH2E_Nightshroud2_27_B$"
        - Row: "<size=100%> "
        - XPTracker: BActive
