Parser: AbilityCard
Name: $ABILITY_CARD_ClawsoftheNight$
Character: Nightshroud2ID
ID: 32921
Level: 6
Initiative: 56
# card: Claws of the Night
# top: Attack 5, then the persistent "at the end of your next turn, if you do not have Invisible, you may perform Attack
# 5" with one slot (XP 1): EndTurnAbility, skipped on the turn it is played (CheckingBonus.InternalRoundNumber > 0 in
# the bonus Requirements) and run only without Invisible (Deathwalker Fluid Night's form).
# bottom: "when you next kill an enemy this round, place one Tear in the hex they occupied" = Slice Through's kill
# trigger (Deathwalker When Your Time Comes shape) for the round, one use, your kills only.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 5
                    DiamondEnhancements: 1
            TActive:
                AddActiveBonus:
                    Attack:
                        Amount: 5
                        DiamondEnhancements: 1
                    Filter: Enemy
                    AnimOverload: HeavyAttack
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1]
                    Requirements:
                        Vars:
                            ValidateNotInvisible: Actor.Tokens.HasKey(CCondition.EPositiveCondition.Invisible) == False
                            # not the turn the card is played (CheckingBonus = this bonus; rounds since it was placed)
                            ValidateNextTurn: CheckingBonus.InternalRoundNumber > 0
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BActive:
                AddActiveBonus:
                    CreateShadow:
                    Targeting: Custom
                    TargetingVars:
                        AddTileInRange: TargetTile
                    Target: 1
                    CanUndo: False
                    AnimOverload: Shadow Manipulation
                Range: 1
                Target: -1
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Round
                    Behaviour: DuringActionAbilityOnDeath
                    TriggerAbilitiesImmediately: True
                    TriggerOnCaster: True
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter:
                        TargetType: Enemy
                        UseTargetOriginalType: True
                    XPTracker: [0]
                    Vars:
                        TargetTile: TriggerActor.Tile
                        # "whenever YOU kill an enemy": the cause of death must be your ability (SetupTriggerContext
                        # checks these before the slot is used, so other figures' kills leave the card alone)
                        ValidateHasAbility: TriggerAbility != null
                        ValidateYourKill: TriggerAbility.TargetingActor == ActiveBonus.Caster
Layout:
    Top:
        - Row: "<size=150%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Divider:
        - Active:
            Ability: TActive
            Icon: Positive_AttackPlus
            ListLayout: "$FHS_GH2E_Nightshroud2_21_T$"
            Layout: "$FHS_GH2E_Nightshroud2_21_T$"
        - Row: "<size=100%> "
        - XPTracker: TActive
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Active:
            Ability: BActive
            Icon: Positive_Shadow_Enemy_Death
            ListLayout: "$FHS_GH2E_Nightshroud2_21_B$"
            Layout: "$FHS_GH2E_Nightshroud2_21_B$"
