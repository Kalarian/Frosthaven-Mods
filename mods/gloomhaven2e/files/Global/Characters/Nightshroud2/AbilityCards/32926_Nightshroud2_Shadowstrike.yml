Parser: AbilityCard
Name: $ABILITY_CARD_Shadowstrike$
Character: Nightshroud2ID
ID: 32926
Level: 8
Initiative: 90
# card: Shadowstrike
# top: "enemies in the red hexes suffer damage 2": Damage can't take an area (CARD_FIXES 20225), so the area is a
# NullTargeting ability and the damage its sub-ability on the figures in its red hexes (Frosthaven's Banner Spear
# Boldening Blow top: CustomAbility.ActorsOnRedHexes). The Tear hex 3,1 is a blue hex of the area (the Tear may go only
# there) and "Teleport to the Tear hex of the damage ability" may land only on it (tag GH2ETearHexTeleport, GHTears.cs);
# both need the damage ability performed (an enemy in the red hexes, 2e FAQ). Consume Dark: "play a card from your hand to perform its top or bottom action" = Frosthaven's
# SelectAndPlayCard from the hand (Blinkblade Sand in the Hourglass bottom), XP 1.
# bottom: Ward and Strengthen on you, Attack 3. Consume Dark: "this attack does not cause you to gain Invisible at the
# end of the round": a round marker bonus on you (a NullTargeting round bonus with its own list text, Blinkblade Systems
# Reboot's form); the class mat rule (GHNightshroud.cs) gives no Invisible at the round's end for this card's attack
# while it is active; XP 1.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TArea:
                NullTargeting: True
                AreaEffect: "0,0,G|2,0,R|1,1,R|4,0,E|3,1,B"
                MiscVars:
                    GH2ETearHexArea: True
                Filter: Enemy
                SkipAnim: True
                SubAbilities:
                    TAreaSubDamage:
                        Damage: 2
                        Target: -1
                        TreatAsNonSubAbility: True
                        AutoTrigger: True
                        CanSkip: False
                        Filter: Enemy
                        Targeting: Custom
                        TargetingVars:
                            AddTilesInRange: CustomAbility.ActorsOnRedHexes(ParentAbility, false).Select(Tile)
                            AddValidActorsInRange: CustomAbility.ActorsOnRedHexes(ParentAbility, false)
                        StartAbilityRequirements:
                            Type: ThisAbility
                            Vars:
                                ValidateHasHappened: Ability?.ParentAbility != null && Ability.ParentAbility.AbilityHasHappened
                        AnimOverload: Debuff
            TTear:
                CreateShadow:
                HelpBoxTooltipLocKey: "GH2E_Nightshroud2_TEARHEX_HELP"
                Target: 1
                # (the tiles are replaced by the Tear hexes of the area by GHTears.cs; Custom targeting is what makes the
                # game ask for them)
                Targeting: Custom
                TargetingVars:
                    AddTilesInRange: CustomAbility.GetAdjacentTiles(TargetingActor.Tile)
                MiscVars:
                    GH2ETearHex: True
                AnimOverload: Shadow Manipulation
            TTeleport:
                Teleport2: 2
                Filter: Self
                MiscVars:
                    GH2ETearHexTeleport: True
                AnimOverload: Teleport Into
                AnimOverload2: Teleport Outof
            TCDark:
                Consume:
                    Elements: Dark
                    Abilities:
                        TCDarkPlay:
                            SelectAndPlayCard:
                            Filter: Self
                            AnimOverload: PowerUp
                    XP: 1
    Bottom:
        Abilities:
            BWard:
                Ward: True
                Conditions: Strengthen
                Filter: Self
                AnimOverload: PowerUp
            BAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
            BCDark:
                Consume:
                    Elements: Dark
                    Abilities:
                        BCDarkMarker:
                            NullTargeting: True
                            Filter: Self
                            AnimOverload: None
                            ActiveBonus:
                                Duration: Round
                                ListLayoutOverride: [$GH2E_Nightshroud2_26_B$, Icon_Invisible]
                    XP: 1
        Infuse: Dark
Layout:
    Top:
        - Row:
            - ColumnWidths: "65,30"
            - Column:
                - Row: "$FHS_GH2E_Nightshroud2_26_T$"
            - Column: "£Area£"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Nightshroud2_26_T2$"
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCDark
                    Text: "$FHS_GH2E_Nightshroud2_26_T3$"
    Bottom:
        - Row: "<size=150%><sprite name=Ward>, <sprite name=Strengthen>"
        - Divider:
        - Row: "<size=150%><sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: BCDark
                    Text: "$FHS_GH2E_Nightshroud2_26_B2$"
        - Row: "<size=50%> "
        - Infuse: Dark
