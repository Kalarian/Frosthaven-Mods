Parser: AbilityCard
Name: $ABILITY_CARD_Shadowstrike$
Character: Nightshroud2ID
ID: 32926
Level: 8
Initiative: 90
# card: Shadowstrike
# top: "enemies in the red hexes suffer damage 2": Damage can't take an area (CARD_FIXES 20225), so the area is a
# NullTargeting ability and the damage its sub-ability on the figures in its red hexes (Frosthaven's Banner Spear
# Boldening Blow top: CustomAbility.ActorsOnRedHexes). "Teleport to the Tear hex of the damage ability" = a Tear within
# range 2 (the Tear hex 3,1 is two hexes away), then Teleport 2 onto a Tear (APPROXIMATION: not tied to the area's
# rotation). Consume Dark: "play a card from your hand to perform its top or bottom action" = Frosthaven's
# SelectAndPlayCard from the hand (Blinkblade Sand in the Hourglass bottom), XP 1.
# bottom: Ward and Strengthen on you, Attack 3. Consume Dark: "this attack does not cause you to gain Invisible at the
# end of the round" belongs to the class mat's Invisible rule (NEEDS PLUGIN): a round marker bonus on you (a
# NullTargeting round bonus with its own list text, Blinkblade Systems Reboot's form) the plugin can read; XP 1.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TArea:
                NullTargeting: True
                AreaEffect: "0,0,G|2,0,R|1,1,R|4,0,E"
                Filter: Enemy
                SkipAnim: True
                SubAbilities:
                    TAreaSubDamage:
                        Damage: 2
                        Target: -1
                        TreatAsNonSubAbility: True
                        AutoTrigger: True
                        CanSkip: False
                        Filter: Enemy
                        Targeting: Custom
                        TargetingVars:
                            AddTilesInRange: CustomAbility.ActorsOnRedHexes(ParentAbility, false).Select(Tile)
                            AddValidActorsInRange: CustomAbility.ActorsOnRedHexes(ParentAbility, false)
                        StartAbilityRequirements:
                            Type: ThisAbility
                            Vars:
                                ValidateHasHappened: Ability?.ParentAbility != null && Ability.ParentAbility.AbilityHasHappened
                        AnimOverload: Debuff
            TTear:
                CreateShadow:
                HelpBoxTooltipLocKey: "FH/GUI_PLACE_SHADOWS_HELPBOX"
                Range: 2
                Target: 1
                AnimOverload: Shadow Manipulation
            TTeleport:
                Teleport2: 2
                Filter: Self
                MiscVars:
                    IsValidTeleportTile: CustomAbility.SteppedOnShadow(Tile)
                AnimOverload: Teleport Into
                AnimOverload2: Teleport Outof
            TNull:
                Null: True
        Consumes:
            TCDark:
                Elements: Dark
                Abilities:
                    TCDarkPlay:
                        ParentName: TNull
                        SelectAndPlayCard:
                        Filter: Self
                        AnimOverload: PowerUp
                XP: 1
    Bottom:
        Abilities:
            BWard:
                Ward: True
                Conditions: Strengthen
                Filter: Self
                AnimOverload: PowerUp
            BAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
            BNull:
                Null: True
        Consumes:
            BCDark:
                Elements: Dark
                Abilities:
                    BCDarkMarker:
                        ParentName: BNull
                        NullTargeting: True
                        Filter: Self
                        AnimOverload: None
                        ActiveBonus:
                            Duration: Round
                            ListLayoutOverride: [$GH2E_Nightshroud2_26_B$, Icon_Invisible]
                XP: 1
        Infuse: Dark
Layout:
    Top:
        - Row:
            - ColumnWidths: "65,30"
            - Column:
                - Row: "$FHS_GH2E_Nightshroud2_26_T$"
            - Column: "£Area£"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Nightshroud2_26_T2$"
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCDark
                    Text: "$FHS_GH2E_Nightshroud2_26_T3$"
    Bottom:
        - Row: "<size=150%><sprite name=Ward>, <sprite name=Strengthen>"
        - Divider:
        - Row: "<size=150%><sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: BCDark
                    Text: "$FHS_GH2E_Nightshroud2_26_B2$"
        - Row: "<size=50%> "
        - Infuse: Dark
