Parser: AbilityCard
Name: $ABILITY_CARD_VoiceoftheNight$
Character: Nightshroud2ID
ID: 32928
Level: 9
Initiative: 19
# card: Voice of the Night
# top: "grant all allies in the red hexes: Teleport 3" = a NullTargeting area (Banner Spear Boldening Blow's form) whose
# sub-ability grants (ControlActor) Teleport 3 to the allies on its red hexes (CustomAbility.ActorsOnRedHexes). The two
# Tear hexes (4,0 and 2,2, both two hexes away) = two Tears within range 2 (APPROXIMATION, NOTES.md).
# bottom: Push 3 on one ally or enemy, range 1. "If the target enters a hex containing a Tear you may remove the Tear to
# have the target gain Invisible": APPROXIMATION: when the pushed figure ends on a Tear, you may give it Invisible
# (optional), and that Tear is removed (RemoveShadow on its hex).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TArea:
                NullTargeting: True
                AreaEffect: "0,0,G|2,0,R|1,1,R|3,1,R|5,1,E|4,2,E"
                Filter: Ally
                SkipAnim: True
                SubAbilities:
                    TAreaSubGrant:
                        ControlActor:
                            Abilities:
                                TAllyTeleport:
                                    Teleport2: 3
                                    StrengthIsBase: True
                                    Filter: Self
                                    AnimOverload: Teleport Into
                                    AnimOverload2: Teleport Outof
                        Target: -1
                        TreatAsNonSubAbility: True
                        Filter: Ally
                        Targeting: Custom
                        TargetingVars:
                            AddTilesInRange: CustomAbility.ActorsOnRedHexes(ParentAbility, false).Select(Tile)
                            AddValidActorsInRange: CustomAbility.ActorsOnRedHexes(ParentAbility, false)
                        AnimOverload: ControlAlly
            TTears:
                CreateShadow:
                HelpBoxTooltipLocKey: "FH/GUI_PLACE_SHADOWS_HELPBOX"
                Range: 2
                Target: 2
                AnimOverload: Shadow Manipulation
        Infuse: Dark
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BPush:
                Push:
                    Amount: 3
                    SquareEnhancements: 1
                Range: 1
                Target: 1
                Filter: [Enemy, Ally]
                AnimOverload: TargetedPull
            BInvisible:
                Invisible: True
                Filter: [Enemy, Ally]
                Target: -1
                Targeting: Custom
                Vars:
                    Pushed: CustomAbility.FindAbilityInPhaseByName("BPush")
                TargetingVars:
                    AddValidActorsInRange: Pushed.ActorsToTarget
                    AddActorsToTarget: Pushed.ActorsToTarget
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOnTear: Pushed != null && Pushed.ActorsToTarget.Any(obj.IsDead == False && CustomAbility.SteppedOnShadow(obj.Tile))
                AnimOverload: TurnInvisible
                SubAbilities:
                    BInvisibleSubRemoveTear:
                        RemoveShadow:
                        Target: 1
                        AutoTrigger: True
                        SkipAnim: True
                        CanUndo: False
                        TreatAsNonSubAbility: True
                        Targeting: Custom
                        TargetingVars:
                            AddTilesInRange: ParentAbility.TilesSelected
                            AddSelectedTiles: ParentAbility.TilesSelected
Layout:
    Top:
        - Row:
            - ColumnWidths: "60,35"
            - Column:
                - Row: "$FHS_GH2E_Nightshroud2_28_T$"
                - Row: "<size=150%><sprite name=Teleport> 3"
                - Row: "<size=20%> "
                - Row: "$FHS_GH2E_Nightshroud2_TEARHEX2$"
            - Column: "£Area£"
        - Row: "<size=50%> "
        - Infuse: Dark
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row: "<size=150%><sprite name=Push> *BPush* <size=100%><voffset=1>@BPush@"
        - Row: "$FHS_GH2E_Nightshroud2_28_B$"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Nightshroud2_28_B2$"
