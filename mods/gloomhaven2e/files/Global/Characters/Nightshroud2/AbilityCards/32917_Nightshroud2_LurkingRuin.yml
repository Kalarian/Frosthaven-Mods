Parser: AbilityCard
Name: $ABILITY_CARD_LurkingRuin$
Character: Nightshroud2ID
ID: 32917
Level: 4
Initiative: 4
# card: Lurking Ruin
# top: Poison on the 8-hex area (three hex marks as E hexes); the Tear hex (0,2, two hexes away) = a Tear within range 2
# (APPROXIMATION, NOTES.md); "you and all allies gain advantage on all attacks targeting enemies that have Poison this
# round" = a round advantage aura on you and allies (Shattersong Barbaric Yawp bottom) whose BasedOnVarsCondition
# checks the target's Poison (Deepwraith Crippling Terror bottom's condition test).
# bottom: "whenever you or an ally attack an enemy within range 2 of you this round, after the attack ability the
# attacker may perform Heal 1, self" = a round aura on you and allies firing after each attack ability
# (DuringActionAbilityOnAttackAbilityFinished, the 1st edition Black Knives top's behaviour), Heal 1 on the attacker.
# Only when one of the attack's targets is within 2 hexes of you (bonus Vars on TriggerAbility.ActorsTargeted).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TPoison:
                Poison: True
                Filter: Enemy
                AreaEffect: "0,0,G|2,0,R|4,0,R|1,1,R|3,1,R|5,1,R|2,2,R|4,2,R|6,0,E|7,1,E|6,2,E"
                AnimOverload: AggressiveTargetedShout
            TTear:
                CreateShadow:
                HelpBoxTooltipLocKey: "FH/GUI_PLACE_SHADOWS_HELPBOX"
                Range: 2
                Target: 1
                AnimOverload: Shadow Manipulation
            TAdvantage:
                Attack: 0
                AttackHasAdvantage: True
                AttackEffect:
                    Type: BasedOnVarsCondition
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Round
                    Behaviour: BuffAttack
                    IsAura: True
                    AuraFilter: [Self, Ally]
                    AuraTargeting: All
                    Vars:
                        ActorTarget: TriggerTarget
                        ValidateTargetPoisoned: ActorTarget.Tokens.HasKey(CCondition.ENegativeCondition.Poison)
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BHealAura:
                AddActiveBonus:
                    Heal: 1
                    Filter: Self
                    AnimOverload: Heal
                Filter: Self
                AnimOverload: PositiveBuffRadial
                ActiveBonus:
                    Duration: Round
                    Behaviour: DuringActionAbilityOnAttackAbilityFinished
                    IsAura: True
                    AuraFilter: [Self, Ally]
                    AuraTargeting: All
                    # "attack an enemy within range 2 (of you)": one of the attack's targets stood within 2 hexes of
                    # the Nightshroud (checked before the heal is offered)
                    Vars:
                        ValidateHasAbility: TriggerAbility != null
                        ValidateTargetNearYou: TriggerAbility.ActorsTargeted.Any(obj.GetDistanceTo(ActiveBonus.Caster) <= 2)
Layout:
    Top:
        - Row:
            - ColumnWidths: "55,40"
            - Column:
                - Row: "<size=150%><nobr><sprite name=Poison></nobr>"
                - Row: "<size=20%> "
                - Row: "$FHS_GH2E_Nightshroud2_TEARHEX$"
            - Column: "£Area£"
        - Row: "<size=20%> "
        - Active:
            Ability: TAdvantage
            Icon: Positive_Advantage_Aura
            ListLayout: "$FHS_GH2E_Nightshroud2_17_T$"
            Layout: "$FHS_GH2E_Nightshroud2_17_T$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Active:
            Ability: BHealAura
            Icon: Positive_Heal
            ListLayout: "$FHS_GH2E_Nightshroud2_17_B$"
            Layout: "$FHS_GH2E_Nightshroud2_17_B$"
