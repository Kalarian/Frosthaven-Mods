Parser: AbilityCard
Name: $ABILITY_CARD_CursedBlades$
Character: Nightshroud2ID
ID: 32918
Level: 4
Initiative: 18
# card: Cursed Blades
# top: the consume gives a second, separate Attack 2 with Curse (no "+": the sheet's note), the 1st edition Black Arrow
