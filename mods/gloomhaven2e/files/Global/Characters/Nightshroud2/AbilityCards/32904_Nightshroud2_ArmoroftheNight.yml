# (the single dashed slot: XPTracker [0]); the active bonus on the ally stands for the character token. Then a Tear in
# a hex adjacent to that ally (CreateShadow aimed with CustomAbility.GetAdjacentTiles, Cragheart2 Dig Pit's way).
Discard: [Discard,Discard]
