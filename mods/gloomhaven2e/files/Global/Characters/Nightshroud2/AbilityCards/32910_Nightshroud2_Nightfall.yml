Parser: AbilityCard
Name: $ABILITY_CARD_Nightfall$
Character: Nightshroud2ID
ID: 32910
Level: X
Initiative: 28
# card: Nightfall
# top: Push 3 with Immobilize. "If the target is pushed into one or more hexes with a Tear, they gain Muddle, Curse and
# suffer hazardous terrain damage": the plugin (GHTears.cs) marks each figure a Nightshroud push moves through or into a
# hex with one of her Tears (the actor's temp var GH2EPushTear, read here as obj.GH2EPushTear), so a Tear passed
# mid-push counts. Muddle + Curse on it, then the scenario's hazardous terrain damage (Damage 0 with StatIsBasedOnX
# ScenarioHazardousTerrainDamage, Frosthaven's Laser Spire / Algox Icespeaker Ice Wall form).
# bottom: consume Light: Heal 2, self, and infuse Dark (the 1st edition Nightfall bottom's consume-and-infuse shape).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TPush:
                Push:
                    Amount: 3
                    SquareEnhancements: 1
                Range: 1
                Filter: Enemy
                Conditions: Immobilize
                AnimOverload: TargetedPull
            TTearCurse:
                Muddle: True
                Conditions: Curse
                Filter: Enemy
                Target: -1
                AutoTrigger: True
                CanSkip: False
                Targeting: Custom
                Vars:
                    # (ActorsTargeted: a push moves each target from ActorsToTarget to ActorsTargeted once pushed, so
                    # ActorsToTarget is empty by now: the rider never fired, harness 2026-11-02)
                    Pushed: CustomAbility.FindAbilityInPhaseByName("TPush")
                TargetingVars:
                    AddValidActorsInRange: Pushed.ActorsTargeted
                    AddActorsToTarget: Pushed.ActorsTargeted
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOnTear: Pushed != null && Pushed.ActorsTargeted.Any(obj.IsDead == False && obj.GH2EPushTear == True)
                AnimOverload: WeakRadial
            TTearDamage:
                Damage: 0
                StatIsBasedOnX:
                    Strength:
                        BasedOn: ScenarioHazardousTerrainDamage
                Filter: Enemy
                Target: -1
                AutoTrigger: True
                CanSkip: False
                Targeting: Custom
                Vars:
                    Pushed: CustomAbility.FindAbilityInPhaseByName("TPush")
                TargetingVars:
                    # (the same lists as TTearCurse, seen working in game: Push targets one figure and the requirement
                    # below already checks that it entered a Tear; GHTears.cs logs "GHRule TearDamage" per hit)
                    AddValidActorsInRange: Pushed.ActorsTargeted
                    AddActorsToTarget: Pushed.ActorsTargeted
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOnTear: Pushed != null && Pushed.ActorsTargeted.Any(obj.IsDead == False && obj.GH2EPushTear == True)
                AnimOverload: Debuff
        Infuse: Dark
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    SquareEnhancements: 1
            BCLight:
                Consume:
                    Elements: Light
                    Abilities:
                        BCLightHeal:
                            Heal: 2
                            Filter: Self
                            AnimOverload: Heal
                    Infuse: Dark
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Push> *TPush* <size=100%><voffset=1>@TPush@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> 1, <sprite name=Immobilize></link>"
            - Column:
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Nightshroud2_10_T$"
        - Row: "<size=50%> "
        - Infuse: Dark
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: BCLight
                    Text: "<sprite name=Heal> 2, <voffset=-1.5><sprite name=CreateDark></voffset></size>"
