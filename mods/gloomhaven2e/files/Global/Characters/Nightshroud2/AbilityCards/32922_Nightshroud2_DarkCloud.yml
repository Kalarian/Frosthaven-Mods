Parser: AbilityCard
Name: $ABILITY_CARD_DarkCloud$
Character: Nightshroud2ID
ID: 32922
Level: 6
Initiative: 2
# card: Dark Cloud
# top: Muddle on all enemies within range 3; reveal (Eyes of the Night's shape, range 3); a Tear within range 3.
# bottom: Safeguard, self = the class's Safeguard stand-in (AUTHORING.md: Frosthaven's prevent-a-negative-condition
# bonus, Metal Mosaic perk 09 / Pain Conduit Blood Ritual: GenericOnNegativeCondition + PreventCondition on the caster,
# one prevention: XPTracker [0]). The printed diamond+ mark on Safeguard has no slot (the bonus has no condition value
# to enhance): dropped (NOTES.md).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TMuddle:
                Muddle: True
                Range: 3
                Target: -1
                Filter: Enemy
                AnimOverload: WeakRadial
            TReveal:
                NullTargeting: True
                Range: 3
                Target: -1
                Filter: Enemy
                AnimOverload: Cast_Concentrate
                PerformVars:
                    ApplyToActors:
                        Targets: ActorsToTarget
                        ShowMonsterCards: CustomAbility.ShowTopMonsterCards(Targets)
            TTear:
                CreateShadow:
                HelpBoxTooltipLocKey: "FH/GUI_PLACE_SHADOWS_HELPBOX"
                Range: 3
                Target: 1
                AnimOverload: Shadow Manipulation
        Infuse: Dark
    Bottom:
        Abilities:
            BSafeguard:
                AddActiveBonus:
                    NullTargeting: True
                    Filter: Self
                    AutoTrigger: True
                    SkipAnim: True
                    IgnoreStun: True
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: GenericOnNegativeCondition
                    TriggerOnCaster: True
                    IsToggleBonus: True
                    XPTracker: [0]
                    ListLayoutOverride: [$GH2E_SAFEGUARD$, Positive_DamagePrevent]
                    Vars:
                        ValidateIsCaster: TriggerTarget == ActiveBonus.Caster
                        PreventCondition: True
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BCurse:
                Curse: True
                Range:
                    Amount: 1
                    SquareEnhancements: 1
                Filter: Enemy
                AnimOverload: WeakRadial
        Infuse: Dark
Layout:
    Top:
        - Row: "<size=150%><sprite name=Muddle>"
        - Row: "$FHS_GH2E_Nightshroud2_22_T$"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Nightshroud2_22_T2$"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Nightshroud2_22_T3$"
        - Row: "<size=50%> "
        - Infuse: Dark
    Bottom:
        - Active:
            Ability: BSafeguard
            Icon: Positive_DamagePrevent
            ListLayout: "$FHS_GH2E_SAFEGUARD$"
            Layout: "$FHS_GH2E_SAFEGUARD$"
        - Divider:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
