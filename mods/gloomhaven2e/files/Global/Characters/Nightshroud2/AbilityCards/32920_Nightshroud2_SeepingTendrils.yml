Parser: AbilityCard
Name: $ABILITY_CARD_SeepingTendrils$
Character: Nightshroud2ID
ID: 32920
Level: 5
Initiative: 23
# card: Seeping Tendrils
# top: Immobilize, range 1. "If you have Invisible, place one Tear in a hex adjacent to the target" (CreateShadow aimed
# with GetAdjacentTiles on the immobilize's target, run only when you have Invisible: the Deepwraith's
# ValidateHasInvisibility test); "if you do not have Invisible, the target suffers damage 4" (a Damage 4 aimed at that
# target, run only without Invisible). Both read the Invisible condition: with the class mat's permanent Invisible
# still NEEDS PLUGIN, you are rarely Invisible today (NOTES.md).
# bottom: consume Dark "the targets suffer damage 1": a Damage 1 on all adjacent enemies (the push's own targets)
# performed just before the push, since after it they are no longer adjacent (same targets, same result).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TImmobilize:
                Immobilize: True
                Range:
                    Amount: 1
                    SquareEnhancements: 1
                Filter: Enemy
                AnimOverload: WeakRadial
            TTear:
                CreateShadow:
                HelpBoxTooltipLocKey: "GH2E_Nightshroud2_TEAR_PLACE_HELP"
                Target: 1
                Targeting: Custom
                Vars:
                    Held: CustomAbility.FindAbilityInPhaseByName("TImmobilize")
                TargetingVars:
                    AddTilesInRange: CustomAbility.GetAdjacentTiles(Held.ActorsToTarget)
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateHasInvisibility: TargetingActor.Tokens.HasKey(CCondition.EPositiveCondition.Invisible)
                AnimOverload: Shadow Manipulation
            TDamage:
                Damage: 4
                Filter: Enemy
                Target: -1
                AutoTrigger: True
                CanSkip: False
                Targeting: Custom
                Vars:
                    Held: CustomAbility.FindAbilityInPhaseByName("TImmobilize")
                TargetingVars:
                    AddValidActorsInRange: Held.ActorsToTarget
                    AddActorsToTarget: Held.ActorsToTarget
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateNotInvisible: TargetingActor.Tokens.HasKey(CCondition.EPositiveCondition.Invisible) == False
                        ValidateTarget: Held != null && Held.ActorsToTarget.Any(obj.IsDead == False)
                AnimOverload: Debuff
        Infuse: Dark
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BCDark:
                Consume:
                    Elements: Dark
                    Abilities:
                        BCDarkDamage:
                            Damage: 1
                            Range: 1
                            Target: -1
                            Filter: Enemy
                            AnimOverload: Debuff
                    XP: 1
            BPush:
                Push:
                    Amount: 2
                    SquareEnhancements: 1
                Range: 1
                Target: -1
                Filter: Enemy
                AnimOverload: WeakRadial
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Immobilize>"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TImmobilize.Range* @TImmobilize.Range@</link>"
            - Column:
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Nightshroud2_20_T$"
        - Row: "<size=50%> "
        - Infuse: Dark
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Push> *BPush* <size=100%><voffset=1>@BPush@"
            - Column:
                - Row: "<link=fhpill><sprite name=Target> all adjacent <sprite name=Enemy></link>"
            - Column:
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: BCDark
                    Text: "$FHS_GH2E_Nightshroud2_20_B$"
