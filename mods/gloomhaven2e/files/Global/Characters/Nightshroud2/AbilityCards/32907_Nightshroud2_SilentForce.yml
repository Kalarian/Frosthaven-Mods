Parser: AbilityCard
Name: $ABILITY_CARD_SilentForce$
Character: Nightshroud2ID
ID: 32907
Level: 1
Initiative: 8
# card: Silent Force
# top: Stun on an area (the 1st edition Soothsinger's Provoke Terror shape, a melee area from the grey hex); the Tear
# hex 4,0: the Tear hex is a blue hex of the area (it turns with it; tag GH2ETearHexArea) and the Tear placement may
# use only that hex (tag GH2ETearHex, GHTears.cs), once the area's ability was performed (2e FAQ).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TStun:
                Stun: True
                Filter: Enemy
                AreaEffect: "0,0,G|2,0,R|4,0,B"
                MiscVars:
                    GH2ETearHexArea: True
                AnimOverload: AggressiveTargetedShout
            TTear:
                CreateShadow:
                HelpBoxTooltipLocKey: "GH2E_Nightshroud2_TEARHEX_HELP"
                Target: 1
                # (the tiles are replaced by the Tear hexes of the area by GHTears.cs; Custom targeting is what makes the
                # game ask for them)
                Targeting: Custom
                TargetingVars:
                    AddTilesInRange: CustomAbility.GetAdjacentTiles(TargetingActor.Tile)
                MiscVars:
                    GH2ETearHex: True
                AnimOverload: Shadow Manipulation
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BMuddle:
                Muddle: True
                Range: 1
                Target: -1
                Filter: Enemy
                AnimOverload: WeakRadial
Layout:
    Top:
        - Row:
            - ColumnWidths: "65,30"
            - Column:
                - Row: "<size=150%><nobr><sprite name=Stun></nobr>"
                - Row: "<size=20%> "
                - Row: "$FHS_GH2E_Nightshroud2_TEARHEXB$"
            - Column: "£Area£"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Muddle>"
            - Column:
                - Row: "<link=fhpill><sprite name=Target> all adjacent <sprite name=Enemy></link>"
            - Column:
