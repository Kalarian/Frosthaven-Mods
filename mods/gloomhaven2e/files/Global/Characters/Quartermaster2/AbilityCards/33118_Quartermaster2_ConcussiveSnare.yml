Parser: AbilityCard
Name: $ABILITY_CARD_ConcussiveSnare$
Character: Quartermaster2ID
ID: 33118
Level: 3
Initiative: 89
# card: Concussive Snare
# top: give the Weighted Bolas to one adjacent ally (XP 1; printed first): the class item from the plugin (GH2E_QMGive, NOTES.md item supply), XP 1 only when given (GH2E_QMGiveXP); Move 1 [circle]; Attack 3 [diamond], Push 2 [square].
# bottom: Move 3 [circle]; gain 10 supplies.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TGive:
                NullTargeting: True
                Range: 1
                IsTargetedAbility: False
                Filter:
                    TargetType: Ally
                    ActorType: Player
                MiscVars:
                    GH2E_QMGive: 4
                    GH2E_QMGiveXP: 1
                AnimOverload: Refresh
            TMove:
                Move:
                    Amount: 1
                    CircleEnhancements: 1
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                SubAbilities:
                    TAttackSubPush:
                        Push:
                            Amount: 2
                            SquareEnhancements: 1
                        AnimOverload: None
                        IsInlineSubAbility: True
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BSupplies:
                Null: True
                Filter: Self
                ResourcesToAddOnAbilityEnd:
                    - ["Supplies", 10]
                AnimOverload: PowerUp
Layout:
    Top:
        - Row: "$FHS_GH2E_Quartermaster2_18_T$"
        - Row: "<size=50%> "
        - Row: "<size=150%><sprite name=Move> *TMove* <size=100%><voffset=1>@TMove@"
        - Divider:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Push> *TAttackSubPush* @TAttackSubPush@</link>"
            - Column:
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Quartermaster2_SUPPLIES10$"
