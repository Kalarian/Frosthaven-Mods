Parser: AbilityCard
Name: $ABILITY_CARD_SetUpShop$
Character: Quartermaster2ID
ID: 33122
Level: 5
Initiative: 41
# card: Set Up Shop
# top: persistent, not lost, XP 1 (no use slots: stays until the scenario ends, a rules question in NOTES.md).
#   - "end of each of your turns, gain 10 supplies": an EndTurnAbility bonus whose Null ability adds 10 (AutoTrigger
#     inside the bonus, as the 1st edition end-of-turn cards).
#   - "whenever an ally ends a move or teleport adjacent to you, you may spend supplies to Recover that ally's items":
#     the plugin (GHQuartermaster.cs) watches every ally's move / teleport ability end while the bonus (marked
#     GH2E_QMSetUpShop) is active and asks the Quartermaster's player (10+ supplies, the ally adjacent).
#   - mandatory "You cannot perform move abilities": the plugin makes the Quartermaster unable to perform move
#     abilities while the bonus is active (the game's own "cannot use move abilities" refusal).
# bottom: Move 4 [circle]; give the Scroll of Foresight to one adjacent ally (the plugin's class-item give); "at the end
#   of the round, Heal 2 on all allies within range 1": a round EndRoundAbility bonus (heal unmarked). TEST: the round
#   bonus still triggers in the end-of-round phase.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TActive:
                AddActiveBonus:
                    Null: True
                    Filter: Self
                    AutoTrigger: True
                    ResourcesToAddOnAbilityEnd:
                        - ["Supplies", 10]
                    AnimOverload: PowerUp
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                MiscVars:
                    GH2E_QMSetUpShop: 1
                AnimOverload: PowerUp
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BGive:
                NullTargeting: True
                Range: 1
                IsTargetedAbility: False
                Filter:
                    TargetType: Ally
                    ActorType: Player
                MiscVars:
                    GH2E_QMGive: 9
                AnimOverload: Refresh
            BActive:
                AddActiveBonus:
                    Heal: 2
                    Range: 1
                    Target: -1
                    Filter: Ally
                    AnimOverload: Heal
                Filter: Self
                ActiveBonus:
                    Duration: Round
                    Behaviour: EndRoundAbility
                AnimOverload: PowerUp
Layout:
    Top:
        - Active:
            Ability: TActive
            Icon: Refresh
            ListLayout: "$FHS_GH2E_Quartermaster2_22_T$"
            Layout: "$FHS_GH2E_Quartermaster2_22_T$"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Quartermaster2_22_T2$"
        - Row: "<size=20%> "
        - MandatoryTrigger:
            Layout:
                - Row: "$FHS_GH2E_Quartermaster2_22_T3$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Quartermaster2_22_B$"
        - Row: "<size=50%> "
        - Active:
            Ability: BActive
            Icon: Positive_HealSelf_Ally_Aura
            ListLayout: "$FHS_GH2E_Quartermaster2_22_B2$"
            Layout: "$FHS_GH2E_Quartermaster2_22_B2$"
