Parser: AbilityCard
Name: $ABILITY_CARD_Proficiency$
Character: Quartermaster2ID
ID: 33110
Level: 1
Initiative: 52
# card: Proficiency
# top: persistent, lost, XP 2. A persistent +1 melee Attack bonus marked GH2E_QMProficiencyTop: the plugin
#   (GHQuartermaster.cs) makes it count only from the first time on each of your turns that you use an item with a lost
#   icon until the turn ends. "Recover a 30+ gold item with supplies: you may gain a random class item" is the plugin's
#   supplies spend (it asks after each such recover while this bonus is active).
# bottom: persistent, lost, XP 2, marked GH2E_QMProficiencyBottom: while active, the plugin hands out (and swaps in)
#   the +1 copies of Barbed Strip (Retaliate 3) and Iron Plate (Shield 3). "Whenever you rest, gain the Barbed Strip or
#   Iron Plate" = on each short or long rest (both rest behaviours, as Crashing Tide's Cleansing Swell lists them) a
#   self give the plugin performs, asking which of the two.
Discard: [Lost,Lost]
Data:
    Top:
        Abilities:
            TAttackBuff:
                Attack: 1
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffAttack
                    AttackType: Melee
                MiscVars:
                    GH2E_QMProficiencyTop: 1
                AnimOverload: PowerUp
        XP: 2
    Bottom:
        Abilities:
            BActive:
                AddActiveBonus:
                    NullTargeting: True
                    Filter: Self
                    MiscVars:
                        GH2E_QMGive: 8
                        GH2E_QMGiveOr: 7
                    AnimOverload: Refresh
                Filter: Self
                MiscVars:
                    GH2E_QMProficiencyBottom: 1
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: [DuringActionAbilityOnShortRest, DuringActionAbilityOnLongRest]
                AnimOverload: PowerUp
        XP: 2
Layout:
    Top:
        - Active:
            Ability: TAttackBuff
            Icon: Positive_AttackPlus_Item
            ListLayout: "$FHS_GH2E_Quartermaster2_10_T$"
            Layout: "$FHS_GH2E_Quartermaster2_10_T$"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Quartermaster2_10_T2$"
    Bottom:
        - Row: "$FHS_GH2E_Quartermaster2_10_B$"
        - Row: "<size=20%> "
        - Active:
            Ability: BActive
            Icon: Refresh
            ListLayout: "$FHS_GH2E_Quartermaster2_10_B2$"
            Layout: "$FHS_GH2E_Quartermaster2_10_B2$"
