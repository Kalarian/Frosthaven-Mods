Parser: AbilityCard
Name: $ABILITY_CARD_CarelessCharge$
Character: Berserker2ID
ID: 32623
Level: 7
Initiative: 15
# card: Careless Charge
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            TAttack:
                Attack:
                    Amount: 4
                    DiamondEnhancements: 1
        Consumes:
            # only after a straight-line move and while not wounded (Frosthaven's requirement keys; the plugin GHBerserker2e
            # points MoveWasStraightLine at this action's move); gaining Wound stays optional (approved reading)
            TCWound:
                Requirements:
                    MoveWasStraightLine: True
                    DoesntHaveNegativeCondition: [Wound]
                CostAbility:
                    ParentName: TAttack
                    Wound: True
                    Filter: Self
                AbilityOverrides:
                    TCChargeBuff:
                        ParentName: TAttack
                        StatIsBasedOnX:
                            Strength:
                                BasedOn: HexesMovedThisAction
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BRetaliate:
                Retaliate: 0
                Filter: Self
                AnimOverload: PowerUp
                StatIsBasedOnX:
                    Strength:
                        BasedOn: CasterAdjacentEnemies
                # X is recounted at each attack (plugin GHRetaliate2e)
                MiscVars:
                    GH2E_RetaliatePerAttack: True
                ActiveBonus:
                    Duration: Round
Layout:
    Top:
        - Row: "<size=150%><sprite name=Move> *TMove* <size=100%><voffset=1>@TMove@"
        - Divider:
        - Row: "<size=150%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCWound
                    Text: "$FHS_GH2E_Berserker2_23_T$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Active:
            Ability: BRetaliate
            Icon: Positive_Retaliate
            ListLayout: "$FHS_GH2E_Berserker2_23_B$"
            Layout: "$FHS_GH2E_Berserker2_23_B$"
