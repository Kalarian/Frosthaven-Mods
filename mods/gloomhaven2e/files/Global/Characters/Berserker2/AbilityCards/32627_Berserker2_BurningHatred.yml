        - Row: "$FHS_GH2E_Berserker2_27_B$"
        - Row: "$FHS_GH2E_Berserker2_27_B2$"
        - Row: "<size=150%><sprite name=Move> *BMove*"
        - Row: "<size=150%><sprite name=Attack> *BAttack*"
