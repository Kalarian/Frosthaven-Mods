                    ParentName: TAttack
                    Damage: 2
                    Filter: Self
                AbilityOverrides:
                    TCAttackBuff:
                        ParentName: TAttack
                        Strength: 1
                XP: 1
    Bottom:
        # "You may perform this action any number of times in succession, increasing the damage suffered by 1 each time":
        # after the attack the plugin (GHBerserker2e) asks; yes repeats suffer damage N+1 (cannot be negated), Move 1,
        # Attack 2, with no cap. GH2E_CannotPrevent: no prevent bonus or lost card negates the damage.
        Abilities:
            BDamage:
                Damage: 1
                Filter: Self
                CanSkip: False
                MiscVars:
                    GH2E_CannotPrevent: True
            BMove:
                Move: 1
            BAttack:
                Attack: 2
        XP: 2
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Attack> *TAttack*"
            - Column:
                - Row: "<link=fhpill><sprite name=Target> all adjacent <sprite name=Enemy></link>"
            - Column:
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCFire
                    Text: "$FHS_Target_TwoHexInstead$"
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
