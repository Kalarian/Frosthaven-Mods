Parser: AbilityCard
Name: $ABILITY_CARD_PreventionisKey$
Character: Sawbones2ID
ID: 33205
Level: 1
Initiative: 13
# card: Prevention is Key
# top: Wound + Disarm on all enemies within range 1 (no attack; the diamond mark on Disarm, as Secretariat); Safeguard on
# you and all allies within range 1 (mark dropped). bottom: a one-use round bonus that fires at the end of your next
# action holding a Prescription ability (MiscVars GH2E_Prescription) and gives Shield 1 for the round to you and the
# adjacent allies.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TWoundDisarm:
                Disarm:
                    DiamondEnhancements: 1
                Conditions: [Wound]
                Range: 1
                Target: -1
                Filter: Enemy
                AnimOverload: RadialDebuff
            TSafeguard:
                NullTargeting: True
                Filter: [Self, Ally]
                Range: 1
                Target: -1
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: GenericOnNegativeCondition
                    XPTracker: [0]
                    ListLayoutOverride: [$GH2E_SAFEGUARD$, Positive_DamagePrevent]
                    Vars:
                        ValidateIsHolder: TriggerTarget == ActiveBonus.Actor
                        ValidateNotImmune: CAbility.ImmuneToAbility(TriggerTarget, TriggerAbility) == False
                        ValidateIsNegativeCondition: TriggerAbility.AbilityType == "Poison" || TriggerAbility.AbilityType == "Wound" || TriggerAbility.AbilityType == "Stun" || TriggerAbility.AbilityType == "Disarm" || TriggerAbility.AbilityType == "Immobilize" || TriggerAbility.AbilityType == "Muddle" || TriggerAbility.AbilityType == "Curse" || TriggerAbility.AbilityType == "Bane" || TriggerAbility.AbilityType == "Brittle" || TriggerAbility.AbilityType == "Impair"
                        PreventCondition: True
        XP: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            # "when you next perform a Prescription action this round, grant all adjacent allies and self: Shield 1"
            # (round): a one-use round bonus fired at the end of an action that holds a Prescription ability (the
            # class's MiscVars GH2E_Prescription; Etheric Echo bottom's action-ended trigger), giving Shield 1 for the
            # round to you and the allies adjacent then (Iron Bulwark bottom's shape)
            BShield:
                AddActiveBonus:
                    Shield: 1
                    Range: 1
                    Target: 99
                    Filter: [Self, Ally]
                    AutoTrigger: True
                    ActiveBonusDuration: Round
                    MiscVars:
                        AutoSelectValidTiles: True
                    AnimOverload: RadialBuff
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Round
                    Behaviour: DuringActionAbilityOnActionEnded
                    XPTracker: [0]
                    Vars:
                        LastPerformedAbility: TriggerActor.LastAbilityPerformed
                        PerformedAction: LastPerformedAbility?.GetAbilityBaseCard()?.SelectedAction
                        ValidatePrescription: PerformedAction != null && PerformedAction.Abilities.Any(CustomAbility.GetMiscVarBool(obj, "GH2E_Prescription"))
Layout:
    Top:
        - Row: "<size=150%><sprite name=Wound> <sprite name=Disarm> <size=100%><voffset=1>@TWoundDisarm@"
        - Row: "$FHS_GH2E_Sawbones2_ALL_R1$"
        - Row: "<size=50%> "
        - Active:
            Ability: TSafeguard
            Icon: Positive_DamagePrevent
            ListLayout: "$FHS_GH2E_SAFEGUARD$"
            Layout: "$FHS_GH2E_Sawbones2_05_T$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Sawbones2_05_B$"
        - Active:
            Ability: BShield
            Icon: Positive_Shield_Ally_Aura
            ListLayout: "<sprite name=Shield> *BShield*"
            Layout: "<size=150%><sprite name=Shield> *BShield*"
