Parser: AbilityCard
Name: $ABILITY_CARD_TakeYourMedicine$
Character: Sawbones2ID
ID: 33226
Level: 8
Initiative: 6
# card: Take Your Medicine
# top (Prescription): Regenerative Tissue's start-of-turn Prescription shape on one adjacent ally (GiveAbilityCardToActor,
# three slots, MiscVars GH2E_Prescription): at the start of each of the ally's next three turns it performs a
# GiveSupplyCard to itself. The engine would take the pack from the performer's own class supply (the ally has none);
# the plugin (GHSupplyCards) takes it from the Sawbones' supply when the performer's class has no such card.
# bottom: Move 3, then "in initiative order, each ally may play one Medical Pack from their hand for one action": the
# marker BAlliesPlayPacks (MiscVars GH2E_AlliesPlayPacks) makes the plugin (GHSawbones2e) give each ally holding a
# pack, in initiative order, the template BPlayPack (Geminate's SelectAndPlayCard from the hand, one card, skippable,
# supply cards only) performed by that ally. The template (MiscVars GH2E_Template) is taken out of the card's action
# when the card is read, so it never runs on its own.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TPrescription:
                AddActiveBonus:
                    GiveSupplyCard: [33230]
                    Filter: Self
                    CanUndo: False
                    AnimOverload: GivePackAdjacent
                Filter:
                    TargetType: Ally
                    ActorType: Player
                Range: 1
                Target: 1
                MiscVars:
                    GH2E_Prescription: True
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: StartTurnAbility
                    GiveAbilityCardToActor: True
                    XPTracker: [0,0,0]
                AnimOverload: BuffAdjacent
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BAlliesPlayPacks:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                CanUndo: False
                AnimOverload: None
                MiscVars:
                    GH2E_AlliesPlayPacks: True
            BPlayPack:
                SelectAndPlayCard:
                    CardPile: Hand
                    Amount: 1
                    MinRequiredCards: 0
                Filter: Self
                AutoTrigger: True
                CanSkip: True
                CanUndo: False
                SkipAnim: True
                HelpBoxTooltipLocKey: "GH2E_Sawbones2_PLAYPACK_HELP"
                MiscVars:
                    GH2E_Template: True
                    IsCardValid: AbilityCard.SupplyCard
Layout:
    Top:
        - Row: "$FHS_GH2E_Sawbones2_RX$"
        - Row: "<size=20%> "
        - Active:
            Ability: TPrescription
            Icon: Positive_Cards
            ListLayout: "$FHS_GH2E_Sawbones2_26_T$"
            Layout: "$FHS_GH2E_Sawbones2_26_T$"
        - Row: "<size=100%> "
        - XPTracker: TPrescription
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Sawbones2_26_B$"
