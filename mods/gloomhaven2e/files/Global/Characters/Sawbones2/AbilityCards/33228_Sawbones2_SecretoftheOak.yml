Parser: AbilityCard
Name: $ABILITY_CARD_SecretoftheOak$
Character: Sawbones2ID
ID: 33228
Level: 9
Initiative: 10
# card: Secret of the Oak
# top: all negative conditions removed first (the parent ability, it picks the target), then on the same figure Heal 6,
# Safeguard, and Shield 2 this round + XP 1 when it holds an active Prescription (sub filter
# Vars; unverified that a sub's filter is checked against the parent's target). bottom: a persistent marker bonus
# (Shattersong Empowering Note's NullTargeting, MiscVars GH2E_SecretOfTheOak) keeps the card active and lost as printed;
# while it is out, after each heal ability of a Medical Pack the plugin (GHSawbones2e) gives the character who performed
# it the template BSecretChoice: a skippable choice of +4 Attack on their next attack this round or +4 Move on their
# next move ability this round (one-use round bonuses, Grisly Trauma's shape). The template (MiscVars GH2E_Template) is
# taken out of the card's action when the card is read, so it never runs on its own.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            # "before the heal, remove all negative conditions from the target": the removal is the parent (it picks
            # the target), the heal, Safeguard and the Prescription shield its sub-abilities on the same figure
            TRemove:
                RemoveConditions: All
                Conditions: [Wound, Brittle, Bane, Poison, Immobilize, Disarm, Impair, Stun, Muddle]
                Range: 1
                Filter: [Self, Ally]
                AnimOverload: Heal
                SubAbilities:
                    THeal:
                        Heal:
                            Amount: 6
                            DiamondPlusEnhancements: 1
                        AnimOverload: None
                    THealSubSafeguard:
                        Ward: True
                        Filter: [Self, Ally]
                        UseParentTargets: True
                        SkipAnim: True
                        AnimOverload: None
                        MiscVars:
                            GH2ESafeguard: True
                    THealSubShield:
                        Shield: 2
                        Filter:
                            TargetType: [Self, Ally]
                            Vars:
                                ValidatePrescription: target.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_Prescription"))
                        XP: 1
                        ActiveBonus:
                            Duration: Round
                        AnimOverload: None
    Bottom:
        Abilities:
            BActive:
                NullTargeting: True
                Filter: Self
                AnimOverload: PowerUp
                MiscVars:
                    GH2E_SecretOfTheOak: True
                ActiveBonus:
                    Duration: Persistent
            BSecretChoice:
                Filter: Self
                CanSkip: True
                CanUndo: False
                AnimOverload: PowerUp
                HelpBoxTooltipLocKey: "GH2E_Sawbones2_SECRET_HELP"
                MiscVars:
                    GH2E_Template: True
                Choose:
                    Abilities:
                        BSecretAttack:
                            Attack: 4
                            Filter: Self
                            ActiveBonus:
                                Duration: Round
                                Behaviour: BuffAttack
                                XPTracker: [0]
                            AnimOverload: PowerUp
                        BSecretMove:
                            Move: 4
                            Filter: Self
                            ActiveBonus:
                                Duration: Round
                                Behaviour: BuffMove
                                XPTracker: [0]
                            AnimOverload: PowerUp
        XP: 2
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TRemove.Range*</link>"
            - Column:
        - Row: "$FHS_GH2E_Sawbones2_SG$"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Sawbones2_28_T$"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Sawbones2_28_T2$"
    Bottom:
        - Active:
            Ability: BActive
            Icon: Positive_HealPlus
            ListLayout: "$FHS_GH2E_Sawbones2_28_B$"
            Layout: "$FHS_GH2E_Sawbones2_28_B$"
