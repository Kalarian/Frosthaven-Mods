Parser: AbilityCard
Name: $ABILITY_CARD_SecretoftheOak$
Character: Sawbones2ID
ID: 33228
Level: 9
Initiative: 10
# card: Secret of the Oak
# top: all negative conditions removed first (the parent ability, it picks the target), then on the same figure Heal 6,
# Safeguard, and Shield 2 this round + XP 1 when it holds an active Prescription (sub filter
# Vars; unverified that a sub's filter is checked against the parent's target). bottom: no engine hook for "a heal on a
# Medical Pack card": a dummy persistent bonus (Shattersong Empowering Note's NullTargeting) keeps the card active and
# lost as printed; the +4 Attack / +4 Move is text only, NEEDS PLUGIN.
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            # "before the heal, remove all negative conditions from the target": the removal is the parent (it picks
            # the target), the heal, Safeguard and the Prescription shield its sub-abilities on the same figure
            TRemove:
                RemoveConditions: All
                Conditions: [Wound, Brittle, Bane, Poison, Immobilize, Disarm, Impair, Stun, Muddle]
                Range: 1
                Filter: [Self, Ally]
                AnimOverload: Heal
                SubAbilities:
                    THeal:
                        Heal:
                            Amount: 6
                            DiamondPlusEnhancements: 1
                        AnimOverload: None
                    THealSubSafeguard:
                        NullTargeting: True
                        Filter: [Self, Ally]
                        AnimOverload: None
                        ActiveBonus:
                            Duration: Persistent
                            Behaviour: GenericOnNegativeCondition
                            XPTracker: [0]
                            ListLayoutOverride: [$GH2E_SAFEGUARD$, Positive_DamagePrevent]
                            Vars:
                                ValidateIsHolder: TriggerTarget == ActiveBonus.Actor
                                ValidateNotImmune: CAbility.ImmuneToAbility(TriggerTarget, TriggerAbility) == False
                                ValidateIsNegativeCondition: TriggerAbility.AbilityType == "Poison" || TriggerAbility.AbilityType == "Wound" || TriggerAbility.AbilityType == "Stun" || TriggerAbility.AbilityType == "Disarm" || TriggerAbility.AbilityType == "Immobilize" || TriggerAbility.AbilityType == "Muddle" || TriggerAbility.AbilityType == "Curse" || TriggerAbility.AbilityType == "Bane" || TriggerAbility.AbilityType == "Brittle" || TriggerAbility.AbilityType == "Impair"
                                PreventCondition: True
                    THealSubShield:
                        Shield: 2
                        Filter:
                            TargetType: [Self, Ally]
                            Vars:
                                ValidatePrescription: target.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_Prescription"))
                        XP: 1
                        ActiveBonus:
                            Duration: Round
                        AnimOverload: None
    Bottom:
        Abilities:
            BActive:
                NullTargeting: True
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Persistent
        XP: 2
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Heal> *THeal* <size=100%><voffset=1>@THeal@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TRemove.Range*</link>"
            - Column:
        - Row: "$FHS_GH2E_Sawbones2_SG$"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Sawbones2_28_T$"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Sawbones2_28_T2$"
    Bottom:
        - Active:
            Ability: BActive
            Icon: Positive_HealPlus
            ListLayout: "$FHS_GH2E_Sawbones2_28_B$"
            Layout: "$FHS_GH2E_Sawbones2_28_B$"
