Parser: AbilityCard
Name: $ABILITY_CARD_ReturntheFavor$
Character: Sawbones2ID
ID: 33223
Level: 6
Initiative: 40
# card: Return the Favor
# top: the grant (ControlActor) may only pick an ally holding an active Prescription (filter Vars), no range printed:
# range 99. bottom: one condition removed from an adjacent ally (the performer picks which: GH2E_ChooseCondition) with
# the XP on the removal; then "you may give one adjacent enemy the condition you removed": the plugin (GHSawbones2e,
# GH2E_TransferRemoved) offers each enemy adjacent to the Sawbones in turn, and the one accepted gains that condition.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyMove:
                            Move:
                                Amount: 3
                                SquareEnhancements: 1
                            StrengthIsBase: True
                        TAllyAttack:
                            Attack:
                                Amount: 3
                                DiamondEnhancements: 1
                            StrengthIsBase: True
                            RangeIsBase: True
                Range: 99
                Filter:
                    TargetType: Ally
                    ActorType: Player
                    Vars:
                        ValidatePrescription: target.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_Prescription"))
                AnimOverload: ControlAlly
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BRemove:
                RemoveConditions: 1
                Conditions: [Wound, Brittle, Bane, Poison, Immobilize, Disarm, Impair, Stun, Muddle]
                Range: 1
                Filter: Ally
                XP: 1
                AnimOverload: BuffAdjacent
                MiscVars:
                    GH2E_ChooseCondition: True
                    GH2E_TransferRemoved: True
Layout:
    Top:
        - Row: "<size=150%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Sawbones2_23_T$"
        - Row: "<size=20%> "
        - Row: "<size=150%><sprite name=Move> *TAllyMove* <size=100%><voffset=1>@TAllyMove@"
        - Row: "<size=150%><sprite name=Attack> *TAllyAttack* <size=100%><voffset=1>@TAllyAttack@"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Sawbones2_23_B$"
