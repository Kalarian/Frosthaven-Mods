Parser: AbilityCard
Name: $ABILITY_CARD_DoNoHarm$
Character: Sawbones2ID
ID: 33219
Level: 4
Initiative: 18
# card: Do No Harm
# top: Attack 4, Wound, Stun and the mandatory self-Disarm. The character token ("the next three times they lose Stun,
# they gain Stun", three slots): an ApplyConditionOnLoseCondition bonus placed on the target (a sub-ability of the
# attack), three uses; the card is lost after the last.
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 4
                Conditions: [Wound, Stun]
                AnimOverload: Attack_AOE_Cone
                SubAbilities:
                    # the character token on the target: "the next three times they lose Stun, they gain Stun" =
                    # Frosthaven's ApplyConditionOnLoseCondition add-condition bonus (CChallengeSpitefulRetribution
                    # builds one in code): three slots, listened on the holder only
                    TToken:
                        AddCondition: 1
                        Filter: Enemy
                        AutoTrigger: True
                        SkipAnim: True
                        AnimOverload: None
                        ActiveBonus:
                            Duration: Persistent
                            Behaviour: ApplyConditionOnLoseCondition
                            ValidConditions: [Stun]
                            AbilityData:
                                NullTargeting: True
                                Conditions: [Stun]
                            XPTracker: [0,0,0]
                            ListLayoutOverride: [$GH2E_Sawbones2_19_T$, Icon_Stun]
                            Vars:
                                ValidateIsHolder: TriggerTarget == ActiveBonus.Actor
            TDisarm:
                Disarm: True
                Filter: Self
                AutoTrigger: True
                CanSkip: False
                AnimOverload: SelfDebuff
        XP: 2
    Bottom:
        Abilities:
            BAttack:
                Attack:
                    Amount: 2
                    DiamondEnhancements: 1
                Conditions: Poison
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Attack> *TAttack*"
            - Column:
                - Row: "<link=fhpill><sprite name=Wound><sprite name=Stun></link>"
            - Column:
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Sawbones2_19_T$"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Sawbones2_19_T2$"
    Bottom:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Attack> *BAttack* <size=100%><voffset=1>@BAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Poison></link>"
            - Column:
