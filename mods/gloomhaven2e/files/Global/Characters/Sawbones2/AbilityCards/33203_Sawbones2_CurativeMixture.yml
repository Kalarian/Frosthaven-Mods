        Abilities:
            THeal:
                Heal:
                    Amount: 3
                    DiamondPlusEnhancements: 1
                Range: 1
                Filter: [Self, Ally]
                AnimOverload: Heal
                SubAbilities:
                    THealSubRemove:
                        RemoveConditions: 1
                        Conditions: [Wound, Brittle, Bane, Poison, Immobilize, Disarm, Impair, Stun, Muddle]
                        AnimOverload: None
    Bottom:
