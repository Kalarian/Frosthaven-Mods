# card: Curative Mixture
# "remove one negative condition": RemoveConditions 1 over the removable list (the game picks which one, as its Cure
# Potion comment says; Frosthaven's own "choose which" needs a Choose block on yourself only). Top: the removal is a
# sub-ability on the heal's target, so it lands after the heal, not before (approximation).
