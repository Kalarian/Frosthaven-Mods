Parser: AbilityCard
Name: $ABILITY_CARD_Vaccine$
Character: Sawbones2ID
ID: 33211
Level: X
Initiative: 15
# card: Vaccine
# top: a target conditional override (TargetMissingHP > 0) adding +1 Target and XP 1; whether an override found on the
# first target can still add a second target is unverified (NOTES.md). bottom (Prescription): the Safeguard bonus with
# three slots, placed on one adjacent ally, only against conditions an enemy applies.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    SquareEnhancements: 1
                ConditionalOverrides:
                    TAttackCO:
                        Filter:
                            TargetType: Enemy
                            TargetMissingHP: "> 0"
                        XP: 1
                        AbilityOverrides:
                            TAttackCOTarget:
                                Target: 1
    Bottom:
        Abilities:
            BPrevent:
                NullTargeting: True
                Filter:
                    TargetType: Ally
                    ActorType: Player
                Range: 1
                Target: 1
                MiscVars:
                    GH2E_Prescription: True
                AnimOverload: BuffAdjacent
                ActiveBonus:
                    Duration: Persistent
                    GiveAbilityCardToActor: True
                    Behaviour: GenericOnNegativeCondition
                    XPTracker: [0,0,0]
                    Vars:
                        ValidateIsHolder: TriggerTarget == ActiveBonus.Actor
                        ValidateFromEnemy: TriggerAbility.TargetingActor != null && CustomAbility.IsEnemy(TriggerTarget, TriggerAbility.TargetingActor)
                        ValidateNotImmune: CAbility.ImmuneToAbility(TriggerTarget, TriggerAbility) == False
                        ValidateIsNegativeCondition: TriggerAbility.AbilityType == "Poison" || TriggerAbility.AbilityType == "Wound" || TriggerAbility.AbilityType == "Stun" || TriggerAbility.AbilityType == "Disarm" || TriggerAbility.AbilityType == "Immobilize" || TriggerAbility.AbilityType == "Muddle" || TriggerAbility.AbilityType == "Curse" || TriggerAbility.AbilityType == "Bane" || TriggerAbility.AbilityType == "Brittle" || TriggerAbility.AbilityType == "Impair"
                        PreventCondition: True
        XP: 1
Layout:
    Top:
        - Row: "<size=150%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Sawbones2_11_T$"
    Bottom:
        - Row: "$FHS_GH2E_Sawbones2_RX$"
        - Row: "<size=20%> "
        - Active:
            Ability: BPrevent
            Icon: Positive_DamagePrevent
            ListLayout: "$FHS_GH2E_Sawbones2_11_B$"
            Layout: "$FHS_GH2E_Sawbones2_11_B$"
        - Row: "<size=100%> "
        - XPTracker: BPrevent
