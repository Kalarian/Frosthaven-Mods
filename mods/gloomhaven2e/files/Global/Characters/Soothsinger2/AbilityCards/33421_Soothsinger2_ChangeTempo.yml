        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Bless> <size=100%><voffset=1>@BBless@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *BBless.Range*</link>"
            - Column:
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_LOW$"
