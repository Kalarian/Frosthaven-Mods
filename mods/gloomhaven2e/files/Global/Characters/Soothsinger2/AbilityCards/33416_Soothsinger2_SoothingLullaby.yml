Parser: AbilityCard
Name: $ABILITY_CARD_SoothingLullaby$
Character: Soothsinger2ID
ID: 33416
Level: 2
Initiative: 20
# card: Soothing Lullaby
# top: song (High Note); "Heal 1, target all" with no range = you and all allies anywhere (Sunkeeper2 Engulfing Radiance)
# bottom: APPROXIMATION: the marked monster's Disarm is given now (NOTES.md)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                AddActiveBonus:
                    Heal: 1
                    Target: -1
                    Targeting: All
                    Filter: [Self, Ally]
                    AnimOverload: PlayPositiveTune
                Filter: Self
                AnimOverload: PlaySongHealing1
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,0,0]
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song1: True      # the song's Note cost (Symphonic Medley picks songs by it)
    Bottom:
        Abilities:
            BDisarm:
                Disarm: True
                Range: 3
                Target: 1
                Filter: Enemy
                AnimOverload: AggressiveTargetedShout
            BNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerLowNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
Layout:
    Top:
        - Row: "$FHS_GH2E_Soothsinger2_16_T$"
        - Active:
            Ability: TSong
            Icon: Positive_Heal
            ListLayout: "$FHS_GH2E_Soothsinger2_16_T2$"
            Layout: "$FHS_GH2E_Soothsinger2_16_T2$"
        - Row: "<size=100%> "
        - XPTracker: TSong
    Bottom:
        - Row: "$FHS_GH2E_Soothsinger2_16_B$"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_LOW$"
