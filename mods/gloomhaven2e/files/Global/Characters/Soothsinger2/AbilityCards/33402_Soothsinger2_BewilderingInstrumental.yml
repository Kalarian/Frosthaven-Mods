Parser: AbilityCard
Name: $ABILITY_CARD_BewilderingInstrumental$
Character: Soothsinger2ID
ID: 33402
Level: 1
Initiative: 11
# card: Bewildering Instrumental
# top: song (High Note); Damage 1 + Muddle on the enemy with the highest current hit points (Custom targeting; ties: the player picks)
# bottom: the granted Shield 1 has no enhancement mark
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                AddActiveBonus:
                    Damage: 1
                    Range: 99
                    Target: 1
                    Filter: Enemy
                    Conditions: Muddle
                    Vars:
                        SongMe: TargetingActor
                        SongFoes: AllAliveMonsters.Where(CActor.AreActorsEnemies(obj.Type, SongMe.Type, obj, SongMe))
                        ValidateSongFoes: SongFoes.Count > 0
                        SongTopHealth: SongFoes.OrderBy(0 - obj.Health).First.Health
                        SongHighest: SongFoes.Where(obj.Health == SongTopHealth)
                    Targeting: Custom
                    TargetingVars:
                        AddTilesInRange: SongHighest.Select(Tile)
                        AddValidActorsInRange: SongHighest
                    AnimOverload: AggressiveTargetedShout
                Filter: Self
                AnimOverload: PlaySongConfuse1
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,0,0,0]
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song1: True      # the song's Note cost (Symphonic Medley picks songs by it)
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BShield:
                Shield: 1
                Range: 1
                Target: 1
                Filter: Ally
                ActiveBonus:
                    Duration: Round
                AnimOverload: PlayPositiveTuneShield
Layout:
    Top:
        - Row: "$FHS_GH2E_Soothsinger2_02_T$"
        - Active:
            Ability: TSong
            Icon: Positive_Damage_Enemy_Aura
            ListLayout: "$FHS_GH2E_Soothsinger2_02_T2$"
            Layout: "$FHS_GH2E_Soothsinger2_02_T2$"
        - Row: "<size=100%> "
        - XPTracker: TSong
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_GRANT_ADJ$"
        - Row: "<size=150%><sprite name=Shield> 1"
