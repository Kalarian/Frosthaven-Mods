Parser: AbilityCard
Name: $ABILITY_CARD_AlluringSerenade$
Character: Soothsinger2ID
ID: 33420
Level: 4
Initiative: 24
# card: Alluring Serenade
# top: song (Low, Low Note); end-of-turn Pull 3 + Curse on one enemy within range 5
# bottom: the Pull rides on the heal: a sub-ability on the healed ally (UseParentTargets), skipped when you heal yourself
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                AddActiveBonus:
                    Pull: 3
                    Range: 5
                    Target: 1
                    Filter: Enemy
                    Conditions: Curse
                    AnimOverload: AggressiveTargetedShout
                Filter: Self
                AnimOverload: PlaySongConfuse2
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,0,0]
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song2: True      # the song's Note cost (Symphonic Medley picks songs by it)
    Bottom:
        Abilities:
            BHeal:
                Heal:
                    Amount: 3
                    SquareEnhancements: 1
                Range: 4
                Filter: [Self, Ally]
                AnimOverload: PlayPositiveTune
                SubAbilities:
                    BHealSubPull:
                        Pull: 3
                        Filter: Ally
                        UseParentTargets: True
                        Target: 1
            BNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerHighNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
Layout:
    Top:
        - Row: "$FHS_GH2E_Soothsinger2_20_T$"
        - Active:
            Ability: TSong
            Icon: Icon_Curse
            ListLayout: "$FHS_GH2E_Soothsinger2_20_T2$"
            Layout: "$FHS_GH2E_Soothsinger2_20_T2$"
        - Row: "<size=100%> "
        - XPTracker: TSong
    Bottom:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Heal> *BHeal* <size=100%><voffset=1>@BHeal@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *BHeal.Range* <sprite name=Pull> *BHealSubPull*</link>"
            - Column:
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_HIGH$"
