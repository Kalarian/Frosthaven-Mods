Parser: AbilityCard
Name: $ABILITY_CARD_PowerBallad$
Character: Soothsinger2ID
ID: 33404
Level: 1
Initiative: 12
# card: Power Ballad
# top: song (High, High, Low Note): Shattersong Din of Battle's once-per-turn attack aura, persistent, on you and
# every ally, untoggled so it takes each figure's first attack of its turn; its three slots advance once per round (TSongTimer, NOTES.md)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                Attack: 1
                Target: -1
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffAttack
                    ValidAbilityTypes: [Attack]
                    Restriction: OncePerTurn
                    RestrictPerActor: True
                    # no toggle: lands by itself on each figure's first attack of its turn (HIVE Heavy Metal)
                    IsSingleTargetBonus: True
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter: [Self, Ally]
                AnimOverload: PlaySongAttack1
            TSongTimer:
                AddActiveBonus:
                    Null: True
                    Filter: Self
                    AutoTrigger: True
                    SkipAnim: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndRoundAbility
                    XPTracker: [1,0,1]
                    EndAllActiveBonusesOnBaseCardSimultaneously: True
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song3: True      # the song's Note cost (Symphonic Medley picks songs by it)
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
Layout:
    Top:
        - Row: "$FHS_GH2E_Soothsinger2_04_T$"
        - Active:
            Ability: TSong
            Icon: Positive_AttackPlus_Ally_Aura
            ListLayout: "$FHS_GH2E_Soothsinger2_04_T2$"
            Layout: "$FHS_GH2E_Soothsinger2_04_T2$"
        - Row: "<size=100%> "
        - XPTracker: TSongTimer
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
