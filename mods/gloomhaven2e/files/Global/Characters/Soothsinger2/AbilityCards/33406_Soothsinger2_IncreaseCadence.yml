Parser: AbilityCard
Name: $ABILITY_CARD_IncreaseCadence$
Character: Soothsinger2ID
ID: 33406
Level: 1
Initiative: 32
# card: Increase Cadence
# bottom: an end-of-turn Note choice (Choose) with six slots, this turn included (Elementalist2 Pulsing Cores' shape)
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    SquareEnhancements: 1
                Range: 4
                Conditions: Muddle
                AnimOverload: RangedAttack
            TNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerHighNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
    Bottom:
        Abilities:
            BActive:
                MiscVars:
                    ImmuneMoveActiveBonusTracker: True      # not a song (Captivating Performance moves song tokens only)
                AddActiveBonus:
                    Filter: Self
                    CanSkip: False
                    CanUndo: False
                    PreviewEffectText: "High Note / Low Note"
                    Choose:
                        Abilities:
                            BNoteHigh:
                                PreviewEffectText: "High Note"
                                NullTargeting: True
                                Filter: Self
                                AutoTrigger: True
                                SkipAnim: True
                                ResourcesToAddOnAbilityEnd:
                                    - ["SoothsingerHighNote", 1]
                            BNoteLow:
                                PreviewEffectText: "Low Note"
                                NullTargeting: True
                                Filter: Self
                                AutoTrigger: True
                                SkipAnim: True
                                ResourcesToAddOnAbilityEnd:
                                    - ["SoothsingerLowNote", 1]
                Filter: Self
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,0,1,0,1,0]
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAttack.Range*, <sprite name=Muddle></link>"
            - Column:
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_HIGH$"
    Bottom:
        - Active:
            Ability: BActive
            Icon: Positive_Resonance
            ListLayout: "$FHS_GH2E_Soothsinger2_06_B$"
            Layout: "$FHS_GH2E_Soothsinger2_06_B$"
        - Row: "<size=100%> "
        - XPTracker: BActive
