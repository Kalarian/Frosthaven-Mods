Parser: AbilityCard
Name: $ABILITY_CARD_CaptivatingPerformance$
Character: Soothsinger2ID
ID: 33430
Level: 9
Initiative: 71
# card: Captivating Performance
# top: song (High, High, Low, Low Note); end-of-turn Disarm in Secretariat's triangle (0,1) (1,0) (1,1), no hex mark
# bottom: Move 4, then song tokens back one slot (MoveActiveBonusTracker -1, the player picks each song card)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                AddActiveBonus:
                    Disarm: True
                    Range: 3
                    AreaEffect: "2,1,R|1,0,R|3,0,R"
                    Filter: Enemy
                    AnimOverload: AggressiveTargetedShout
                Filter: Self
                AnimOverload: PlaySongConfuse1
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,1]
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song4: True      # the song's Note cost (Symphonic Medley picks songs by it)
                    GH2E_SongHigh: 2   # the printed cost in High / Low Notes (plugin GHSoothsinger)
                    GH2E_SongLow: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            # "move your character tokens on each of your active Song abilities backward one slot": Frosthaven's
            # MoveActiveBonusTracker -1 (Drifter Fortitude bottom, AMC_MoveTrackerBackOneSlot), as many cards as you have
            # songs; the class's non-song trackers are marked ImmuneMoveActiveBonusTracker (Lucky Dice's flag)
            BTrackersBack:
                MoveActiveBonusTracker: -1
                Filter: Self
                AnimOverload: PowerUp
                Vars:
                    NumberOfCardsToSelect: 15
Layout:
    Top:
        - Row: "$FHS_GH2E_Soothsinger2_30_T$"
        - Active:
            Ability: TSong
            Icon: Icon_Disarm
            ListLayout: "$FHS_GH2E_Soothsinger2_30_T2$"
            Layout: "$FHS_GH2E_Soothsinger2_30_T2$"
        - Row: "<size=100%> "
        - XPTracker: TSong
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_30_B$"
