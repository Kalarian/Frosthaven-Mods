Parser: AbilityCard
Name: $ABILITY_CARD_MobilizingMeasure$
Character: Soothsinger2ID
ID: 33401
Level: 1
Initiative: 8
# card: Mobilizing Measure
# top: song (Low Note); end-of-turn grant Move 2 to the closest ally (Custom targeting: only the closest; ties: the player picks)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                AddActiveBonus:
                    ControlActor:
                        Abilities:
                            TSongAllyMove:
                                Move: 2
                                StrengthIsBase: True
                    Range: 99
                    Target: 1
                    Filter: Ally
                    Vars:
                        SongMe: TargetingActor
                        SongAllies: AllAliveActors.Where(obj != SongMe and CActor.AreActorsAllied(obj.Type, SongMe.Type, obj, SongMe))
                        ValidateSongAllies: SongAllies.Count > 0
                        SongNearestDist: SongAllies.OrderBy(obj.GetDistanceTo(SongMe, true)).First.GetDistanceTo(SongMe, true)
                        SongClosest: SongAllies.Where(obj.GetDistanceTo(SongMe, true) == SongNearestDist)
                    Targeting: Custom
                    TargetingVars:
                        AddTilesInRange: SongClosest.Select(Tile)
                        AddValidActorsInRange: SongClosest
                    AnimOverload: PlayPositiveTuneMove
                Filter: Self
                AnimOverload: PlaySongSpeed1
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,0,0,0]
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song1: True      # the song's Note cost (Symphonic Medley picks songs by it)
                    GH2E_SongHigh: 0   # the printed cost in High / Low Notes (plugin GHSoothsinger)
                    GH2E_SongLow: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
                    Jump: True
            BRetaliate:
                Retaliate:
                    Amount: 1
                    SquareEnhancements: 1
                Range: 1
                Target: 1
                Filter: Ally
                ActiveBonus:
                    Duration: Round
                AnimOverload: PlayPositiveTuneShield
Layout:
    Top:
        - Row: "$FHS_GH2E_Soothsinger2_01_T$"
        - Active:
            Ability: TSong
            Icon: Positive_Move_Ally_Grant
            ListLayout: "$FHS_GH2E_Soothsinger2_01_T2$"
            Layout: "$FHS_GH2E_Soothsinger2_01_T2$"
        - Row: "<size=100%> "
        - XPTracker: TSong
    Bottom:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
            - Column:
                - Row: "<link=fhpill><sprite name=Jump></link>"
            - Column:
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_GRANT_ADJ$"
        - Row: "<size=150%><sprite name=Retaliate> *BRetaliate* <size=100%><voffset=1>@BRetaliate@"
