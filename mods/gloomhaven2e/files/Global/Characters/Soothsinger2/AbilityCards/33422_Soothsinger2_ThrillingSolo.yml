Parser: AbilityCard
Name: $ABILITY_CARD_ThrillingSolo$
Character: Soothsinger2ID
ID: 33422
Level: 5
Initiative: 60
# card: Thrilling Solo
# top: song (High, Low, Low Note): a marker persistent bonus (MiscVars GH2E_ThrillingSolo); the plugin (GHSoothsinger)
# repeats your first attack ability from an ability card each round, whole (area, targets, effects), with +1 Attack,
# new targets chosen (the copy can be skipped), as Frosthaven's repeat behaviour copies an ability (CRepeatAbilityBaseBehaviour)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                NullTargeting: True
                Filter: Self
                AnimOverload: PlaySongAttack2
                MiscVars:
                    GH2E_ThrillingSolo: True
                ActiveBonus:
                    Duration: Persistent
            TSongTimer:
                AddActiveBonus:
                    Null: True
                    Filter: Self
                    AutoTrigger: True
                    SkipAnim: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndRoundAbility
                    XPTracker: [1,0,1,0]
                    EndAllActiveBonusesOnBaseCardSimultaneously: True
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song3: True      # the song's Note cost (Symphonic Medley picks songs by it)
                    GH2E_SongHigh: 1   # the printed cost in High / Low Notes (plugin GHSoothsinger)
                    GH2E_SongLow: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerLowNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
Layout:
    Top:
        - Row: "$FHS_GH2E_Soothsinger2_22_T$"
        - Active:
            Ability: TSong
            Icon: Positive_AttackPlus
            ListLayout: "$FHS_GH2E_Soothsinger2_22_T2$"
            Layout: "$FHS_GH2E_Soothsinger2_22_T2$"
        - Row: "<size=100%> "
        - XPTracker: TSongTimer
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_LOW$"
