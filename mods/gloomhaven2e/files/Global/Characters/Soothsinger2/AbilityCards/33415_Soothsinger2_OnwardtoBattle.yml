Parser: AbilityCard
Name: $ABILITY_CARD_OnwardtoBattle$
Character: Soothsinger2ID
ID: 33415
Level: 2
Initiative: 91
# card: Onward to Battle
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAlly:
                ControlActor:
                    Abilities:
                        TAllyAttack:
                            Attack:
                                Amount: 4
                                DiamondEnhancements: 1
                            Range: 1
                            StrengthIsBase: True
                            RangeIsBase: True
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                Filter: Ally
                AnimOverload: PlayPositiveTuneAttack
            TNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerHighNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    CircleEnhancements: 1
Layout:
    Top:
        - Row: "$FHS_GH2E_Soothsinger2_GRANT_RANGE$ <nobr><sprite name=Range> *TAlly.Range*</nobr>: @TAlly.Range@"
        - Row: "<size=20%> "
        - Row: "<size=150%><sprite name=Attack> *TAllyAttack* <size=100%><voffset=1>@TAllyAttack@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_HIGH$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
