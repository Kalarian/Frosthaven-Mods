Parser: AbilityCard
Name: $ABILITY_CARD_EchoingAria$
Character: Soothsinger2ID
ID: 33413
Level: X
Initiative: 5
# card: Echoing Aria
# top: song (Low, Low Note): a persistent Retaliate 1, range 2 aura on you and all allies, four slots per round
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                Retaliate: 1
                RetaliateRange: 2
                Target: -1
                Targeting: All
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter: [Self, Ally]
                AnimOverload: PlaySongShield2
            TSongTimer:
                AddActiveBonus:
                    Null: True
                    Filter: Self
                    AutoTrigger: True
                    SkipAnim: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndRoundAbility
                    XPTracker: [1,0,0,0]
                    EndAllActiveBonusesOnBaseCardSimultaneously: True
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song2: True      # the song's Note cost (Symphonic Medley picks songs by it)
                    GH2E_SongHigh: 0   # the printed cost in High / Low Notes (plugin GHSoothsinger)
                    GH2E_SongLow: 2
    Bottom:
        Abilities:
            BAttack:
                Attack:
                    Amount: 1
                    SquareEnhancements: 1
                Range: 4
                AnimOverload: RangedAttack
            BLoot:
                Loot: 1
                AnimOverload: Loot
            BNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerHighNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
Layout:
    Top:
        - Row: "$FHS_GH2E_Soothsinger2_13_T$"
        - Active:
            Ability: TSong
            Icon: Positive_Retaliate_Range
            ListLayout: "$FHS_GH2E_Soothsinger2_13_T2$"
            Layout: "$FHS_GH2E_Soothsinger2_13_T2$"
        - Row: "<size=100%> "
        - XPTracker: TSongTimer
    Bottom:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *BAttack* <size=100%><voffset=1>@BAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *BAttack.Range*</link>"
            - Column:
        - Divider:
        - Row: "<size=150%><sprite name=Loot> *BLoot*"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_HIGH$"
