Parser: AbilityCard
Name: $ABILITY_CARD_WistfulWounding$
Character: Soothsinger2ID
ID: 33426
Level: 7
Initiative: 6
# card: Wistful Wounding
# top: song (Low Note): a once-per-turn Wound on one attack (Crashing Tide Rancid Brine's condition buff) as Power
# Ballad's untoggled once-per-turn aura on you and every ally (the first attack each turn); two slots per round
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                Attack: 0
                AttackEffect:
                    Type: StandardBuff
                    Conditions: [Wound]
                Target: -1
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffAttack
                    ValidAbilityTypes: [Attack]
                    Restriction: OncePerTurn
                    RestrictPerActor: True
                    # no toggle: lands by itself on each figure's first attack of its turn (HIVE Heavy Metal)
                    IsSingleTargetBonus: True
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter: [Self, Ally]
                AnimOverload: PlaySongAttack2
            TSongTimer:
                AddActiveBonus:
                    Null: True
                    Filter: Self
                    AutoTrigger: True
                    SkipAnim: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndRoundAbility
                    XPTracker: [1,0]
                    EndAllActiveBonusesOnBaseCardSimultaneously: True
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song1: True      # the song's Note cost (Symphonic Medley picks songs by it)
    Bottom:
        Abilities:
            BRetaliate:
                Retaliate:
                    Amount: 2
                    SquareEnhancements: 1
                RetaliateRange: 2
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                Target: 1
                Filter: Ally
                ActiveBonus:
                    Duration: Round
                AnimOverload: PlayPositiveTuneShield
            BNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerHighNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
Layout:
    Top:
        - Row: "$FHS_GH2E_Soothsinger2_26_T$"
        - Active:
            Ability: TSong
            Icon: Icon_Wound
            ListLayout: "$FHS_GH2E_Soothsinger2_26_T2$"
            Layout: "$FHS_GH2E_Soothsinger2_26_T2$"
        - Row: "<size=100%> "
        - XPTracker: TSongTimer
    Bottom:
        - Row: "$FHS_GH2E_Soothsinger2_GRANT_RANGE$ <nobr><sprite name=Range> *BRetaliate.Range*</nobr>: @BRetaliate.Range@"
        - Row: "<size=20%> "
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Retaliate> *BRetaliate* <size=100%><voffset=1>@BRetaliate@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> 2</link>"
            - Column:
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_HIGH$"
