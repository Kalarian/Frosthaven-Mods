Parser: AbilityCard
Name: $ABILITY_CARD_WearyingChant$
Character: Soothsinger2ID
ID: 33403
Level: 1
Initiative: 19
# card: Wearying Chant
# top: song (High + Low Note); Disarm on the closest enemy without Disarm or Stun (Custom targeting; ties: the player picks)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                AddActiveBonus:
                    Disarm: True
                    Range: 99
                    Target: 1
                    Filter: Enemy
                    Vars:
                        SongMe: TargetingActor
                        SongFoes: AllAliveMonsters.Where(CActor.AreActorsEnemies(obj.Type, SongMe.Type, obj, SongMe) and !obj.Tokens.HasKey(CCondition.ENegativeCondition.Disarm) and !obj.Tokens.HasKey(CCondition.ENegativeCondition.Stun))
                        ValidateSongFoes: SongFoes.Count > 0
                        SongNearestDist: SongFoes.OrderBy(obj.GetDistanceTo(SongMe, true)).First.GetDistanceTo(SongMe, true)
                        SongClosest: SongFoes.Where(obj.GetDistanceTo(SongMe, true) == SongNearestDist)
                    Targeting: Custom
                    TargetingVars:
                        AddTilesInRange: SongClosest.Select(Tile)
                        AddValidActorsInRange: SongClosest
                    AnimOverload: AggressiveTargetedShout
                Filter: Self
                AnimOverload: PlaySongConfuse2
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,0]
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song2: True      # the song's Note cost (Symphonic Medley picks songs by it)
    Bottom:
        Abilities:
            BHeal:
                Heal:
                    Amount: 2
                    SquareEnhancements: 1
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                Filter: [Self, Ally]
                AnimOverload: PlayPositiveTune
            BNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerLowNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
Layout:
    Top:
        - Row: "$FHS_GH2E_Soothsinger2_03_T$"
        - Active:
            Ability: TSong
            Icon: Icon_Disarm
            ListLayout: "$FHS_GH2E_Soothsinger2_03_T2$"
            Layout: "$FHS_GH2E_Soothsinger2_03_T2$"
        - Row: "<size=100%> "
        - XPTracker: TSong
    Bottom:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Heal> *BHeal* <size=100%><voffset=1>@BHeal@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *BHeal.Range* @BHeal.Range@</link>"
            - Column:
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_LOW$"
