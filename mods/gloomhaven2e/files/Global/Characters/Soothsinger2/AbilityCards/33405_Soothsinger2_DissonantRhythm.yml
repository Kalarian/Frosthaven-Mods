Parser: AbilityCard
Name: $ABILITY_CARD_DissonantRhythm$
Character: Soothsinger2ID
ID: 33405
Level: 1
Initiative: 14
# card: Dissonant Rhythm
# top: song (High, Low, Low Note); end-of-turn Attack 2, Push 2, Pierce 2 on the enemy the player picks
# (closest not enforced; no range printed: any range, NOTES.md)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TSong:
                AddActiveBonus:
                    Attack: 2
                    Pierce: 2
                    Range: 99
                    Target: 1
                    Filter: Enemy
                    AnimOverload: AggressiveTargetedShout
                    SubAbilities:
                        TSongSubPush:
                            Push: 2
                            IsInlineSubAbility: True
                Filter: Self
                AnimOverload: PlaySongAttack2
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndTurnAbility
                    XPTracker: [1,0,1]
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song3: True      # the song's Note cost (Symphonic Medley picks songs by it)
    Bottom:
        Abilities:
            BMuddle:
                Muddle: True
                Target:
                    Amount: 3
                    SquareEnhancements: 1
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                Filter: Enemy
                AnimOverload: AggressiveNonTargetedShout
            BNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerHighNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
Layout:
    Top:
        - Row: "$FHS_GH2E_Soothsinger2_05_T$"
        - Active:
            Ability: TSong
            Icon: Positive_ForceMove_Damage
            ListLayout: "$FHS_GH2E_Soothsinger2_05_T2$"
            Layout: "$FHS_GH2E_Soothsinger2_05_T2$"
        - Row: "<size=100%> "
        - XPTracker: TSong
    Bottom:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Muddle>"
            - Column:
                - Row: "<link=fhpill><sprite name=Target> *BMuddle.Target* @BMuddle.Target@</link>"
                - Row: "<link=fhpill><sprite name=Range> *BMuddle.Range* @BMuddle.Range@</link>"
            - Column:
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_HIGH$"
