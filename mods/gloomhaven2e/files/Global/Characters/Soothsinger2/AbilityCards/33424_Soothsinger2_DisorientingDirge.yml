Parser: AbilityCard
Name: $ABILITY_CARD_DisorientingDirge$
Character: Soothsinger2ID
ID: 33424
Level: 6
Initiative: 13
# card: Disorienting Dirge
# top: song (High, High Note): "all enemies gain disadvantage on all their attacks" = a disadvantage BuffAttack aura on
# every enemy (Frosthaven's Decanter of Mists shape), whatever they attack
# bottom: the 1st edition Defensive Ditty bottom (one prevention among allies within range 2, this round)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            # "all enemies gain disadvantage on all their attacks" (whoever they target, objectives included):
            # Frosthaven's Decanter of Mists shape, a disadvantage attack buff as an aura on every enemy
            TSong:
                Attack: 0
                AttackHasDisadvantage: True
                Filter: Self
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: BuffAttack
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter: Enemy
                AnimOverload: PlaySongShield3
            TSongTimer:
                AddActiveBonus:
                    Null: True
                    Filter: Self
                    AutoTrigger: True
                    SkipAnim: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: EndRoundAbility
                    XPTracker: [1,0,0]
                    EndAllActiveBonusesOnBaseCardSimultaneously: True
            TSongNotes:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                ActiveBonus:
                    Duration: Ability
                    Hidden: True
                    RemoveAllInstancesOfResourcesOnFinish: ["SoothsingerHighNote", "SoothsingerLowNote"]
                MiscVars:
                    GH2E_Song2: True      # the song's Note cost (Symphonic Medley picks songs by it)
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    CircleEnhancements: 1
            BPrevent:
                MiscVars:
                    ImmuneMoveActiveBonusTracker: True      # not a song (Captivating Performance moves song tokens only)
                PreventDamage: 1
                Range: 2
                Target: -1
                Filter: [Self]
                ActiveBonus:
                    Duration: Round
                    XPTracker: [0]
                    IsAura: True
                    AuraFilter: [Ally]
                AnimOverload: PlayPositiveTuneShield
Layout:
    Top:
        - Row: "$FHS_GH2E_Soothsinger2_24_T$"
        - Active:
            Ability: TSong
            Icon: Positive_Disadvantage_Enemy
            ListLayout: "$FHS_GH2E_Soothsinger2_24_T2$"
            Layout: "$FHS_GH2E_Soothsinger2_24_T2$"
        - Row: "<size=100%> "
        - XPTracker: TSongTimer
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Active:
            Ability: BPrevent
            Icon: Positive_DamagePrevent_Ally_Aura
            ListLayout: "$FHS_GH2E_Soothsinger2_24_B$"
            Layout: "$FHS_GH2E_Soothsinger2_24_B$"
            HideTracker: True
