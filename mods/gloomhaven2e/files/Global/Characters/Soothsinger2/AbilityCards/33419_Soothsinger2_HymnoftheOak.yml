Parser: AbilityCard
Name: $ABILITY_CARD_HymnoftheOak$
Character: Soothsinger2ID
ID: 33419
Level: 4
Initiative: 10
# card: Hymn of the Oak
# bottom: "grant all allies: Shield 1" for the round = a round Shield 1 aura on every ally (not you)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TWard:
                Ward:
                    DiamondPlusEnhancements: 1
                Target:
                    Amount: 2
                    SquareEnhancements: 1
                Range:
                    Amount: 3
                    SquareEnhancements: 1
                Filter: [Self, Ally]
                AnimOverload: PlayPositiveTune
            TNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerLowNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
    Bottom:
        Abilities:
            BShield:
                Shield: 1
                Target: -1
                Targeting: All
                Filter: Self
                ActiveBonus:
                    Duration: Round
                    IsAura: True
                    AuraTargeting: All
                    AuraFilter: [Ally]
                AnimOverload: PlayPositiveTuneShield
            BNote:
                NullTargeting: True
                Filter: Self
                CanSkip: True
                SkipAnim: True
                ResourcesToAddOnAbilityEnd:
                    - ["SoothsingerHighNote", 1]
                # "once each round, when you perform an action with a note, you MAY gain the note": offered, not
                # automatic; a hidden round marker bonus (MiscVars GH2E_NoteThisRound) blocks a second gain this round
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateOncePerRound: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_NoteThisRound")) == False
                MiscVars:
                    GH2E_NoteThisRound: True
                ActiveBonus:
                    Duration: Round
                    Hidden: True
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Ward> <size=100%><voffset=1>@TWard@"
            - Column:
                - Row: "<link=fhpill><sprite name=Target> *TWard.Target* @TWard.Target@</link>"
                - Row: "<link=fhpill><sprite name=Range> *TWard.Range* @TWard.Range@</link>"
            - Column:
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_LOW$"
    Bottom:
        - Row: "$FHS_GH2E_Soothsinger2_19_B$"
        - Row: "<size=20%> "
        - Row: "<size=150%><sprite name=Shield> 1"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_HIGH$"
