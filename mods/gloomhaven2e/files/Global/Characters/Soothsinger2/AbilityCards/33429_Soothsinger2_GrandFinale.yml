Parser: AbilityCard
Name: $ABILITY_CARD_GrandFinale$
Character: Soothsinger2ID
ID: 33429
Level: 9
Initiative: 46
# card: Grand Finale
# top: a plain Move with Jump, then a control on every enemy moved through (the Trample fix: AllTargetsOnMovePath +
# Targeting All), each performing Attack 3; the extra Note is a Note choice right away ("this round" not tracked)
# bottom: song actions from the hand and the discard pile in one pass (SelectAndPlayCard over both piles); then a marker
# (MiscVars GH2E_SkipSongTokens): the plugin GHSoothsinger holds every active song's token at the end of this round
Discard: [Discard,Permanently Lost]
Data:
    Top:
        Abilities:
            TMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
                    Jump: True
            TControl:
                ControlActor:
                    Abilities:
                        EnemyWillDoThis:
                            Attack:
                                Amount: 3
                                DiamondEnhancements: 1
                            Range: 1
                            Target: 1
                            StrengthIsBase: True
                            RangeIsBase: True
                            TargetIsBase: True
                    ControlDurationType: ControlForOneAction
                    ControlActorType: Player
                AllTargetsOnMovePath: True
                Targeting: All
                Target: -1
                Filter: Enemy
                AnimOverload: AggressiveTargetedShout
            TNoteChoice:
                Filter: Self
                AutoTrigger: True
                CanSkip: False
                CanUndo: False
                PreviewEffectText: "High Note / Low Note"
                Choose:
                    Abilities:
                        TNoteHigh:
                            PreviewEffectText: "High Note"
                            NullTargeting: True
                            Filter: Self
                            AutoTrigger: True
                            SkipAnim: True
                            ResourcesToAddOnAbilityEnd:
                                - ["SoothsingerHighNote", 1]
                        TNoteLow:
                            PreviewEffectText: "Low Note"
                            NullTargeting: True
                            Filter: Self
                            AutoTrigger: True
                            SkipAnim: True
                            ResourcesToAddOnAbilityEnd:
                                - ["SoothsingerLowNote", 1]
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            # "play any number of cards from your hand and discard pile": one pass over both piles together (a
            # CardPile list, Frosthaven's Expertise Potion), so they can be played in any order
            BPlaySongs:
                Filter: Self
                AutoTrigger: True
                SelectAndPlayCard:
                    CardPile: [Hand, Discarded]
                    Amount: 20
                    MinRequiredCards: 0
                MiscVars:
                    IsActionValid: Action.Abilities.Any(obj.Name == 'TSongNotes')
            # "Skip moving your character token on active Songs this round" (all of them: GH2e FAQ, Fermata)
            BSkipTokens:
                NullTargeting: True
                Filter: Self
                AutoTrigger: True
                SkipAnim: True
                MiscVars:
                    GH2E_SkipSongTokens: True
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Move> *TMove* <size=100%><voffset=1>@TMove@"
            - Column:
                - Row: "<link=fhpill><sprite name=Jump></link>"
            - Column:
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_29_T$"
        - Row: "<size=150%><sprite name=Attack> *EnemyWillDoThis* <size=100%><voffset=1>@EnemyWillDoThis@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_29_T2$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Soothsinger2_29_B$"
