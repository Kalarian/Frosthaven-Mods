        Abilities:
            TAttack:
                Attack:
                    Amount: 4
                    DiamondEnhancements: 1
                Conditions: [Wound, Stun]
                AnimOverload: Attack_AOE_Cone
                SubAbilities:
                    # the enemies on the hexes the target enters suffer 4 and gain Wound (plugin GHBruiser2e, after the push)
                    TAttackSubPush:
                        Push: 4
                        AnimOverload: None
                        IsInlineSubAbility: True
                        MiscVars:
                            GH2E_PushPathDamage: 4
        XP: 2
    Bottom:
        Abilities:
            BAttack:
                Attack:
                    Amount: 2
                    SquareEnhancements: 1
                SubAbilities:
                    BAttackSubPush:
                        Push: 3
                        AnimOverload: None
                        IsInlineSubAbility: True
            BMove:
