    Top:
        Abilities:
            TMove:
                Move:
                    Amount: 1
                    CircleEnhancements: 1
            TLoot:
                Loot: 2
                Target: -1
                AnimOverload: Loot
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BRetaliate:
                Retaliate:
                    Amount: 2
                    SquareEnhancements: 1
                MiscVars:
                    GH2E_ProcXPOnce: True
                ActiveBonus:
                    Duration: Round
                    ProcXP: 1
                AnimOverload: PowerUp
Layout:
