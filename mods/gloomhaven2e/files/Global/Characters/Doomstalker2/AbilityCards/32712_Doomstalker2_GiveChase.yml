Parser: AbilityCard
Name: $ABILITY_CARD_GiveChase$
Character: Doomstalker2ID
ID: 32712
Level: X
Initiative: 80
# card: Give Chase
# top: the only Doom on a top half. "Your summons add +2 Move and Jump to all their move abilities" has no doom shape
# (a doom's bonuses sit on the doomed monster): plugin GHDoomstalker2e (GiveChase: +2 and Jump on every move ability of
# the Doomstalker's summons while this Doom is on a living enemy; DoomFocus: the summons focus on it). The doom places
# its token with a +0 summon attack bonus so the card has a doom ability (no effect on the numbers); the text is printed.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TDoom:
                AddDoom:
                    Doom:
                        DoomAbilities:
                            TDoomMarker:
                                Attack: 0
                                ActiveBonus:
                                    Duration: Persistent
                                    Behaviour: BuffIncomingAttacks
                                    Filter:
                                        ActorType: Summon
                                        Summoner: [Doomstalker2ID]   # "your summons": the Doomstalker's own (CAbilityFilter.CheckSummoner)
                Filter:
                    TargetType: Enemy
                    EnemyType: [Normal, Elite, Boss, Object]
                Target: 1
                Targeting: All
                MiscVars:
                    CheckLOS: True
                AnimOverload: DoomTargetAlt
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
Layout:
    Top:
        - Active:
            Ability: TDoom
            Icon: Positive_AttackPlus
            ListLayout: "$FHS_GH2E_Doomstalker2_12_T$"
            Layout:
                - Row: "$FHS_Doom_MarkText$"
                - Row: "$FHS_GH2E_Doomstalker2_12_T$"
                - Row: "$FHS_Doom_DiscardReminderText$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
