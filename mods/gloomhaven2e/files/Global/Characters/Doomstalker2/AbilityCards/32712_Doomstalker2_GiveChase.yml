Parser: AbilityCard
Name: $ABILITY_CARD_GiveChase$
Character: Doomstalker2ID
ID: 32712
Level: X
Initiative: 80
# card: Give Chase
# top: the only Doom on a top half. "Your summons add +2 Move and Jump to all their move abilities" has no doom shape
# (a doom's bonuses sit on the doomed monster; nothing in Frosthaven or the 1st edition buffs the caster's summons from
# there) and "your summons focus on this enemy" is the player's steering in Frosthaven: NEEDS PLUGIN. The doom places
# its token with a +0 summon attack bonus so the card has a doom ability (no effect on the numbers); the text is printed.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TDoom:
                AddDoom:
                    Doom:
                        DoomAbilities:
                            TDoomMarker:
                                Attack: 0
                                ActiveBonus:
                                    Duration: Persistent
                                    Behaviour: BuffIncomingAttacks
                                    Filter:
                                        ActorType: Summon
                Filter:
                    TargetType: Enemy
                    EnemyType: [Normal, Elite, Boss]
                Target: 1
                Targeting: All
                AnimOverload: DoomTargetAlt
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
Layout:
    Top:
        - Active:
            Ability: TDoom
            Icon: Positive_AttackPlus
            ListLayout: "$FHS_GH2E_Doomstalker2_12_T$"
            Layout:
                - Row: "$FHS_Doom_MarkText$"
                - Row: "$FHS_GH2E_Doomstalker2_12_T$"
                - Row: "$FHS_Doom_DiscardReminderText$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
