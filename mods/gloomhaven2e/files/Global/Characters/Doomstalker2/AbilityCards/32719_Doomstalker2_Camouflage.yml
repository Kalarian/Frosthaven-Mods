Parser: AbilityCard
Name: $ABILITY_CARD_Camouflage$
Character: Doomstalker2ID
ID: 32719
Level: 4
Initiative: 6
# card: Camouflage
# top: Invisible only when you are adjacent to a wall (the 1st edition Crushing Weight filter TargetAdjacentToWalls, on
# yourself). Frosthaven digital has no corridor tiles: that clause is dropped (user decision C). "Lose Invisible at the
# end of the round": the condition's DecrementTrigger Rounds with a round bonus (Silent Knife Stick to the Shadows).
# bottom: attacks on your summons adjacent to you gain disadvantage this round: the Sunkeeper's round disadvantage aura
# (AttackersGainDisadvantage, Frosthaven's Deflecting Maneuver) on your summons within range 1.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    DiamondEnhancements: 1
                Range:
                    Amount: 4
                    SquareEnhancements: 1
                AnimOverload: RangedAttack
            TInvis:
                Invisible:
                    DecrementTrigger: Rounds
                Filter:
                    TargetType: Self
                    TargetAdjacentToWalls: "> 0"
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Round
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
            BDisadvantage:
                AttackersGainDisadvantage: 1
                Range: 1
                Target: -1
                Filter: Self
                ActiveBonus:
                    Duration: Round
                    IsAura: True
                    AuraFilter:
                        # "any summons adjacent to you": every summon on your side, not only yours (re-audit)
                        TargetType: Ally
                        ActorType: Summon
                AnimOverload: PositiveBuffRadial
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAttack.Range* @TAttack.Range@</link>"
            - Column:
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Doomstalker2_19_T$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Active:
            Ability: BDisadvantage
            Icon: Disadvantage
            ListLayout: "$FHS_GH2E_Doomstalker2_19_B$"
            Layout: "$FHS_GH2E_Doomstalker2_19_B$"
