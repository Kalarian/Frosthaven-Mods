Parser: AbilityCard
Name: $ABILITY_CARD_HeartofDoom$
Character: Doomstalker2ID
ID: 32730
Level: 9
Initiative: 40
# card: Heart of Doom
# top: "play a card from your hand to perform a Doom action" = Frosthaven's SelectAndPlayCard (Blinkblade Reverse the
# Flow, Boneshaper Malicious Conversion), hand only, actions with a Doom only. Then the 1st edition Wild Command bottom
# attack (doomed enemy at any range) and a plain Attack 3, Range 5.
# bottom: "any number of Doom active on the same target" = the 1st edition Inescapable Fate's AddDoomSlot, +98 (any
# number: the class has 14 Dooms; it was +4, five at most, until the re-audit). "If you discard this card, discard all but one active Doom": when the slots drop,
# plugin GHDoomstalker2e (HeartOfDoom) asks the player which Doom to keep (the engine would drop the oldest ones).
# Then SelectAndPlayCard from the hand or the discard pile.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TPlayDoom:
                Filter: Self
                SelectAndPlayCard:
                    CardPile: Hand
                MiscVars:
                    IsActionValid: Action.Abilities.Any(obj.AbilityType == CAbility.EAbilityType.AddDoom)
                AnimOverload: PowerUp
            TAttackDoomed:
                Attack: 3
                Targeting: All
                Filter:
                    IsDoomed: True
                AnimOverload: RangedAttack
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                Range: 5
                AnimOverload: RangedAttack
    Bottom:
        Abilities:
            BAddDoomSlot:
                AddDoomSlot: 98
                Filter: Self
                ActiveBonusDuration: Persistent
                AnimOverload: PowerUp
            BPlayDoom:
                Filter: Self
                SelectAndPlayCard:
                    CardPile: [Hand, Discarded]
                MiscVars:
                    IsActionValid: Action.Abilities.Any(obj.AbilityType == CAbility.EAbilityType.AddDoom)
                AnimOverload: PowerUp
Layout:
    Top:
        - Row: "$FHS_GH2E_Doomstalker2_30_T$"
        - Row: "<size=50%> "
        - Row: "<size=150%><sprite name=Attack> *TAttackDoomed*"
        - Row: "$FHS_GH2E_Doomstalker2_23_B$"
        - Row: "<size=50%> "
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAttack.Range*</link>"
            - Column:
    Bottom:
        - Active:
            Ability: BAddDoomSlot
            Icon: Positive_Attack_Curse
            ListLayout: "$FHS_GH2E_Doomstalker2_30_B$"
            Layout: "$FHS_GH2E_Doomstalker2_30_B$"
        - Row: "<size=50%> "
        - Row: "$FHS_GH2E_Doomstalker2_30_B2$"
