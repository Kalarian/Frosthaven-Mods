Parser: AbilityCard
Name: $ABILITY_CARD_WalkingBastion$
Character: Doomstalker2ID
ID: 32717
Level: 3
Initiative: 90
# card: Walking Bastion
# top: "when you summon this summon, it gains Ward" sits in its summon file (OnSummonAbilities Ward). "Whenever you
# long rest, this summon gains Ward": a second persistent bonus on the summon half (as Frosthaven's Unholy Prowess,
# Boneshaper 149, keeps extra bonuses on its summon half) that fires on your long rest (Boneshaper perk 10's
# DuringActionAbilityOnLongRest) and wards the Staunch Garralev. Unverified: that the bonus ends with the summon.
# bottom: Doom. "After one of your summons performs an attack targeting this enemy, once each round, grant that summon
# Attack 1, Pierce 2 (must target the doomed enemy)": plugin GHDoomstalker2e (WalkingBastion: after the summon's attack
# ability on the doomed enemy ends, once per round, the summon performs Attack 1 Pierce 2 on it, its own modifier draw).
# "Your summons focus on this enemy": GHDoomstalker2e DoomFocus. The doom keeps a +0 summon attack bonus so it has a
# doom ability (token and status row; no effect on the numbers).
Discard: [Lost,Discard]
Data:
    Top:
        Abilities:
            TSummon:
                Summon: StaunchGarralevID
                AnimOverload: Summon
            TLongRestWard:
                AutoTrigger: True
                Filter: Self
                SkipAnim: True
                AddActiveBonus:
                    CanUndo: False
                    Ward: True
                    Filter:
                        TargetType: OwnSummon
                        HeroSummonClasses: [StaunchGarralevID]
                    Range: 99
                    Target: -1
                    IgnoreLOS: True
                    AutoTrigger: True
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: DuringActionAbilityOnLongRest
                    ListLayoutOverride: ["$GH2E_Doomstalker2_17_T2$", Positive_Summon]
                Text: "$GH2E_Doomstalker2_17_T2$"
                TextOnly: True
        XP: 2
    Bottom:
        Abilities:
            BDoom:
                AddDoom:
                    Doom:
                        DoomAbilities:
                            BDoomMarker:
                                Attack: 0
                                ActiveBonus:
                                    Duration: Persistent
                                    Behaviour: BuffIncomingAttacks
                                    Filter:
                                        ActorType: Summon
                                        Summoner: [Doomstalker2ID]   # "your summons": the Doomstalker's own (CAbilityFilter.CheckSummoner)
                Filter:
                    TargetType: Enemy
                    EnemyType: [Normal, Elite, Boss, Object]
                Target: 1
                Targeting: All
                MiscVars:
                    CheckLOS: True
                AnimOverload: DoomTargetAlt
Layout:
    Top:
        - Active:
            Ability: "TSummon"
            Icon: Positive_Summon
            Layout:
                - Summon:
                    Ability: TSummon
                    SummonName: $FHS_GH2E_SUMMON_StaunchGarralev$
                    SpecialText:
                        - Row: "<nobr><sprite name=Pierce> 3</nobr>"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Doomstalker2_17_T$"
    Bottom:
        - Active:
            Ability: BDoom
            Icon: Positive_AttackPlus
            ListLayout: "$FHS_GH2E_Doomstalker2_17_B$"
            Layout:
                - Row: "$FHS_Doom_MarkText$"
                - Row: "$FHS_GH2E_Doomstalker2_17_B$"
                - Row: "$FHS_Doom_DiscardReminderText$"
