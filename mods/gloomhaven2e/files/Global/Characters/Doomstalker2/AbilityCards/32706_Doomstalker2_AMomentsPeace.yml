        - Row: "<size=150%><sprite name=Loot> *TLoot*"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Doomstalker2_06_T$"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row: "<size=150%><sprite name=Heal> *BHeal*"
        - Row: "$FHS_GH2E_Doomstalker2_06_B$"
