# bottom: Heal 2 on yourself or one of your summons within range 1.
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TLoot:
                Loot: 1
                Target: -1
                AnimOverload: Loot
            TReveal:
                NullTargeting: True
                Range: 5
                Target: 1
                Filter: Enemy
                AnimOverload: Cast_Concentrate
                PerformVars:
                    ApplyToActors:
                        Targets: ActorsToTarget
                        ShowMonsterCards: CustomAbility.ShowTopMonsterCards(Targets)
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BHeal:
                Heal: 2
                Range: 1
                Filter:
                    TargetType: [Self, OwnSummon]
                AnimOverload: Heal
Layout:
