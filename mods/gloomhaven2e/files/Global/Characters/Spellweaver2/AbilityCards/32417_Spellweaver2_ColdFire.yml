Parser: AbilityCard
Name: $ABILITY_CARD_ColdFire$
Character: Spellweaver2ID
ID: 32417
Level: 4
Initiative: 67
# card: Cold Fire
# top: the area's hex mark is right of the top red hex (3,1), not left as Xipe and the 1st edition card have it
# bottom: the consume grants the round "+1 Attack on all your attacks" as a whole ability on a Null placeholder, so no
# empty +0 bonus shows when nothing is consumed (Xipe's shape)
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 1
                Range: 3
                AreaEffect: "0,0,R|2,0,R|1,1,R|3,1,E"
                MultiPassAttack: False
                AnimOverload: TargetedColdFire
        Consumes:
            TCFire:
                Elements: Fire
                AbilityOverrides:
                    TCFireAttackBuff:
                        ParentName: TAttack
                        Strength: 2
            TCIce:
                Elements: Ice
                AbilityOverrides:
                    TCIceImmobilize:
                        ParentName: TAttack
                        Conditions: Immobilize
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
            BCAny:
                Consume:
                    Elements: Any
                    Abilities:
                        BCAnyAttackBuff:
                            Attack: 1
                            Filter: Self
                            ActiveBonus:
                                Duration: Round
                                Behaviour: BuffAttack
                            AnimOverload: PowerUp
                    XP: 1
Layout:
    Top:
        - ColumnWidths: "65,30"
        - Column:
            - Row:
                - ColumnWidths: "10,35,45,10"
                - Column:
                - Column: "<size=150%><sprite name=RangedAttack> *TAttack*"
                - Column:
                    - Row: "<link=fhpill><sprite name=Range> *TAttack.Range*</link>"
                - Column:
            - Row: "<size=20%> "
            - Conditional:
                Layout:
                    - Consume:
                        Name: TCFire
                        Text: "+2 <sprite name=Attack>"
            - Row: "<size=20%> "
            - Conditional:
                Layout:
                    - Consume:
                        Name: TCIce
                        Text: "<sprite name=Immobilize>"
        - Column:
            - Row: "£Area£"
            - Row: "<size=80%> "
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=50%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: BCAny
                    Text: "$FHS_GH2E_Spellweaver2_17_B$"
