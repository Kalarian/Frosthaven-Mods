    ID: "GH2EUndamagedAttacks"
    Sprite: "Positive_DamagePrevent"
    LocKey: "$GH_GH2E_Sawbones2_HIDDEN_TOOLTIP$"
    MaxAmount: 999
    Hidden: True

GH2ESongsSung:
    # pack-wide: hidden bit mask of the different Songs the Soothsinger performed this scenario (bit = card ID - 33400;
