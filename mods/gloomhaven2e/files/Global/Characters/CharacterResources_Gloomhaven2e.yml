Parser: CharacterResources

GH2EFlankAttacks:
    # pack-wide: hidden count of the Silent Knife's attacks this scenario (mastery 1, GHSilentKnife.cs); saved with the
    # scenario, never shown.
    ID: "GH2EFlankAttacks"
    Sprite: "Positive_DamagePrevent"
    LocKey: "$GH_GH2E_SilentKnife_HIDDEN_TOOLTIP$"
    MaxAmount: 9999
    Hidden: True

GH2EFlankBad:
    # pack-wide: hidden count of the Silent Knife's attacks on a target neither flanked nor isolated (mastery 1,
    # GHSilentKnife.cs); saved with the scenario, never shown.
    ID: "GH2EFlankBad"
    Sprite: "Positive_DamagePrevent"
    LocKey: "$GH_GH2E_SilentKnife_HIDDEN_TOOLTIP$"
    MaxAmount: 9999
    Hidden: True

Tinkerer2SharedSupplies:
    # pack-wide: a hidden flag on the Tinkerer, set when an ally used one of her potions through the Shared Supplies perk
    # (once each scenario, GHTinkerer.cs); a character resource is saved with the scenario, so a reload keeps it used
    ID: "Tinkerer2SharedSupplies"
    Sprite: "Positive_DamagePrevent"
    LocKey: "$GH_GH2E_SAFEGUARD_TOOLTIP$"
    Hidden: True
    MaxAmount: 1

GH2EAllSixElements:
    # pack-wide: hidden, a marker the plugin puts on the Elementalist the first time in a scenario all six elements are
    # strong or waning at once (GHElementalist2e.cs, mastery 2); saved with the scenario, counted at its end
    ID: "GH2EAllSixElements"
    Sprite: "GHClass_Elementalist2"
    LocKey: "$GH_GH2E_Elementalist2_ALLSIX_TOOLTIP$"
    MaxAmount: 1
    Hidden: True

GH2EXornUsed:
    # pack-wide: hidden mark on the Plagueherald that Xorn's Last Gift (perk Plagueherald212) was used this scenario
    # (GHPlagueherald2e.cs); saved with the scenario, never shown.
    ID: "GH2EXornUsed"
    Sprite: "Positive_DamagePrevent"
    LocKey: "$GH_GH2E_PH2_HIDDEN_TOOLTIP$"
    MaxAmount: 1
    Hidden: True

GH2EPoisonRounds:
    # pack-wide: hidden count of the rounds in which the Plagueherald gave or removed Poison (his second mastery,
    # GHPlagueherald2e.cs); saved with the scenario, never shown.
    ID: "GH2EPoisonRounds"
    Sprite: "Positive_DamagePrevent"
    LocKey: "$GH_GH2E_PH2_HIDDEN_TOOLTIP$"
    MaxAmount: 999
    Hidden: True

GH2EPoisonLastRound:
    # pack-wide: hidden number of the last round counted in GH2EPoisonRounds (GHPlagueherald2e.cs).
    ID: "GH2EPoisonLastRound"
    Sprite: "Positive_DamagePrevent"
    LocKey: "$GH_GH2E_PH2_HIDDEN_TOOLTIP$"
    MaxAmount: 999
    Hidden: True

GH2EUndamagedAttacks:
    # pack-wide: hidden count of the Sawbones' attacks on an undamaged enemy while a damaged monster lived (mastery 2
