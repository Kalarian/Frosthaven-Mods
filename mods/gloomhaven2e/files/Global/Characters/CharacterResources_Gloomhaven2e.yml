    ID: "GH2ENotesMade"
    Sprite: "Positive_DamagePrevent"
    LocKey: "$GH_GH2E_Soothsinger2_HIDDEN_TOOLTIP$"
    MaxAmount: 9999
    Hidden: True

GH2ENotesWasted:
