    ID: "GH2ENotesWasted"
    Sprite: "Positive_DamagePrevent"
    LocKey: "$GH_GH2E_Soothsinger2_HIDDEN_TOOLTIP$"
    MaxAmount: 9999
    Hidden: True

GH2EHadWard:
    # pack-wide: hidden mark on a Soultether's summon that it had Ward when the attack now resolving started (Imposed
    # Will bottom reads it after the attack: GHSoultether.cs sets it at the start of every attack on such a summon);
    # never shown.
    ID: "GH2EHadWard"
    Sprite: "Positive_DamagePrevent"
    LocKey: "$GH_GH2E_SOUL_HIDDEN_TOOLTIP$"
    MaxAmount: 1
    Hidden: True

GH2EFirstRestRound:
    # pack-wide: hidden number of the round of the Soultether's first rest this scenario (mastery 1 "before your first
    # rest": GHSoultether.cs notes it from the engine's rest calls; the turn stats never mark a rest); saved with the
    # scenario, never shown.
    ID: "GH2EFirstRestRound"
    Sprite: "Positive_DamagePrevent"
    LocKey: "$GH_GH2E_SOUL_HIDDEN_TOOLTIP$"
    MaxAmount: 999
    Hidden: True

WildfuryRage:
    # pack-wide (carried although no card names it): Concentrated Rage bottom's damage tokens (on the card in the
    # physical game), kept on the Wildfury so they are saved with the scenario and shown on her status row. Given and
    # spent by the plugin (GHWildfury.cs RageTokens).
    ID: "WildfuryRage"
    Sprite: "Positive_AttackPlus"
    LocKey: "$GH_GH2E_Wildfury_RAGE_TOOLTIP$"
    MaxAmount: 99

GH2ECommandKills7:
    # pack-wide: hidden count of the enemies killed this scenario by Command attacks of 7 or more (mastery 2
    # Unleashed, GHWildfury.cs); saved with the scenario, never shown.
    ID: "GH2ECommandKills7"
    Sprite: "Positive_DamagePrevent"
    LocKey: "$GH_GH2E_Wildfury_HIDDEN_TOOLTIP$"
    MaxAmount: 999
    Hidden: True

GH2ESafeguard:
    # pack-wide: the Safeguard condition token (2e rulebook: the next negative condition the figure would gain is
    # prevented, then Safeguard is removed; no stacking: MaxAmount 1). Given and spent by the plugin (GHSafeguard.cs);
    # shown on the figure's status row with this Frosthaven icon and text.
    ID: "GH2ESafeguard"
    Sprite: "Positive_DamagePrevent"
    LocKey: "$GH_GH2E_SAFEGUARD_TOOLTIP$"
    MaxAmount: 1

