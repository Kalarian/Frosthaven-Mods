Parser: AbilityCard
Name: $ABILITY_CARD_EyeoftheHurricane$
Character: Elementalist2ID
ID: 32827
Level: 8
Initiative: 25
# card: Eye of the Hurricane
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            THeal:
                Heal: 2
                Range: 4
                Filter: [Self, Ally]
                AnimOverload: Heal
        Consumes:
            TCFire:
                Elements: Fire
                AbilityOverrides:
                    TCFireStrengthen:
                        ParentName: THeal
                        Conditions: Strengthen
                XP: 1
            TCIce:
                Elements: Ice
                AbilityOverrides:
                    TCIceAttack:
                        ParentName: THeal
                        SubAbilities:
                            THealAdjacentAttack:
                                Attack: 2
                                Range: 1
                                Target: -1
                                Filter: Enemy
                                Conditions: Muddle
                                AllTargetsAdjacentToParentTargets: True
                                TreatAsNonSubAbility: True
                                AnimOverload: RadialHexWind
                XP: 1
            TCAir:
                Elements: Air
                AbilityOverrides:
                    TCAirAttack:
                        ParentName: THeal
                        SubAbilities:
                            THealRingAttack:
                                Attack: 1
                                Pierce: 3
                                Target: -1
                                Filter: Enemy
                                TreatAsNonSubAbility: True
                                Targeting: Custom
                                TargetingVars:
                                    HealTarget: ParentAbility.ActorsToTarget[0]
                                    NearEnemies: GameState.GetAllEnemiesInRange(HealTarget, HealTarget.ArrayIndex, 1)
                                    AddValidActorsInRange: GameState.GetAllEnemiesInRange(HealTarget, HealTarget.ArrayIndex, 2).Where(NearEnemies.Contains(obj) == False)
                                    AddTilesInRange: AddValidActorsInRange.Select(Tile)
                                AnimOverload: RadialHexWind
                XP: 1
    Bottom:
        Abilities:
            BAttack:
                Attack: 2
                Range: 3
                AnimOverload: TargetFloorMulti
        Consumes:
            BCFire:
                Elements: Fire
                Infuse: [Fire]
                AbilityOverrides:
                    BCFireWound:
                        ParentName: BAttack
                        Conditions: Wound
            BCAir:
                Elements: Air
                Infuse: [Air]
                AbilityOverrides:
                    BCAirRange:
                        ParentName: BAttack
                        Range: 3
            BCEarth:
                Elements: Earth
                Infuse: [Earth]
                AbilityOverrides:
                    BCEarthPoison:
                        ParentName: BAttack
                        Conditions: Poison
            BCTwo:
                Infuse: [Dark]
                Requirements:
                    Type: ThisAbility
                    Vars:
                        ValidateTwoElementsConsumed: PhaseManager.CurrentPhaseAction.ActionAugmentationsToConsume.Where(obj.Elements.Count > 0).Count >= 2
                AbilityOverrides:
                    BCTwoAttack:
                        ParentName: BAttack
                        Strength: 1
                XP: 1
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Heal> *THeal*"
            - Column:
