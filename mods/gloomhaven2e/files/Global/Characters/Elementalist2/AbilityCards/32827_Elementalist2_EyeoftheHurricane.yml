            - Column:
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCFire
                    Text: "<sprite name=Strengthen>, <sprite name=XP1>"
        - Conditional:
            Layout:
                - Consume:
                    Name: TCIce
                    Text: "$FHS_GH2E_Elementalist2_27_T$"
        - Conditional:
            Layout:
                - Consume:
                    Name: TCAir
                    Text: "$FHS_GH2E_Elementalist2_27_T2$"
    Bottom:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *BAttack*"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *BAttack.Range*</link>"
            - Column:
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: BCFire
                    Text: "<sprite name=Wound>, <sprite name=CreateFire>"
        - Conditional:
