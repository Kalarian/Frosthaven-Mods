Parser: AbilityCard
Name: $ABILITY_CARD_FormlessPower$
Character: Elementalist2ID
ID: 32803
Level: 1
Initiative: 45
# card: Formless Power
Discard: [Discard,Lost]
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 2
                    DiamondEnhancements: 1
                Range: 3
                AnimOverload: ProjectileFormless
        Consumes:
            TCAnyXP:
                Elements: Any
                AbilityOverrides:
                    TCAnyAttackBuff1:
                        ParentName: TAttack
                        Strength: 1
                        Range: 1
                XP: 1
            TCAnyNoXP:
                Elements: Any
                AbilityOverrides:
                    TCAnyAttackBuff2:
                        ParentName: TAttack
                        Strength: 1
                        Range: 1
    Bottom:
        Abilities:
            # "at the start of each of your turns, you may consume any to add +1 Attack to all your attacks that turn":
            # Snowdancer Cold Therapy's start-of-turn consume (element picker over all six), whose ability is a Round
            # +1 Attack bonus on yourself (the round ends with your turn as far as your attacks go)
            BActive:
                AddActiveBonus:
                    IgnoreStun: True
                    Consume:
                        Elements: [Fire, Ice, Air, Earth, Light, Dark]
                        Abilities:
                            CABuff:
                                Attack: 1
                                Filter: Self
                                IgnoreStun: True
                                AnimOverload: PowerUp
                                ActiveBonus:
                                    Duration: Round
                                    Behaviour: BuffAttack
                                    ValidAbilityType: Attack
                    ShowElementPicker: True
                Filter: Self
                ActiveBonus:
                    Behaviour: StartTurnAbility
                    Duration: Persistent
                    ValidAbilityType: Consume
                    Restriction: OncePerRound
        XP: 2
Layout:
    Top:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=RangedAttack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column:
                - Row: "<link=fhpill><sprite name=Range> *TAttack.Range*</link>"
            - Column:
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCAnyXP
                    Text: "+1 <sprite name=Attack>, +1 <sprite name=Range>, <sprite name=XP1>"
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCAnyNoXP
                    Text: "+1 <sprite name=Attack>, +1 <sprite name=Range>"
    Bottom:
        - Active:
            Ability: BActive
            ListLayout: "$FHS_GH2E_Elementalist2_03_B$"
            Layout: "$FHS_GH2E_Elementalist2_03_B$"
            Icon: Positive_AttackPlus
