Parser: AbilityCard
Name: $ABILITY_CARD_WaveofDestruction$
Character: Cragheart2ID
ID: 32129
Level: 9
Initiative: 74
# card: Wave of Destruction
# from Xipe's 99144_Cragheart2_Wave of Destruction.yml; corrected against tools/gh2e/sheets/Cragheart.json
# top: no enhancement mark on the attack. "+X Attack per target, X = range to it": Frosthaven's per-target
#   TargetDistanceRangeDiff is |ability range - distance|, and a melee area attack has range 1, so it gives distance - 1;
#   the stored base is 2 so the total is the printed 1 + distance (the card face shows the printed 1)
# bottom: a plain Move 5 (no Jump: the card has none) marked GHMoveThroughObstacles: the plugin (GHCragheart2e.cs)
#   lets it enter (pass or end in) hexes with obstacles; the next step destroys every obstacle on the move path (the
#   1st edition Clear the Way's destroy-on-path), then +2 per destroyed obstacle on your next attack this turn (a
#   one-use turn bonus, CPhaseAction obstacle count of the action).
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 2
                StatIsBasedOnX:
                    Strength:
                        BasedOn: TargetDistanceRangeDiff
                        AddTo: True
                AreaEffect: "0,0,G|1,1,R|2,0,R|3,1,R|4,2,R|5,1,R|6,2,R|7,3,R|8,2,R|9,3,R|10,4,E|11,3,E"
                MultiPassAttack: False
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    CircleEnhancements: 1
                MiscVars:
                    GHMoveThroughObstacles: True
            BDestroyObstacle:
                DestroyObstacle:
                Target: -1
                AllTargetsOnMovePath: True
                SpawnDelay: 0.2
                SkipAnim: True
            BAttackBuff:
                Attack: 0
                Filter: Self
                AutoTrigger: True
                AnimOverload: PowerUp
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ValidateDestroyed: CPhaseAction.ObstaclesDestroyedThisAction > 0
                StatIsBasedOnX:
                    Strength:
                        BasedOn: ObstaclesDestroyedThisAction
                        Multiplier: 2
                ActiveBonus:
                    Duration: Turn
                    Behaviour: BuffAttack
                    XPTracker: [0]
Layout:
    Top:
        - Row:
            - ColumnWidths: "45,55"
            - Column:
                - Row: "<size=150%><sprite name=Attack> 1"
                - Row: "<size=20%> "
                - Row: "$FHS_GH2E_Cragheart2_29_T$"
            - Column:
                - Row: "£Area£"
    Bottom:
        - Row: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Cragheart2_29_B$"
        - Row: "<size=20%> "
        - Active:
            Ability: BAttackBuff
            ListLayout: "$FHS_GH2E_Cragheart2_29_B3$"
            Layout: "$FHS_GH2E_Cragheart2_29_B2$"
            Icon: Positive_AttackPlus
