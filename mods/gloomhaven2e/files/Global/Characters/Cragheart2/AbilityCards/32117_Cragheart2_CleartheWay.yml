Parser: AbilityCard
Name: $ABILITY_CARD_CleartheWay$
Character: Cragheart2ID
ID: 32117
Level: 3
Initiative: 30
# card: Clear the Way
# from Xipe's 99132_Cragheart2_Clear the Way.yml; corrected against tools/gh2e/sheets/Cragheart.json
# top: the 1st edition card's merged move-obstacle attack (play-tested); Attack 2 carries a square mark
# bottom: APPROXIMATION: obstacles and traps on the path are destroyed (the 1st edition card's merged disarm/destroy,
# play-tested); hazardous and difficult terrain stay
Discard: [Discard,Discard]
Data:
    Top:
        Abilities:
            TMoveObstacleAttack:
                MergedMoveObstacleAttack:
                    Abilities:
                        TMoveObstacle:
                            MoveObstacle:
                            ObstacleTypes: OneHexObstacle
                            Target: 1
                            Range: 1
                            SpawnDelay: 2.6
                            MoveObstacleRange: 4
                            AnimOverload: MeleeSmashExplosivePunch
                            MoveObstacleAnimOverload: ObstacleMeteor
                        TAttack:
                            Attack:
                                Amount: 2
                                SquareEnhancements: 1
                                Pierce: 1
                            Range: 1
                            Target: -1
                            Filter: Enemy
                            IgnoreParentAreaOfEffect: True
                            UseParentRangeType: True
                            AnimOverload: None
                Range: 2 #Give the merged parent ability a Range for the Attack Ability UseParentRangeType to use
        Consumes:
            TCEarth:
                Elements: Earth
                AbilityOverrides:
                    TCEarthAttackBuff:
                        ParentName: TAttack
                        Strength: 1
                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
                    Jump: True
            BDisarmTrapDestroyObstacle:
                MergedDisarmTrapDestroyObstacle:
                    Abilities:
                        BDisarmTrap:
                            DisarmTrap: True
                            AnimOverload: DisarmTrap
                            Target: -1
                            AllTargetsOnMovePath: True
                        BDestroyObstacle:
                            DestroyObstacle:
                            Target: -1
                            AllTargetsOnMovePath: True
                            SpawnDelay: 0.2
                            SkipAnim: True
Layout:
    Top:
        - Row: "$FHS_GH2E_Cragheart2_17_T$"
        - Row: "<size=50%> "
        - Row: "<size=150%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$FHS_GH2E_Cragheart2_17_T2$"
        - Row: "<sprite name=Pierce> *TAttack.Pierce*"
        - Row: "<size=20%> "
        - Conditional:
            Layout:
                - Consume:
                    Name: TCEarth
                    Text: "+1 <sprite name=Attack>, <sprite name=XP1>"
    Bottom:
        - Row:
            - ColumnWidths: "10,35,45,10"
            - Column:
            - Column: "<size=150%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
            - Column:
                - Row: "<link=fhpill><sprite name=Jump></link>"
            - Column:
        - Row: "<size=20%> "
        - Row: "$FHS_GH2E_Cragheart2_17_B$"
