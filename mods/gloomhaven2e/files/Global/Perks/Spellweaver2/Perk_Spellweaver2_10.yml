Parser: Perk
ID: Spellweaver210
Name: PERK_Spellweaver2_10_Name
Description: PERK_Spellweaver2_10_Desc
CharacterID: Spellweaver2ID
Available: 1
Cost: 2
Flags: [Passive, ApplyActiveBonusesAtScenarioStart]
Abilities:
    TActive:
        AutoTrigger: True
        AddActiveBonus:
            NullTargeting: True
            Filter: Self
            AutoTrigger: True
            SkipAnim: True
            CanUndo: False
            MiscVars:
                GH2E_LostActionThisTurn: True
            ActiveBonus:
                Duration: Round
                Hidden: True
        ActiveBonus:
            Duration: Persistent
            Behaviour: DuringActionAbilityOnActionEnded
            Restriction: OncePerTurn
            Hidden: True
            Vars:
                LastPerformedAbility: TriggerActor.LastAbilityPerformed
                LostPile: LastPerformedAbility?.GetAbilityBaseCard()?.SelectedAction?.CardPile
                ValidateDidLoseCard: LostPile == "Lost" || LostPile == "PermanentlyLost"
    TEndBless:
        AutoTrigger: True
        AddActiveBonus:
            Bless: True
            Filter: Self
            AutoTrigger: True
            SkipAnim: True
            CanUndo: False
        ActiveBonus:
            Duration: Persistent
            Behaviour: EndTurnAbility
            Hidden: True
            Requirements:
                Vars:
                    ValidateLostActionThisTurn: Actor.ActiveBonuses.Any(CustomAbility.GetMiscVarBool(obj.Ability, "GH2E_LostActionThisTurn"))
