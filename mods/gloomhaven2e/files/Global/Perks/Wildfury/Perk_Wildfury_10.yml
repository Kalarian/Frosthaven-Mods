Parser: Perk
ID: Wildfury10
Name: PERK_Wildfury_10_Name
Description: PERK_Wildfury_10_Desc
CharacterID: WildfuryID
Available: 1
Cost: 2
Flags: [Passive, ApplyActiveBonusesAtScenarioStart]
Abilities:
    TLifeBondStart:
        Filter: Self
        AutoTrigger: True
        SkipAnim: True
        AddActiveBonus:
            ShowElementPicker: True
            CanSkip: True
            CanUndo: False
            Consume:
                Elements: [Air, Earth]
                Abilities:
                    TLifeBondXStart:
                        Null: True
                        AutoTrigger: True
                        CanUndo: False
                        MiscVars:
                            GHLifeBond: True
                    TLifeBondHealStart:
                        ControlActor:
                            ControlDurationType: ControlForOneAction
                            Abilities:
                                ABearHealStart:
                                    Heal: 1
                                    Filter: Self
                                    StatIsBasedOnX:
                                        Strength:
                                            BasedOn: Vars
                                            Vars:
                                                Value: TargetingActor.Summoner.GHLifeBondX
                        Filter:
                            TargetType: [Companion]
                            HeroSummonClasses: [WildfuryBearID]
                        Target: 1
                        Targeting: All
                        IgnoreLOS: True
                        SkipAnim: True
        ActiveBonus:
            Duration: Persistent
            Behaviour: DuringActionAbilityOnLongRest
            Flags: [PreRestBonus]
            Hidden: True
            Requirements:
                Vars:
                    ValidateUnused: Actor.GHLifeBondUsed != True
                    ValidateCanPay: Actor.Health > 1
    TLifeBondEnd:
        Filter: Self
        AutoTrigger: True
        SkipAnim: True
        AddActiveBonus:
            ShowElementPicker: True
            CanSkip: True
            CanUndo: False
            Consume:
                Elements: [Air, Earth]
                Abilities:
                    TLifeBondXEnd:
                        Null: True
                        AutoTrigger: True
                        CanUndo: False
                        MiscVars:
                            GHLifeBond: True
                    TLifeBondHealEnd:
                        ControlActor:
                            ControlDurationType: ControlForOneAction
                            Abilities:
                                ABearHealEnd:
                                    Heal: 1
                                    Filter: Self
                                    StatIsBasedOnX:
                                        Strength:
                                            BasedOn: Vars
                                            Vars:
                                                Value: TargetingActor.Summoner.GHLifeBondX
                        Filter:
                            TargetType: [Companion]
                            HeroSummonClasses: [WildfuryBearID]
                        Target: 1
                        Targeting: All
                        IgnoreLOS: True
                        SkipAnim: True
        ActiveBonus:
            Duration: Persistent
            Behaviour: DuringActionAbilityOnLongRest
            Hidden: True
            Requirements:
                Vars:
                    ValidateUnused: Actor.GHLifeBondUsed != True
                    ValidateCanPay: Actor.Health > 1
